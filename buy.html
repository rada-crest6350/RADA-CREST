<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Secure Checkout | RADA CREST</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #FF7A00;
      --primary-glow: rgba(255, 122, 0, 0.4);
      --bg: #0b0d14;
      --card: #12141a;
      --text: #ffffff;
      --muted: #9ba1b0;
      --border: rgba(255, 255, 255, 0.08);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding-bottom: 120px; min-height: 100vh; overflow-x: hidden; }

    /* Header */
    .header {
      background: rgba(18, 20, 26, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 2px solid var(--primary);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-title { color: var(--primary); font-weight: 900; font-size: 1.15rem; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .nav-btn { color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }

    .checkout-wrap { max-width: 650px; margin: 15px auto; padding: 0 14px; animation: slideUp 0.4s var(--ease-spring); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .order-card {
      background: var(--card);
      border-radius: 18px;
      padding: 18px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    /* Product Summary */
    .prod-summary { display: flex; gap: 14px; align-items: center; }
    .prod-thumb { width: 75px; height: 75px; border-radius: 12px; object-fit: contain; background: rgba(255,255,255,0.02); border: 1px solid var(--border); }
    .prod-info h3 { font-size: 1.1rem; font-weight: 800; line-height: 1.3; }
    .prod-info p { font-size: 0.85rem; color: var(--muted); margin-top: 3px; }

    /* Stamp Box */
    .stamp-box {
      background: linear-gradient(135deg, rgba(255,122,0,0.12), rgba(255,180,0,0.03));
      border: 1px dashed var(--primary);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .stamp-dots { display: flex; gap: 10px; margin-top: 10px; justify-content: center; }
    .stamp-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      color: var(--muted);
      transition: all 0.4s var(--ease-spring);
    }
    .stamp-dot.earned { background: var(--primary); color: #000; border-color: var(--primary); font-weight: 900; box-shadow: 0 0 14px var(--primary-glow); transform: scale(1.1); }

    /* Rule Banners */
    .rule-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.03);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 8px;
      border: 1px solid var(--border);
    }
    .info-btn { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 1rem; padding: 2px 6px; }

    /* Gift Choice Grid */
    .gift-choice-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .gift-choice-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.02);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .gift-choice-item.selected { border-color: var(--primary); background: rgba(255,122,0,0.1); }
    .gift-choice-item img { width: 44px; height: 44px; border-radius: 8px; object-fit: contain; background: #fff; }

    /* Form Fields */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
    .form-control {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .form-control:focus { border-color: var(--primary); }

    /* Payment Options */
    .payment-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .pay-opt {
      background: rgba(255,255,255,0.03);
      border: 1.5px solid var(--border);
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      transition: all 0.2s ease;
    }
    .pay-opt.active { border-color: var(--primary); color: #fff; background: rgba(255,122,0,0.12); }

    /* Bill Calculation */
    .bill-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.88rem; padding: 6px 0; color: var(--muted); }
    .bill-row.total-row { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 12px; color: #fff; font-size: 1.2rem; font-weight: 900; }
    .text-discount { color: #25D366; font-weight: 700; }
    .text-primary { color: var(--primary); font-weight: 900; }

    /* Policies Box */
    .policies-box {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-top: 16px;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .policies-box h4 { color: #fff; margin-bottom: 6px; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }
    .policies-links { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
    .policies-links a { color: var(--primary); text-decoration: none; font-weight: 700; }

    /* Bottom Action Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(18, 20, 26, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      z-index: 100;
      max-width: 650px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-place-order {
      background: linear-gradient(135deg, #FF7A00, #ff5500);
      color: #000;
      border: none;
      padding: 14px 26px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 22px var(--primary-glow);
      transition: transform 0.2s ease;
    }
    .btn-place-order:active { transform: scale(0.96); }

    /* Congratulations Success Modal with Live Stamp Animation */
    .success-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(16px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .success-modal.active { display: flex; animation: fadeIn 0.3s ease; }
    .success-card {
      background: var(--card);
      border: 2px solid var(--primary);
      border-radius: 24px;
      padding: 26px 20px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 40px var(--primary-glow);
      animation: zoomIn 0.4s var(--ease-spring);
    }
    @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .success-icon-box {
      width: 60px;
      height: 60px;
      background: rgba(37,211,102,0.15);
      border: 2px solid #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      color: #25D366;
      font-size: 1.6rem;
    }

    /* Modal Stamp Progress Animation Container */
    .modal-stamp-container {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin: 14px 0;
    }

    /* Info Modal */
    .info-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 500; padding: 20px; }
    .info-modal.active { display: flex; }
    .info-modal-card { background: var(--card); border: 1px solid var(--primary); border-radius: 16px; padding: 20px; max-width: 380px; width: 100%; text-align: center; }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="brand-title">
      <i class="fa-solid fa-bolt" style="color:var(--primary);"></i> RADA CREST
    </a>
    <a href="javascript:history.back()" class="nav-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </header>

  <div class="checkout-wrap" id="checkoutRoot">
    <div style="text-align:center; padding: 90px 0; color:var(--muted);">
      <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:var(--primary);"></i>
      <p style="margin-top:12px;">Securing Checkout...</p>
    </div>
  </div>

  <!-- Congratulations Success Modal with Live Stamp Animation -->
  <div class="success-modal" id="successModal">
    <div class="success-card">
      <div class="success-icon-box">
        <i class="fa-solid fa-check"></i>
      </div>
      <h2 style="font-size: 1.3rem; font-weight: 900; margin-bottom: 4px;">Order Placed Successfully!</h2>
      <p style="color: var(--muted); font-size: 0.82rem; margin-bottom: 10px;">Your loyalty stamp has been successfully earned!</p>
      
      <!-- Animated Stamp Progress inside Modal -->
      <div class="modal-stamp-container">
        <div style="font-size:0.8rem; font-weight:700; color:var(--primary); margin-bottom:6px;" id="modalStampText">Updating Stamps...</div>
        <div class="stamp-dots" id="modalStampDots"></div>
      </div>

      <p style="color: var(--muted); font-size: 0.78rem;">Redirecting to WhatsApp receipt in <span id="countdownTimer" style="color:var(--primary); font-weight:800;">3s</span></p>
    </div>
  </div>

  <!-- Info Modal -->
  <div class="info-modal" id="infoModal" onclick="closeInfoModal()">
    <div class="info-modal-card" onclick="event.stopPropagation()">
      <h3 id="infoModalTitle" style="color:var(--primary); margin-bottom:8px;">Rule Details</h3>
      <p id="infoModalDesc" style="color:var(--muted); font-size:0.9rem; line-height:1.4;"></p>
      <button onclick="closeInfoModal()" style="margin-top:16px; background:var(--primary); color:#000; border:none; padding:9px 24px; border-radius:8px; font-weight:800; cursor:pointer;">Got It</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ynpsnkvrjhaxdynmurzj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlucHNua3ZyamhheGR5bm11cnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNTc5NjAsImV4cCI6MjEwMTgzMzk2MH0.I3xFYthE0JNfGnD6N1BaNBybSq7m0G6MRILzq3NXihg';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    let checkoutState = {
      product: null,
      qty: 1,
      settings: null,
      giftList: [],
      selectedGift: null,
      paymentMode: 'cod',
      userStamps: Number(localStorage.getItem('rc_user_stamps')) || 0
    };

    async function initCheckout() {
      const params = new URLSearchParams(window.location.search);
      const prodId = params.get('id');
      checkoutState.qty = Number(params.get('qty')) || 1;

      if (!prodId || !supabaseClient) { showError("Invalid Order URL"); return; }

      const { data: prod } = await supabaseClient.from('products').select('*').eq('id', Number(prodId)).single();
      const { data: config } = await supabaseClient.from('store_settings').select('*').eq('id', 'config').single();
      const { data: gifts } = await supabaseClient.from('gift_items').select('*').eq('is_active', true);

      if (prod) {
        checkoutState.product = prod;
        checkoutState.settings = config || {};
        checkoutState.giftList = gifts || [];
        if (checkoutState.giftList.length > 0) checkoutState.selectedGift = checkoutState.giftList[0];
        renderCheckout();
      } else {
        showError("Product Not Found");
      }
    }

    function renderCheckout() {
      const p = checkoutState.product;
      const s = checkoutState.settings;
      const root = document.getElementById('checkoutRoot');

      let unitPrice = p.price;
      if (s.festival_discount_enabled && s.festival_discount_percent > 0) {
        unitPrice = Math.round(unitPrice - (unitPrice * (s.festival_discount_percent / 100)));
      }

      const unitMrp = (p.old_price && p.old_price > p.price) ? p.old_price : p.price;
      const totalMrp = unitMrp * checkoutState.qty;
      const totalSelling = unitPrice * checkoutState.qty;
      const totalDiscount = totalMrp - totalSelling;

      let baseFee = s.delivery_fee || 50;
      const freeAmt = s.free_delivery_min_amount || 499;
      const freeQty = s.free_delivery_min_qty || 3;
      const isFreeDelivery = (totalSelling >= freeAmt) || (checkoutState.qty >= freeQty);
      let deliveryFee = isFreeDelivery ? 0 : baseFee;

      const minGiftQty = s.gift_min_qty || 5;
      const minGiftAmt = s.gift_min_amount || 999;
      const giftUnlocked = (s.gift_qty_enabled && checkoutState.qty >= minGiftQty) ||
                           (s.gift_amount_enabled && totalSelling >= minGiftAmt);

      const stampTarget = s.stamp_target || 5;
      const isStampCompleted = checkoutState.userStamps >= stampTarget;
      const finalAmount = isStampCompleted ? 0 : (totalSelling + deliveryFee);

      root.innerHTML = `
        <!-- Digital Stamp Card Progress -->
        <div class="stamp-box">
          <div style="display:flex; justify-content:space-between; font-size:0.88rem; align-items:center;">
            <b><i class="fa-solid fa-stamp" style="color:var(--primary);"></i> Loyalty Stamp Card</b>
            <span style="color:var(--primary); font-weight:800;">${checkoutState.userStamps} / ${stampTarget} Stamps</span>
          </div>
          <div class="stamp-dots">
            ${Array.from({ length: stampTarget }).map((_, i) => `
              <div class="stamp-dot ${i < checkoutState.userStamps ? 'earned' : ''}">
                ${i < checkoutState.userStamps ? '<i class="fa-solid fa-check"></i>' : (i + 1)}
              </div>
            `).join('')}
          </div>
          ${isStampCompleted ? '<p style="color:#25D366; font-size:0.82rem; margin-top:8px; font-weight:800;">🎉 Milestone Unlocked! This order is completely FREE!</p>' : ''}
        </div>

        <!-- Product Summary -->
        <div class="order-card">
          <div class="prod-summary">
            <img class="prod-thumb" src="${p.image || 'assets/placeholder.jpg'}" />
            <div class="prod-info">
              <h3>${p.name}</h3>
              <p>Quantity: <b>${checkoutState.qty} Pcs</b></p>
              <p style="color:var(--primary); font-weight:800;">₹${unitPrice} / pc</p>
            </div>
          </div>
        </div>

        <!-- Delivery Fee Banner -->
        <div class="rule-banner">
          <span><i class="fa-solid fa-truck" style="color:var(--primary); margin-right:6px;"></i> Delivery: ${deliveryFee === 0 ? '<b>FREE Delivery Applied</b>' : 'Standard Fee ₹' + baseFee}</span>
          <button type="button" class="info-btn" onclick="openInfoModal('Delivery Fee Rules', 'Standard delivery fee is ₹' + baseFee + '. Orders above ₹' + freeAmt + ' or buying ' + freeQty + '+ pieces get completely FREE delivery.')"><i class="fa-solid fa-circle-question"></i></button>
        </div>

        <!-- Gift Unlocked Banner -->
        ${giftUnlocked && checkoutState.giftList.length > 0 ? `
          <div class="order-card" style="border-color:var(--primary);">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <b style="color:var(--primary);"><i class="fa-solid fa-gift"></i> Free Gift Unlocked!</b>
              <button type="button" class="info-btn" onclick="openInfoModal('Free Gift Rules', 'Unlocked because your order meets the threshold.')"><i class="fa-solid fa-circle-question"></i></button>
            </div>
            <p style="font-size:0.8rem; color:var(--muted); margin:4px 0 10px;">Select 1 gift from our pool:</p>
            <div class="gift-choice-grid">
              ${checkoutState.giftList.map(g => `
                <div class="gift-choice-item ${checkoutState.selectedGift && checkoutState.selectedGift.id === g.id ? 'selected' : ''}" onclick="selectGift(${g.id})">
                  <div style="display:flex; align-items:center; gap:10px;">
                    <img src="${g.image || 'https://via.placeholder.com/44'}" />
                    <div>
                      <b style="font-size:0.85rem;">${g.name}</b>
                      <div style="font-size:0.75rem; color:var(--muted);">Value: ₹${g.market_value}</div>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : `
          <div class="rule-banner">
            <span><i class="fa-solid fa-gift" style="color:var(--primary); margin-right:6px;"></i> Unlock Free Gift on ${minGiftQty}+ Pcs or ₹${minGiftAmt}+ order</span>
            <button type="button" class="info-btn" onclick="openInfoModal('Free Gift Program', 'Add more quantity to claim an exclusive free gift!')"><i class="fa-solid fa-circle-question"></i></button>
          </div>
        `}

        <!-- Customer Address Form -->
        <div class="order-card">
          <b style="font-size:0.95rem; display:block; margin-bottom:12px;">Delivery Address</b>
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="custName" class="form-control" placeholder="Enter your name" required />
          </div>
          <div class="form-group">
            <label>Mobile / WhatsApp Number *</label>
            <input type="tel" id="custPhone" class="form-control" placeholder="10-digit number" required />
          </div>
          <div class="form-group">
            <label>Complete Address *</label>
            <textarea id="custAddr" class="form-control" rows="2" placeholder="House no, street, landmark" required></textarea>
          </div>
          <div class="form-group">
            <label>Pincode *</label>
            <input type="number" id="custPin" class="form-control" placeholder="6-digit pincode" required />
          </div>
        </div>

        <!-- Payment Mode -->
        <div class="order-card">
          <b style="font-size:0.95rem; display:block; margin-bottom:8px;">Payment Method</b>
          <div class="payment-options">
            <div class="pay-opt ${checkoutState.paymentMode === 'cod' ? 'active' : ''}" onclick="setPaymentMode('cod')">
              <i class="fa-solid fa-truck-ramp-box" style="display:block; font-size:1.2rem; margin-bottom:4px;"></i>
              Cash on Delivery
            </div>
            <div class="pay-opt ${checkoutState.paymentMode === 'online
