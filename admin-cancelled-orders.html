<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Cancelled Orders — RADA CREST Admin</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>

<style>

.admin-page{
  width:min(1200px,calc(100% - 24px));
  margin:25px auto 60px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:22px;
}

.top a{
  text-decoration:none;
}

.title{
  background:#171717;
  color:#fff;
  border-radius:22px;
  padding:25px;
  margin-bottom:20px;
}

.title small{
  color:#aaa;
  font-weight:800;
}

.title h1{
  margin:7px 0;
  font-size:38px;
}

.title p{
  color:#bbb;
  margin:0;
}

.message{
  margin:15px 0;
  font-weight:700;
}

.list{
  display:grid;
  gap:16px;
}

.order{
  background:#fff;
  border:1px solid #ded9ce;
  border-radius:20px;
  padding:20px;
  box-shadow:0 8px 25px rgba(0,0,0,.05);
}

.order-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
}

.order-id{
  font-size:20px;
  font-weight:900;
}

.date{
  color:#777;
  font-size:13px;
  margin-top:5px;
}

.amount{
  font-size:23px;
  font-weight:900;
}

.badge{
  display:inline-flex;
  margin-top:10px;
  padding:7px 11px;
  border-radius:999px;
  background:#fde4e4;
  color:#a33a3a;
  font-size:12px;
  font-weight:900;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);
  gap:12px;
  margin-top:17px;
}

.box{
  background:#f8f6f0;
  border-radius:13px;
  padding:13px;
}

.box strong{
  display:block;
  font-size:12px;
  margin-bottom:5px;
}

.box span{
  color:#555;
  font-size:14px;
  line-height:1.5;
}

.items{
  border-top:1px solid #eee;
  margin-top:17px;
  padding-top:14px;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:9px 0;
  border-bottom:1px solid #f0eee9;
}

.item:last-child{
  border-bottom:0;
}

.item-name{
  font-weight:750;
}

.item-price{
  font-weight:800;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:12px 16px;
  border-radius:12px;
  border:0;
  text-decoration:none;
  font-weight:850;
  cursor:pointer;
}

.primary{
  background:#171717;
  color:#fff;
}

.secondary{
  background:#fff;
  color:#171717;
  border:1px solid #171717;
}

select{
  width:100%;
  margin-top:7px;
  padding:11px 12px;
  border:1px solid #d5d0c6;
  border-radius:10px;
  background:#fff;
  font:inherit;
}

.empty{
  background:#fff;
  border:1px dashed #cfc8ba;
  border-radius:18px;
  padding:45px;
  text-align:center;
  color:#777;
}

.error{
  color:#a33a3a;
  background:#fff0f0;
  border:1px solid #efcaca;
  padding:15px;
  border-radius:14px;
}

@media(max-width:800px){

  .grid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:600px){

  .admin-page{
    width:min(100% - 18px,1200px);
  }

  .order-head{
    flex-direction:column;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .amount{
    font-size:20px;
  }

}

</style>

</head>

<body>

<main class="admin-page">

  <div class="top">

    <a href="admin-dashboard.html">
      ← Dashboard
    </a>

    <a href="admin-orders.html">
      All Orders →
    </a>

  </div>


  <section class="title">

    <small>RADA CREST • ADMIN</small>

    <h1>Cancelled Orders</h1>

    <p>
      Manage cancelled orders, cancellation reasons
      and refund information.
    </p>

  </section>


  <div
    id="message"
    class="message"
  ></div>


  <div
    id="list"
    class="list"
  >

    <div class="empty">
      Loading cancelled orders...
    </div>

  </div>

</main>


<script>

async function loadCancelledOrders(){

  const message =
    document.getElementById("message");

  const list =
    document.getElementById("list");


  const {
    data:{
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if(!user){

    location.href =
      "admin.html";

    return;

  }


  message.textContent =
    "Loading cancelled orders...";


  const {
    data:orders,
    error
  } =
    await supabaseClient
      .from("orders")
      .select("*")
      .eq("status","cancelled")
      .order("created_at",{
        ascending:false
      });


  if(error){

    console.error(error);

    list.innerHTML = `
      <div class="error">
        ${escapeHtml(
          error.message
        )}
      </div>
    `;

    message.textContent = "";

    return;

  }


  message.textContent = "";


  if(!orders || !orders.length){

    list.innerHTML = `
      <div class="empty">

        <div style="font-size:40px;">
          ✓
        </div>

        <h3>
          No Cancelled Orders
        </h3>

        <p>
          There are currently no cancelled orders.
        </p>

      </div>
    `;

    return;

  }


  const ids =
    orders.map(
      order => order.id
    );


  let items = [];


  if(ids.length){

    const result =
      await supabaseClient
        .from("order_items")
        .select("*")
        .in("order_id",ids);

    if(!result.error){

      items =
        result.data || [];

    }

  }


  const itemMap =
    new Map();


  items.forEach(item => {

    const id =
      String(item.order_id);

    if(!itemMap.has(id)){

      itemMap.set(id,[]);

    }

    itemMap
      .get(id)
      .push(item);

  });


  list.innerHTML =
    orders.map(order => {

      const orderItems =
        itemMap.get(
          String(order.id)
        ) || [];


      const calculated =
        orderItems.reduce(
          (sum,item) =>
            sum +
            Number(item.quantity || 0) *
            Number(
              item.unit_price ??
              item.price ??
              0
            ),
          0
        );


      const total =
        Number(order.total || 0) > 0
          ? Number(order.total)
          :
        Number(order.total_amount || 0) > 0
          ? Number(order.total_amount)
          :
        calculated;


      const itemsHtml =
        orderItems.length

        ?

        orderItems.map(item => {

          const qty =
            Number(
              item.quantity || 1
            );

          const price =
            Number(
              item.unit_price ??
              item.price ??
              0
            );

          return `
            <div class="item">

              <div class="item-name">
                ${escapeHtml(
                  item.product_name ||
                  "Product"
                )}
                × ${qty}
              </div>

              <div class="item-price">
                ${money(
                  price * qty
                )}
              </div>

            </div>
          `;

        }).join("")

        :

        `
          <div style="color:#777;">
            Order item details unavailable.
          </div>
        `;


      const refundStatus =
        order.refund_status ||
        (
          String(
            order.payment_method || "COD"
          )
          .toLowerCase()
          .includes("cod")
            ?
            "not_applicable"
            :
            "pending"
        );


      return `

        <article class="order">

          <div class="order-head">

            <div>

              <div class="order-id">

                Order #${escapeHtml(
                  order.order_number ||
                  order.id
                )}

              </div>

              <div class="date">

                Ordered:
                ${formatDate(
                  order.created_at
                )}

              </div>

              <div class="badge">
                🔴 CANCELLED
              </div>

            </div>

            <div class="amount">

              ${money(total)}

            </div>

          </div>


          <div class="grid">

            <div class="box">

              <strong>
                Customer
              </strong>

              <span>
                ${escapeHtml(
                  order.customer_name ||
                  order.shipping_name ||
                  "-"
                )}
              </span>

            </div>


            <div class="box">

              <strong>
                Phone
              </strong>

              <span>
                ${escapeHtml(
                  order.customer_phone ||
                  order.shipping_phone ||
                  "-"
                )}
              </span>

            </div>


            <div class="box">

              <strong>
                Email
              </strong>

              <span>
                ${escapeHtml(
                  order.customer_email ||
                  "-"
                )}
              </span>

            </div>


            <div class="box">

              <strong>
                Cancelled By
              </strong>

              <span>
                ${escapeHtml(
                  order.cancelled_by ||
                  "Unknown"
                )}
              </span>

            </div>


            <div class="box">

              <strong>
                Cancelled On
              </strong>

              <span>
                ${formatDate(
                  order.cancelled_at ||
                  order.updated_at ||
                  order.created_at
                )}
              </span>

            </div>


            <div class="box">

              <strong>
                Payment
              </strong>

              <span>
                ${escapeHtml(
                  order.payment_method ||
                  "COD"
                )}
                •
                ${escapeHtml(
                  order.payment_status ||
                  "pending"
                )}
              </span>

            </div>


            <div class="box">

              <strong>
                Cancellation Reason
              </strong>

              <span>
                ${escapeHtml(
                  order.cancellation_reason ||
                  "No reason provided"
                )}
              </span>

            </div>


            <div class="box">

              <strong>
                Refund Amount
              </strong>

              <span>
                ${money(
                  order.refund_amount ||
                  0
                )}
              </span>

            </div>


            <div class="box">

              <strong>
                Refund Status
              </strong>

              <select
                onchange="
                  updateRefundStatus(
                    ${JSON.stringify(order.id)},
                    this.value
                  )
                "
              >

                <option
                  value="not_applicable"
                  ${refundStatus === "not_applicable" ? "selected" : ""}
                >
                  Not Applicable
                </option>

                <option
                  value="pending"
                  ${refundStatus === "pending" ? "selected" : ""}
                >
                  Pending
                </option>

                <option
                  value="processing"
                  ${refundStatus === "processing" ? "selected" : ""}
                >
                  Processing
                </option>

                <option
                  value="completed"
                  ${refundStatus === "completed" ? "selected" : ""}
                >
                  Completed
                </option>

                <option
                  value="failed"
                  ${refundStatus === "failed" ? "selected" : ""}
                >
                  Failed
                </option>

              </select>

            </div>

          </div>


          <div class="items">

            <strong>
              Order Items
            </strong>

            ${itemsHtml}

          </div>


          <div class="actions">

            <a
              class="btn primary"
              href="order.html?id=${encodeURIComponent(
                order.id
              )}"
            >
              View Order
            </a>

          </div>

        </article>

      `;

    }).join("");

}


async function updateRefundStatus(
  id,
  status
){

  const {
    error
  } =
    await supabaseClient
      .from("orders")
      .update({
        refund_status:status
      })
      .eq("id",id);


  if(error){

    alert(
      "Refund status update failed:\n" +
      error.message
    );

    await loadCancelledOrders();

    return;

  }


  await loadCancelledOrders();

}


function money(value){

  return "₹" +
    Number(value || 0)
      .toLocaleString("en-IN");

}


function formatDate(value){

  if(!value) return "-";

  try{

    return new Date(value)
      .toLocaleString("en-IN",{
        day:"2-digit",
        month:"short",
        year:"numeric",
        hour:"numeric",
        minute:"2-digit",
        hour12:true
      });

  }catch{

    return "-";

  }

}


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


loadCancelledOrders();

</script>

</body>
</html>
