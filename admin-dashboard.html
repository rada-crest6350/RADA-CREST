<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADA CREST — Admin Dashboard</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#090909;
  --panel:#121212;
  --panel2:#171717;
  --border:#242424;
  --text:#ffffff;
  --muted:#8e8e93;
  --brand:#FF7A00;
  --brand-glow:rgba(255, 122, 0, 0.15);
  --green:#7dff9b;
  --red:#ff6b6b;
  --yellow:#ffd66b;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:265px;
  background:#0d0d0d;
  border-right:1px solid var(--border);
  padding:22px 14px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
}

.brand{
  padding:6px 10px 18px;
  border-bottom:1px solid var(--border);
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:42px;
  height:42px;
  border:2px solid var(--brand);
  background:#141414;
  color:var(--brand);
  border-radius:12px;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:16px;
  box-shadow:0 0 14px var(--brand-glow);
}

.brand-details small{
  color:var(--brand);
  letter-spacing:2px;
  font-size:9px;
  font-weight:bold;
  text-transform:uppercase;
}

.brand-details h2{
  margin:2px 0 0;
  font-size:18px;
  color:#fff;
}

.menu{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.menu button{
  width:100%;
  background:transparent;
  color:#a1a1aa;
  border:1px solid transparent;
  padding:10px 12px;
  text-align:left;
  border-radius:10px;
  font-weight:600;
  font-size:13.5px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  transition:all 0.2s ease;
}

.menu button .btn-content{
  display:flex;
  align-items:center;
  gap:10px;
}

.menu button .icon{
  color:var(--brand);
  font-size:15px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:20px;
}

.menu button:hover{
  background:#171717;
  color:#fff;
  border-color:#2a2a2a;
}

.menu button.active{
  background:var(--brand-glow);
  color:#fff;
  border-color:rgba(255,122,0,0.4);
  font-weight:700;
}

.menu button.active .icon{
  color:var(--brand);
  filter:drop-shadow(0 0 4px var(--brand));
}

/* NOTIFICATION BADGE & DOT */
.badge-dot{
  display:none;
  align-items:center;
  justify-content:center;
  background:var(--brand);
  color:#000;
  font-size:10.5px;
  font-weight:900;
  min-width:18px;
  height:18px;
  padding:0 5px;
  border-radius:10px;
  box-shadow:0 0 8px var(--brand);
}

.badge-dot.show{
  display:inline-flex;
}

.logout{
  margin-top:16px;
  width:100%;
  padding:11px;
  background:#141414;
  border:1px solid #282828;
  color:#d4d4d8;
  border-radius:10px;
  font-weight:700;
  font-size:13px;
  transition:0.2s;
}

.logout:hover{
  background:#241414;
  border-color:#4a1e1e;
  color:var(--red);
}

/* MAIN */
.main{
  margin-left:265px;
  width:calc(100% - 265px);
  min-height:100vh;
}

.topbar{
  height:68px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  background:#0c0c0c;
  position:sticky;
  top:0;
  z-index:20;
}

.topbar h1{
  margin:0;
  font-size:20px;
  font-weight:800;
}

.topbar span{
  color:#71717a;
  font-size:12.5px;
  display:flex;
  align-items:center;
  gap:6px;
}

.topbar span::before{
  content:'';
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
}

.topbar span.error::before{
  background:var(--red);
  box-shadow:0 0 8px var(--red);
}

.content{
  padding:26px 28px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* DASHBOARD */
.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:20px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  width:3px;
  height:100%;
  background:var(--brand);
  opacity:0.4;
}

.card small{
  color:#a1a1aa;
  font-size:12px;
  font-weight:600;
}

.card h2{
  margin:8px 0 0;
  font-size:28px;
  font-weight:800;
  color:#fff;
}

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:22px;
  margin-bottom:20px;
}

.panel h2{
  margin:0 0 16px;
  font-size:18px;
  font-weight:700;
}

.empty{
  border:1px dashed #282828;
  border-radius:12px;
  padding:30px;
  text-align:center;
  color:#71717a;
  font-size:13px;
}

/* RESPONSIVE */
@media(max-width:1000px){
  .cards{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:768px){
  .sidebar{
    width:100%;
    height:auto;
    position:relative;
    border-right:0;
    border-bottom:1px solid var(--border);
  }

  .app{
    display:block;
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
  }

  .topbar{
    padding:0 18px;
  }

  .content{
    padding:18px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:480px){
  .cards{
    grid-template-columns:1fr;
  }
  .menu{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR NAVIGATION -->
<aside class="sidebar">

  <div class="brand">
    <div class="logo">RC</div>
    <div class="brand-details">
      <small>RADA CREST</small>
      <h2>Admin Panel</h2>
    </div>
  </div>

  <div class="menu">

    <!-- 1. Home / Dashboard -->
    <button class="active" onclick="window.location.href='admin-dashboard.html'">
      <div class="btn-content"><span class="icon">⚡</span> Dashboard</div>
    </button>

    <!-- 2. Products -->
    <button onclick="window.location.href='admin-products.html'">
      <div class="btn-content"><span class="icon">📦</span> Products</div>
      <span id="dot-products" class="badge-dot">!</span>
    </button>

    <!-- 3. Categories -->
    <button onclick="window.location.href='admin-categories.html'">
      <div class="btn-content"><span class="icon">📑</span> Categories</div>
    </button>

    <!-- 4. Orders -->
    <button onclick="window.location.href='admin-orders.html'">
      <div class="btn-content"><span class="icon">🛍️</span> Orders</div>
      <span id="dot-orders" class="badge-dot">0</span>
    </button>

    <!-- 5. Customers -->
    <button onclick="window.location.href='admin-customers.html'">
      <div class="btn-content"><span class="icon">👥</span> Customers</div>
    </button>

    <!-- 6. Store Control -->
    <button onclick="window.location.href='admin-store-control.html'">
      <div class="btn-content"><span class="icon">⚙️</span> Store Control</div>
    </button>

    <!-- 7. Main Banners -->
    <button onclick="window.location.href='admin-banners.html'">
      <div class="btn-content"><span class="icon">🖼️</span> Banner Manager</div>
    </button>

    <!-- 8. Festive / Sale Banner -->
    <button onclick="window.location.href='admin-banners.html#festive'">
      <div class="btn-content"><span class="icon">🎉</span> Festive Sale</div>
    </button>

    <!-- 9. Returns & Replacements -->
    <button onclick="window.location.href='admin-returns.html'">
      <div class="btn-content"><span class="icon">🔄</span> Returns & Repl.</div>
      <span id="dot-returns" class="badge-dot">0</span>
    </button>

    <!-- 10. Cancelled Orders -->
    <button onclick="window.location.href='admin-cancelled-orders.html'">
      <div class="btn-content"><span class="icon">❌</span> Cancelled Orders</div>
    </button>

    <!-- 11. Gift & Discounts -->
    <button onclick="window.location.href='discounts.html'">
      <div class="btn-content"><span class="icon">🎁</span> Gifts & Offers</div>
    </button>
    <!-- updated --> 
    
    <!-- 12. Referral Page Control -->
    <button onclick="window.location.href='​admin-referrals.html'">
      <div class="btn-content"><span class="icon">🔗</span> Referral Page</div>
    </button>

    <!-- 13. Help Center / Support -->
    <button onclick="window.location.href='admin-help.html'">
      <div class="btn-content"><span class="icon">🎧</span> Help Center</div>
      <span id="dot-help" class="badge-dot">0</span>
    </button>

    <!-- 14. Revenue & Sales Analytics -->
    <button onclick="window.location.href='admin-revenue.html'">
      <div class="btn-content"><span class="icon">📈</span> Revenue & Sales</div>
    </button>

    <!-- 15. Terms & Conditions -->
    <button onclick="window.location.href='admin-terms.html'">
      <div class="btn-content"><span class="icon">📄</span> Terms & Policy</div>
    </button>

  </div>

  <button class="logout" onclick="logout()">
    🚪 Logout
  </button>

</aside>

<!-- MAIN CONTENT AREA -->
<main class="main">

  <header class="topbar">
    <h1 id="pageTitle">Dashboard</h1>
    <span id="connectionStatus">Connecting...</span>
  </header>

  <div class="content">

    <section id="dashboard" class="page active">

      <div class="cards">
        <div class="card">
          <small>Total Products</small>
          <h2 id="dashboardProducts">0</h2>
        </div>
        <div class="card">
          <small>Active Products</small>
          <h2 id="dashboardActive">0</h2>
        </div>
        <div class="card">
          <small>Low Stock</small>
          <h2 id="dashboardLowStock">0</h2>
        </div>
        <div class="card">
          <small>Out of Stock</small>
          <h2 id="dashboardOutStock">0</h2>
        </div>
      </div>

      <div class="panel">
        <h2>Recent Products</h2>
        <div id="recentProducts" class="empty">
          Loading...
        </div>
      </div>

    </section>

  </div>

</main>

</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://ynpsnkvrjhaxdynmurzj.supabase.co";
const SUPABASE_KEY = "sb_publishable_De-FpQeLF8L5g-7_nu_mvQ_VihQGfjL";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

// SESSION SECURITY
const { data: sessionData } = await supabase.auth.getSession();
if(!sessionData.session){
  window.location.href = "admin.html";
}

// LOGOUT
window.logout = async function(){
  await supabase.auth.signOut();
  window.location.href = "admin.html";
};

// LOAD DASHBOARD DATA & NOTIFICATION DOTS
async function loadDashboardData(){
  try{
    // 1. Fetch Products
    const { data: products, error: pErr } = await supabase
      .from("products")
      .select("*")
      .order("created_at", { ascending: false });

    if(pErr) throw pErr;

    const list = products || [];
    document.getElementById("dashboardProducts").textContent = list.length;
    document.getElementById("dashboardActive").textContent = list.filter(p => p.active === true).length;
    
    const lowStockCount = list.filter(p => Number(p.stock || 0) > 0 && Number(p.stock || 0) <= 5).length;
    const outStockCount = list.filter(p => Number(p.stock || 0) <= 0).length;
    
    document.getElementById("dashboardLowStock").textContent = lowStockCount;
    document.getElementById("dashboardOutStock").textContent = outStockCount;

    // Show warning dot on Products if stock is critical
    if(lowStockCount > 0 || outStockCount > 0){
      const pDot = document.getElementById("dot-products");
      pDot.textContent = lowStockCount + outStockCount;
      pDot.classList.add("show");
    }

    // Render Recent Products
    const box = document.getElementById("recentProducts");
    const recent = list.slice(0, 5);

    if(!recent.length){
      box.innerHTML = "No products added yet.";
    } else {
      box.innerHTML = recent.map(p => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #242424;">
          <div>
            <strong>${p.name || "Unnamed"}</strong>
            <div style="color:#71717a;font-size:11px;margin-top:4px;">${p.category || "No category"}</div>
          </div>
          <div style="font-weight:bold;color:var(--brand);">₹${Number(p.price || 0).toLocaleString("en-IN")}</div>
        </div>
      `).join("");
    }

    // 2. Check Pending Orders for Notification Badge
    const { data: pendingOrders } = await supabase
      .from("orders")
      .select("id")
      .eq("status", "pending");

    if(pendingOrders && pendingOrders.length > 0){
      const oDot = document.getElementById("dot-orders");
      oDot.textContent = pendingOrders.length;
      oDot.classList.add("show");
    }

    // 3. Check Pending Returns
    const { data: pendingReturns } = await supabase
      .from("returns")
      .select("id")
      .eq("status", "pending");

    if(pendingReturns && pendingReturns.length > 0){
      const rDot = document.getElementById("dot-returns");
      rDot.textContent = pendingReturns.length;
      rDot.classList.add("show");
    }

    // 4. Check Unread Support Queries / Help Messages
    const { data: newQueries } = await supabase
      .from("support_queries")
      .select("id")
      .eq("status", "unread");

    if(newQueries && newQueries.length > 0){
      const hDot = document.getElementById("dot-help");
      hDot.textContent = newQueries.length;
      hDot.classList.add("show");
    }

    const conn = document.getElementById("connectionStatus");
    conn.textContent = "Connected";
    conn.classList.remove("error");

  }catch(err){
    console.error(err);
    const conn = document.getElementById("connectionStatus");
    conn.textContent = "Database Error";
    conn.classList.add("error");
  }
}

loadDashboardData();
</script>

</body>
</html>
