<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Account — RADA CREST</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>

<style>
:root{
  --ink:#171717;
  --muted:#777;
  --paper:#f7f5ef;
  --card:#fffdf8;
  --line:#ded9ce;
  --gold:#b08a3c;
  --danger:#b53b3b;
  --success:#28734b;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(180deg,#f7f5ef,#efede6);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

.page{
  width:min(980px,calc(100% - 28px));
  margin:28px auto 60px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:24px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:900;
  letter-spacing:.12em;
  font-size:18px;
}

.brand-mark{
  width:46px;
  height:46px;
  border:2px solid var(--ink);
  border-radius:13px;
  display:grid;
  place-items:center;
  background:#fff;
  color:var(--ink);
  overflow:hidden;
  font-size:13px;
  letter-spacing:.04em;
}

.brand-mark img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.back{
  font-size:14px;
  color:#555;
}

.panel{
  background:rgba(255,253,248,.94);
  border:1px solid var(--line);
  border-radius:24px;
  padding:30px;
  box-shadow:0 20px 55px rgba(45,39,28,.08);
}

h1{
  font-size:clamp(36px,7vw,58px);
  line-height:1;
  margin:0 0 12px;
  letter-spacing:-.04em;
}

h2{
  font-size:28px;
  margin:34px 0 16px;
}

.sub{
  color:var(--muted);
  margin:0 0 24px;
}

.auth-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.auth-card{
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px;
  background:#fff;
}

.auth-card h2{
  margin:0 0 6px;
  font-size:23px;
}

label{
  display:block;
  font-weight:750;
  margin:15px 0 7px;
  font-size:14px;
}

input{
  width:100%;
  border:1px solid #d7d2c8;
  border-radius:13px;
  padding:14px 15px;
  font:inherit;
  background:#fffdf9;
  outline:none;
}

input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(176,138,60,.12);
}

button,.button{
  border:0;
  border-radius:13px;
  padding:14px 17px;
  font:inherit;
  font-weight:850;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.primary{
  background:#171717;
  color:#fff;
  width:100%;
  margin-top:18px;
}

.secondary{
  background:#fff;
  border:1px solid #171717;
  color:#171717;
}

.gold{
  background:linear-gradient(135deg,#a77d2e,#d4b76e);
  color:#16120b;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.message{
  margin-top:14px;
  min-height:20px;
  font-size:14px;
  font-weight:700;
}

.hidden{
  display:none!important;
}

.account-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
}

.orders{
  display:grid;
  gap:15px;
}

.order-card{
  border:1px solid var(--line);
  border-radius:20px;
  background:#fff;
  padding:20px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
}

.order-id{
  font-size:20px;
  font-weight:900;
}

.order-date{
  color:#888;
  font-size:13px;
  margin-top:5px;
}

.total{
  font-size:22px;
  font-weight:950;
  white-space:nowrap;
}

.meta{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin:16px 0;
}

.badge{
  padding:7px 10px;
  border-radius:999px;
  background:#f0eee7;
  font-size:12px;
  font-weight:850;
  text-transform:capitalize;
}

.status-pending{
  background:#fff2c8;
  color:#8a6400;
}

.status-confirmed{
  background:#e7f0ff;
  color:#31598d;
}

.status-processing{
  background:#eee6ff;
  color:#62419c;
}

.status-shipped{
  background:#e3efff;
  color:#315b9b;
}

.status-delivered{
  background:#e2f5e8;
  color:#267144;
}

.status-cancelled{
  background:#fde4e4;
  color:#a33a3a;
}

.items{
  border-top:1px solid #ece8df;
  margin-top:14px;
  padding-top:13px;
  display:grid;
  gap:9px;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:12px;
  font-size:14px;
}

.item-name{
  font-weight:750;
}

.item-right{
  white-space:nowrap;
  color:#444;
}

.address{
  margin-top:14px;
  padding:13px 14px;
  background:#f8f6f0;
  border-radius:12px;
  color:#555;
  font-size:13px;
  line-height:1.5;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:#777;
  border:1px dashed #ccc5b7;
  border-radius:18px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.error-box{
  background:#fff0f0;
  border:1px solid #efcaca;
  color:#a33a3a;
  padding:14px;
  border-radius:14px;
  line-height:1.5;
}

@media(max-width:720px){
  .auth-grid{
    grid-template-columns:1fr;
  }

  .panel{
    padding:22px;
  }

  .order-top{
    flex-direction:column;
  }

  .total{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark" id="logo">RC</span>
      <span>RADA CREST</span>
    </a>

    <a class="back" href="index.html">← Back to Store</a>
  </div>

  <main class="panel">

    <!-- LOGIN / SIGNUP -->
    <section id="authView">

      <h1>My Account</h1>

      <p class="sub">
        Sign in to view your orders, or create a new customer account.
      </p>

      <div class="auth-grid">

        <div class="auth-card">

          <h2>Sign In</h2>

          <p class="sub">
            Access your existing RADA CREST account.
          </p>

          <label for="loginEmail">Email</label>

          <input
            id="loginEmail"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
          >

          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Your password">
 
          <a href="reset-password.html"
             style="display:block;margin-top:10px;color:#b08a3c;font-weight:700;font-size:14px;">
            Forgot password?
          </a>

          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="Your password"
          >

          <button
            class="primary"
            id="loginBtn"
            type="button"
          >
            Sign In
          </button>

          <div class="message" id="loginMsg"></div>

        </div>


        <div class="auth-card">

          <h2>Create Account</h2>

          <p class="sub">
            Create your customer account for order history.
          </p>

          <label for="signupEmail">Email</label>

          <input
            id="signupEmail"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
          >

          <label for="signupPassword">Password</label>

          <input
            id="signupPassword"
            type="password"
            autocomplete="new-password"
            placeholder="At least 6 characters"
          >

          <button
            class="primary gold"
            id="signupBtn"
            type="button"
          >
            Create Account
          </button>

          <div class="message" id="signupMsg"></div>

        </div>

      </div>

    </section>


    <!-- ACCOUNT -->
    <section id="accountView" class="hidden">

      <div class="account-head">

        <div>

          <h1>My Account</h1>

          <p class="sub">
            Welcome, <strong id="userEmail"></strong>
          </p>

        </div>

        <div class="actions">

          <button
            class="secondary"
            id="logoutBtn"
            type="button"
          >
            Logout
          </button>

        </div>

      </div>


      <h2>My Orders</h2>

      <div
        id="ordersMessage"
        class="message"
      ></div>

      <div
        id="ordersList"
        class="orders"
      >
        <div class="empty">
          Loading your orders...
        </div>
      </div>

    </section>

  </main>

</div>


<script>

const SUPABASE_URL =
  "https://ynpsnkvrjhaxdynmurzj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_De-FpQeLF8L5g-7_nu_mvQ_VihQGfjL";

const client =
  window.supabase?.createClient
    ? window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      )
    : supabaseClient;


/* -----------------------------
   BASIC HELPERS
----------------------------- */

const $ = id =>
  document.getElementById(id);


function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function money(value){

  const n = Number(value || 0);

  return "₹" +
    n.toLocaleString("en-IN");

}


function date(value){

  try{

    return new Date(value).toLocaleString(
      "en-IN",
      {
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"numeric",
        minute:"2-digit",
        hour12:true
      }
    );

  }catch{

    return "-";

  }

}


function statusClass(status){

  return "status-" +
    String(status || "pending")
      .toLowerCase()
      .replace(/[^a-z]/g,"");

}


function showMsg(id,text,type=""){

  const el = $(id);

  if(!el) return;

  el.textContent = text || "";

  el.style.color =
    type === "error"
      ? "#b53b3b"
      : type === "success"
        ? "#28734b"
        : "#777";

}


/* -----------------------------
   LOGO
----------------------------- */

async function loadLogo(){

  try{

    const {data,error} =
      await client
        .from("site_settings")
        .select("logo_url,site_name")
        .limit(1)
        .maybeSingle();

    if(error){

      console.warn(
        "site_settings logo load failed:",
        error
      );

      return;

    }

    if(data?.logo_url){

      $("logo").innerHTML =
        '<img src="' +
        esc(data.logo_url) +
        '" alt="RADA CREST Logo">';

    }

  }catch(error){

    console.warn(
      "Logo error:",
      error
    );

  }

}


/* -----------------------------
   SIGN IN
----------------------------- */

async function signIn(){

  const email =
    $("loginEmail").value.trim();

  const password =
    $("loginPassword").value;

  if(!email || !password){

    showMsg(
      "loginMsg",
      "Please enter email and password.",
      "error"
    );

    return;

  }

  const btn =
    $("loginBtn");

  btn.disabled = true;

  btn.textContent =
    "Signing in...";

  showMsg("loginMsg","");

  const {
    data,
    error
  } =
    await client.auth.signInWithPassword({
      email,
      password
    });

  btn.disabled = false;

  btn.textContent =
    "Sign In";

  if(error){

    showMsg(
      "loginMsg",
      error.message,
      "error"
    );

    return;

  }

  if(data?.user){

    await showAccount(
      data.user
    );

  }

}


/* -----------------------------
   SIGN UP
----------------------------- */

async function signUp(){

  const email =
    $("signupEmail").value.trim();

  const password =
    $("signupPassword").value;

  if(
    !email ||
    password.length < 6
  ){

    showMsg(
      "signupMsg",
      "Enter a valid email and a password of at least 6 characters.",
      "error"
    );

    return;

  }

  const btn =
    $("signupBtn");

  btn.disabled = true;

  btn.textContent =
    "Creating...";

  showMsg("signupMsg","");

  const {
    data,
    error
  } =
    await client.auth.signUp({
      email,
      password
    });

  btn.disabled = false;

  btn.textContent =
    "Create Account";

  if(error){

    showMsg(
      "signupMsg",
      error.message,
      "error"
    );

    return;

  }

  if(
    data?.session &&
    data?.user
  ){

    showMsg(
      "signupMsg",
      "Account created successfully.",
      "success"
    );

    await showAccount(
      data.user
    );

    return;

  }

  showMsg(
    "signupMsg",
    "Account created. If email confirmation is enabled, check your email, then sign in.",
    "success"
  );

}


/* -----------------------------
   NORMALIZE ORDER ITEM
----------------------------- */

function normalizeItem(item){

  const quantity =
    Number(
      item?.quantity ??
      item?.qty ??
      1
    ) || 1;


  const unitPrice =
    Number(
      item?.unit_price ??
      item?.price ??
      item?.product_price ??
      item?.amount ??
      0
    ) || 0;


  const productName =
    item?.product_name ??
    item?.name ??
    item?.productName ??
    item?.title ??
    "Product";


  return {
    quantity,
    unitPrice,
    productName
  };

}


/* -----------------------------
   ORDER TOTAL
----------------------------- */

function getOrderTotal(
  order,
  items
){

  const directTotal =
    Number(
      order?.total_amount ??
      order?.total ??
      order?.grand_total ??
      order?.amount ??
      0
    );

  if(directTotal > 0){

    return directTotal;

  }


  return items.reduce(
    (sum,item)=>{

      const normalized =
        normalizeItem(item);

      return sum +
        (
          normalized.quantity *
          normalized.unitPrice
        );

    },
    0
  );

}


/* -----------------------------
   LOAD ORDERS
----------------------------- */

async function loadOrders(user){

  const box =
    $("ordersList");

  box.innerHTML =
    '<div class="empty">Loading your orders...</div>';

  showMsg(
    "ordersMessage",
    ""
  );


  /*
    IMPORTANT:

    We read the actual orders table first.
    We do NOT depend on order_summary
    for displaying customer orders.
  */

  const {
    data:orders,
    error:ordersError
  } =
    await client
      .from("orders")
      .select("*")
      .eq("user_id",user.id)
      .order(
        "created_at",
        {ascending:false}
      );


  if(ordersError){

    console.error(
      "Orders loading error:",
      ordersError
    );

    box.innerHTML =
      '<div class="error-box">' +
      'Unable to load your orders right now.<br><br>' +
      esc(ordersError.message) +
      '</div>';

    showMsg(
      "ordersMessage",
      "Orders could not be loaded.",
      "error"
    );

    return;

  }


  if(!orders || !orders.length){

    box.innerHTML =
      '<div class="empty">' +
      'You have not placed any orders yet.' +
      '<br><br>' +
      '<a class="button secondary" href="index.html#products">' +
      'Start Shopping' +
      '</a>' +
      '</div>';

    return;

  }


  /*
    Get all order IDs.
  */

  const orderIds =
    orders
      .map(order=>order.id)
      .filter(Boolean);


  /*
    Load all order items together.
  */

  let allItems = [];


  if(orderIds.length){

    const {
      data:itemData,
      error:itemError
    } =
      await client
        .from("order_items")
        .select("*")
        .in(
          "order_id",
          orderIds
        );


    if(itemError){

      console.warn(
        "Order items loading error:",
        itemError
      );

      /*
        We DO NOT delete/hide the order
        if item loading fails.
      */

      allItems = [];

    }else{

      allItems =
        itemData || [];

    }

  }


  /*
    Group items by order ID.
  */

  const itemsByOrder =
    new Map();


  allItems.forEach(item=>{

    const id =
      item.order_id;

    if(!itemsByOrder.has(id)){

      itemsByOrder.set(
        id,
        []
      );

    }

    itemsByOrder
      .get(id)
      .push(item);

  });


  /*
    Render every order.
  */

  box.innerHTML =
    orders
      .map(order=>{

        const items =
          itemsByOrder.get(
            order.id
          ) || [];


        const status =
          String(
            order.status ||
            "pending"
          ).toLowerCase();


        const total =
          getOrderTotal(
            order,
            items
          );


        const payment =
          order.payment_method ??
          order.payment_status ??
          "COD";


        const shippingName =
          order.shipping_name ??
          order.customer_name ??
          "";


        const shippingPhone =
          order.shipping_phone ??
          order.customer_phone ??
          "";


        const shippingAddress =
          order.shipping_address ??
          order.address ??
          "";


        const itemsHTML =
          items.length

            ? items
                .map(item=>{

                  const x =
                    normalizeItem(
                      item
                    );


                  const lineTotal =
                    x.quantity *
                    x.unitPrice;


                  return `
                    <div class="item">

                      <div class="item-name">
                        ${esc(x.productName)}
                        × ${x.quantity}
                      </div>

                      <div class="item-right">
                        ${money(lineTotal)}
                      </div>

                    </div>
                  `;

                })
                .join("")

            : `
              <div class="item">

                <div class="item-name">
                  Order details unavailable
                </div>

              </div>
            `;


        const addressHTML =
          shippingAddress ||
          shippingName ||
          shippingPhone

            ? `
              <div class="address">

                <strong>
                  Delivery address
                </strong>

                ${shippingName
                  ? `<br>${esc(shippingName)}`
                  : ""}

                ${shippingPhone
                  ? `<br>${esc(shippingPhone)}`
                  : ""}

                ${shippingAddress
                  ? `<br>${esc(shippingAddress)}`
                  : ""}

              </div>
            `

            : "";


        return `
          <article class="order-card">

            <div class="order-top">

              <div>

                <div class="order-id">
                  Order #${esc(order.id)}
                </div>

                <div class="order-date">
                  ${esc(
                    date(order.created_at)
                  )}
                </div>

              </div>

              <div class="total">
                ${money(total)}
              </div>

            </div>


            <div class="meta">

              <span class="badge ${statusClass(status)}">
                Order Status:
                ${esc(status)}
              </span>

              <span class="badge">
                Payment:
                ${esc(payment)}
              </span>

            </div>


            <div class="items">

              ${itemsHTML}

            </div>


            ${addressHTML}

          </article>
        `;

      })
      .join("");

}


/* -----------------------------
   SHOW ACCOUNT
----------------------------- */

async function showAccount(user){

  $("authView")
    .classList
    .add("hidden");

  $("accountView")
    .classList
    .remove("hidden");


  $("userEmail")
    .textContent =
      user.email || "";


  await loadOrders(
    user
  );

}


/* -----------------------------
   INITIALIZE
----------------------------- */

async function init(){

  await loadLogo();


  const {
    data,
    error
  } =
    await client.auth.getUser();


  if(error){

    console.warn(
      "Auth check:",
      error
    );

  }


  if(data?.user){

    await showAccount(
      data.user
    );

    return;

  }


  const redirect =
    new URLSearchParams(
      location.search
    ).get("redirect");


  if(redirect){

    sessionStorage.setItem(
      "rc_after_login",
      redirect
    );

  }

}


/* -----------------------------
   BUTTONS
----------------------------- */

$("loginBtn")
  .addEventListener(
    "click",
    signIn
  );


$("signupBtn")
  .addEventListener(
    "click",
    signUp
  );


$("logoutBtn")
  .addEventListener(
    "click",
    async()=>{

      await client.auth.signOut();

      location.href =
        "index.html";

    }
  );


$("loginPassword")
  .addEventListener(
    "keydown",
    event=>{

      if(event.key === "Enter"){

        signIn();

      }

    }
  );


$("signupPassword")
  .addEventListener(
    "keydown",
    event=>{

      if(event.key === "Enter"){

        signUp();

      }

    }
  );


/* -----------------------------
   AUTH STATE
----------------------------- */

client.auth.onAuthStateChange(
  async(event,session)=>{

    if(session?.user){

      const redirect =
        sessionStorage.getItem(
          "rc_after_login"
        );


      if(redirect){

        sessionStorage.removeItem(
          "rc_after_login"
        );

        location.href =
          redirect;

        return;

      }


      await showAccount(
        session.user
      );

    }

  }
);


/* START */

init();

</script>

</body>
</html>
