<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Account — RADA CREST</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
</head>

<body class="center-page">

<main class="auth">

  <a class="brand" href="index.html">
    <span class="brand-mark">RC</span>
    <span>RADA <b>CREST</b></span>
  </a>

  <div id="accountArea">

    <h1>My Account</h1>

    <p id="welcome">
      Loading account...
    </p>

    <div id="ordersBox"></div>

    <button
      class="btn full"
      type="button"
      onclick="location.href='index.html'"
    >
      Continue Shopping
    </button>

    <button
      class="text-btn"
      type="button"
      onclick="logout()"
    >
      Logout
    </button>

  </div>


  <div id="loginArea" class="hidden">

    <h1>Welcome to RADA CREST</h1>

    <p>Login to continue shopping.</p>

    <label>Email</label>

    <input
      id="loginEmail"
      type="email"
      autocomplete="email"
      placeholder="you@example.com"
    >

    <label>Password</label>

    <input
      id="loginPass"
      type="password"
      autocomplete="current-password"
      placeholder="Password"
    >

    <button
      class="btn full"
      type="button"
      onclick="login()"
    >
      Login
    </button>

    <button
      class="text-btn"
      type="button"
      onclick="showSignup()"
    >
      Create Account
    </button>

    <button
      class="text-btn"
      type="button"
      onclick="resetPassword()"
    >
      Forgot Password?
    </button>

    <button
      class="text-btn"
      type="button"
      onclick="continueAsGuest()"
    >
      Skip for now
    </button>

  </div>


  <div id="signupArea" class="hidden">

    <h1>Create Account</h1>

    <p>Create your RADA CREST account.</p>

    <label>Name</label>

    <input
      id="signupName"
      autocomplete="name"
      placeholder="Your full name"
    >

    <label>Email</label>

    <input
      id="signupEmail"
      type="email"
      autocomplete="email"
      placeholder="you@example.com"
    >

    <label>Password</label>

    <input
      id="signupPass"
      type="password"
      minlength="8"
      autocomplete="new-password"
      placeholder="At least 8 characters"
    >

    <button
      class="btn full"
      type="button"
      onclick="signup()"
    >
      Create Account
    </button>

    <button
      class="text-btn"
      type="button"
      onclick="showLogin()"
    >
      Already have an account? Login
    </button>

  </div>


  <p id="msg" class="msg"></p>

</main>


<script>

const accountArea =
  document.getElementById("accountArea");

const loginArea =
  document.getElementById("loginArea");

const signupArea =
  document.getElementById("signupArea");

const welcome =
  document.getElementById("welcome");

const ordersBox =
  document.getElementById("ordersBox");

const msg =
  document.getElementById("msg");


function getRedirect(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("redirect") ||
    "index.html"
  );

}


function showLogin(){

  accountArea.classList.add("hidden");
  signupArea.classList.add("hidden");
  loginArea.classList.remove("hidden");

  msg.textContent = "";

}


function showSignup(){

  accountArea.classList.add("hidden");
  loginArea.classList.add("hidden");
  signupArea.classList.remove("hidden");

  msg.textContent = "";

}


function continueAsGuest(){

  sessionStorage.setItem(
    "rc_guest",
    "true"
  );

  location.href =
    getRedirect();

}


async function login(){

  if(!sbReady()){

    msg.textContent =
      "Supabase is not configured.";

    return;

  }

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPass"
    ).value;

  if(!email || !password){

    msg.textContent =
      "Enter email and password.";

    return;

  }

  msg.textContent =
    "Logging in...";

  const {
    error
  } =
    await supabaseClient.auth
      .signInWithPassword({

        email,
        password

      });

  if(error){

    msg.textContent =
      error.message;

    return;

  }

  sessionStorage.removeItem(
    "rc_guest"
  );

  const redirect =
    getRedirect();

  if(
    redirect &&
    redirect !== "index.html"
  ){

    location.href =
      redirect;

    return;

  }

  await loadAccount();

}


async function signup(){

  if(!sbReady()){

    msg.textContent =
      "Supabase is not configured.";

    return;

  }

  const name =
    document.getElementById(
      "signupName"
    ).value.trim();

  const email =
    document.getElementById(
      "signupEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "signupPass"
    ).value;

  if(!name){

    msg.textContent =
      "Enter your name.";

    return;

  }

  if(!email){

    msg.textContent =
      "Enter your email.";

    return;

  }

  if(password.length < 8){

    msg.textContent =
      "Password must be at least 8 characters.";

    return;

  }

  msg.textContent =
    "Creating account...";

  const {
    data,
    error
  } =
    await supabaseClient.auth.signUp({

      email,
      password,

      options: {
        data: {
          full_name: name
        }
      }

    });

  if(error){

    msg.textContent =
      error.message;

    return;

  }

  if(data.session){

    sessionStorage.removeItem(
      "rc_guest"
    );

    await loadAccount();

    return;

  }

  msg.textContent =
    "Account created. Check your email if confirmation is enabled, then login.";

}


async function resetPassword(){

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();

  if(!email){

    msg.textContent =
      "Enter your email first.";

    return;

  }

  const {
    error
  } =
    await supabaseClient.auth
      .resetPasswordForEmail(

        email,

        {
          redirectTo:
            window.location.origin +
            "/reset-password.html"
        }

      );

  msg.textContent =
    error
      ? error.message
      : "Password reset email sent.";

}


async function loadAccount(){

  if(!sbReady()){

    accountArea.classList.add("hidden");
    loginArea.classList.remove("hidden");

    return;

  }

  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth
      .getUser();


  if(!user){

    accountArea.classList.add("hidden");
    loginArea.classList.remove("hidden");

    return;

  }


  loginArea.classList.add("hidden");
  signupArea.classList.add("hidden");
  accountArea.classList.remove("hidden");


  const name =
    user.user_metadata?.full_name ||
    user.email ||
    "Customer";


  welcome.innerHTML =
    `Welcome, <strong>${escapeHtml(name)}</strong>`;


  await loadOrders(user.id);

}


async function loadOrders(userId){

  ordersBox.innerHTML = `
    <h2>My Orders</h2>
    <p>Loading orders...</p>
  `;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("orders")
      .select("*")
      .eq("customer_id",userId)
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    ordersBox.innerHTML = `
      <h2>My Orders</h2>
      <p>${escapeHtml(error.message)}</p>
    `;

    return;

  }


  if(!data || !data.length){

    ordersBox.innerHTML = `
      <h2>My Orders</h2>
      <p>No orders yet.</p>
    `;

    return;

  }


  ordersBox.innerHTML = `

    <h2>My Orders</h2>

    ${data.map(order => `

      <div
        class="cart-row"
        style="
          display:block;
          margin:15px 0;
          padding:15px;
        "
      >

        <div
          style="
            display:flex;
            justify-content:space-between;
            gap:10px;
          "
        >

          <strong>
            Order #${order.id}
          </strong>

          <strong>
            ₹${Number(
              order.total_amount || 0
            ).toLocaleString("en-IN")}
          </strong>

        </div>

        <small>
          ${new Date(
            order.created_at
          ).toLocaleString("en-IN")}
        </small>

        <p>
          Order Status:
          <strong>
            ${escapeHtml(
              order.status || "pending"
            )}
          </strong>
        </p>

        <p>
          Payment:
          <strong>
            ${escapeHtml(
              order.payment_status || "pending"
            )}
          </strong>
        </p>

      </div>

    `).join("")}

  `;

}


async function logout(){

  await supabaseClient.auth.signOut();

  location.href =
    "account.html";

}


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


loadAccount();

</script>

</body>
</html>
