<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers — RADA CREST</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script></head><body><main class="section"><a href="admin-dashboard.html">← Dashboard</a><h1>Customers</h1><div id="list"></div></main><script>async function go(){const {data:{user}}=await supabaseClient.auth.getUser();if(!user)return location.href='admin.html';const {data:p}=await supabaseClient.from('profiles').select('role').eq('id',user.id).single();if(p?.role!=='admin')return location.href='admin.html';const {data,error}=await supabaseClient.from('profiles').select('id,full_name,phone,role,created_at').order('created_at',{ascending:false});if(error)return list.textContent=error.message;list.innerHTML=(data||[]).map(x=>`<div class="cart-row"><div><b>${x.full_name||'Customer'}</b><small>${x.phone||''} · ${x.role}</small></div></div>`).join('')}go();</script></body></html>
