<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Smart AI Search | RADA CREST</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Supabase Core Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Real AI Vision Model: TensorFlow.js & MobileNet -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>

  <style>
    :root {
      --primary: #FF7A00;
      --primary-glow: rgba(255, 122, 0, 0.4);
      --primary-soft: rgba(255, 122, 0, 0.12);
      --bg-dark: #0b0d14;
      --card-bg: rgba(18, 20, 26, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #9ba1b0;
      --danger: #ef4444;
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(255, 122, 0, 0.07) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(255, 122, 0, 0.04) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .header {
      background: rgba(18, 20, 26, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    .back-btn:active { transform: scale(0.92); }

    .brand-mark {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-mark span { color: var(--primary); }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 16px;
    }

    .search-hero {
      position: relative;
      margin-bottom: 14px;
    }

    .search-input-shell {
      position: relative;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      display: flex;
      align-items: center;
      padding: 6px 12px 6px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }
    .search-input-shell:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 25px var(--primary-glow);
      background: rgba(255, 255, 255, 0.07);
    }

    .search-icon-left {
      color: var(--muted);
      font-size: 1.1rem;
      margin-right: 12px;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .search-input::placeholder {
      color: var(--muted);
      font-weight: 400;
    }

    .input-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .action-icon-btn:hover {
      color: var(--primary);
      border-color: var(--primary);
    }
    .action-icon-btn:active { transform: scale(0.9); }
    .action-icon-btn.listening {
      background: var(--primary);
      color: #000;
      animation: pulseMic 1.2s infinite;
    }
    @keyframes pulseMic {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,122,0,0.7); }
      50% { box-shadow: 0 0 0 12px rgba(255,122,0,0); }
    }

    .analysis-pill {
      display: none;
      background: var(--primary-soft);
      border: 1px solid var(--primary);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 0.82rem;
      align-items: center;
      justify-content: space-between;
      animation: slideDown 0.3s ease;
    }
    .analysis-pill.show { display: flex; }
    .analysis-pill b { color: var(--primary); }

    /* Photo AI Preview Banner */
    .photo-search-preview {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 16px;
      align-items: center;
      gap: 12px;
      animation: slideDown 0.3s ease;
    }
    .photo-search-preview.show { display: flex; }
    .preview-thumb {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      border: 1.5px solid var(--primary);
    }
    .preview-info { flex: 1; }
    .preview-info h4 { font-size: 0.85rem; font-weight: 700; color: #fff; }
    .preview-info p { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    .filter-wrapper {
      margin-bottom: 18px;
      overflow-x: auto;
      display: flex;
      gap: 8px;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .filter-wrapper::-webkit-scrollbar { display: none; }

    .chip-filter {
      padding: 7px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .chip-filter.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .results-count {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 12px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .products-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all 0.25s var(--ease-spring);
      position: relative;
    }
    .product-card:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .card-img-wrap {
      width: 100%;
      height: 140px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }
    .card-img-wrap img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .card-rating {
      color: #ffd700;
      font-weight: 700;
    }

    .card-price-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: auto;
    }
    .selling-price {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary);
    }
    .mrp-price {
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: line-through;
    }

    .empty-box {
      grid-column: span 2;
      text-align: center;
      padding: 50px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
    }
    .empty-icon {
      font-size: 2.8rem;
      color: var(--primary);
      margin-bottom: 12px;
      opacity: 0.8;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="brand-mark">RADA <span>CREST</span> SEARCH</div>
    <div style="width:40px;"></div>
  </header>

  <div class="container">

    <div class="search-hero">
      <div class="search-input-shell">
        <i class="fa-solid fa-magnifying-glass search-icon-left"></i>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Search bulbs, extensions, lights..." 
          autocomplete="off"
        />
        
        <div class="input-actions">
          <button class="action-icon-btn" id="voiceBtn" title="Voice Search" onclick="toggleVoiceSearch()">
            <i class="fa-solid fa-microphone"></i>
          </button>
          
          <label class="action-icon-btn" title="Photo Search">
            <i class="fa-solid fa-camera"></i>
            <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="handleVisualSearch(event)" />
          </label>
        </div>
      </div>
    </div>

    <!-- AI Intent Autocorrect Feedback -->
    <div class="analysis-pill" id="analysisPill">
      <span id="analysisText">Showing closest match for your search.</span>
      <i class="fa-solid fa-wand-magic-sparkles" style="color:var(--primary);"></i>
    </div>

    <!-- Real AI Photo Analysis Banner -->
    <div class="photo-search-preview" id="photoPreview">
      <img id="previewImg" src="" class="preview-thumb" alt="Uploaded Preview" />
      <div class="preview-info">
        <h4 id="photoAiHeader">AI Analyzing Image...</h4>
        <p id="imageRecognizedTag"><i class="fa-solid fa-spinner fa-spin"></i> Detecting object pixels...</p>
      </div>
      <button class="action-icon-btn" onclick="clearPhotoSearch()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="filter-wrapper">
      <div class="chip-filter active" onclick="applyCategoryFilter('all', this)">All Items</div>
      <div class="chip-filter" onclick="applyCategoryFilter('led', this)">LED Bulbs</div>
      <div class="chip-filter" onclick="applyCategoryFilter('extension', this)">Extension Boards</div>
      <div class="chip-filter" onclick="applyCategoryFilter('t-bulb', this)">T-Bulbs</div>
      <div class="chip-filter" onclick="applyCategoryFilter('accessories', this)">Accessories</div>
      <div class="chip-filter" onclick="toggleSortPrice(this)"><i class="fa-solid fa-arrow-down-wide-short"></i> Price</div>
    </div>

    <div class="results-count">
      <span id="resultCountText">Loading catalog...</span>
      <span id="activeFilterBadge"></span>
    </div>

    <div class="products-grid" id="productsGrid"></div>

  </div>

  <script>
    const SUPABASE_URL = 'https://ynpsnkvrjhaxdynmurzj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlucHNua3ZyamhheGR5bm11cnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNTc5NjAsImV4cCI6MjEwMTgzMzk2MH0.I3xFYthE0JNfGnD6N1BaNBybSq7m0G6MRILzq3NXihg';

    let supabaseClient = null;
    let aiModel = null;
    let allProducts = [];
    let currentCategory = 'all';
    let currentPriceSort = 'none';
    let searchDebounceTimer = null;

    // 1. Initialize Client & Preload AI Model in Background
    async function initPage() {
      if (window.supabase && window.supabase.createClient) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }

      // Preload MobileNet AI Model for Image Analysis
      if (window.mobilenet) {
        window.mobilenet.load().then(model => {
          aiModel = model;
        }).catch(err => console.warn("AI Model load deferred:", err));
      }

      await loadCatalog();
    }

    async function loadCatalog() {
      if (!supabaseClient && window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      if (!supabaseClient) return;

      try {
        const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending: false });
        if (error) throw error;
        
        allProducts = data || [];

        const urlParams = new URLSearchParams(window.location.search);
        const initialQ = urlParams.get('q');
        if (initialQ) {
          document.getElementById('searchInput').value = initialQ;
          performSmartSearch(initialQ);
        } else {
          renderProducts(allProducts);
        }
      } catch (e) {
        document.getElementById('resultCountText').innerText = "Failed to load products.";
      }
    }

    // 2. Real AI Visual Recognition
    async function handleVisualSearch(e) {
      const file = e.target.files[0];
      if (!file) return;

      const previewBox = document.getElementById('photoPreview');
      const previewImg = document.getElementById('previewImg');
      const tagText = document.getElementById('imageRecognizedTag');
      const headerText = document.getElementById('photoAiHeader');

      previewBox.classList.add('show');
      headerText.innerText = "Scanning Image Pixels...";
      tagText.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Running object classifier...`;

      const reader = new FileReader();
      reader.onload = async (event) => {
        previewImg.src = event.target.result;

        previewImg.onload = async () => {
          try {
            if (!aiModel && window.mobilenet) {
              aiModel = await window.mobilenet.load();
            }

            if (!aiModel) {
              headerText.innerText = "Model Unavailable";
              tagText.innerText = "AI Vision could not initialize in browser.";
              renderProducts([]);
              return;
            }

            // Real AI Prediction
            const predictions = await aiModel.classify(previewImg);
            
            // Electronic / Hardware Target Keywords
            const lightingKeywords = [
              'lamp', 'light', 'bulb', 'spotlight', 'lantern', 'candle', 'lampshade', 'chandelier', 'torch'
            ];
            const hardwareKeywords = [
              'plug', 'socket', 'switch', 'cord', 'wire', 'cable', 'extension', 'power', 'adapter'
            ];

            let matchedKeyword = null;
            let detectedClass = predictions[0] ? predictions[0].className.toLowerCase() : '';

            for (const pred of predictions) {
              const name = pred.className.toLowerCase();
              if (lightingKeywords.some(k => name.includes(k))) {
                matchedKeyword = 'led';
                detectedClass = pred.className;
                break;
              }
              if (hardwareKeywords.some(k => name.includes(k))) {
                matchedKeyword = 'extension';
                detectedClass = pred.className;
                break;
              }
            }

            // If user uploads an unrelated photo (e.g. human face, animal, shoe, vehicle)
            if (!matchedKeyword) {
              headerText.innerText = "Unrecognized Category";
              tagText.innerText = `Detected: "${detectedClass.split(',')[0]}". No matching light/electrical product found in store.`;
              renderProducts([]);
              return;
            }

            // Filter relevant catalog products
            headerText.innerText = "Matched Product Category";
            tagText.innerText = `AI recognized: ${detectedClass.split(',')[0]} (${matchedKeyword.toUpperCase()})`;
            
            const matchedProducts = allProducts.filter(p => (p.category || '').toLowerCase().includes(matchedKeyword));
            applyFilters(matchedProducts.length > 0 ? matchedProducts : []);

          } catch (err) {
            headerText.innerText = "Analysis Failed";
            tagText.innerText = "Could not analyze image pixels.";
            renderProducts([]);
          }
        };
      };
      reader.readAsDataURL(file);
    }

    function clearPhotoSearch() {
      document.getElementById('photoPreview').classList.remove('show');
      document.getElementById('photoInput').value = "";
      performSmartSearch(document.getElementById('searchInput').value);
    }

    // 3. Fuzzy Text Matching
    function calculateSimilarity(s1, s2) {
      s1 = (s1 || '').toLowerCase();
      s2 = (s2 || '').toLowerCase();
      if (s1 === s2) return 1.0;
      if (s1.includes(s2) || s2.includes(s1)) return 0.85;

      const costs = [];
      for (let i = 0; i <= s1.length; i++) {
        let lastValue = i;
        for (let j = 0; j <= s2.length; j++) {
          if (i === 0) costs[j] = j;
          else if (j > 0) {
            let newValue = costs[j - 1];
            if (s1.charAt(i - 1) !== s2.charAt(j - 1)) {
              newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
            }
            costs[j - 1] = lastValue;
            lastValue = newValue;
          }
        }
        if (i > 0) costs[s2.length] = lastValue;
      }
      const longer = Math.max(s1.length, s2.length);
      return longer === 0 ? 1.0 : (longer - costs[s2.length]) / longer;
    }

    function performSmartSearch(query) {
      query = (query || '').trim().toLowerCase();
      const analysisPill = document.getElementById('analysisPill');
      const analysisText = document.getElementById('analysisText');

      if (!query) {
        analysisPill.classList.remove('show');
        applyFilters(allProducts);
        return;
      }

      let exactMatches = [];
      let fuzzyMatches = [];

      allProducts.forEach(prod => {
        const title = (prod.name || '').toLowerCase();
        const cat = (prod.category || '').toLowerCase();
        const desc = (prod.colors || '') + ' ' + (prod.size || '');

        if (title.includes(query) || cat.includes(query) || desc.toLowerCase().includes(query)) {
          exactMatches.push({ product: prod, score: 1.0 });
        } else {
          const tokens = (title + ' ' + cat).split(/\s+/);
          let bestScore = 0;
          tokens.forEach(tok => {
            const score = calculateSimilarity(tok, query);
            if (score > bestScore) bestScore = score;
          });

          if (bestScore >= 0.45) {
            fuzzyMatches.push({ product: prod, score: bestScore });
          }
        }
      });

      fuzzyMatches.sort((a, b) => b.score - a.score);
      const combined = [...exactMatches, ...fuzzyMatches].map(m => m.product);

      if (exactMatches.length === 0 && fuzzyMatches.length > 0) {
        analysisText.innerHTML = `Showing smart matches for <b>"${query}"</b>`;
        analysisPill.classList.add('show');
      } else {
        analysisPill.classList.remove('show');
      }

      applyFilters(combined);
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        performSmartSearch(e.target.value);
      }, 200);
    });

    // 4. Voice Recognition
    function toggleVoiceSearch() {
      const voiceBtn = document.getElementById('voiceBtn');
      const searchInput = document.getElementById('searchInput');

      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert("Voice search is not supported in this browser. Please use Chrome.");
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();

      recognition.lang = 'hi-IN';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        voiceBtn.classList.add('listening');
        searchInput.placeholder = "Listening... Speak now";
      };

      recognition.onresult = (event) => {
        const spokenWord = event.results[0][0].transcript;
        searchInput.value = spokenWord;
        performSmartSearch(spokenWord);
      };

      recognition.onerror = () => {
        voiceBtn.classList.remove('listening');
        searchInput.placeholder = "Search products...";
      };

      recognition.onend = () => {
        voiceBtn.classList.remove('listening');
        searchInput.placeholder = "Search products...";
      };

      recognition.start();
    }

    // 5. Category & Filters
    function applyCategoryFilter(cat, element) {
      document.querySelectorAll('.chip-filter').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');
      currentCategory = cat;
      performSmartSearch(document.getElementById('searchInput').value);
    }

    function toggleSortPrice(element) {
      if (currentPriceSort === 'none' || currentPriceSort === 'desc') {
        currentPriceSort = 'asc';
        element.innerHTML = `<i class="fa-solid fa-arrow-up-1-9"></i> Low Price`;
        element.classList.add('active');
      } else {
        currentPriceSort = 'desc';
        element.innerHTML = `<i class="fa-solid fa-arrow-down-9-1"></i> High Price`;
        element.classList.add('active');
      }
      performSmartSearch(document.getElementById('searchInput').value);
    }

    function applyFilters(productsToFilter) {
      let filtered = [...productsToFilter];

      if (currentCategory !== 'all') {
        filtered = filtered.filter(p => (p.category || '').toLowerCase() === currentCategory.toLowerCase());
      }

      if (currentPriceSort === 'asc') {
        filtered.sort((a, b) => Number(a.price) - Number(b.price));
      } else if (currentPriceSort === 'desc') {
        filtered.sort((a, b) => Number(b.price) - Number(a.price));
      }

      renderProducts(filtered);
    }

    function renderProducts(list) {
      const grid = document.getElementById('productsGrid');
      const countEl = document.getElementById('resultCountText');

      countEl.innerText = `${list.length} item(s) found`;

      if (list.length === 0) {
        grid.innerHTML = `
          <div class="empty-box">
            <i class="fa-solid fa-box-open empty-icon"></i>
            <h3 style="font-weight:800; margin-bottom:6px;">No Matching Product Found</h3>
            <p style="color:var(--muted); font-size:0.85rem;">Try searching light bulbs, cords, or clear filters.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = list.map(item => {
        const photo = item.image || (item.images && item.images[0]) || 'https://via.placeholder.com/300?text=RADA+CREST';
        const hasDiscount = item.old_price && item.old_price > item.price;

        return `
          <div class="product-card" onclick="window.location.href='product.html?id=${item.id}'">
            <div class="card-img-wrap">
              <img src="${photo}" alt="${item.name}" loading="lazy" />
            </div>
            <div class="card-title">${item.name}</div>
            <div class="card-meta">
              <span class="card-rating"><i class="fa-solid fa-star"></i> ${item.rating || '5.0'}</span>
              <span>•</span>
              <span>${item.sales_count || 0} sold</span>
            </div>
            <div class="card-price-row">
              <span class="selling-price">₹${item.price}</span>
              ${hasDiscount ? `<span class="mrp-price">₹${item.old_price}</span>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    window.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
