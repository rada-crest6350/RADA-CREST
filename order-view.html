<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Details — RADA CREST</title>

<!-- Fonts & Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  *{box-sizing:border-box;margin:0;padding:0;}

  :root{
    --bg-deep:#060608;
    --panel-card:rgba(20, 20, 28, 0.85);
    --border:rgba(255, 255, 255, 0.08);
    --border-hover:rgba(255, 122, 0, 0.6);
    --text:#ffffff;
    --text-muted:#9da0b0;
    --brand:#FF7A00;
    --brand-glow:rgba(255, 122, 0, 0.4);
    --brand-gradient:linear-gradient(135deg, #FF9433 0%, #FF5100 100%);
    --success:#3dd598;
    --warning:#ffbb33;
    --danger:#ff4d4d;
  }

  body{
    background:var(--bg-deep);
    color:var(--text);
    font-family:'Plus Jakarta Sans', sans-serif;
    min-height:100vh;
    padding:20px;
    position:relative;
    overflow-x:hidden;
  }

  /* Floating Anime/Cyber Ambient Glow Animation */
  .cyber-grid-glow{
    position:fixed;
    top:0;left:0;width:100%;height:100%;
    background-image: 
      radial-gradient(circle at 15% 20%, rgba(255, 122, 0, 0.12) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(255, 81, 0, 0.1) 0%, transparent 45%);
    z-index:0;
    pointer-events:none;
    animation: floatGlow 8s ease-in-out infinite alternate;
  }
  @keyframes floatGlow {
    0% { transform: translateY(0px) scale(1); }
    100% { transform: translateY(-15px) scale(1.05); }
  }

  .page{
    max-width:900px;
    margin:0 auto;
    position:relative;
    z-index:1;
    animation: pageEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes pageEntrance{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
    background:var(--panel-card);
    backdrop-filter:blur(20px);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:#fff;
    font-weight:800;
  }

  .brand-mark{
    width:36px;height:36px;
    border-radius:10px;
    background:var(--brand-gradient);
    color:#000;
    display:grid;place-items:center;
    font-weight:900;
    box-shadow:0 0 15px var(--brand-glow);
    animation: pulseMark 2s infinite;
  }
  @keyframes pulseMark {
    0%, 100% { box-shadow: 0 0 10px var(--brand-glow); }
    50% { box-shadow: 0 0 25px var(--brand); }
  }

  .back{
    text-decoration:none;
    color:var(--text-muted);
    font-weight:700;
    font-size:13px;
    transition:0.2s;
  }
  .back:hover{color:var(--brand);}

  /* Floating Anime Card Style */
  .card{
    background:var(--panel-card);
    backdrop-filter:blur(16px);
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px;
    margin-bottom:16px;
    box-shadow:0 10px 35px rgba(0,0,0,0.6);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
  }
  .card:hover{
    border-color: rgba(255,122,0,0.5);
    transform: translateY(-2px);
    box-shadow: 0 15px 40px rgba(255,122,0,0.15);
  }

  .order-head{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
  }

  .order-id{font-size:20px;font-weight:900;letter-spacing:-0.5px;}
  .date{color:var(--text-muted);font-size:12px;margin-top:3px;}

  .status{
    display:inline-block;
    margin-top:10px;
    padding:5px 12px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:800;
    text-transform:capitalize;
  }
  .status-delivered{background:rgba(61,213,152,0.15);color:var(--success);border:1px solid rgba(61,213,152,0.3);}
  .status-cancelled{background:rgba(255,77,77,0.15);color:var(--danger);border:1px solid rgba(255,77,77,0.3);}
  .status-shipped{background:rgba(0,210,255,0.15);color:#00d2ff;border:1px solid rgba(0,210,255,0.3);}
  .status-confirmed, .status-processing, .status-packed{background:rgba(255,187,51,0.15);color:var(--warning);border:1px solid rgba(255,187,51,0.3);}
  .status-pending{background:rgba(255,255,255,0.06);color:var(--text-muted);border:1px solid var(--border);}

  /* PROFESSIONAL ANIMATED TRACKING */
  .tracking{margin-top:20px;border-top:1px solid var(--border);padding-top:18px;}
  .tracking h2, .card h2{margin-top:0;font-size:16px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;}

  .steps{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
    margin-top:16px;
    position:relative;
  }

  .step{text-align:center;position:relative;}

  .circle{
    width:36px;height:36px;
    margin:auto;
    border-radius:50%;
    background:rgba(255,255,255,0.04);
    border:1.5px solid var(--border);
    color:var(--text-muted);
    display:grid;place-items:center;
    font-weight:900;
    font-size:12px;
    position:relative;
    z-index:2;
    transition:all 0.4s ease;
  }

  .step.active .circle{
    background:var(--brand-gradient);
    color:#000;
    border-color:var(--brand);
    box-shadow:0 0 20px var(--brand-glow);
    transform:scale(1.15);
  }

  .step.done .circle{
    background:var(--success);
    color:#000;
    border-color:var(--success);
    box-shadow:0 0 12px rgba(61,213,152,0.4);
  }

  .step-label{
    margin-top:6px;
    font-size:11px;
    font-weight:700;
    color:var(--text-muted);
  }
  .step.active .step-label{color:#fff;}
  .step-date{font-size:9.5px;color:var(--text-muted);margin-top:2px;}

  .step-line{
    position:absolute;
    top:18px;left:50%;
    width:100%;height:2px;
    background:var(--border);
    z-index:1;
  }
  .step:last-child .step-line{display:none;}
  .step.done .step-line{background:var(--success);transition:background 0.5s ease;}

  /* ITEMS */
  .items{display:grid;gap:10px;}

  .item{
    display:flex;
    justify-content:space-between;
    gap:14px;
    padding:14px;
    background:rgba(255,255,255,0.02);
    border:1px solid var(--border);
    border-radius:14px;
    align-items:center;
    cursor:pointer;
    transition:0.3s;
  }
  .item:hover{
    border-color:var(--brand);
    background:rgba(255,122,0,0.05);
    transform:translateY(-2px);
  }

  .item-left{display:flex;gap:12px;align-items:center;}
  .item-image{
    width:60px;height:60px;
    border-radius:10px;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);
    object-fit:cover;
  }

  .item-name{font-weight:800;font-size:14px;color:#fff;}
  .item-qty{color:var(--text-muted);font-size:12px;margin-top:2px;}
  .item-price-box {display:flex;flex-direction:column;align-items:flex-end;}
  .item-price{font-weight:900;font-size:15px;color:var(--brand);}
  .item-mrp {font-size:11px;color:var(--text-muted);text-decoration:line-through;}

  /* DETAILED ANIME BILL BREAKDOWN */
  .bill-box{
    background:linear-gradient(135deg, rgba(255,122,0,0.04), rgba(20,20,28,0.6));
    border:1px solid rgba(255,122,0,0.2);
    border-radius:16px;
    padding:16px;
    margin-top:12px;
    box-shadow: inset 0 0 15px rgba(255,122,0,0.03);
  }
  .bill-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--text-muted);
    padding:5px 0;
  }
  .bill-row.discount {color:var(--success);}
  .bill-row.total{
    border-top:1px dashed var(--border);
    margin-top:10px;
    padding-top:12px;
    color:#fff;
    font-size:16px;
    font-weight:900;
  }

  /* INFO GRID */
  .info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .info-box{
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
  }

  .info-box strong{
    display:block;
    margin-bottom:4px;
    font-size:11.5px;
    color:var(--brand);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }

  .info-box span{
    color:var(--text-muted);
    font-size:12.5px;
    line-height:1.4;
  }

  /* BUTTONS */
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:0;
    border-radius:12px;
    padding:11px 16px;
    text-decoration:none;
    font-weight:800;
    font-size:12.5px;
    cursor:pointer;
    transition:0.3s;
  }

  .primary{
    background:var(--brand-gradient);
    color:#000;
    box-shadow:0 0 15px var(--brand-glow);
  }
  .primary:hover{transform:translateY(-2px);box-shadow:0 0 25px var(--brand);opacity:0.95;}

  .secondary{
    background:rgba(255,255,255,0.05);
    color:#fff;
    border:1px solid var(--border);
  }
  .secondary:hover{background:rgba(255,255,255,0.1);border-color:var(--brand);}

  .danger-btn{
    background:rgba(255,77,77,0.1);
    color:var(--danger);
    border:1px solid rgba(255,77,77,0.3);
  }
  .danger-btn:hover{background:var(--danger);color:#fff;}

  /* REVIEW BUTTON & MODALS */
  .review-btn{
    margin-top:5px;
    padding:3px 8px;
    border:1px solid var(--brand);
    border-radius:6px;
    background:rgba(255,122,0,0.1);
    color:var(--brand);
    font-weight:700;
    cursor:pointer;
    font-size:11px;
    display:inline-block;
  }
  .review-btn:hover{background:var(--brand);color:#000;}

  .review-modal{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.8);
    backdrop-filter:blur(10px);
    display:none;align-items:center;justify-content:center;
    padding:16px;z-index:9999;
  }
  .review-modal.show{display:flex;}

  .review-box{
    width:min(440px,100%);
    background:#14141c;
    border:1.5px solid rgba(255,122,0,0.4);
    border-radius:18px;
    padding:20px;
    box-shadow:0 25px 60px rgba(0,0,0,0.8);
  }

  .review-head{display:flex;justify-content:space-between;align-items:center;}
  .review-close{
    border:0;background:rgba(255,255,255,0.06);
    color:#fff;width:32px;height:32px;border-radius:50%;
    font-size:16px;cursor:pointer;display:grid;place-items:center;
  }

  .review-stars{display:flex;gap:6px;margin:10px 0;}
  .review-star{border:0;background:none;font-size:26px;color:rgba(255,255,255,0.15);cursor:pointer;}
  .review-star.selected{color:var(--warning);text-shadow:0 0 10px rgba(255,187,51,0.6);}

  .review-text{
    width:100%;min-height:90px;
    background:rgba(255,255,255,0.04);
    border:1.5px solid var(--border);
    border-radius:10px;padding:10px;
    color:#fff;font-family:inherit;font-size:12.5px;resize:vertical;outline:0;
  }
  .review-text:focus{border-color:var(--brand);box-shadow:0 0 10px var(--brand-glow);}

  .error{color:var(--danger);background:rgba(255,77,77,0.1);border:1px solid rgba(255,77,77,0.2);padding:14px;border-radius:12px;text-align:center;}

  @media(max-width:700px){
    .steps{grid-template-columns:1fr;gap:10px;}
    .step{display:flex;align-items:center;gap:12px;text-align:left;}
    .circle{margin:0;flex:none;}
    .step-line{display:none;}
    .info-grid{grid-template-columns:1fr;}
    .order-head{flex-direction:column;gap:8px;}
  }
</style>
</head>
<body>

<div class="cyber-grid-glow"></div>

<div class="page">
  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">RC</span>
      <span>RADA CREST</span>
    </a>
    <a class="back" href="account.html"><i class="fa-solid fa-arrow-left"></i> My Account</a>
  </div>

  <div id="pageMessage"></div>
  <div id="orderContent"></div>
</div>

<!-- REVIEW MODAL -->
<div id="reviewModal" class="review-modal">
  <div class="review-box">
    <div class="review-head">
      <div>
        <h3 style="margin:0;font-size:16px;">Rate & Review</h3>
        <div id="reviewProductName" style="color:var(--brand);font-size:11.5px;margin-top:2px;font-weight:600;"></div>
      </div>
      <button class="review-close" onclick="closeReview()">✕</button>
    </div>
    <div style="margin-top:14px;font-size:12px;font-weight:700;">Select Rating</div>
    <div class="review-stars">
      <button type="button" class="review-star" data-rating="1">★</button>
      <button type="button" class="review-star" data-rating="2">★</button>
      <button type="button" class="review-star" data-rating="3">★</button>
      <button type="button" class="review-star" data-rating="4">★</button>
      <button type="button" class="review-star" data-rating="5">★</button>
    </div>
    <textarea id="reviewText" class="review-text" placeholder="Share your experience..."></textarea>
    <div id="reviewMessage" style="margin-top:8px;font-size:11.5px;color:var(--brand);"></div>
    <button class="btn primary" style="width:100%;margin-top:14px;" onclick="submitReview()">Submit Review</button>
  </div>
</div>

<!-- EDIT ADDRESS MODAL -->
<div id="addressModal" class="review-modal">
  <div class="review-box">
    <div class="review-head">
      <h3 style="margin:0;font-size:16px;">Change Delivery Address</h3>
      <button class="review-close" onclick="closeAddressModal()">✕</button>
    </div>
    <div style="margin-top:14px;">
      <label style="font-size:11.5px;color:var(--text-muted);font-weight:700;">New Address</label>
      <textarea id="newAddressText" class="review-text" placeholder="Enter updated delivery address..."></textarea>
    </div>
    <div id="addressMessage" style="margin-top:8px;font-size:11.5px;color:var(--brand);"></div>
    <button class="btn primary" style="width:100%;margin-top:14px;" onclick="saveNewAddress()">Update Address</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ynpsnkvrjhaxdynmurzj.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlucHNua3ZyamhheGR5bm11cnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNTc5NjAsImV4cCI6MjEwMTgzMzk2MH0.I3xFYthE0JNfGnD6N1BaNBybSq7m0G6MRILzq3NXihg";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const box = document.getElementById("orderContent");
const message = document.getElementById("pageMessage");
let currentOrderId = null;

function esc(value){
  return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function money(value){
  return "₹" + Number(value || 0).toLocaleString("en-IN");
}

function formatDate(value){
  try{
    return new Date(value).toLocaleString("en-IN", { day:"2-digit", month:"short", year:"numeric", hour:"numeric", minute:"2-digit", hour12:true });
  }catch{ return "-"; }
}

function cleanImage(value){
  if(!value) return "";
  let url = String(value).trim().replace(/^\[img\]\s*/i,"").replace(/\s*\[\/img\]$/i,"").replace(/^["']+|["']+$/g,"").trim();
  return /^https?:\/\/\S+$/i.test(url) ? url : "";
}

function statusClass(status){
  return String(status || "pending").toLowerCase().replace(/[^a-z]/g,"");
}

function getTrackingSteps(status){
  const current = String(status || "pending").toLowerCase().trim();
  if(current === "cancelled") return { cancelled: true, index: -1 };
  const steps = ["pending", "confirmed", "packed", "shipped", "delivered"];
  let index = steps.indexOf(current);
  if(current === "processing") index = 2;
  if(index < 0) index = 0;
  return { cancelled: false, index: index };
}

function renderTracking(status, order){
  const tracking = getTrackingSteps(status);
  if(tracking.cancelled){
    return `
      <div class="tracking">
        <h2><i class="fa-solid fa-location-crosshairs" style="color:var(--brand);"></i> Order Tracking</h2>
        <div class="status status-cancelled" style="margin-top:10px;">Order Cancelled</div>
      </div>
    `;
  }
  const labels = [
    ["pending","Placed", order.created_at],
    ["confirmed","Confirmed", order.confirmed_at],
    ["packed","Packed", order.packed_at],
    ["shipped","Shipped", order.shipped_at],
    ["delivered","Delivered", order.delivered_at]
  ];
  return `
    <div class="tracking">
      <h2><i class="fa-solid fa-location-crosshairs" style="color:var(--brand);"></i> Order Tracking Flow</h2>
      <div class="steps">
        ${labels.map((item, index) => {
          const done = index < tracking.index;
          const active = index === tracking.index;
          const timeStr = item[2] ? formatDate(item[2]) : (active ? "In Progress" : "");
          return `
            <div class="step ${done ? "done" : ""} ${active ? "active" : ""}">
              <div class="circle">${done ? "✓" : index + 1}</div>
              <div class="step-label">${item[1]}</div>
              <div class="step-date">${timeStr}</div>
              ${index < labels.length - 1 ? `<div class="step-line"></div>` : ""}
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;
}

function shortAddress(addr){
  if(!addr) return "N/A";
  let clean = String(addr).trim();
  return clean.length > 50 ? clean.substring(0, 47) + "..." : clean;
}

function openAddressModal(currentAddr){
  document.getElementById("newAddressText").value = currentAddr || "";
  document.getElementById("addressMessage").textContent = "";
  document.getElementById("addressModal").classList.add("show");
}

function closeAddressModal(){
  document.getElementById("addressModal").classList.remove("show");
}

async function saveNewAddress(){
  const newAddr = document.getElementById("newAddressText").value.trim();
  const msgBox = document.getElementById("addressMessage");
  if(!newAddr){ msgBox.textContent = "Please enter a valid address."; return; }
  if(!currentOrderId){ msgBox.textContent = "Order ID missing."; return; }

  msgBox.textContent = "Updating address...";
  const { error } = await supabaseClient
    .from("orders")
    .update({ shipping_address: newAddr, address: newAddr })
    .eq("id", currentOrderId);

  if(error){
    msgBox.textContent = "Error: " + error.message;
    return;
  }

  msgBox.textContent = "Address updated successfully!";
  setTimeout(() => { closeAddressModal(); location.reload(); }, 1000);
}

let reviewProductId = null;
let reviewRating = 0;

document.addEventListener("DOMContentLoaded", () => {
  const reviewStars = document.querySelectorAll(".review-star");
  reviewStars.forEach(star => {
    star.addEventListener("click", () => {
      reviewRating = Number(star.dataset.rating);
      reviewStars.forEach(s => s.classList.toggle("selected", Number(s.dataset.rating) <= reviewRating));
    });
  });
});

async function openReview(productId, productName){
  reviewProductId = Number(productId);
  reviewRating = 0;
  document.getElementById("reviewProductName").textContent = productName;
  document.getElementById("reviewText").value = "";
  document.getElementById("reviewMessage").innerHTML = "";
  document.querySelectorAll(".review-star").forEach(s => s.classList.remove("selected"));
  document.getElementById("reviewModal").classList.add("show");
}

function closeReview(){
  document.getElementById("reviewModal").classList.remove("show");
}

async function submitReview(){
  const textInput = document.getElementById("reviewText");
  const messageBox = document.getElementById("reviewMessage");
  if(!reviewProductId) return;

  messageBox.textContent = "Submitting review...";
  try {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if(!user){ messageBox.textContent = "Please login first."; return; }

    const { error: insErr } = await supabaseClient.from("product_reviews").upsert({
      product_id: reviewProductId,
      user_id: user.id,
      customer_name: user.user_metadata?.full_name || user.email || "Customer",
      rating: reviewRating || 5,
      review: textInput.value.trim()
    }, { onConflict: 'product_id,user_id' });

    if(insErr){ messageBox.textContent = "Error: " + insErr.message; return; }

    messageBox.textContent = "Review submitted successfully!";
    setTimeout(() => { closeReview(); location.reload(); }, 1200);
  } catch(err){
    messageBox.textContent = "Failed: " + err.message;
  }
}

async function loadOrder(){
  const params = new URLSearchParams(location.search);
  const orderId = params.get("id");
  currentOrderId = orderId;

  if(!orderId){
    message.innerHTML = `<div class="card error">Order ID is missing in URL.</div>`;
    return;
  }

  const { data: { user } } = await supabaseClient.auth.getUser();
  if(!user){
    location.href = "account.html?redirect=" + encodeURIComponent("order-view.html?id=" + orderId);
    return;
  }

  const { data: order, error: orderError } = await supabaseClient.from("orders").select("*").eq("id", orderId).maybeSingle();
  if(orderError || !order){
    message.innerHTML = `<div class="card error">Order not found or unauthorized.</div>`;
    return;
  }

  const { data: items } = await supabaseClient.from("order_items").select("*").eq("order_id", order.id);
  const orderItems = items && items.length > 0 ? items : [{
    product_id: order.product_id || null,
    product_name: order.product_name || "RADA CREST Product",
    quantity: order.quantity || 1,
    unit_price: order.total_amount || order.total || 0,
    price: order.total_amount || order.total || 0,
    image_url: order.image_url || ""
  }];

  const status = String(order.status || "pending").toLowerCase();
  const canChangeAddress = (status === "pending" || status === "unconfirmed");

  // Calculate accurate bill breakdown
  let itemsMrpTotal = 0;
  let itemsSellingTotal = 0;

  const itemsHtml = orderItems.map(item => {
    const image = cleanImage(item.image_url || item.image || "");
    const qty = Number(item.quantity || 1);
    const sellingPrice = Number(item.unit_price ?? item.price ?? 0);
    // MRP fallback if old_price is available or estimated
    const mrp = Number(item.old_price || item.mrp || (sellingPrice * 1.25)); 
    
    itemsMrpTotal += mrp * qty;
    itemsSellingTotal += sellingPrice * qty;

    const pId = item.product_id;
    const pName = esc(item.product_name || "Product");

    const reviewBtn = status === "delivered" && item.product_id ? `
      <div onclick="event.stopPropagation()">
        <button class="review-btn" onclick="openReview(${Number(item.product_id)}, '${pName.replace(/'/g,"&#039;")}')">
          <i class="fa-solid fa-star"></i> Rate & Review
        </button>
      </div>
    ` : "";

    // 100% Fixed product page redirection link
    const clickAction = pId ? `window.location.href='product.html?id=${pId}'` : `window.location.href='index.html'`;

    return `
      <div class="item" onclick="${clickAction}" title="Click to view product page">
        <div class="item-left">
          ${image ? `<img class="item-image" src="${esc(image)}" alt="Product">` : `<div class="item-image"></div>`}
          <div>
            <div class="item-name">${pName}</div>
            <div class="item-qty">Qty: ${qty} Pcs</div>
            ${reviewBtn}
          </div>
        </div>
        <div class="item-price-box">
          <div class="item-price">${money(sellingPrice)}</div>
          ${mrp > sellingPrice ? `<div class="item-mrp">${money(mrp)}</div>` : ``}
        </div>
      </div>
    `;
  }).join("");

  const discountTotal = itemsMrpTotal > itemsSellingTotal ? itemsMrpTotal - itemsSellingTotal : 0;
  const deliveryFee = 0; // Free delivery or standard policy
  const finalPayable = Number(order.total || order.total_amount || 0) > 0 ? Number(order.total || order.total_amount) : itemsSellingTotal;

  box.innerHTML = `
    <div class="card">
      <div class="order-head">
        <div>
          <div class="order-id">Order #${esc(order.id)}</div>
          <div class="date"><i class="fa-regular fa-clock"></i> ${esc(formatDate(order.created_at))}</div>
          <div class="status status-${statusClass(status)}">${esc(status)}</div>
        </div>
        <div class="total" style="color:var(--brand);font-size:22px;font-weight:900;">${money(finalPayable)}</div>
      </div>
      
      <div style="margin-top:18px;">
        <h2 style="font-size:14px;margin-bottom:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;"><i class="fa-solid fa-box-open" style="color:var(--brand);"></i> Ordered Product</h2>
        <div class="items">${itemsHtml}</div>
      </div>

      ${renderTracking(status, order)}
    </div>

    <!-- PROPER ANIME/CYBER BILL BREAKDOWN -->
    <div class="card">
      <h2><i class="fa-solid fa-file-invoice-dollar" style="color:var(--brand);"></i> Price Details & Bill</h2>
      <div class="bill-box">
        <div class="bill-row">
          <span>Total MRP (${orderItems.reduce((s, i) => s + Number(i.quantity||1), 0)} items)</span>
          <span>${money(itemsMrpTotal)}</span>
        </div>
        ${discountTotal > 0 ? `
          <div class="bill-row discount">
            <span>Discount on MRP</span>
            <span>- ${money(discountTotal)}</span>
          </div>
        ` : ``}
        <div class="bill-row">
          <span>Delivery Charges</span>
          <span style="color:var(--success); font-weight:700;">${deliveryFee === 0 ? 'FREE' : money(deliveryFee)}</span>
        </div>
        <div class="bill-row">
          <span>GST / Taxes</span>
          <span>Included (No Extra Tax)</span>
        </div>
        <div class="bill-row total">
          <span>Total Payable Amount</span>
          <span style="color:var(--brand);">${money(finalPayable)}</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 style="margin:0;"><i class="fa-solid fa-truck-fast" style="color:var(--brand);"></i> Delivery & Contact Info</h2>
        ${canChangeAddress ? `<button class="btn secondary" style="padding:5px 10px;font-size:11px;" onclick="openAddressModal('${esc(order.shipping_address || order.address || "").replace(/'/g,"\\'")}')"><i class="fa-solid fa-pen"></i> Change Address</button>` : ''}
      </div>
      <div class="info-grid">
        <div class="info-box">
          <strong>Customer Name</strong>
          <span>${esc(order.shipping_name || order.customer_name || user.email)}</span>
        </div>
        <div class="info-box">
          <strong>Phone Number</strong>
          <span>${esc(order.shipping_phone || order.customer_phone || "N/A")}</span>
        </div>
        <div class="info-box">
          <strong>Email Address</strong>
          <span>${esc(order.customer_email || user.email)}</span>
        </div>
        <div class="info-box">
          <strong>Payment Mode</strong>
          <span>${esc(order.payment_method || "COD")} ${order.payment_status ? " • " + esc(order.payment_status) : ""}</span>
        </div>
      </div>
      ${order.shipping_address || order.address ? `<div class="info-box" style="margin-top:10px;"><strong>Delivery Address</strong><span>${esc(shortAddress(order.shipping_address || order.address))}</span></div>` : ""}
    </div>

    <div class="card">
      <h2><i class="fa-solid fa-headset" style="color:var(--brand);"></i> Assistance & Support</h2>
      <p style="color:var(--text-muted);font-size:12.5px;line-height:1.4;">Need help regarding this order? Connect instantly with RADA CREST support via WhatsApp.</p>
      <div class="actions">
        <a class="btn primary" href="https://wa.me/919079714767?text=${encodeURIComponent("Hello RADA CREST, I need help regarding Order #" + order.id)}" target="_blank">
          <i class="fa-brands fa-whatsapp"></i> WhatsApp Support
        </a>
        <a class="btn secondary" href="index.html">Continue Shopping</a>
        ${status === 'delivered' ? `<a href="return.html?id=${esc(order.id)}" class="btn secondary">Return / Replace</a>` : ''}
        ${canChangeAddress ? `<a href="cancel-order.html?id=${encodeURIComponent(order.id)}" class="btn danger-btn">Cancel Order</a>` : ''}
      </div>
    </div>
  `;
}

loadOrder();
</script>

</body>
</html>
