<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Details — RADA CREST</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg-deep:#060608;
    --panel-card:rgba(20, 20, 28, 0.85);
    --border:rgba(255, 255, 255, 0.08);
    --text:#ffffff;
    --text-muted:#9da0b0;
    --brand:#FF7A00;
    --brand-glow:rgba(255, 122, 0, 0.4);
    --brand-gradient:linear-gradient(135deg, #FF9433 0%, #FF5100 100%);
    --success:#3dd598;
    --warning:#ffbb33;
    --danger:#ff4d4d;
  }
  body{
    background:var(--bg-deep);
    color:var(--text);
    font-family:'Plus Jakarta Sans', sans-serif;
    min-height:100vh;
    padding:20px;
    position:relative;
    overflow-x:hidden;
  }
  .cyber-grid-glow{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background-image: radial-gradient(circle at 15% 20%, rgba(255, 122, 0, 0.08) 0%, transparent 40%), radial-gradient(circle at 85% 80%, rgba(255, 81, 0, 0.06) 0%, transparent 40%);
    z-index:0;pointer-events:none;
  }
  .page{max-width:1000px;margin:0 auto;position:relative;z-index:1;}
  .topbar{
    display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px;
    background:var(--panel-card);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:18px;padding:16px 22px;
  }
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;font-weight:800;}
  .brand-mark{
    width:40px;height:40px;border-radius:10px;background:var(--brand-gradient);color:#000;
    display:grid;place-items:center;font-weight:900;box-shadow:0 0 15px var(--brand-glow);
  }
  .back{text-decoration:none;color:var(--text-muted);font-weight:700;font-size:13px;}
  .back:hover{color:var(--brand);}
  .card{
    background:var(--panel-card);backdrop-filter:blur(16px);border:1px solid var(--border);
    border-radius:20px;padding:24px;margin-bottom:20px;box-shadow:0 10px 30px rgba(0,0,0,0.5);
  }
  .order-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;}
  .order-id{font-size:22px;font-weight:900;}
  .date{color:var(--text-muted);font-size:12.5px;margin-top:4px;}
  .total{font-size:24px;font-weight:900;color:var(--brand);text-shadow:0 0 15px var(--brand-glow);}
  .status{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:800;text-transform:capitalize;}
  .status-delivered{background:rgba(61,213,152,0.15);color:var(--success);border:1px solid rgba(61,213,152,0.3);}
  .status-cancelled{background:rgba(255,77,77,0.15);color:var(--danger);border:1px solid rgba(255,77,77,0.3);}
  .status-shipped{background:rgba(0,210,255,0.15);color:#00d2ff;border:1px solid rgba(0,210,255,0.3);}
  .status-confirmed, .status-processing, .status-packed{background:rgba(255,187,51,0.15);color:var(--warning);border:1px solid rgba(255,187,51,0.3);}
  .status-pending{background:rgba(255,255,255,0.06);color:var(--text-muted);border:1px solid var(--border);}
  .tracking{margin-top:24px;border-top:1px solid var(--border);padding-top:20px;}
  .tracking h2, .card h2{margin-top:0;font-size:17px;font-weight:800;margin-bottom:16px;}
  .steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:20px;}
  .step{text-align:center;position:relative;}
  .circle{
    width:38px;height:38px;margin:auto;border-radius:50%;background:rgba(255,255,255,0.05);
    border:1px solid var(--border);color:var(--text-muted);display:grid;place-items:center;font-weight:900;font-size:13px;position:relative;z-index:2;
  }
  .step.active .circle{background:var(--brand-gradient);color:#000;border-color:var(--brand);box-shadow:0 0 15px var(--brand-glow);}
  .step.done .circle{background:var(--success);color:#000;border-color:var(--success);}
  .step-label{margin-top:8px;font-size:11px;font-weight:700;color:var(--text-muted);}
  .step.active .step-label{color:#fff;}
  .step-line{position:absolute;top:19px;left:50%;width:100%;height:2px;background:var(--border);z-index:1;}
  .step:last-child .step-line{display:none;}
  .step.done .step-line{background:var(--success);}
  .items{display:grid;gap:12px;}
  .item{
    display:flex;justify-content:space-between;gap:15px;padding:12px;background:rgba(255,255,255,0.02);
    border:1px solid var(--border);border-radius:14px;align-items:center;cursor:pointer;transition:0.3s;
  }
  .item:hover{border-color:var(--brand);background:rgba(255,122,0,0.04);}
  .item-left{display:flex;gap:14px;align-items:center;}
  .item-image{width:60px;height:60px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid var(--border);object-fit:cover;}
  .item-name{font-weight:800;font-size:14px;color:#fff;}
  .item-qty{color:var(--text-muted);font-size:12px;margin-top:3px;}
  .item-price{font-weight:900;font-size:15px;color:var(--brand);}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .info-box{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:14px;padding:14px;}
  .info-box strong{display:block;margin-bottom:5px;font-size:12px;color:var(--brand);text-transform:uppercase;}
  .info-box span{color:var(--text-muted);font-size:13px;line-height:1.5;}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;
    padding:12px 18px;text-decoration:none;font-weight:800;font-size:13px;cursor:pointer;transition:0.3s;
  }
  .primary{background:var(--brand-gradient);color:#000;box-shadow:0 0 15px var(--brand-glow);}
  .secondary{background:rgba(255,255,255,0.05);color:#fff;border:1px solid var(--border);}
  .danger-btn{background:rgba(255,77,77,0.1);color:var(--danger);border:1px solid rgba(255,77,77,0.3);}
  .empty{text-align:center;padding:40px 15px;color:var(--text-muted);}
  .error{color:var(--danger);background:rgba(255,77,77,0.1);border:1px solid rgba(255,77,77,0.2);padding:16px;border-radius:12px;text-align:center;}
</style>
</head>
<body>

<div class="cyber-grid-glow"></div>
<div class="page">
  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">RC</span>
      <span>RADA CREST</span>
    </a>
    <a class="back" href="account.html"><i class="fa-solid fa-arrow-left"></i> My Account</a>
  </div>
  <div id="pageMessage"></div>
  <div id="orderContent"></div>
</div>

<script>
const SUPABASE_URL = "https://ynpsnkvrjhaxdynmurzj.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlucHNua3ZyamhheGR5bm11cnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNTc5NjAsImV4cCI6MjEwMTgzMzk2MH0.I3xFYthE0JNfGnD6N1BaNBybSq7m0G6MRILzq3NXihg";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const box = document.getElementById("orderContent");
const message = document.getElementById("pageMessage");

function esc(value){
  return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function money(value){
  return "₹" + Number(value || 0).toLocaleString("en-IN");
}

function formatDate(value){
  try{
    return new Date(value).toLocaleString("en-IN", { day:"2-digit", month:"short", year:"numeric", hour:"numeric", minute:"2-digit", hour12:true });
  }catch{ return "-"; }
}

function cleanImage(value){
  if(!value) return "";
  let url = String(value).trim().replace(/^\[img\]\s*/i,"").replace(/\s*\[\/img\]$/i,"").replace(/^["']+|["']+$/g,"").trim();
  return /^https?:\/\/\S+$/i.test(url) ? url : "";
}

function statusClass(status){
  return String(status || "pending").toLowerCase().replace(/[^a-z]/g,"");
}

function getTrackingSteps(status){
  const current = String(status || "pending").toLowerCase().trim();
  if(current === "cancelled") return { cancelled: true, index: -1 };
  const steps = ["pending", "confirmed", "packed", "shipped", "delivered"];
  let index = steps.indexOf(current);
  if(current === "processing") index = 2;
  if(index < 0) index = 0;
  return { cancelled: false, index: index };
}

function renderTracking(status){
  const tracking = getTrackingSteps(status);
  if(tracking.cancelled){
    return `<div class="tracking"><h2>Order Tracking</h2><div class="status status-cancelled">Order Cancelled</div></div>`;
  }
  const labels = [["pending","Placed"], ["confirmed","Confirmed"], ["packed","Packed"], ["shipped","Shipped"], ["delivered","Delivered"]];
  return `
    <div class="tracking">
      <h2>Order Tracking</h2>
      <div class="steps">
        ${labels.map((item, index) => {
          const done = index < tracking.index;
          const active = index === tracking.index;
          return `
            <div class="step ${done ? "done" : ""} ${active ? "active" : ""}">
              <div class="circle">${done ? "✓" : index + 1}</div>
              <div class="step-label">${item[1]}</div>
              ${index < labels.length - 1 ? `<div class="step-line"></div>` : ""}
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;
}

function shortAddress(addr){
  if(!addr) return "N/A";
  let clean = String(addr).trim();
  return clean.length > 55 ? clean.substring(0, 52) + "..." : clean;
}

async function loadOrder(){
  const params = new URLSearchParams(location.search);
  const orderId = params.get("id");

  if(!orderId){
    message.innerHTML = `<div class="card error">Order ID is missing in URL.</div>`;
    return;
  }

  const { data: { user } } = await supabaseClient.auth.getUser();
  if(!user){
    location.href = "account.html?redirect=" + encodeURIComponent("order.html?id=" + orderId);
    return;
  }

  const { data: order, error: orderError } = await supabaseClient.from("orders").select("*").eq("id", orderId).maybeSingle();
  if(orderError || !order){
    message.innerHTML = `<div class="card error">Order not found or unauthorized.</div>`;
    return;
  }

  let orderItems = [];
  const { data: items } = await supabaseClient.from("order_items").select("*").eq("order_id", order.id);
  
  if(items && items.length > 0){
    orderItems = items;
  } else {
    orderItems = [{
      product_name: order.product_name || "RADA CREST LED Product",
      quantity: order.quantity || 1,
      unit_price: order.total_amount || order.total || 0,
      image_url: order.image_url || ""
    }];
  }

  const calculatedTotal = orderItems.reduce((sum, item) => sum + Number(item.quantity || 1) * Number(item.unit_price ?? item.price ?? 0), 0);
  const total = Number(order.total_amount ?? order.total || 0) > 0 ? Number(order.total_amount ?? order.total) : calculatedTotal;
  const status = String(order.status || "pending").toLowerCase();
  const isPending = (status === "pending" || status === "unconfirmed");

  const itemsHtml = orderItems.map(item => {
    const image = cleanImage(item.image_url || item.image || "");
    const qty = Number(item.quantity || 1);
    const price = Number(item.unit_price ?? item.price ?? 0);
    const pName = esc(item.product_name || "RADA CREST Item");

    return `
      <div class="item">
        <div class="item-left">
          ${image ? `<img class="item-image" src="${esc(image)}" alt="Product">` : `<div class="item-image"></div>`}
          <div>
            <div class="item-name">${pName}</div>
            <div class="item-qty">Qty: ${qty} × ${money(price)}</div>
          </div>
        </div>
        <div class="item-price">${money(price * qty)}</div>
      </div>
    `;
  }).join("");

  box.innerHTML = `
    <div class="card">
      <div class="order-head">
        <div>
          <div class="order-id">Order #${esc(order.id)}</div>
          <div class="date"><i class="fa-regular fa-clock"></i> ${esc(formatDate(order.created_at))}</div>
          <div class="status status-${statusClass(status)}">${esc(status)}</div>
        </div>
        <div class="total">${money(total)}</div>
      </div>
      
      <div style="margin-top:22px;">
        <h2 style="font-size:15px;margin-bottom:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">Ordered Products</h2>
        <div class="items">${itemsHtml}</div>
      </div>

      ${renderTracking(status)}
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h2 style="margin:0;">Delivery & Payment Info</h2>
      </div>
      <div class="info-grid">
        <div class="info-box">
          <strong>Customer Name</strong>
          <span>${esc(order.shipping_name || order.customer_name || user.email)}</span>
        </div>
        <div class="info-box">
          <strong>Phone Number</strong>
          <span>${esc(order.shipping_phone || order.customer_phone || "N/A")}</span>
        </div>
        <div class="info-box">
          <strong>Email Address</strong>
          <span>${esc(order.customer_email || user.email)}</span>
        </div>
        <div class="info-box">
          <strong>Payment Mode</strong>
          <span>${esc(order.payment_method || order.payment_mode || "COD")}</span>
        </div>
      </div>
      ${order.shipping_address || order.address ? `<div class="info-box" style="margin-top:14px;"><strong>Shipping Address</strong><span>${esc(shortAddress(order.shipping_address || order.address))}</span></div>` : ""}
    </div>

    <div class="card">
      <h2>Assistance & Control</h2>
      <p style="color:var(--text-muted);font-size:13px;line-height:1.5;">Need modifications or help regarding this order? Connect instantly with RADA CREST support.</p>
      <div class="actions">
        <a class="btn primary" href="https://wa.me/919079714767?text=${encodeURIComponent("Hello RADA CREST, I need help regarding Order #" + order.id)}" target="_blank">
          <i class="fa-brands fa-whatsapp"></i> WhatsApp Support
        </a>
        <a class="btn secondary" href="index.html">Continue Shopping</a>
      </div>
    </div>
  `;
}

loadOrder();
</script>

</body>
</html>
