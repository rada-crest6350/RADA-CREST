<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Order Details — RADA CREST</title>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;}
body{margin:0;background:#f7f5ef;color:#171717;font-family:Arial,Helvetica,sans-serif;}
.page{max-width:1000px;margin:auto;padding:20px;}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#171717;font-weight:800;}
.brand-mark{width:42px;height:42px;border-radius:12px;background:#171717;color:#fff;display:grid;place-items:center;font-weight:900;}
.back{text-decoration:none;color:#555;font-weight:700;}
.card{background:#fff;border:1px solid #e5e0d5;border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.05);}
.order-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;}
.order-id{font-size:24px;font-weight:900;}
.date{color:#777;margin-top:6px;}
.total{font-size:25px;font-weight:900;}
.status{display:inline-block;margin-top:12px;padding:8px 12px;border-radius:999px;background:#eee;font-size:13px;font-weight:800;text-transform:capitalize;}
.status-delivered{background:#e2f5e8;color:#267144;}
.status-cancelled{background:#fde4e4;color:#a33a3a;}
.status-shipped{background:#e5eefc;color:#315b9b;}
.status-confirmed,.status-processing,.status-packed{background:#fff0cf;color:#8a641c;}
.tracking{margin-top:28px;}
.tracking h2,.card h2{margin-top:0;}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:25px;}
.step{text-align:center;position:relative;}
.circle{width:42px;height:42px;margin:auto;border-radius:50%;background:#ddd;color:#777;display:grid;place-items:center;font-weight:900;position:relative;z-index:2;}
.step.active .circle,.step.done .circle{background:#171717;color:#fff;}
.step-label{margin-top:10px;font-size:12px;font-weight:800;}
.step-line{position:absolute;top:20px;left:50%;width:100%;height:3px;background:#ddd;z-index:1;}
.step:last-child .step-line{display:none;}
.step.done .step-line{background:#171717;}
.items{display:grid;gap:12px;}
.item{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid #eee;}
.item:last-child{border-bottom:0;}
.item-left{display:flex;gap:12px;align-items:center;}
.item-image{width:65px;height:65px;border-radius:12px;background:#f2f0ea;object-fit:contain;}
.item-name{font-weight:800;}
.item-qty{color:#777;font-size:13px;margin-top:5px;}
.item-price{font-weight:900;white-space:nowrap;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.info-box{background:#f8f6f0;border-radius:14px;padding:15px;}
.info-box strong{display:block;margin-bottom:7px;}
.info-box span{color:#555;line-height:1.6;}
.actions{display:flex;gap:10px;flex-wrap:wrap;}
.btn,.return-action-btn{display:inline-block;border:0;border-radius:12px;padding:13px 18px;text-decoration:none;font-weight:800;cursor:pointer;}
.primary{background:#171717;color:#fff;}
.secondary{background:#fff;color:#171717;border:1px solid #d8d2c7;}
.return-action-btn{background:#0f172a;color:#fff !important;}
.empty{text-align:center;padding:45px 15px;color:#777;}
.error{color:#a33a3a;background:#fde4e4;padding:15px;border-radius:12px;margin-bottom:15px;}
@media(max-width:700px){
  .page{padding:12px;}
  .order-head{flex-direction:column;}
  .steps{grid-template-columns:1fr;gap:15px;}
  .step{display:flex;align-items:center;gap:12px;text-align:left;}
  .circle{margin:0;flex:none;}
  .step-line{display:none;}
  .info-grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="page">
  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">RC</span>
      <span>RADA CREST</span>
    </a>
    <a class="back" href="account.html">← My Account</a>
  </div>

  <div id="pageMessage"></div>
  <div id="orderContent"></div>
</div>

<!-- Optional config files (if they exist) -->
<script src="config.js" onerror="console.log('config.js optional load skipped')"></script>
<script src="supabase-client.js" onerror="console.log('supabase-client.js optional load skipped')"></script>

<script>
const box = document.getElementById("orderContent");
const msgBox = document.getElementById("pageMessage");

function esc(value){
  return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function money(value){
  return "₹" + Number(value || 0).toLocaleString("en-IN");
}
function formatDate(value){
  try{ return new Date(value).toLocaleString("en-IN", {day:"2-digit", month:"long", year:"numeric", hour:"numeric", minute:"2-digit", hour12:true}); }
  catch{ return "-"; }
}
function cleanImage(value){
  if(!value) return "";
  let url = String(value).trim().replace(/^\[img\]\s*/i,"").replace(/\s*\[\/img\]$/i,"").replace(/^["']+|["']+$/g,"").trim();
  return /^https?:\/\/\S+$/i.test(url) ? url : "";
}

async function initOrderView() {
  try {
    // Self-initialize Supabase if window.supabaseClient is not defined yet
    let client = window.supabaseClient;
    if (!client && window.supabase && window.supabase.createClient) {
      // Use values from config.js if available, otherwise use default fallback constants
      const url = window.SUPABASE_URL || "https://yngankarjheadymarzuj.supabase.co";
      const key = window.SUPABASE_ANON_KEY || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InluZ2Fua2FyamhlYWR5bWFyenVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAzNjEzODAsImV4cCI6MjA1NTkzNzM4MH0.q-SAMPLE_KEY_PLACEHOLDER_REPLACE_IF_NEEDED"; 
      
      // Let's create client directly using window.SUPABASE_URL / ANON_KEY if defined globally by config.js
      if(window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
        client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
      } else {
        // Fallback to whatever URL/Key was working in your project
        client = window.supabase.createClient(url, key);
      }
      window.supabaseClient = client;
    }

    if (!client) {
      msgBox.innerHTML = '<div class="error">Supabase could not be initialized. Please check your Supabase credentials or script files.</div>';
      return;
    }

    const params = new URLSearchParams(location.search);
    const orderId = params.get("id");

    if (!orderId) {
      msgBox.innerHTML = '<div class="error">Order ID is missing in URL.</div>';
      return;
    }

    // 1. Fetch Order from order_summary or orders
    let { data: order, error: orderError } = await client
      .from("order_summary")
      .select("*")
      .eq("id", orderId)
      .maybeSingle();

    if (orderError || !order) {
      const resOrders = await client
        .from("orders")
        .select("*")
        .eq("id", orderId)
        .maybeSingle();
      order = resOrders.data;
      orderError = resOrders.error;
    }

    if (orderError || !order) {
      msgBox.innerHTML = `<div class="error">Order not found: ${esc(orderError?.message || '')}</div>`;
      return;
    }

    // 2. Fetch Order Items & Product Images
    const { data: items } = await client
      .from("order_items")
      .select("*")
      .eq("order_id", orderId);

    const orderItems = items || [];

    for (let item of orderItems) {
      if (!item.image_url && !item.image && !item.product_image && item.product_id) {
        const { data: prod } = await client
          .from("products")
          .select("image_url, image, img, photo")
          .eq("id", item.product_id)
          .maybeSingle();

        if (prod) {
          const imgUrl = prod.image_url || prod.image || prod.img || prod.photo || '';
          item.image_url = imgUrl;
        }
      }
    }

    const calculatedTotal = orderItems.reduce((sum, item) => sum + Number(item.quantity || 0) * Number(item.unit_price ?? item.price ?? 0), 0);
    const total = Number(order.total || 0) > 0 ? Number(order.total) : calculatedTotal;
    const status = String(order.status || "pending").toLowerCase();

    // 3. Render Items HTML
    const itemsHtml = orderItems.length ? orderItems.map(item => {
      const img = cleanImage(item.image_url || item.image || item.product_image || "");
      const qty = Number(item.quantity || 1);
      const price = Number(item.unit_price ?? item.price ?? 0);

      return `
        <div class="item">
          <div class="item-left">
            ${img ? `<img class="item-image" src="${esc(img)}" alt="Product" onerror="this.style.display='none'">` : `<div class="item-image"></div>`}
            <div>
              <div class="item-name">${esc(item.product_name || "Product")}</div>
              <div class="item-qty">Quantity: ${qty} × ${money(price)}</div>
            </div>
          </div>
          <div class="item-price">${money(price * qty)}</div>
        </div>
      `;
    }).join("") : `<div class="empty">No items found for this order.</div>`;

    // 4. Render Main Page
    box.innerHTML = `
      <div class="card">
        <div class="order-head">
          <div>
            <div class="order-id">Order #${esc(order.id)}</div>
            <div class="date">${esc(formatDate(order.created_at))}</div>
            <div class="status status-${status}">${esc(status)}</div>
          </div>
          <div class="total">${money(total)}</div>
        </div>
      </div>

      <div class="card">
        <h2>Order Items</h2>
        <div class="items">${itemsHtml}</div>
      </div>

      <div class="card">
        <h2>Delivery Details</h2>
        <div class="info-grid">
          <div class="info-box">
            <strong>Customer</strong>
            <span>${esc(order.shipping_name || order.customer_name || "-")}</span>
          </div>
          <div class="info-box">
            <strong>Phone</strong>
            <span>${esc(order.shipping_phone || order.customer_phone || "-")}</span>
          </div>
          <div class="info-box">
            <strong>Email</strong>
            <span>${esc(order.customer_email || "-")}</span>
          </div>
          <div class="info-box">
            <strong>Payment</strong>
            <span>${esc(order.payment_method || "COD")}</span>
          </div>
        </div>
        ${order.shipping_address ? `<div class="info-box" style="margin-top:15px;"><strong>Delivery Address</strong><span>${esc(order.shipping_address)}</span></div>` : ""}
      </div>

      <div class="card">
        <h2>Actions</h2>
        <div class="actions">
          <a class="btn primary" href="account.html">← My Account</a>
          <a class="return-action-btn" href="return.html?id=${esc(order.id)}">Return / Replace</a>
          <a class="btn secondary" href="cancel-order.html?id=${esc(order.id)}">Cancel Order</a>
        </div>
      </div>
    `;

  } catch (err) {
    console.error("View Error:", err);
    msgBox.innerHTML = `<div class="error">Error loading page: ${esc(err.message)}</div>`;
  }
}

initOrderView();
</script>

</body>
</html>
