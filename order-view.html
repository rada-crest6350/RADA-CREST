<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Details — RADA CREST</title>

<!-- Fonts & Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  *{box-sizing:border-box;margin:0;padding:0;}

  :root{
    --bg-deep:#060608;
    --panel-card:rgba(20, 20, 28, 0.85);
    --border:rgba(255, 255, 255, 0.08);
    --border-hover:rgba(255, 122, 0, 0.6);
    --text:#ffffff;
    --text-muted:#9da0b0;
    --brand:#FF7A00;
    --brand-glow:rgba(255, 122, 0, 0.4);
    --brand-gradient:linear-gradient(135deg, #FF9433 0%, #FF5100 100%);
    --success:#3dd598;
    --warning:#ffbb33;
    --danger:#ff4d4d;
  }

  body{
    background:var(--bg-deep);
    color:var(--text);
    font-family:'Plus Jakarta Sans', sans-serif;
    min-height:100vh;
    padding:20px;
    position:relative;
    overflow-x:hidden;
  }

  /* Cyber Ambient Glow */
  .cyber-grid-glow{
    position:fixed;
    top:0;left:0;width:100%;height:100%;
    background-image: 
      radial-gradient(circle at 15% 20%, rgba(255, 122, 0, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255, 81, 0, 0.06) 0%, transparent 40%);
    z-index:0;
    pointer-events:none;
  }

  .page{
    max-width:1000px;
    margin:0 auto;
    position:relative;
    z-index:1;
    animation: pageEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes pageEntrance{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:24px;
    background:var(--panel-card);
    backdrop-filter:blur(20px);
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px 22px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:#fff;
    font-weight:800;
  }

  .brand-mark{
    width:40px;height:40px;
    border-radius:10px;
    background:var(--brand-gradient);
    color:#000;
    display:grid;place-items:center;
    font-weight:900;
    box-shadow:0 0 15px var(--brand-glow);
  }

  .back{
    text-decoration:none;
    color:var(--text-muted);
    font-weight:700;
    font-size:13px;
    transition:0.2s;
  }
  .back:hover{color:var(--brand);}

  .card{
    background:var(--panel-card);
    backdrop-filter:blur(16px);
    border:1px solid var(--border);
    border-radius:20px;
    padding:24px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
    transition:0.3s;
  }
  .card:hover{border-color:rgba(255,122,0,0.3);}

  .order-head{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
  }

  .order-id{
    font-size:22px;
    font-weight:900;
    letter-spacing:-0.5px;
  }

  .date{
    color:var(--text-muted);
    font-size:12.5px;
    margin-top:4px;
  }

  .total{
    font-size:24px;
    font-weight:900;
    color:var(--brand);
    text-shadow:0 0 15px var(--brand-glow);
  }

  .status{
    display:inline-block;
    margin-top:12px;
    padding:6px 14px;
    border-radius:999px;
    font-size:12px;
    font-weight:800;
    text-transform:capitalize;
  }
  .status-delivered{background:rgba(61,213,152,0.15);color:var(--success);border:1px solid rgba(61,213,152,0.3);}
  .status-cancelled{background:rgba(255,77,77,0.15);color:var(--danger);border:1px solid rgba(255,77,77,0.3);}
  .status-shipped{background:rgba(0,210,255,0.15);color:#00d2ff;border:1px solid rgba(0,210,255,0.3);}
  .status-confirmed, .status-processing, .status-packed{background:rgba(255,187,51,0.15);color:var(--warning);border:1px solid rgba(255,187,51,0.3);}
  .status-pending{background:rgba(255,255,255,0.06);color:var(--text-muted);border:1px solid var(--border);}

  /* TRACKING */
  .tracking{margin-top:24px;}
  .tracking h2, .card h2{margin-top:0;font-size:17px;font-weight:800;margin-bottom:16px;}

  .steps{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    margin-top:20px;
  }

  .step{text-align:center;position:relative;}

  .circle{
    width:38px;height:38px;
    margin:auto;
    border-radius:50%;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    color:var(--text-muted);
    display:grid;place-items:center;
    font-weight:900;
    font-size:13px;
    position:relative;
    z-index:2;
  }

  .step.active .circle{
    background:var(--brand-gradient);
    color:#000;
    border-color:var(--brand);
    box-shadow:0 0 15px var(--brand-glow);
  }

  .step.done .circle{
    background:var(--success);
    color:#000;
    border-color:var(--success);
  }

  .step-label{
    margin-top:8px;
    font-size:11px;
    font-weight:700;
    color:var(--text-muted);
  }
  .step.active .step-label{color:#fff;}

  .step-line{
    position:absolute;
    top:19px;left:50%;
    width:100%;height:2px;
    background:var(--border);
    z-index:1;
  }
  .step:last-child .step-line{display:none;}
  .step.done .step-line{background:var(--success);}

  /* ITEMS */
  .items{display:grid;gap:14px;}

  .item{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:12px 0;
    border-bottom:1px solid var(--border);
    align-items:center;
  }
  .item:last-child{border-bottom:0;}

  .item-left{display:flex;gap:14px;align-items:center;}

  .item-image{
    width:60px;height:60px;
    border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);
    object-fit:cover;
  }

  .item-name{font-weight:800;font-size:14px;}
  .item-qty{color:var(--text-muted);font-size:12px;margin-top:3px;}
  .item-price{font-weight:900;font-size:15px;color:var(--brand);}

  /* INFO GRID */
  .info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }

  .info-box{
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
  }

  .info-box strong{
    display:block;
    margin-bottom:5px;
    font-size:12px;
    color:var(--brand);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }

  .info-box span{
    color:var(--text-muted);
    font-size:13px;
    line-height:1.5;
  }

  /* BUTTONS & ACTIONS */
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:0;
    border-radius:12px;
    padding:12px 18px;
    text-decoration:none;
    font-weight:800;
    font-size:13px;
    cursor:pointer;
    transition:0.3s;
  }

  .primary{
    background:var(--brand-gradient);
    color:#000;
    box-shadow:0 0 15px var(--brand-glow);
  }
  .primary:hover{transform:translateY(-2px);box-shadow:0 0 25px var(--brand);opacity:0.95;}

  .secondary{
    background:rgba(255,255,255,0.05);
    color:#fff;
    border:1px solid var(--border);
  }
  .secondary:hover{background:rgba(255,255,255,0.1);border-color:var(--brand);}

  .danger-btn{
    background:rgba(255,77,77,0.1);
    color:var(--danger);
    border:1px solid rgba(255,77,77,0.3);
  }
  .danger-btn:hover{background:var(--danger);color:#fff;}

  /* REVIEW BUTTON & MODAL */
  .review-btn{
    margin-top:8px;
    padding:6px 12px;
    border:1px solid var(--brand);
    border-radius:8px;
    background:rgba(255,122,0,0.1);
    color:var(--brand);
    font-weight:700;
    cursor:pointer;
    font-size:11.5px;
    transition:0.2s;
  }
  .review-btn:hover{background:var(--brand);color:#000;}

  .review-modal{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(10px);
    display:none;align-items:center;justify-content:center;
    padding:16px;z-index:9999;
  }
  .review-modal.show{display:flex;}

  .review-box{
    width:min(480px,100%);
    background:#14141c;
    border:1.5px solid var(--border);
    border-radius:20px;
    padding:24px;
    box-shadow:0 25px 60px rgba(0,0,0,0.8);
  }

  .review-head{display:flex;justify-content:space-between;align-items:center;}
  .review-close{
    border:0;background:rgba(255,255,255,0.06);
    color:#fff;width:36px;height:36px;border-radius:50%;
    font-size:18px;cursor:pointer;display:grid;place-items:center;
  }

  .review-stars{display:flex;gap:6px;margin:12px 0;}
  .review-star{border:0;background:none;font-size:30px;color:rgba(255,255,255,0.15);cursor:pointer;}
  .review-star.selected{color:var(--warning);text-shadow:0 0 10px rgba(255,187,51,0.5);}

  .review-text{
    width:100%;min-height:100px;
    background:rgba(255,255,255,0.04);
    border:1.5px solid var(--border);
    border-radius:12px;padding:12px;
    color:#fff;font-family:inherit;font-size:13px;resize:vertical;outline:0;
  }
  .review-text:focus{border-color:var(--brand);box-shadow:0 0 12px var(--brand-glow);}

  .review-upload input{
    width:100%;padding:10px;background:rgba(255,255,255,0.04);
    border:1.5px solid var(--border);border-radius:10px;color:#fff;font-size:12px;margin-top:6px;
  }

  .review-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .review-preview img{width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--border);}

  .empty{text-align:center;padding:40px 15px;color:var(--text-muted);}
  .error{color:var(--danger);background:rgba(255,77,77,0.1);border:1px solid rgba(255,77,77,0.2);padding:16px;border-radius:12px;text-align:center;}

  @media(max-width:700px){
    .steps{grid-template-columns:1fr;gap:12px;}
    .step{display:flex;align-items:center;gap:12px;text-align:left;}
    .circle{margin:0;flex:none;}
    .step-line{display:none;}
    .info-grid{grid-template-columns:1fr;}
    .order-head{flex-direction:column;gap:10px;}
  }
</style>
</head>
<body>

<div class="cyber-grid-glow"></div>

<div class="page">

  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">RC</span>
      <span>RADA CREST</span>
    </a>
    <a class="back" href="account.html"><i class="fa-solid fa-arrow-left"></i> My Account</a>
  </div>

  <div id="pageMessage"></div>
  <div id="orderContent"></div>

</div>

<!-- REVIEW MODAL -->
<div id="reviewModal" class="review-modal">
  <div class="review-box">
    <div class="review-head">
      <div>
        <h3 style="margin:0;font-size:18px;">Rate & Review</h3>
        <div id="reviewProductName" style="color:var(--brand);font-size:12px;margin-top:3px;font-weight:600;"></div>
      </div>
      <button class="review-close" onclick="closeReview()"><i class="fa-solid xmark fa-xmark"></i>✕</button>
    </div>
    <div style="margin-top:16px;font-size:12.5px;font-weight:700;">Select Rating</div>
    <div class="review-stars">
      <button type="button" class="review-star" data-rating="1">★</button>
      <button type="button" class="review-star" data-rating="2">★</button>
      <button type="button" class="review-star" data-rating="3">★</button>
      <button type="button" class="review-star" data-rating="4">★</button>
      <button type="button" class="review-star" data-rating="5">★</button>
    </div>
    <textarea id="reviewText" class="review-text" placeholder="Share your experience with this high-tech product..."></textarea>
    <div class="review-upload" style="margin-top:12px;">
      <strong style="font-size:12px;color:var(--text-muted);">Upload Photos / Videos (Max 5)</strong>
      <input id="reviewPhotos" type="file" accept="image/*,video/*" multiple>
      <div id="reviewPreview" class="review-preview"></div>
    </div>
    <div id="reviewMessage" style="margin-top:10px;font-size:12px;color:var(--brand);"></div>
    <button id="reviewSubmit" class="btn primary" style="width:100%;margin-top:16px;" onclick="submitReview()">Submit Review</button>
  </div>
</div>

<script>
const box = document.getElementById("orderContent");
const message = document.getElementById("pageMessage");

function esc(value){
  return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function money(value){
  return "₹" + Number(value || 0).toLocaleString("en-IN");
}

function formatDate(value){
  try{
    return new Date(value).toLocaleString("en-IN", { day:"2-digit", month:"short", year:"numeric", hour:"numeric", minute:"2-digit", hour12:true });
  }catch{ return "-"; }
}

function cleanImage(value){
  if(!value) return "";
  let url = String(value).trim().replace(/^\[img\]\s*/i,"").replace(/\s*\[\/img\]$/i,"").replace(/^["']+|["']+$/g,"").trim();
  return /^https?:\/\/\S+$/i.test(url) ? url : "";
}

function statusClass(status){
  return String(status || "pending").toLowerCase().replace(/[^a-z]/g,"");
}

function getTrackingSteps(status){
  const current = String(status || "pending").toLowerCase().trim();
  if(current === "cancelled") return { cancelled: true, index: -1 };
  const steps = ["pending", "confirmed", "packed", "shipped", "delivered"];
  let index = steps.indexOf(current);
  if(current === "processing") index = 2;
  if(index < 0) index = 0;
  return { cancelled: false, index: index };
}

function renderTracking(status){
  const tracking = getTrackingSteps(status);
  if(tracking.cancelled){
    return `
      <div class="tracking">
        <h2>Order Tracking</h2>
        <div class="status status-cancelled">Order Cancelled</div>
      </div>
    `;
  }
  const labels = [
    ["pending","Placed"],
    ["confirmed","Confirmed"],
    ["packed","Packed"],
    ["shipped","Shipped"],
    ["delivered","Delivered"]
  ];
  return `
    <div class="tracking">
      <h2>Order Tracking</h2>
      <div class="steps">
        ${labels.map((item, index) => {
          const done = index < tracking.index;
          const active = index === tracking.index;
          return `
            <div class="step ${done ? "done" : ""} ${active ? "active" : ""}">
              <div class="circle">${done ? "✓" : index + 1}</div>
              <div class="step-label">${item[1]}</div>
              ${index < labels.length - 1 ? `<div class="step-line"></div>` : ""}
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;
}

let reviewProductId = null;
let reviewRating = 0;

document.addEventListener("DOMContentLoaded", () => {
  const reviewStars = document.querySelectorAll(".review-star");
  reviewStars.forEach(star => {
    star.addEventListener("click", () => {
      reviewRating = Number(star.dataset.rating);
      reviewStars.forEach(s => s.classList.toggle("selected", Number(s.dataset.rating) <= reviewRating));
    });
  });

  const reviewPhotos = document.getElementById("reviewPhotos");
  if(reviewPhotos){
    reviewPhotos.addEventListener("change", () => {
      const reviewPreview = document.getElementById("reviewPreview");
      if(reviewPreview) reviewPreview.innerHTML = "";
      const files = Array.from(reviewPhotos.files || []);
      if(files.length > 5){ reviewPhotos.value = ""; return; }
      files.forEach(file => {
        if(!file.type.startsWith("image/") && !file.type.startsWith("video/")) return;
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        if(reviewPreview) reviewPreview.appendChild(img);
      });
    });
  }
});

async function openReview(productId, productName){
  reviewProductId = Number(productId);
  reviewRating = 0;
  document.getElementById("reviewProductName").textContent = productName;
  document.getElementById("reviewText").value = "";
  document.getElementById("reviewPhotos").value = "";
  document.getElementById("reviewPreview").innerHTML = "";
  document.getElementById("reviewMessage").innerHTML = "";
  document.querySelectorAll(".review-star").forEach(s => s.classList.remove("selected"));
  document.getElementById("reviewModal").classList.add("show");
}

function closeReview(){
  document.getElementById("reviewModal").classList.remove("show");
}

async function submitReview(){
  const textInput = document.getElementById("reviewText");
  const fileInput = document.getElementById("reviewPhotos");
  const messageBox = document.getElementById("reviewMessage");
  if(!reviewProductId) return;

  messageBox.textContent = "Uploading review & media...";
  try {
    const SUPABASE_URL = "https://ynpsnkvrjhaxdynmurzj.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlucHNua3ZyamhheGR5bm11cnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNTc5NjAsImV4cCI6MjEwMTgzMzk2MH0.I3xFYthE0JNfGnD6N1BaNBybSq7m0G6MRILzq3NXihg";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const { data: { user } } = await supabaseClient.auth.getUser();
    if(!user){ messageBox.textContent = "Please login first."; return; }

    let photoUrls = [];
    const files = fileInput ? fileInput.files : [];
    for(let i=0; i<files.length; i++){
      const file = files[i];
      const fileName = `review_${Date.now()}_${i}_${file.name}`;
      const { error: upErr } = await supabaseClient.storage.from("product-review-images").upload(fileName, file);
      if(!upErr){
        const { data: pubData } = supabaseClient.storage.from("product-review-images").getPublicUrl(fileName);
        if(pubData?.publicUrl) photoUrls.push(pubData.publicUrl);
      }
    }

    const { error: insErr } = await supabaseClient.from("product_reviews").upsert({
      product_id: reviewProductId,
      user_id: user.id,
      customer_name: user.user_metadata?.full_name || user.email || "Customer",
      rating: reviewRating || 5,
      review: textInput.value.trim(),
      photo_urls: photoUrls.length ? photoUrls : null
    }, { onConflict: 'product_id,user_id' });

    if(insErr){ messageBox.textContent = "Error: " + insErr.message; return; }

    messageBox.textContent = "Review submitted successfully!";
    setTimeout(() => { closeReview(); location.reload(); }, 1200);
  } catch(err){
    messageBox.textContent = "Failed: " + err.message;
  }
}

async function loadOrder(){
  const SUPABASE_URL = "https://ynpsnkvrjhaxdynmurzj.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlucHNua3ZyamhheGR5bm11cnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNTc5NjAsImV4cCI6MjEwMTgzMzk2MH0.I3xFYthE0JNfGnD6N1BaNBybSq7m0G6MRILzq3NXihg";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const params = new URLSearchParams(location.search);
  const orderId = params.get("id");

  if(!orderId){
    message.innerHTML = `<div class="card error">Order ID is missing in URL.</div>`;
    return;
  }

  const { data: { user } } = await supabaseClient.auth.getUser();
  if(!user){
    location.href = "account.html?redirect=" + encodeURIComponent("order.html?id=" + orderId);
    return;
  }

  const { data: order, error: orderError } = await supabaseClient.from("orders").select("*").eq("id", orderId).eq("user_id", user.id).maybeSingle();
  if(orderError || !order){
    message.innerHTML = `<div class="card error">Order not found or unauthorized.</div>`;
    return;
  }

  const { data: items } = await supabaseClient.from("order_items").select("*").eq("order_id", order.id);
  const orderItems = items || [];

  const productIds = orderItems.map(i => i.product_id).filter(Boolean);
  let productMap = new Map();
  if(productIds.length){
    const { data: prods } = await supabaseClient.from("products").select("*").in("id", productIds);
    (prods || []).forEach(p => productMap.set(String(p.id), p));
  }

  const calculatedTotal = orderItems.reduce((sum, item) => sum + Number(item.quantity || 0) * Number(item.unit_price ?? item.price ?? 0), 0);
  const total = Number(order.total || 0) > 0 ? Number(order.total) : calculatedTotal;
  const status = String(order.status || "pending").toLowerCase();

  const itemsHtml = orderItems.length ? orderItems.map(item => {
    const prod = productMap.get(String(item.product_id));
    const image = cleanImage(item.image_url || item.image || prod?.image_url || prod?.image || "");
    const qty = Number(item.quantity || 1);
    const price = Number(item.unit_price ?? item.price ?? 0);

    const reviewBtn = status === "delivered" && item.product_id ? `
      <button class="review-btn" onclick="openReview(${Number(item.product_id)}, '${esc(item.product_name || "Product").replace(/'/g,"&#039;")}')">
        <i class="fa-solid fa-star"></i> Rate & Review
      </button>
    ` : "";

    return `
      <div class="item">
        <div class="item-left">
          ${image ? `<img class="item-image" src="${esc(image)}" alt="Product">` : `<div class="item-image"></div>`}
          <div>
            <div class="item-name">${esc(item.product_name || "Product")}</div>
            <div class="item-qty">Qty: ${qty} × ${money(price)}</div>
            ${reviewBtn}
          </div>
        </div>
        <div class="item-price">${money(price * qty)}</div>
      </div>
    `;
  }).join("") : `<div class="empty">No order items found.</div>`;

  box.innerHTML = `
    <div class="card">
      <div class="order-head">
        <div>
          <div class="order-id">Order #${esc(order.id)}</div>
          <div class="date"><i class="fa-regular fa-clock"></i> ${esc(formatDate(order.created_at))}</div>
          <div class="status status-${statusClass(status)}">${esc(status)}</div>
        </div>
        <div class="total">${money(total)}</div>
      </div>
      ${renderTracking(status)}
    </div>

    <div class="card">
      <h2>Ordered Items</h2>
      <div class="items">${itemsHtml}</div>
    </div>

    <div class="card">
      <h2>Delivery & Payment Information</h2>
      <div class="info-grid">
        <div class="info-box">
          <strong>Customer Name</strong>
          <span>${esc(order.shipping_name || order.customer_name || user.email)}</span>
        </div>
        <div class="info-box">
          <strong>Phone Number</strong>
          <span>${esc(order.shipping_phone || order.customer_phone || "N/A")}</span>
        </div>
        <div class="info-box">
          <strong>Email Address</strong>
          <span>${esc(order.customer_email || user.email)}</span>
        </div>
        <div class="info-box">
          <strong>Payment Mode</strong>
          <span>${esc(order.payment_method || "COD")} ${order.payment_status ? " • " + esc(order.payment_status) : ""}</span>
        </div>
      </div>
      ${order.shipping_address ? `<div class="info-box" style="margin-top:14px;"><strong>Shipping Address</strong><span>${esc(order.shipping_address)}</span></div>` : ""}
    </div>

    <div class="card">
      <h2>Assistance & Control</h2>
      <p style="color:var(--text-muted);font-size:13px;line-height:1.5;">Need modifications or help regarding this order? Connect instantly with RADA CREST support.</p>
      <div class="actions">
        <a class="btn primary" href="https://wa.me/919079714767?text=${encodeURIComponent("Hello RADA CREST, I need help regarding Order #" + order.id)}" target="_blank">
          <i class="fa-brands fa-whatsapp"></i> WhatsApp Support
        </a>
        <a class="btn secondary" href="index.html">Continue Shopping</a>
        ${status === 'delivered' ? `<a href="return.html?id=${esc(order.id)}" class="btn secondary">Return / Replace</a>` : ''}
        ${status === 'pending' || status === 'confirmed' ? `<a href="cancel-order.html?id=${encodeURIComponent(order.id)}" class="btn danger-btn">Cancel Order</a>` : ''}
      </div>
    </div>
  `;
}

loadOrder();
</script>

</body>
</html>
