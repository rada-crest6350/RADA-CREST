<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://ynpsnkvrjhaxdynmurzj.supabase.co";
const SUPABASE_KEY = "sb_publishable_De-FpQeLF8L5g-7_nu_mvQ_VihQGfjL";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

let liveTopics = [];
let detectedUser = { phone: '', email: '', id: '' };

async function autoDetectUser(){
  try {
    const { data: { user } } = await supabase.auth.getUser();
    if(user){
      detectedUser.email = user.email || '';
      detectedUser.phone = user.phone || user.user_metadata?.phone || '';
      detectedUser.id = user.id || '';
    }
    if(!detectedUser.phone){
      detectedUser.phone = localStorage.getItem('rc_user_phone') || localStorage.getItem('customer_phone') || '';
    }
  } catch(e){
    console.warn("Auto-detect:", e);
  }
}

async function loadTopics(){
  const defaultGuides = [
    {
      id: 'def-1',
      title: 'Website par Naya Order Kaise Karein? (Step-by-Step Guide)',
      explanation: 'Dost, order karna behad aasan hai:\n1. Home page par jakar jo item pasand ho uska "Buy Now" button dabayein.\n2. Address page khulega, apna pata aur phone number bharein.\n3. Cash on Delivery ya Online payment chunein aur "Place Order" karein.'
    },
    {
      id: 'def-2',
      title: 'Delivery Address Kaise Badlein ya Add Karein?',
      explanation: 'Order karte waqt address.html page par aap naya address save kar sakte hain ya purane address ko select kar sakte hain.'
    },
    {
      id: 'def-3',
      title: 'Product Kharab / Damage Hone par 7 Days Free Replacement',
      explanation: 'Agar koi item kharab ya toota hua mile toh 7 din tak 100% Free replacement milta hai. Delivery partner naya piece laakar purana collect karega.'
    }
  ];

  try {
    const { data, error } = await supabase
      .from('help_topics')
      .select('*')
      .eq('is_active', true)
      .order('id', { ascending: false });

    if(!error && data && data.length > 0){
      liveTopics = data;
    } else {
      liveTopics = defaultGuides;
    }
  } catch(err){
    liveTopics = defaultGuides;
  }
  renderTopics();
}

function renderTopics(){
  const container = document.getElementById('dynamicTopicsContainer');
  if(!container) return;

  container.innerHTML = liveTopics.map(t => `
    <div class="acc-item" id="topic-${t.id}">
      <div class="acc-trigger" onclick="window.toggleAcc(this)">
        <div class="acc-trigger-left">
          <div class="icon-box">📌</div>
          <h3>${t.title}</h3>
        </div>
        <div class="chevron">▼</div>
      </div>
      <div class="acc-body">
        <div class="acc-content">
          <div class="explanation-text">${t.explanation}</div>
          
          <div class="fallback-box">
            <p style="color:#a0a0ab;font-size:12.5px;">Problem solve nahi hui? Admin desk ko direct request bhejein:</p>
            <button class="open-ticket-link" onclick="window.toggleForm('form-${t.id}')">📩 Submit Request to Admin</button>
            
            <form class="ticket-form" id="form-${t.id}" onsubmit="window.submitTicket(event, '${t.title.replace(/'/g, "\\'")}')">
              <input type="text" placeholder="Order ID (Optional)">
              <input type="tel" placeholder="Aapka Mobile Number" value="${detectedUser.phone || ''}" required>
              <textarea placeholder="Apni problem detail me likhein..." required></textarea>
              <button type="submit" class="submit-btn">Send to Admin Desk ➔</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

// ASLI LIVE AI SEARCH ENGINE (HAR SAWAL PAR NYA, SANTUSHTIMAK JWAB)
window.executeSmartSearch = async function(){
  const input = document.getElementById('helpInput');
  const rawQ = input ? input.value.trim() : '';
  if(!rawQ) return;

  const btn = document.getElementById('aiSearchBtn');
  const card = document.getElementById('smartSolutionCard');
  const solText = document.getElementById('smartSolText');
  const badge = document.getElementById('solBadgeTitle');

  if(btn){
    btn.disabled = true;
    btn.textContent = 'Analyzing...';
  }
  if(card) card.style.display = 'block';
  if(badge) badge.textContent = '🤖 RADA CREST AI Smart Assistant';
  if(solText) solText.innerHTML = '<span style="color:var(--brand);">⚡ Aapke sawal ko gehraai se analyze kiya ja raha hai...</span>';

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: rawQ })
    });

    const data = await res.json();
    if(!res.ok || !data.answer) throw new Error(data.error || "AI server busy");

    if(badge) badge.textContent = "💡 RADA CREST AI Solution";
    if(solText){
      solText.innerHTML = data.answer.replace(/\n/g, "<br>") + `
        <br><br>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <a href="index.html" class="sol-action-btn">🛒 Store Par Jayein</a>
          <a href="orders.html" class="sol-action-btn" style="background:#1f1f26;color:#fff;border:1px solid #333;">📦 My Orders</a>
        </div>
      `;
    }
  } catch(err){
    console.error("AI error:", err);
    if(solText){
      solText.innerHTML = `
        <strong>Dost, aapke is sawal ke liye hamari salah:</strong><br><br>
        • Agar aapko naya saman dekhna hai toh <strong>Store</strong> par jayein.<br>
        • Kisi bhi tarah ki discount ya special request ke liye niche diye gaye ticket form se humein message bhej dein.<br><br>
        <a href="index.html" class="sol-action-btn">🛒 Store Par Jayein</a>
      `;
    }
  } finally {
    if(btn){
      btn.disabled = false;
      btn.textContent = '🔍 Analyze';
    }
  }
};

// EVENT BINDINGS
document.addEventListener('DOMContentLoaded', () => {
  const aiBtn = document.getElementById('aiSearchBtn');
  if(aiBtn) aiBtn.addEventListener('click', window.executeSmartSearch);

  const helpInput = document.getElementById('helpInput');
  if(helpInput){
    helpInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter') window.executeSmartSearch();
    });
  }

  const closeSol = document.getElementById('closeSolCardBtn');
  if(closeSol) closeSol.addEventListener('click', () => {
    const card = document.getElementById('smartSolutionCard');
    if(card) card.style.display = 'none';
  });

  const trackTrigger = document.getElementById('trackBtnModalTrigger');
  if(trackTrigger) trackTrigger.addEventListener('click', window.openAutoTrackerModal);

  const closeTracker = document.getElementById('closeTrackerModalBtn');
  if(closeTracker) closeTracker.addEventListener('click', window.closeTrackerModal);

  const closeSuccess = document.getElementById('closeSuccessModalBtn');
  if(closeSuccess) closeSuccess.addEventListener('click', () => {
    const modal = document.getElementById('successModal');
    if(modal) modal.style.display = 'none';
  });
});

window.toggleAcc = function(headerEl){
  const item = headerEl.closest('.acc-item');
  const isOpen = item.classList.contains('active');
  document.querySelectorAll('.acc-item').forEach(i => i.classList.remove('active'));
  if(!isOpen) item.classList.add('active');
};

window.toggleForm = function(formId){
  const f = document.getElementById(formId);
  if(f) f.style.display = (f.style.display === 'block') ? 'none' : 'block';
};

window.submitTicket = async function(e, topicTitle){
  e.preventDefault();
  const form = e.target;
  const inputs = form.querySelectorAll('input, textarea');
  const btn = form.querySelector('.submit-btn');

  const orderId = inputs[0].value.trim() || null;
  const phone = inputs[1].value.trim();
  const desc = inputs[2].value.trim();

  btn.disabled = true;
  btn.textContent = 'Sending...';

  try {
    const { data, error } = await supabase.from('help_tickets').insert([{
      issue_type: topicTitle,
      order_id: orderId,
      customer_phone: phone,
      description: desc,
      status: 'pending'
    }]).select();

    if(error) throw error;
    localStorage.setItem('rc_user_phone', phone);
    detectedUser.phone = phone;

    form.reset();
    form.style.display = 'none';
    if(data && data[0]) document.getElementById('createdTicketId').textContent = '#' + data[0].id;
    document.getElementById('successModal').style.display = 'grid';
  } catch(err){
    alert('Error: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send to Admin Desk ➔';
  }
};

window.openAutoTrackerModal = async function(){
  const modal = document.getElementById('trackerModal');
  if(modal) modal.style.display = 'grid';
  const idBox = document.getElementById('identityDetectedBox');
  const resBox = document.getElementById('trackResultList');

  await autoDetectUser();
  const activePhone = detectedUser.phone;

  if(!activePhone){
    if(idBox) idBox.innerHTML = `<span>Guest Device (No order history)</span>`;
    if(resBox){
      resBox.innerHTML = `
        <div style="text-align:center;padding:20px;">
          <p style="color:var(--text-muted);font-size:13px;margin-bottom:12px;">Apna mobile number likhein jisse order/request ki thi:</p>
          <input type="tel" id="manualTrackInput" placeholder="Mobile Number daalein" style="width:100%;padding:10px;background:#0d0d10;border:1px solid #333;color:#fff;border-radius:8px;font-size:13px;margin-bottom:8px;">
          <button class="submit-btn" id="manualSearchBtn">Search My Requests</button>
        </div>
      `;
      const manualBtn = document.getElementById('manualSearchBtn');
      if(manualBtn) manualBtn.addEventListener('click', () => {
        const inp = document.getElementById('manualTrackInput');
        if(inp) window.fetchTickets(inp.value.trim());
      });
    }
    return;
  }

  if(idBox) idBox.innerHTML = `<span>Customer Mobile: <strong>${activePhone}</strong></span> <span style="color:var(--green);font-size:11px;">● Auto Synced</span>`;
  await window.fetchTickets(activePhone);
};

window.fetchTickets = async function(phone){
  const resBox = document.getElementById('trackResultList');
  if(!resBox) return;
  resBox.innerHTML = `<p style="color:var(--text-muted);font-size:12.5px;text-align:center;padding:20px;">Analyzing your requests...</p>`;

  try {
    const { data: tickets, error } = await supabase
      .from('help_tickets')
      .select('*')
      .eq('customer_phone', phone)
      .order('id', { ascending: false });

    if(error) throw error;
    if(!tickets || !tickets.length){
      resBox.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:30px;">Is number par abhi koi active request nahi mili.</div>`;
      return;
    }

    resBox.innerHTML = tickets.map(tk => `
      <div class="ticket-status-card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="status-pill ${tk.status}">${tk.status}</span>
          <small style="color:var(--text-muted);">Ticket #${tk.id}</small>
        </div>
        <div style="font-size:13.5px;font-weight:700;color:#fff;margin-bottom:4px;">${tk.issue_type}</div>
        <div style="font-size:12px;color:var(--text-muted);">${tk.description}</div>
        ${tk.status === 'rejected' && tk.rejection_reason ? `
          <div class="reject-reason-box">
            <strong>❌ Rejection Reason:</strong> ${tk.rejection_reason}
          </div>
        ` : ''}
        ${tk.status === 'confirmed' ? `<div style="color:var(--green);font-size:12px;margin-top:6px;">✓ Admin team has approved & confirmed this request.</div>` : ''}
        ${tk.status === 'proceeding' ? `<div style="color:var(--blue);font-size:12px;margin-top:6px;">⚙️ Request in progress (Action underway).</div>` : ''}
      </div>
    `).join('');
  } catch(err){
    resBox.innerHTML = `<div style="color:var(--red);text-align:center;padding:20px;">Error: ${err.message}</div>`;
  }
};

window.closeTrackerModal = function(){
  const modal = document.getElementById('trackerModal');
  if(modal) modal.style.display = 'none';
};

(async () => {
  await autoDetectUser();
  await loadTopics();
})();
</script>

</body<>
</html>
