<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RADA CREST | Product Experience</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #FF7A00;
      --primary-glow: rgba(255, 122, 0, 0.4);
      --bg: #0b0d14;
      --card: #12141a;
      --text: #ffffff;
      --muted: #9ba1b0;
      --border: rgba(255, 255, 255, 0.08);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding-bottom: 100px; overflow-x: hidden; }

    /* Modern Neon Preloader */
    #pageLoader {
      position: fixed;
      inset: 0;
      background: #0b0d14;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #pageLoader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-ring {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 122, 0, 0.15);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      animation: spinLoader 0.8s linear infinite;
      box-shadow: 0 0 20px var(--primary-glow);
    }
    .loader-text {
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: var(--primary);
      font-weight: 800;
      text-transform: uppercase;
      animation: pulseLoader 1.2s ease-in-out infinite alternate;
    }
    @keyframes spinLoader { 100% { transform: rotate(360deg); } }
    @keyframes pulseLoader { 0% { opacity: 0.3; } 100% { opacity: 1; } }

    /* Top Bar */
    .header {
      background: rgba(18, 20, 26, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 2px solid var(--primary);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-title { color: var(--primary); font-weight: 900; font-size: 1.15rem; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .pulse-dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 10px var(--primary); animation: pulseDot 1.5s infinite; }
    @keyframes pulseDot { 0%, 100% { transform: scale(0.9); opacity: 0.7; } 50% { transform: scale(1.3); opacity: 1; } }
    .nav-btn { color: var(--muted); text-decoration: none; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }

    .product-wrap { max-width: 650px; margin: 15px auto; padding: 0 14px; animation: slideUp 0.4s var(--ease-spring); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* Media Box */
    .media-box { background: var(--card); border-radius: 20px; padding: 14px; border: 1px solid var(--border); position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    
    .wish-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 42px;
      height: 42px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(8px);
      border-radius: 50%;
      border: 1px solid var(--border);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
      transition: transform 0.2s var(--ease-spring);
    }
    .wish-btn:active { transform: scale(0.85); }
    .wish-btn.active { color: #ff3366; animation: elasticPop 0.4s var(--ease-spring); }
    @keyframes elasticPop { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } }

    .main-display {
      width: 100%;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(255,122,0,0.05) 0%, rgba(255,255,255,0.01) 100%);
      border-radius: 14px;
      overflow: hidden;
      cursor: zoom-in;
      position: relative;
    }
    .main-display img, .main-display video { max-width: 95%; max-height: 95%; object-fit: contain; transition: transform 0.3s ease, opacity 0.2s ease; }
    
    .zoom-hint {
      position: absolute;
      bottom: 10px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 5px;
      animation: floatHint 2.5s ease-in-out infinite;
    }
    @keyframes floatHint { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    .thumbs-row { display: flex; gap: 10px; margin-top: 12px; overflow-x: auto; padding-bottom: 4px; }
    .thumbs-row img, .thumbs-row .vid-thumb {
      width: 58px;
      height: 58px;
      border-radius: 10px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid transparent;
      background: rgba(255,255,255,0.03);
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .thumbs-row img:hover { transform: translateY(-2px); }
    .thumbs-row img.active { border-color: var(--primary); box-shadow: 0 0 12px var(--primary-glow); }
    .thumbs-row .vid-thumb { display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 1.2rem; }

    /* Details Box */
    .details-box { background: var(--card); border-radius: 20px; padding: 18px; margin-top: 14px; border: 1px solid var(--border); }
    .prod-name { font-size: 1.3rem; font-weight: 800; line-height: 1.3; }
    
    .meta-line { font-size: 0.82rem; color: var(--muted); margin: 8px 0 12px; display: flex; align-items: center; gap: 8px; }
    .rating-pill { background: rgba(255,122,0,0.12); color: var(--primary); padding: 2px 8px; border-radius: 6px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }

    .price-row { display: flex; align-items: baseline; gap: 12px; margin: 12px 0; }
    .selling-price { font-size: 1.7rem; font-weight: 900; color: var(--primary); text-shadow: 0 0 15px var(--primary-glow); }
    .mrp-price { font-size: 1rem; color: var(--muted); text-decoration: line-through; }
    .discount-tag {
      background: linear-gradient(135deg, #FF7A00, #ff4800);
      color: #000;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 900;
      font-size: 0.75rem;
      animation: pulseDiscount 1.8s infinite;
    }
    @keyframes pulseDiscount { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

    .badge-stock { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; margin-bottom: 12px; }
    .in-stock { background: rgba(37,211,102,0.15); color: #25D366; }
    .low-stock { background: rgba(255,170,0,0.15); color: #FFAA00; }
    .out-stock { background: rgba(255,68,68,0.15); color: #FF4444; }

    /* Interactive Color Variant Chips */
    .color-section { margin-top: 14px; }
    .section-title { font-size: 0.8rem; text-transform: uppercase; color: var(--muted); font-weight: 700; letter-spacing: 0.5px; }
    .swatches-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .color-chip {
      padding: 7px 14px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s var(--ease-spring);
    }
    .color-chip.active {
      border-color: var(--primary);
      background: rgba(255,122,0,0.15);
      color: var(--primary);
      box-shadow: 0 0 12px var(--primary-glow);
    }
    .color-dot-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      display: inline-block;
    }

    .specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .spec-node { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 10px; font-size: 0.8rem; color: var(--muted); border: 1px solid rgba(255,255,255,0.04); }
    .spec-node b { display: block; color: #fff; font-size: 0.88rem; margin-top: 2px; }

    /* Quantity Control */
    .qty-ctrl { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
    .qty-btn {
      width: 38px;
      height: 38px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .qty-btn:active { background: var(--primary); color: #000; transform: scale(0.9); }
    .qty-num { font-size: 1.2rem; font-weight: 800; min-width: 30px; text-align: center; }

    /* Interactive Reviews Section */
    .reviews-box {
      background: var(--card);
      border-radius: 20px;
      padding: 18px;
      margin-top: 14px;
      border: 1px solid var(--border);
    }
    .reviews-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn-review-toggle {
      background: rgba(255, 122, 0, 0.1);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
    }
    .review-drawer {
      display: none;
      background: rgba(255,255,255,0.03);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .review-drawer.active { display: block; }
    .rev-input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: #fff;
      padding: 9px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.85rem;
      outline: none;
    }
    .rev-input:focus { border-color: var(--primary); }
    .stars-picker { display: flex; gap: 6px; margin-bottom: 8px; color: #ffd700; cursor: pointer; font-size: 1rem; }
    .btn-submit-rev {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 9px 14px;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
    }

    .review-item {
      border-top: 1px solid rgba(255,255,255,0.05);
      padding: 12px 0;
    }
    .review-user {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .review-stars {
      color: var(--primary);
      font-size: 0.75rem;
    }
    .review-text {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .review-gallery {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .review-gallery img, .review-gallery video {
      width: 60px;
      height: 60px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: #000;
    }

    /* Suggested / Recommendations Section */
    .suggested-section { margin-top: 24px; }
    .suggested-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .suggested-scroller {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: none;
    }
    .suggested-scroller::-webkit-scrollbar { display: none; }
    .suggest-card {
      min-width: 150px;
      max-width: 150px;
      background: var(--card);
      border-radius: 14px;
      padding: 10px;
      border: 1px solid var(--border);
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s var(--ease-spring);
    }
    .suggest-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
    }
    .suggest-card img {
      width: 100%;
      height: 110px;
      object-fit: contain;
      border-radius: 8px;
      background: rgba(255,255,255,0.02);
    }
    .suggest-name {
      font-size: 0.82rem;
      font-weight: 700;
      margin: 6px 0 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .suggest-price {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--primary);
    }

    /* Bottom Action Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(18, 20, 26, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding: 12px 18px;
      z-index: 100;
      max-width: 650px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    .btn-add-cart {
      flex: 1;
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid var(--border);
      padding: 13px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-add-cart:active { transform: scale(0.96); background: rgba(255,255,255,0.15); }

    .btn-buy {
      flex: 1.2;
      position: relative;
      background: linear-gradient(135deg, #FF7A00, #ff5500);
      color: #000;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 8px 20px var(--primary-glow);
      overflow: hidden;
      transition: transform 0.2s ease;
    }
    .btn-buy:active { transform: scale(0.96); }
    .btn-buy::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shimmer 3s infinite;
    }
    @keyframes shimmer { 0% { left: -100%; } 30%, 100% { left: 100%; } }

    .btn-share {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s var(--ease-spring);
    }
    .btn-share:active { transform: scale(0.85); color: var(--primary); }

    /* Modal Zoom View */
    .zoom-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(12px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }
    .zoom-modal.active { display: flex; }
    .zoom-modal img { max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 12px; }
    .close-modal { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 1.8rem; cursor: pointer; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Toast */
    .toast-pill {
      position: fixed;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: #12151B;
      border: 1px solid var(--primary);
      color: #fff;
      padding: 10px 18px;
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: all 0.3s var(--ease-spring);
      z-index: 200;
    }
    .toast-pill.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <!-- 1. Sleek Modern Glowing Preloader -->
  <div id="pageLoader">
    <div class="loader-ring"></div>
    <div class="loader-text">RADA CREST</div>
  </div>

  <header class="header">
    <a href="index.html" class="brand-title">
      <div class="pulse-dot"></div>
      <span>RADA CREST</span>
    </a>
    <a href="index.html" class="nav-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </header>

  <div class="product-wrap" id="productRoot">
    <!-- Populated Dynamically -->
  </div>

  <!-- Fullscreen Zoom Modal -->
  <div class="zoom-modal" id="zoomModal" onclick="closeZoom()">
    <i class="fa-solid fa-xmark close-modal"></i>
    <img id="zoomImg" src="" alt="Zoomed Product" />
  </div>

  <!-- Toast -->
  <div class="toast-pill" id="toastBox">
    <i class="fa-solid fa-circle-check" style="color:var(--primary);"></i>
    <span id="toastMsg">Action Done</span>
  </div>

  <script>
    const SUPABASE_URL = 'https://ynpsnkvrjhaxdynmurzj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlucHNua3ZyamhheGR5bm11cnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNTc5NjAsImV4cCI6MjEwMTgzMzk2MH0.I3xFYthE0JNfGnD6N1BaNBybSq7m0G6MRILzq3NXihg';

    function getSupabase() {
      if (window.supabase && window.supabase.createClient) {
        return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      return null;
    }

    let currentQty = 1;
    let minOrderQty = 1;
    let currentActiveImg = '';
    let currentProduct = null;
    let selectedColorVariant = '';
    let selectedReviewStars = 5;

    function dismissPreloader() {
      const pLoader = document.getElementById('pageLoader');
      if (pLoader && !pLoader.classList.contains('hidden')) {
        pLoader.classList.add('hidden');
        setTimeout(() => { pLoader.style.display = 'none'; }, 400);
      }
    }

    // Safety timeout: loader 1.5 second se zyada screen par nahi rahega
    setTimeout(dismissPreloader, 1500);

    async function loadProduct() {
      const client = getSupabase();
      const urlParams = new URLSearchParams(window.location.search);
      const rawId = urlParams.get('id');

      if (!client) {
        setTimeout(loadProduct, 250);
        return;
      }

      let prod = null;
      try {
        let query = client.from('products').select('*');
        if (rawId) {
          query = query.eq('id', Number(rawId));
        } else {
          query = query.order('id', { ascending: false }).limit(1);
        }

        const { data, error } = await query;
        if (!error && data && data.length > 0) {
          prod = data[0];
        }
      } catch (e) {
        console.warn("Supabase fetch error:", e);
      }

      dismissPreloader();

      if (prod) {
        currentProduct = prod;
        renderProduct(prod);
        loadSuggestedProducts(prod.category, prod.id);
        loadProductReviews(prod.id);
      } else {
        showError("Product Not Found");
      }
    }

    function renderProduct(p) {
      const root = document.getElementById('productRoot');
      minOrderQty = p.moq || 1;
      currentQty = minOrderQty;

      const hasDiscount = p.old_price && p.old_price > p.price;
      const discountPercent = hasDiscount ? Math.round(((p.old_price - p.price) / p.old_price) * 100) : null;
      
      let photoList = [];
      if (p.images && Array.isArray(p.images) && p.images.length > 0) {
        photoList = p.images;
      } else if (p.image) {
        photoList = [p.image];
      } else {
        photoList = ['https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&q=80'];
      }
      currentActiveImg = photoList[0];

      let stockHtml = '';
      if (p.stock > 10) {
        stockHtml = `<span class="badge-stock in-stock"><i class="fa-solid fa-circle-check"></i> In Stock (${p.stock} units)</span>`;
      } else if (p.stock > 0) {
        stockHtml = `<span class="badge-stock low-stock"><i class="fa-solid fa-clock"></i> Low Stock (${p.stock} left)</span>`;
      } else {
        stockHtml = `<span class="badge-stock out-stock"><i class="fa-solid fa-ban"></i> Out of Stock</span>`;
      }

      let warrantyHtml = p.has_warranty ? `<div class="spec-node">Warranty<b>1 Year Replacement</b></div>` : '';
      let sizeHtml = `<div class="spec-node">Size Option<b>${(p.size && p.size.trim() !== '') ? p.size : 'Standard'}</b></div>`;

      // Dynamic Colors Variants from Database
      let colorBlock = '';
      if (p.colors && p.colors.trim() !== '') {
        const colorArray = p.colors.split(',').map(c => c.trim()).filter(Boolean);
        if (colorArray.length > 0) {
          selectedColorVariant = colorArray[0];
          colorBlock = `
            <div class="color-section">
              <span class="section-title">Select Color / Variant:</span>
              <div class="swatches-wrap" id="swatchesContainer">
                ${colorArray.map((c, i) => `
                  <div class="color-chip ${i === 0 ? 'active' : ''}" onclick="pickVariant('${c}', ${i}, this)">
                    <span class="color-dot-indicator"></span>
                    <span>${c}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }
      }

      root.innerHTML = `
        <div class="media-box">
          <button class="wish-btn" id="wishBtn" onclick="toggleWishlist('${p.id}')">
            <i class="fa-regular fa-heart"></i>
          </button>
          
          <div class="main-display" id="mainDisplay" onclick="openZoom()">
            <img src="${photoList[0]}" id="mainImg" alt="${p.name}" />
            <div class="zoom-hint"><i class="fa-solid fa-magnifying-glass-plus"></i> Tap to Zoom</div>
          </div>

          <div class="thumbs-row" id="thumbsRow">
            ${photoList.map((img, idx) => `
              <img src="${img}" class="${idx === 0 ? 'active' : ''}" onclick="switchMedia('${img}', this)" />
            `).join('')}
            ${p.video ? `
              <div class="vid-thumb" onclick="switchVideo('${p.video}')">
                <i class="fa-solid fa-play"></i>
              </div>
            ` : ''}
          </div>
        </div>

        <div class="details-box">
          <h1 class="prod-name">${p.name}</h1>
          
          <div class="meta-line">
            <span class="rating-pill"><i class="fa-solid fa-star"></i> ${p.rating || '5.0'}</span>
            <span>•</span>
            <span>${p.sales_count || 0} Orders placed</span>
          </div>

          ${stockHtml}

          <div class="price-row">
            <span class="selling-price">₹${p.price}</span>
            ${hasDiscount ? `<span class="mrp-price">₹${p.old_price}</span>` : ''}
            ${hasDiscount ? `<span class="discount-tag">${discountPercent}% OFF</span>` : ''}
          </div>

          ${colorBlock}

          <div class="specs-grid">
            ${sizeHtml}
            ${warrantyHtml}
            <div class="spec-node">Min Order Qty<b>${minOrderQty} Piece</b></div>
            <div class="spec-node">Shipping<b>Express Delivery</b></div>
          </div>

          <div class="qty-ctrl">
            <span class="section-title">Quantity:</span>
            <button class="qty-btn" onclick="updateQty(-1)">-</button>
            <span class="qty-num" id="qtyDisplay">${currentQty}</span>
            <button class="qty-btn" onclick="updateQty(1)">+</button>
          </div>
        </div>

        <!-- Customer Reviews Section with Photos and Videos -->
        <div class="reviews-box">
          <div class="reviews-header">
            <span class="section-title" style="font-size:0.9rem; color:#fff;">Ratings & Reviews</span>
            <button class="btn-review-toggle" onclick="toggleReviewDrawer()">Write Review</button>
          </div>

          <div class="review-drawer" id="reviewDrawer">
            <input type="text" id="revAuthor" class="rev-input" placeholder="Your Name">
            <div class="stars-picker" id="starsPicker">
              <i class="fa-solid fa-star" onclick="setStars(1)"></i>
              <i class="fa-solid fa-star" onclick="setStars(2)"></i>
              <i class="fa-solid fa-star" onclick="setStars(3)"></i>
              <i class="fa-solid fa-star" onclick="setStars(4)"></i>
              <i class="fa-solid fa-star" onclick="setStars(5)"></i>
            </div>
            <textarea id="revComment" class="rev-input" rows="3" placeholder="Share your honest product review..."></textarea>
            <input type="url" id="revImg" class="rev-input" placeholder="Paste Product Photo URL (Optional)">
            <input type="url" id="revVid" class="rev-input" placeholder="Paste Product Video URL (Optional)">
            <button class="btn-submit-rev" onclick="submitReview()">Submit Review</button>
          </div>

          <div id="reviewsContainer">
            <div style="color:var(--muted); font-size:0.85rem;">Loading verified reviews...</div>
          </div>
        </div>

        <!-- Suggested / Category Products Section -->
        <div class="suggested-section">
          <h3 class="suggested-title"><i class="fa-solid fa-layer-group" style="color:var(--primary);"></i> Similar & Suggested Products</h3>
          <div class="suggested-scroller" id="suggestedScroller">
            <div style="color:var(--muted); font-size:0.85rem;">Loading similar items...</div>
          </div>
        </div>

        <!-- Fully Working Bottom Bar -->
        <div class="bottom-bar">
          <button class="btn-add-cart" onclick="addToCart()">
            <i class="fa-solid fa-cart-plus"></i> ADD TO CART
          </button>
          <button class="btn-buy" onclick="goToBuyPage('${p.id}')">
            <i class="fa-solid fa-bolt"></i> BUY NOW
          </button>
          <button class="btn-share" onclick="shareProduct('${p.name}')">
            <i class="fa-solid fa-share-nodes"></i>
          </button>
        </div>
      `;

      checkWishlistStatus(p.id);
    }

    // Color Variant Click -> Updates Image and Selection
    function pickVariant(colorName, colorIndex, element) {
      document.querySelectorAll('.color-chip').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');
      selectedColorVariant = colorName;

      const mainImg = document.getElementById('mainImg');
      if (currentProduct && mainImg) {
        let photos = currentProduct.images && Array.isArray(currentProduct.images) ? currentProduct.images : [currentProduct.image];
        const targetPhoto = photos[colorIndex] || photos[0];
        if (targetPhoto) {
          mainImg.style.opacity = '0.25';
          setTimeout(() => {
            switchMedia(targetPhoto, null);
            mainImg.style.opacity = '1';
          }, 180);
        }
      }
      showToast(`Selected: ${colorName}`);
    }

    function switchMedia(src, el) {
      currentActiveImg = src;
      const display = document.getElementById('mainDisplay');
      if (display) {
        display.innerHTML = `
          <img src="${src}" id="mainImg" />
          <div class="zoom-hint"><i class="fa-solid fa-magnifying-glass-plus"></i> Tap to Zoom</div>
        `;
      }
      document.querySelectorAll('.thumbs-row img').forEach(i => i.classList.remove('active'));
      if (el) el.classList.add('active');
    }

    function switchVideo(videoUrl) {
      const display = document.getElementById('mainDisplay');
      if (display) {
        display.innerHTML = `
          <video controls autoplay style="width:100%; height:100%; object-fit:contain; border-radius:12px;">
            <source src="${videoUrl}" type="video/mp4">
          </video>
        `;
      }
    }

    function openZoom() {
      const modal = document.getElementById('zoomModal');
      document.getElementById('zoomImg').src = currentActiveImg;
      modal.classList.add('active');
    }

    function closeZoom() {
      document.getElementById('zoomModal').classList.remove('active');
    }

    function updateQty(change) {
      if (currentQty + change >= minOrderQty) {
        currentQty += change;
        document.getElementById('qtyDisplay').innerText = currentQty;
      }
    }

    function toggleReviewDrawer() {
      document.getElementById('reviewDrawer').classList.toggle('active');
    }

    function setStars(count) {
      selectedReviewStars = count;
      const stars = document.querySelectorAll('#starsPicker i');
      stars.forEach((s, idx) => {
        s.style.color = idx < count ? '#ffd700' : '#4b5563';
      });
    }

    // Customer Reviews Load & Submit
    async function loadProductReviews(prodId) {
      const client = getSupabase();
      const container = document.getElementById('reviewsContainer');
      if (!client || !container) return;

      try {
        const { data, error } = await client.from('reviews').select('*').eq('product_id', prodId).order('created_at', { ascending: false });
        if (error || !data || data.length === 0) {
          container.innerHTML = `<div style="color:var(--muted); font-size:0.85rem; padding: 6px 0;">No reviews yet. Be the first to share your experience!</div>`;
          return;
        }

        container.innerHTML = data.map(r => `
          <div class="review-item">
            <div class="review-user">
              <span>${r.author_name || 'Verified Buyer'} <i class="fa-solid fa-circle-check" style="color:#25D366; font-size:0.75rem;"></i></span>
              <div class="review-stars">${'<i class="fa-solid fa-star"></i>'.repeat(r.rating || 5)}</div>
            </div>
            <p class="review-text">${r.comment || ''}</p>
            ${(r.image_url || r.video_url) ? `
              <div class="review-gallery">
                ${r.image_url ? `<img src="${r.image_url}" onclick="window.open('${r.image_url}')" />` : ''}
                ${r.video_url ? `<video src="${r.video_url}" controls></video>` : ''}
              </div>
            ` : ''}
          </div>
        `).join('');
      } catch(e) {
        container.innerHTML = `<div style="color:var(--muted); font-size:0.85rem;">Could not load reviews.</div>`;
      }
    }

    async function submitReview() {
      const client = getSupabase();
      if (!client || !currentProduct) return;

      const author = document.getElementById('revAuthor').value.trim() || 'Verified Customer';
      const comment = document.getElementById('revComment').value.trim();
      const img = document.getElementById('revImg').value.trim();
      const vid = document.getElementById('revVid').value.trim();

      if (!comment) {
        alert("Please write a review comment!");
        return;
      }

      const { error } = await client.from('reviews').insert([{
        product_id: currentProduct.id,
        author_name: author,
        rating: selectedReviewStars,
        comment: comment,
        image_url: img || null,
        video_url: vid || null
      }]);

      if (!error) {
        showToast("Review submitted!");
        document.getElementById('revComment').value = "";
        document.getElementById('revImg').value = "";
        document.getElementById('revVid').value = "";
        toggleReviewDrawer();
        loadProductReviews(currentProduct.id);
      } else {
        alert("Could not post review: " + error.message);
      }
    }

    function getActiveUserKey() {
      try {
        const user = JSON.parse(localStorage.getItem('rc_user')) || null;
        if (user) {
          const uniqueId = user.email || user.phone || user.id;
          if (uniqueId) return `rc_cart_items_${String(uniqueId).replace(/[^a-zA-Z0-9]/g, '_')}`;
        }
      } catch(e) {}
      return 'rc_cart_items_guest_user';
    }

    // 1. ADD TO CART: सिर्फ कार्ट में आइटम जोड़ेगा
    function addToCart() {
      if (!currentProduct) return;
      const targetKey = getActiveUserKey();
      
      let cart = JSON.parse(localStorage.getItem(targetKey)) || [];
      const existingIndex = cart.findIndex(item => String(item.id) === String(currentProduct.id) && item.variant === selectedColorVariant);

      let prodImg = currentActiveImg || (currentProduct.images && currentProduct.images[0]) || currentProduct.image || 'assets/placeholder.jpg';
      const itemPrice = Number(currentProduct.price || 0);
      const itemOldPrice = Number(currentProduct.old_price || itemPrice);
      const variantInfo = selectedColorVariant ? `Color: ${selectedColorVariant}` : (currentProduct.size ? `Size: ${currentProduct.size}` : 'Standard');

      if (existingIndex > -1) {
        cart[existingIndex].quantity = Number(cart[existingIndex].quantity || 0) + Number(currentQty);
      } else {
        cart.push({
          id: currentProduct.id,
          title: currentProduct.name,
          name: currentProduct.name,
          price: itemPrice,
          currentPrice: itemPrice,
          oldPrice: itemOldPrice,
          old_price: itemOldPrice,
          image: prodImg,
          variant: variantInfo,
          stockLeft: Number(currentProduct.stock || 50),
          quantity: Number(currentQty),
          selected: true
        });
      }

      localStorage.setItem(targetKey, JSON.stringify(cart));
      showToast("Added to Cart successfully!");
    }

    // 2. BUY NOW: कार्ट को बिल्कुल नहीं छेड़ेगा, सीधे buy.html पर ले जाएगा
    function goToBuyPage(productId) {
      if (!currentProduct) return;
      
      const itemPrice = Number(currentProduct.price || 0);
      const buyNowItem = {
        id: currentProduct.id,
        title: currentProduct.name,
        name: currentProduct.name,
        price: itemPrice,
        image: currentActiveImg || (currentProduct.images && currentProduct.images[0]) || currentProduct.image || 'assets/placeholder.jpg',
        variant: selectedColorVariant ? `Color: ${selectedColorVariant}` : (currentProduct.size || 'Standard'),
        quantity: Number(currentQty)
      };

      // डायरेक्ट ख़रीदने वाले आइटम को अलग की (key) में स्टोर करें
      localStorage.setItem('rc_buy_now_item', JSON.stringify(buyNowItem));
      
      // सीधे buy.html पर भेजें
      window.location.href = `buy.html?id=${currentProduct.id}&qty=${currentQty}`;
    }

    async function loadSuggestedProducts(category, currentId) {
      const scroller = document.getElementById('suggestedScroller');
      const client = getSupabase();
      if (!scroller || !client) return;

      let list = [];
      try {
        const { data, error } = await client.from('products').select('*').neq('id', currentId).limit(6);
        if (!error && data) list = data;
      } catch (e) {}

      if (list.length === 0) {
        scroller.innerHTML = `<div style="color:var(--muted); font-size:0.85rem;">No other products found.</div>`;
        return;
      }

      scroller.innerHTML = list.map(item => `
        <div class="suggest-card" onclick="window.location.href='product.html?id=${item.id}'">
          <img src="${item.image || (item.images && item.images[0]) || 'assets/placeholder.jpg'}" alt="${item.name}" />
          <div class="suggest-name">${item.name}</div>
          <div class="suggest-price">₹${item.price}</div>
        </div>
      `).join('');
    }

    function toggleWishlist(productId) {
      let wishlist = JSON.parse(localStorage.getItem('rc_wishlist')) || [];
      const btn = document.getElementById('wishBtn');
      const icon = btn.querySelector('i');

      if (wishlist.includes(productId)) {
        wishlist = wishlist.filter(id => id !== productId);
        icon.className = 'fa-regular fa-heart';
        btn.classList.remove('active');
        showToast("Removed from Wishlist");
      } else {
        wishlist.push(productId);
        icon.className = 'fa-solid fa-heart';
        btn.classList.add('active');
        showToast("Saved to Wishlist!");
      }
      localStorage.setItem('rc_wishlist', JSON.stringify(wishlist));
    }

    function checkWishlistStatus(productId) {
      const wishlist = JSON.parse(localStorage.getItem('rc_wishlist')) || [];
      const btn = document.getElementById('wishBtn');
      if (wishlist.includes(productId) && btn) {
        btn.querySelector('i').className = 'fa-solid fa-heart';
        btn.classList.add('active');
      }
    }

    function shareProduct(name) {
      if (navigator.share) {
        navigator.share({ title: name, url: window.location.href });
      } else {
        showToast("Link Copied to Clipboard!");
      }
    }

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      document.getElementById('toastMsg').innerText = msg;
      box.classList.add('show');
      setTimeout(() => box.classList.remove('show'), 2000);
    }

    function showError(msg) {
      dismissPreloader();
      document.getElementById('productRoot').innerHTML = `
        <div style="text-align:center; padding: 60px 20px; color:#fff;">
          <h2>${msg}</h2>
          <p style="color:var(--muted); margin: 10px 0 20px;">Could not load item details.</p>
          <a href="index.html" style="color:var(--primary); text-decoration:none; font-weight:700;">← Return to Store</a>
        </div>
      `;
    }

    window.addEventListener('DOMContentLoaded', loadProduct);
  </script>
</body>
</html>
