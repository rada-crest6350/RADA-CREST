<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product — RADA CREST</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Core Backend Scripts -->
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#FF7A00',
              light: '#FF9433',
              dark: '#D96800',
              glow: 'rgba(255, 122, 0, 0.35)'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          },
          keyframes: {
            shimmer: {
              '100%': { transform: 'translateX(100%)' }
            },
            jiggle: {
              '0%, 100%': { transform: 'scale(1)' },
              '25%': { transform: 'scale(1.25) rotate(-6deg)' },
              '75%': { transform: 'scale(1.25) rotate(6deg)' }

          },
          animation: {
            shimmer: 'shimmer 2.2s infinite',
            jiggle: 'jiggle 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)'

      }

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);

      position: fixed;

    }

      overflow: hidden;
      cursor: crosshair;
    }
    .zoom-container img {
      transition: transform 0.15s ease-out;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;

</head>

<body class="text-slate-800 antialiased overflow-x-hidden selection:bg-brand selection:text-white">

  <!-- Sticky Top Navbar -->
  <header class="sticky top-0 z-50 glass-card border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand & Back Link -->
      <a href="index.html" class="flex items-center gap-2 group text-slate-900 font-extrabold text-sm tracking-wide hover:text-brand transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4 transition-transform group-hover:-translate-x-1"></i>
        <span>Back to Store</span>
      </a>

      <!-- Quick Actions -->
      <div class="flex items-center gap-3">
        <a href="admin.html" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold text-brand bg-brand/10 hover:bg-brand hover:text-white transition-all border border-brand/20">
          <i data-lucide="settings" class="w-3.5 h-3.5"></i>
          <span>admin.html</span>
        </a>

        <div id="cartIconBox" class="relative p-2.5 rounded-xl bg-white border border-slate-200 text-slate-700 shadow-sm">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i>
          <span id="cartCountBadge" class="absolute -top-1.5 -right-1.5 bg-brand text-white text-[10px] font-black w-4 h-4 rounded-full flex items-center justify-center ring-2 ring-white">
            0
          </span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12">
    <div id="productPage">
      <div class="min-h-[400px] flex items-center justify-center text-slate-400 font-bold text-sm">
        <i data-lucide="loader-2" class="w-5 h-5 animate-spin mr-2"></i> Loading product details...
      </div>
    </div>
  </main>

  <!-- Fullscreen Photo Modal -->
  <div id="rcModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm p-4 flex items-center justify-center cursor-pointer" onclick="this.classList.add('hidden')">
    <img id="modalImg" src="" class="max-w-[90vw] max-h-[90vh] object-contain rounded-2xl shadow-2xl border border-white/20">
  </div>

  <!-- Dynamic Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-slate-950 text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2">
    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
    <span id="toastMsg">Action completed</span>
  </div>

<script>
"use strict";

const productPage = document.getElementById("productPage");
let product = null;
let media = [];
let activeMedia = 0;
let isWishlisted = false;

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function getUrls(value){
  return String(value || "")
    .split(/[\n,]+/)
    .map(x => x.trim())
    .filter(Boolean);
}

function getProductId(){
  return new URLSearchParams(window.location.search).get("id");
}

function youtubeId(url){
  try{
    const u = new URL(url);
    const host = u.hostname.toLowerCase();

    if(host === "youtu.be" || host.endsWith(".youtu.be")){
      return u.pathname.split("/").filter(Boolean)[0] || null;
    }
    if(host.includes("youtube.com")){
      if(u.pathname === "/watch") return u.searchParams.get("v");
      if(u.pathname.startsWith("/shorts/")) return u.pathname.split("/").filter(Boolean)[1] || null;
      if(u.pathname.startsWith("/embed/")) return u.pathname.split("/").filter(Boolean)[1] || null;
    }
  }catch(e){
    return null;
  }
  return null;
}

function buildMedia(){
  media = [];
  getUrls(product.image_url).forEach(url => {
    media.push({type:"image", url});
  });

  if(product.video_url){
    const videoUrl = String(product.video_url).trim();
    if(videoUrl){
      media.push({type:"video", url:videoUrl});
    }
  }

  if(!media.length){
    media.push({type:"empty", url:""});
  }
  activeMedia = 0;
}

function renderMedia(){
  const box = document.getElementById("rcMain");
  if(!box) return;

  const item = media[activeMedia];

  if(!item || item.type === "empty"){
    box.innerHTML = '<div class="text-slate-400 text-center font-bold text-sm py-10">💡<br>Product image unavailable</div>';
    return;
  }

  if(item.type === "image"){
    box.innerHTML = `
      <img
        id="zoomImg"
        src="${esc(item.url)}"
        alt="${esc(product.name)}"
        class="w-full h-full object-contain drop-shadow-xl"
        onerror="this.onerror=null;this.parentElement.innerHTML='<div class=&quot;text-slate-400 text-center font-bold text-sm py-10&quot;>🖼️<br>Image unavailable</div>'"
      >
    `;
    setupZoom();
  }else{
    const id = youtubeId(item.url);
    if(id){
      box.innerHTML = `
        <iframe
          src="https://www.youtube.com/embed/${encodeURIComponent(id)}"
          title="Product Video"
          class="w-full h-full rounded-2xl border-0"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      `;
    }else{
      box.innerHTML = `
        <video
          src="${esc(item.url)}"
          controls
          playsinline
          preload="metadata"
          class="w-full h-full object-contain rounded-2xl"
          onerror="this.onerror=null;this.parentElement.innerHTML='<div class=&quot;text-slate-400 text-center font-bold text-sm py-10&quot;>🎬<br>Video unavailable</div>'">
        </video>
      `;
    }
  }

  document.querySelectorAll(".rc-thumb").forEach((thumb, index)=>{
    if(index === activeMedia){
      thumb.className = "rc-thumb flex-shrink-0 w-20 h-20 bg-white rounded-2xl border-2 border-brand p-1.5 shadow-sm transition-all";
    } else {
      thumb.className = "rc-thumb flex-shrink-0 w-20 h-20 bg-white rounded-2xl border border-slate-200 hover:border-slate-400 p-1.5 shadow-sm transition-all";
    }
  });
}

function selectMedia(index){
  if(index < 0 || index >= media.length) return;
  activeMedia = index;
  renderMedia();
}

function renderThumbs(){
  const nav = document.getElementById("rcNav");
  if(!nav) return;

  nav.innerHTML = media.map((item, index)=>{
    if(item.type === "image"){
      return `
        <button
          type="button"
          class="rc-thumb ${index === 0 ? 'flex-shrink-0 w-20 h-20 bg-white rounded-2xl border-2 border-brand p-1.5 shadow-sm' : 'flex-shrink-0 w-20 h-20 bg-white rounded-2xl border border-slate-200 p-1.5 shadow-sm'}"
          onclick="selectMedia(${index})"
          aria-label="Image ${index + 1}">
          <img src="${esc(item.url)}" class="w-full h-full object-contain rounded-lg" alt="">
        </button>
      `;
    }
    if(item.type === "video"){
      return `
        <button
          type="button"
          class="rc-thumb flex-shrink-0 w-20 h-20 bg-slate-900 text-white rounded-2xl border border-slate-700 flex items-center justify-center p-1.5 shadow-sm"
          onclick="selectMedia(${index})"
          aria-label="Video">
          <span class="text-xl">▶</span>
        </button>
      `;
    }
    return "";
  }).join("");
}

function setupZoom(){
  const viewer = document.getElementById("rcMain");
  const img = document.getElementById("zoomImg");
  if(!viewer || !img) return;

  viewer.onmousemove = (e) => {
    const rect = viewer.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    img.style.transformOrigin = `${x}% ${y}%`;
    img.style.transform = 'scale(1.75)';
  };

  viewer.onmouseleave = () => {
    img.style.transformOrigin = 'center center';
    img.style.transform = 'scale(1)';
  };
}

function getDiscount(){
  const mrp = Number(product.old_price || 0);
  const price = Number(product.price || 0);
  if(mrp > 0 && price >= 0 && price < mrp){
    return Math.round(((mrp - price) / mrp) * 100);
  }
  return 0;
}

function renderProduct(){
  const price = Number(product.price || 0);
  const mrp = Number(product.old_price || 0);
  const stock = Number(product.stock || 0);
  const off = getDiscount();

  buildMedia();

  productPage.innerHTML = `
    <!-- Top Showcase Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-start">

      <!-- Media Viewer (7 cols) -->
      <div class="lg:col-span-7 flex flex-col gap-4">
        <div id="rcMain" class="relative bg-white rounded-3xl border border-slate-200/90 p-6 flex items-center justify-center shadow-xl shadow-slate-200/40 zoom-container min-h-[380px] sm:min-h-[480px]">
        </div>

        <div class="flex items-center gap-2">
          <span class="bg-slate-900/80 backdrop-blur text-white text-[11px] font-semibold px-2.5 py-1 rounded-full flex items-center gap-1">
            <i data-lucide="move-horizontal" class="w-3 h-3"></i> Side scroll
          </span>
          <span class="bg-brand text-white text-[11px] font-semibold px-2.5 py-1 rounded-full flex items-center gap-1 shadow-sm">
            <i data-lucide="zoom-in" class="w-3 h-3"></i> Tap to zoom
          </span>
        </div>

        <!-- Thumbnails -->
        <div id="rcNav" class="flex items-center gap-3 overflow-x-auto pb-2 scrollbar-none"></div>
      </div>

      <!-- Details & Config Panel (5 cols) -->
      <div class="lg:col-span-5 flex flex-col space-y-6">
        
        <div>
          <div class="flex items-center gap-2 mb-2">
            <span class="px-2.5 py-0.5 rounded-md bg-brand/10 text-brand font-bold text-xs uppercase tracking-wider">
              ${esc(product.category || "RADA CREST")}
            </span>
            ${product.warranty ? `
              <span class="px-2.5 py-0.5 rounded-md bg-emerald-50 text-emerald-700 font-semibold text-xs flex items-center gap-1 border border-emerald-200">
                <i data-lucide="shield-check" class="w-3 h-3"></i> ${esc(product.warranty)}
              </span>
            ` : ''}
          </div>

          <h1 class="text-3xl sm:text-4xl font-black text-slate-950 tracking-tight leading-tight">
            ${esc(product.name || "RADA CREST Product")}
          </h1>
        </div>

        <!-- Price Area -->
        <div class="flex items-baseline gap-3 p-4 rounded-2xl bg-white border border-slate-200/90 shadow-sm">
          <span class="text-3xl font-black text-slate-900">
            ₹${price.toLocaleString("en-IN")}
          </span>
          ${mrp > price ? `
            <span class="text-base text-slate-400 line-through font-medium">
              ₹${mrp.toLocaleString("en-IN")}
            </span>
          ` : ""}
          ${off ? `
            <span class="ml-auto inline-flex items-center px-2.5 py-1 rounded-full text-xs font-extrabold bg-orange-50 text-brand border border-brand/30 animate-pulse">
              ${off}% OFF
            </span>
          ` : ""}
        </div>

        <!-- Dynamic Specs Highlight -->
        <div class="grid grid-cols-2 gap-3">
          <div class="p-3.5 bg-white rounded-2xl border border-slate-200">
            <b class="text-xs text-slate-400 uppercase font-bold block">Warranty</b>
            <span class="text-sm font-extrabold text-slate-800">${esc(product.warranty || "Standard Warranty")}</span>
          </div>
          <div class="p-3.5 bg-white rounded-2xl border border-slate-200">
            <b class="text-xs text-slate-400 uppercase font-bold block">Stock Status</b>
            <span class="text-sm font-extrabold ${stock > 0 ? 'text-emerald-600' : 'text-rose-600'}">
              ${stock > 0 ? stock + " Units Available" : "Out of Stock"}
            </span>
          </div>
        </div>

        <!-- Actions / Quantity Area -->
        ${stock > 0 ? `
          <div class="space-y-4">
            <div class="flex items-center gap-3">
              <span class="text-xs font-bold uppercase text-slate-400">Quantity:</span>
              <div class="flex items-center border border-slate-200 rounded-xl bg-white p-1">
                <button type="button" onclick="changeQty(-1)" class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-slate-600 hover:bg-slate-100">−</button>
                <input id="qty" type="number" min="1" max="${stock}" value="1" class="w-12 text-center text-sm font-black border-0 focus:outline-none">
                <button type="button" onclick="changeQty(1)" class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-slate-600 hover:bg-slate-100">+</button>
              </div>

              <!-- Wishlist & Share -->
              <button onclick="toggleWishlist(this)" class="p-3 rounded-xl border border-slate-200 bg-white text-slate-600 hover:text-rose-500 transition-colors ml-auto shadow-sm">
                <i data-lucide="heart" class="w-4 h-4"></i>
              </button>
              <button onclick="copyShareLink()" class="p-3 rounded-xl border border-slate-200 bg-white text-slate-600 hover:text-brand transition-colors shadow-sm">
                <i data-lucide="share-2" class="w-4 h-4"></i>
              </button>
            </div>

            <div class="space-y-2.5 pt-2">
              <button id="addToCartAction" type="button" onclick="addToCart()" class="relative w-full overflow-hidden rounded-2xl bg-brand py-4 px-6 text-white font-extrabold text-base shadow-xl shadow-brand/30 hover:bg-brand-light active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                <div class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/25 to-transparent animate-shimmer"></div>
                <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                <span>Add to Cart</span>
              </button>

              <button
                type="button"
                onclick="window.location.href='buy.html?id=' + encodeURIComponent(product.id)"
                class="block w-full text-center py-3.5 px-6 rounded-2xl bg-slate-900 hover:bg-black text-white font-bold text-sm shadow-md transition-all">
                Buy Now with 1-Click
              </button>
            </div>
          </div>
        ` : `
          <button class="w-full py-4 rounded-2xl bg-slate-200 text-slate-500 font-extrabold cursor-not-allowed" disabled>
            Out of Stock
          </button>
        `}
      </div>
    </div>

    <!-- Tabbed Information Hub -->
    <section class="bg-white rounded-3xl border border-slate-200/90 p-6 sm:p-8 shadow-sm">
      <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-6 overflow-x-auto gap-4">
        <div class="flex gap-6 sm:gap-8 min-w-max">
          <button onclick="switchTab('details', this)" class="tab-link pb-3 text-sm font-bold text-brand border-b-2 border-brand transition-all">
            Product Full Details
          </button>
          <button onclick="switchTab('selling', this)" class="tab-link pb-3 text-sm font-bold text-slate-400 hover:text-slate-700 border-b-2 border-transparent transition-all">
            Selling Counts
          </button>
          <button onclick="switchTab('rating', this)" class="tab-link pb-3 text-sm font-bold text-slate-400 hover:text-slate-700 border-b-2 border-transparent transition-all">
            Product Rating & Reviews
          </button>
        </div>
        <a href="admin.html" class="text-xs text-brand hover:underline font-semibold flex items-center gap-1">
          <i data-lucide="external-link" class="w-3 h-3"></i> admin.html
        </a>
      </div>

      <!-- Tab Content Area -->
      <div id="tabContent">
        <div id="detailsTab" class="space-y-4 text-sm text-slate-600 leading-relaxed">
          <div class="whitespace-pre-line text-slate-700">
            ${product.description ? esc(product.description) : "Premium RADA CREST product designed for everyday durability and efficiency."}
          </div>
        </div>

        <div id="sellingTab" class="hidden space-y-3">
          <div class="flex items-center justify-between p-4 bg-orange-50/60 rounded-2xl border border-orange-100">
            <div>
              <h4 class="font-bold text-slate-900">Total Orders Processed</h4>
              <p class="text-xs text-slate-500">Verified platform dispatches for this item</p>
            </div>
            <span class="text-2xl font-black text-brand">500+ Units</span>
          </div>
        </div>

        <div id="ratingTab" class="hidden space-y-4">
          <div id="reviews" class="space-y-4">
            <p class="text-xs text-slate-400 font-semibold">Loading reviews...</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Categories Discovery Section -->
    <section class="space-y-6">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight uppercase">Categories You Might Like</h2>
          <p class="text-xs sm:text-sm text-slate-500">Explore curated collections designed for your lifestyle</p>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
        <div class="group relative rounded-3xl overflow-hidden bg-slate-900 min-h-[220px] flex flex-col justify-end p-5 shadow-lg">
          <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&auto=format&fit=crop&q=80" class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:scale-110 transition-transform duration-500">
          <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
          <div class="relative z-10 space-y-3">
            <h3 class="text-white font-extrabold text-base">LED & Lighting</h3>
            <a href="index.html?cat=lighting" class="w-full block text-center py-2.5 px-4 rounded-xl bg-brand text-white font-bold text-xs hover:bg-brand-light shadow-md transition-all">
              TAP TO OPEN PAGE
            </a>
          </div>
        </div>

        <div class="group relative rounded-3xl overflow-hidden bg-slate-900 min-h-[220px] flex flex-col justify-end p-5 shadow-lg">
          <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=80" class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:scale-110 transition-transform duration-500">
          <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
          <div class="relative z-10 space-y-3">
            <h3 class="text-white font-extrabold text-base">Smart Gadgets</h3>
            <a href="index.html?cat=gadgets" class="w-full block text-center py-2.5 px-4 rounded-xl bg-brand text-white font-bold text-xs hover:bg-brand-light shadow-md transition-all">
              TAP TO OPEN PAGE
            </a>
          </div>
        </div>

        <div class="group relative rounded-3xl overflow-hidden bg-slate-900 min-h-[220px] flex flex-col justify-end p-5 shadow-lg">
          <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=80" class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:scale-110 transition-transform duration-500">
          <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
          <div class="relative z-10 space-y-3">
            <h3 class="text-white font-extrabold text-base">Electronics</h3>
            <a href="index.html?cat=electronics" class="w-full block text-center py-2.5 px-4 rounded-xl bg-brand text-white font-bold text-xs hover:bg-brand-light shadow-md transition-all">
              TAP TO OPEN PAGE
            </a>
          </div>
        </div>

        <div class="group relative rounded-3xl overflow-hidden bg-slate-900 min-h-[220px] flex flex-col justify-end p-5 shadow-lg">
          <img src="https://images.unsplash.com/photo-1627123424574-724758594e93?w=500&auto=format&fit=crop&q=80" class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:scale-110 transition-transform duration-500">
          <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
          <div class="relative z-10 space-y-3">
            <h3 class="text-white font-extrabold text-base">Accessories</h3>
            <a href="index.html?cat=accessories" class="w-full block text-center py-2.5 px-4 rounded-xl bg-brand text-white font-bold text-xs hover:bg-brand-light shadow-md transition-all">
              TAP TO OPEN PAGE
            </a>
          </div>
        </div>
      </div>
    </section>
  `;

  renderMedia();
  renderThumbs();
  loadReviews();
  updateCartBadge();
  lucide.createIcons();
}

function switchTab(tabId, el) {
  document.querySelectorAll('.tab-link').forEach(btn => {
    btn.className = 'tab-link pb-3 text-sm font-bold text-slate-400 hover:text-slate-700 border-b-2 border-transparent transition-all';
  });
  el.className = 'tab-link pb-3 text-sm font-bold text-brand border-b-2 border-brand transition-all';

  document.getElementById('detailsTab').classList.add('hidden');
  document.getElementById('sellingTab').classList.add('hidden');
  document.getElementById('ratingTab').classList.add('hidden');

  if (tabId === 'details') document.getElementById('detailsTab').classList.remove('hidden');
  if (tabId === 'selling') document.getElementById('sellingTab').classList.remove('hidden');
  if (tabId === 'rating') document.getElementById('ratingTab').classList.remove('hidden');
}

function changeQty(delta){
  const input = document.getElementById("qty");
  if(!input) return;
  const stock = Number(product.stock || 0);
  const current = Number(input.value || 1);
  input.value = Math.max(1, Math.min(stock, current + delta));
}

function getQty(){
  const input = document.getElementById("qty");
  const quantity = Number(input?.value || 0);
  const stock = Number(product.stock || 0);

  if(!Number.isInteger(quantity) || quantity < 1 || quantity > stock){
    showToast("Please enter a valid quantity.");
    return null;
  }
  return quantity;
}

function getCart(){
  try{
    return JSON.parse(localStorage.getItem("rc_cart") || "[]");
  }catch(e){
    return [];
  }
}

function saveCart(cart){
  localStorage.setItem("rc_cart", JSON.stringify(cart));
  updateCartBadge();
}

function updateCartBadge(){
  const cart = getCart();
  const total = cart.reduce((acc, item) => acc + Number(item.qty || 1), 0);
  const badge = document.getElementById('cartCountBadge');
  if(badge) badge.textContent = total;
}

function addToCart(){
  const quantity = getQty();
  if(quantity === null) return;

  const cart = getCart();
  const existing = cart.find(item => Number(item.id) === Number(product.id));

  if(existing){
    existing.qty = Math.min(Number(product.stock), Number(existing.qty || 0) + quantity);
  }else{
    cart.push({ id: product.id, qty: quantity });
  }

  saveCart(cart);

  const addBtn = document.getElementById('addToCartAction');
  const cartBox = document.getElementById('cartIconBox');
  if(addBtn && cartBox){
    const start = addBtn.getBoundingClientRect();
    const end = cartBox.getBoundingClientRect();

    const dot = document.createElement('div');
    dot.className = 'fly-item bg-brand text-white shadow-lg w-7 h-7 flex items-center justify-center';
    dot.style.left = `${start.left + start.width/2}px`;
    dot.style.top = `${start.top}px`;
    dot.innerHTML = `<i data-lucide="shopping-bag" class="w-3.5 h-3.5"></i>`;
    document.body.appendChild(dot);
    lucide.createIcons();

    requestAnimationFrame(() => {
      dot.style.left = `${end.left + 8}px`;
      dot.style.top = `${end.top + 8}px`;
      dot.style.transform = 'scale(0.3) rotate(360deg)';
      dot.style.opacity = '0.5';
    });

    setTimeout(() => {
      dot.remove();
      const badge = document.getElementById('cartCountBadge');
      badge.classList.add('animate-jiggle');
      setTimeout(() => badge.classList.remove('animate-jiggle'), 400);
      showToast('Added to Cart successfully!');
    }, 750);
  } else {
    showToast('Added to Cart!');
  }
}

function toggleWishlist(btn){
  isWishlisted = !isWishlisted;
  const icon = btn.querySelector('svg');
  if(isWishlisted){
    btn.classList.add('text-rose-500', 'border-rose-300');
    icon.classList.add('fill-current');
    showToast('Saved to Wishlist!');
  } else {
    btn.classList.remove('text-rose-500', 'border-rose-300');
    icon.classList.remove('fill-current');
  }
}

function copyShareLink(){
  navigator.clipboard.writeText(window.location.href);
  showToast('Link copied to clipboard!');
}

function showToast(msg){
  const toast = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  toast.classList.remove('translate-y-20', 'opacity-0');
  toast.classList.add('translate-y-0', 'opacity-100');
  setTimeout(() => {
    toast.classList.add('translate-y-20', 'opacity-0');
    toast.classList.remove('translate-y-0', 'opacity-100');
  }, 2500);
}

async function loadReviews(){
  const box = document.getElementById("reviews");
  if(!box) return;

  try{
    const { data, error } = await supabaseClient
      .from("product_reviews")
      .select("*")
      .eq("product_id", product.id)
      .order("created_at", {ascending:false});

    if(error || !data || !data.length){
      box.innerHTML = "<p class='text-xs text-slate-400 font-semibold'>No reviews yet for this product.</p>";
      return;
    }

    box.innerHTML = data.map(review => {
      const rating = Math.min(5, Math.max(1, Number(review.rating) || 1));
      let photosHtml = '';
      let urls = review.photo_urls;
      
      if (typeof urls === 'string') {
        try { urls = JSON.parse(urls); } catch(e) { urls = [urls]; }
      }

      if (Array.isArray(urls)) {
        photosHtml = urls.map(url => `
          <img src="${esc(url)}" 
               class="w-16 h-16 object-cover rounded-xl border border-slate-200 cursor-pointer flex-shrink-0 hover:opacity-90" 
               onclick="document.getElementById('modalImg').src='${esc(url)}'; document.getElementById('rcModal').classList.remove('hidden');" />
        `).join('');
      }

      return `
        <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100 space-y-2">
          <div class="flex items-center justify-between">
            <div class="text-amber-400 text-sm font-black">
              ${"★".repeat(rating)}${"☆".repeat(5 - rating)}
            </div>
            <span class="text-xs font-bold text-slate-700">${esc(review.customer_name || "Customer")}</span>
          </div>
          <p class="text-xs text-slate-600 leading-relaxed">${esc(review.review || "")}</p>
          ${photosHtml ? `<div class="flex gap-2 overflow-x-auto pt-1">${photosHtml}</div>` : ''}
        </div>
      `;
    }).join("");

  }catch(error){
    console.error(error);
    box.innerHTML = "<p class='text-xs text-slate-400'>Unable to load reviews.</p>";
  }
}
  
async function loadProduct(){
  if(typeof sbReady !== "function" || !sbReady()){
    productPage.innerHTML = "<p class='text-center py-10 font-bold text-rose-500'>Supabase is not configured.</p>";
    return;
  }

  const id = getProductId();
  if(!id){
    productPage.innerHTML = `
      <div class="text-center py-12">
        <h2 class="text-xl font-bold text-slate-900 mb-2">Product not found</h2>
        <a class="px-4 py-2 bg-brand text-white rounded-xl text-xs font-bold" href="index.html">Back to Shop</a>
      </div>
    `;
    return;
  }

  try{
    const { data, error } = await supabaseClient
      .from("products")
      .select("*")
      .eq("id", id)
      .eq("active", true)
      .single();

    if(error || !data){
      productPage.innerHTML = `
        <div class="text-center py-12">
          <h2 class="text-xl font-bold text-slate-900 mb-2">Product not found</h2>
          <a class="px-4 py-2 bg-brand text-white rounded-xl text-xs font-bold" href="index.html">Back to Shop</a>
        </div>
      `;
      return;
    }

    product = data;
    renderProduct();

  }catch(error){
    console.error(error);
    productPage.innerHTML = `
      <div class="text-center py-12">
        <h2 class="text-xl font-bold text-slate-900 mb-2">Unable to load product</h2>
        <a class="px-4 py-2 bg-brand text-white rounded-xl text-xs font-bold" href="index.html">Back to Shop</a>
      </div>
    `;
  }
}

loadProduct();
updateCartBadge();
</script>
