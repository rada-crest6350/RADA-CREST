<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RADA CREST | Ultra-Modern Product Experience</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary: #FF7A00;
      --primary-hover: #e06900;
      --primary-glow: rgba(255, 122, 0, 0.38);
      --primary-tint: rgba(255, 122, 0, 0.08);
      --bg-canvas: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #12151B;
      --text-muted: #64748B;
      --border-subtle: rgba(226, 232, 240, 0.85);
      --border-glass: rgba(255, 255, 255, 0.6);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 10px 25px -4px rgba(18, 21, 27, 0.06);
      --shadow-glow: 0 12px 28px -6px rgba(255, 122, 0, 0.4);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* --- Navigation Bar --- */
    .header-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(248, 250, 252, 0.82);
      border-bottom: 2px solid var(--primary);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(255, 122, 0, 0.7);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 122, 0, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 122, 0, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 122, 0, 0); }
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-admin {
      background: rgba(18, 21, 27, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 100px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s var(--ease-smooth);
    }

    .btn-admin:hover {
      background: var(--text-main);
      color: #fff;
    }

    .btn-cart {
      position: relative;
      background: #FFFFFF;
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s var(--ease-spring);
    }

    .btn-cart:hover {
      transform: scale(1.06);
    }

    .cart-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background: var(--primary);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
    }

    .cart-jiggle {
      animation: jiggle 0.4s var(--ease-spring);
    }

    @keyframes jiggle {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.25) rotate(-10deg); }
      75% { transform: scale(1.25) rotate(10deg); }
    }

    /* --- Main Showcase Layout --- */
    .container {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .product-showcase-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 36px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-subtle);
    }

    @media (max-width: 860px) {
      .product-showcase-grid {
        grid-template-columns: 1fr;
        padding: 20px;
        gap: 24px;
      }
    }

    /* --- Media Gallery (Left Side) --- */
    .gallery-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .main-viewport {
      position: relative;
      width: 100%;
      height: 440px;
      background: #F1F5F9;
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-in;
    }

    .main-viewport img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      transition: transform 0.4s var(--ease-smooth), opacity 0.3s ease;
    }

    .main-viewport.zoomed img {
      transform: scale(1.6);
      cursor: zoom-out;
    }

    .floating-pill {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 21, 27, 0.75);
      backdrop-filter: blur(8px);
      color: #FFFFFF;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.3px;
      animation: floatPill 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes floatPill {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -6px); }
    }

    .thumbnail-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .thumb-node {
      width: 72px;
      height: 72px;
      background: #F1F5F9;
      border-radius: var(--radius-sm);
      border: 2px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      transition: all 0.2s var(--ease-smooth);
    }

    .thumb-node img {
      width: 80%;
      height: 80%;
      object-fit: contain;
    }

    .thumb-node.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    /* --- Details Hub (Right Side) --- */
    .details-hub {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .tag-trending {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-tint);
      color: var(--primary);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 100px;
      width: fit-content;
    }

    .product-title {
      font-size: 1.85rem;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.6px;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin: 4px 0;
    }

    .current-price {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--primary);
      letter-spacing: -1px;
    }

    .mrp-price {
      font-size: 1.15rem;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .discount-badge {
      background: #DC2626;
      color: #FFFFFF;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 6px;
      animation: pulseBadge 2s infinite;
    }

    @keyframes pulseBadge {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.05); }
    }

    .admin-controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #F8FAFC;
      border: 1px dashed #CBD5E1;
      border-radius: var(--radius-sm);
      padding: 12px;
      font-size: 0.82rem;
    }

    .admin-attr-box b {
      color: var(--text-main);
    }

    .admin-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    /* Colour Picker */
    .color-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-label {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .swatches-wrap {
      display: flex;
      gap: 12px;
    }

    .swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s var(--ease-spring);
    }

    .swatch:hover {
      transform: scale(1.15);
    }

    .swatch.active::after {
      content: '';
      position: absolute;
      inset: -4px;
      border: 2px solid var(--primary);
      border-radius: 50%;
    }

    /* Size Selector */
    .size-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .size-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .size-pill {
      background: #FFFFFF;
      border: 1.5px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .size-pill.active {
      background: var(--text-main);
      color: #FFFFFF;
      border-color: var(--text-main);
    }

    .size-pill.free-size {
      background: var(--primary-tint);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* CTAs */
    .cta-group {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .btn-add-cart {
      flex: 1;
      position: relative;
      background: linear-gradient(135deg, #FF8A1E 0%, #FF6600 100%);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-md);
      padding: 16px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      overflow: hidden;
      box-shadow: var(--shadow-glow);
      transition: all 0.2s var(--ease-smooth);
    }

    .btn-add-cart:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px -4px rgba(255, 122, 0, 0.5);
    }

    .btn-add-cart::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      30%, 100% { left: 100%; }
    }

    .btn-icon-square {
      width: 54px;
      height: 54px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border-subtle);
      background: #FFFFFF;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s var(--ease-spring);
    }

    .btn-icon-square:hover {
      transform: scale(1.08);
      border-color: var(--text-muted);
    }

    .btn-wishlist.active {
      color: #DC2626;
      border-color: #FECACA;
      background: #FEF2F2;
      animation: elasticPop 0.4s var(--ease-spring);
    }

    @keyframes elasticPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    /* --- Interactive Information Hub --- */
    .info-hub {
      margin-top: 40px;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-subtle);
    }

    .tabs-header {
      display: flex;
      gap: 32px;
      border-bottom: 2px solid var(--border-subtle);
      position: relative;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 12px 0;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      transition: color 0.2s ease;
    }

    .tab-btn.active {
      color: var(--primary);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--primary);
    }

    .tab-panel {
      display: none;
      padding-top: 24px;
      animation: fadeIn 0.4s ease;
    }

    .tab-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Discovery Grids --- */
    .section-title-wrap {
      margin: 50px 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-heading {
      font-size: 1.3rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.3px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    @media (max-width: 900px) {
      .category-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .category-tile {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 20px;
      text-align: center;
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
      transition: all 0.3s var(--ease-smooth);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .category-tile:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary);
    }

    .cat-icon-wrap {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--primary-tint);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    .btn-tile-link {
      width: 100%;
      background: #F1F5F9;
      color: var(--text-main);
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      transition: all 0.2s ease;
    }

    .category-tile:hover .btn-tile-link {
      background: var(--primary);
      color: #FFFFFF;
    }

    /* Product Cards */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 60px;
    }

    @media (max-width: 860px) {
      .products-grid { grid-template-columns: 1fr; }
    }

    .recommend-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 16px;
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.3s var(--ease-smooth);
    }

    .recommend-card:hover {
      transform: translateY(-4px);
    }

    .card-img-wrap {
      width: 100%;
      height: 180px;
      background: #F1F5F9;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .card-img-wrap img {
      max-height: 80%;
      object-fit: contain;
    }

    .card-wish {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: color 0.2s ease;
    }

    .card-wish.active {
      color: #DC2626;
    }

    /* Toast Notification */
    .toast-box {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #12151B;
      color: #FFFFFF;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s var(--ease-spring);
      z-index: 2000;
    }

    .toast-box.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header class="header-nav">
    <a href="index.html" class="brand-wrap">
      <div class="pulse-dot"></div>
      <span>RADA CREST</span>
    </a>
    <div class="nav-actions">
      <a href="admin.html" class="btn-admin">
        <i class="fa-solid fa-bolt" style="color: var(--primary);"></i>
        <span>Admin Control</span>
      </a>
      <button class="btn-cart" id="cartBtn">
        <i class="fa-solid fa-cart-shopping"></i>
        <div class="cart-badge" id="cartCounter">0</div>
      </button>
    </div>
  </header>

  <main class="container">
    
    <!-- Main Product Showcase Core Screen -->
    <section class="product-showcase-grid">
      
      <!-- Left: Media Gallery -->
      <div class="gallery-container">
        <div class="main-viewport" id="mainViewport">
          <img id="mainProductImg" src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='300' height='300' viewBox='0 0 300 300'%3E%3Crect width='300' height='300' fill='%23F1F5F9'/%3E%3Ccircle cx='150' cy='150' r='90' fill='%23FF7A00' opacity='0.9'/%3E%3Cpath d='M150 90 L185 170 L115 170 Z' fill='%23FFFFFF'/%3E%3Ctext x='150' y='260' fill='%2312151B' font-family='sans-serif' font-size='16' font-weight='bold' text-anchor='middle'%3ENITRO ORANGE EDITION%3C/text%3E%3C/svg%3E" alt="Product Image" />
          <div class="floating-pill">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Tap to Zoom • Side Swatches</span>
          </div>
        </div>
        <div class="thumbnail-strip">
          <div class="thumb-node active" onclick="switchMedia(this, 'orange')">
            <img src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='80' height='80'%3E%3Ccircle cx='40' cy='40' r='30' fill='%23FF7A00'/%3E%3C/svg%3E" alt="Thumb 1" />
          </div>
          <div class="thumb-node" onclick="switchMedia(this, 'dark')">
            <img src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='80' height='80'%3E%3Ccircle cx='40' cy='40' r='30' fill='%2312151B'/%3E%3C/svg%3E" alt="Thumb 2" />
          </div>
          <div class="thumb-node" onclick="switchMedia(this, 'silver')">
            <img src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='80' height='80'%3E%3Ccircle cx='40' cy='40' r='30' fill='%2394A3B8'/%3E%3C/svg%3E" alt="Thumb 3" />
          </div>
        </div>
      </div>

      <!-- Right: Selection & Details Hub -->
      <div class="details-hub">
        <div class="tag-trending">
          <i class="fa-solid fa-fire"></i>
          <span>Trending Release</span>
        </div>

        <h1 class="product-title">Pulse X1 Pro Smart Adaptive Luminaire</h1>

        <div class="price-row">
          <span class="current-price">₹1,499</span>
          <span class="mrp-price">₹2,999</span>
          <span class="discount-badge">50% OFF</span>
        </div>

        <!-- Admin-Controlled Meta Box -->
        <div class="admin-controls-gri
