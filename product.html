<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Product Details | RADA CREST</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0b0d14; color: #ffffff; min-height: 100vh; padding-bottom: 90px; }
    
    .header {
      background: #12141a;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-title { color: #FF7A00; font-weight: 900; font-size: 1.1rem; text-decoration: none; }
    .nav-btn { color: #9ba1b0; text-decoration: none; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }

    .product-wrapper { max-width: 650px; margin: 15px auto; padding: 0 15px; }

    .media-card {
      background: #12141a;
      border-radius: 16px;
      padding: 15px;
      border: 1px solid rgba(255,255,255,0.08);
      position: relative;
    }
    .wish-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 38px;
      height: 38px;
      background: rgba(0,0,0,0.6);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
    }
    .wish-btn.active { color: #ff3366; }

    .main-img-box {
      width: 100%;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.02);
      border-radius: 12px;
      overflow: hidden;
    }
    .main-img-box img, .main-img-box video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .gallery-thumbs {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .gallery-thumbs img, .gallery-thumbs .video-btn {
      width: 55px;
      height: 55px;
      border-radius: 8px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid transparent;
      background: rgba(255,255,255,0.05);
      flex-shrink: 0;
    }
    .gallery-thumbs img.active { border-color: #FF7A00; }
    .gallery-thumbs .video-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FF7A00;
      font-size: 1.2rem;
    }

    .details-card {
      background: #12141a;
      border-radius: 16px;
      padding: 18px;
      margin-top: 15px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .prod-name { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
    .meta-row { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: #9ba1b0; margin-bottom: 12px; }
    .rating-tag { color: #FF7A00; font-weight: 700; }

    .price-box { display: flex; align-items: baseline; gap: 10px; margin: 12px 0; }
    .selling-price { font-size: 1.6rem; font-weight: 800; color: #FF7A00; }
    .mrp-price { font-size: 1rem; color: #9ba1b0; text-decoration: line-through; }
    .discount-pill { background: rgba(255,122,0,0.15); color: #FF7A00; padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; }

    .stock-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .in-stock { background: rgba(37,211,102,0.15); color: #25D366; }
    .low-stock { background: rgba(255,170,0,0.15); color: #FFAA00; }
    .out-stock { background: rgba(255,68,68,0.15); color: #FF4444; }

    .specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .spec-item { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; font-size: 0.8rem; color: #9ba1b0; }
    .spec-item b { display: block; color: #fff; font-size: 0.9rem; margin-top: 2px; }

    .qty-section { margin-top: 18px; }
    .qty-wrap { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
    .qty-btn { width: 36px; height: 36px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
    .qty-display { font-size: 1.1rem; font-weight: 700; min-width: 30px; text-align: center; }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #12141a;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 12px 20px;
      z-index: 100;
      max-width: 650px;
      margin: 0 auto;
    }
    .btn-buy {
      width: 100%;
      background: #FF7A00;
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="brand-title">RADA CREST</a>
    <a href="index.html" class="nav-btn"><i class="fa-solid fa-arrow-left"></i> Back to Store</a>
  </header>

  <div class="product-wrapper" id="productRoot">
    <div style="text-align:center; padding: 80px 0; color:#9ba1b0;">
      <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
      <p style="margin-top:12px;">Loading product details...</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ynpsnkvrjhaxdynmurzj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlucHNua3ZyamhheGR5bm11cnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNTc5NjAsImV4cCI6MjEwMTgzMzk2MH0.I3xFYthE0JNfGnD6N1BaNBybSq7m0G6MRILzq3NXihg';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    let currentQty = 1;
    let minOrderQty = 1;

    async function loadProduct() {
      const urlParams = new URLSearchParams(window.location.search);
      const rawId = urlParams.get('id');

      if (!rawId) {
        showError("Invalid Product URL");
        return;
      }

      let prod = null;

      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('products')
            .select('*')
            .eq('id', Number(rawId))
            .single();

          if (!error && data) {
            prod = data;
          }
        } catch (e) {
          console.warn("Supabase fetch error:", e);
        }
      }

      if (prod) {
        renderProduct(prod);
      } else {
        showError("Product Not Found");
      }
    }

    function renderProduct(p) {
      const root = document.getElementById('productRoot');
      minOrderQty = p.moq || 1;
      currentQty = minOrderQty;

      const hasDiscount = p.old_price && p.old_price > p.price;
      const discountPercent = hasDiscount ? Math.round(((p.old_price - p.price) / p.old_price) * 100) : null;

      const photoList = (p.images && p.images.length > 0) ? p.images : (p.image ? [p.image] : ['assets/placeholder.jpg']);

      let stockHtml = '';
      if (p.stock > 10) {
        stockHtml = `<span class="stock-badge in-stock"><i class="fa-solid fa-check"></i> In Stock (${p.stock} units)</span>`;
      } else if (p.stock > 0) {
        stockHtml = `<span class="stock-badge low-stock"><i class="fa-solid fa-clock"></i> Only ${p.stock} left in stock</span>`;
      } else {
        stockHtml = `<span class="stock-badge out-stock"><i class="fa-solid fa-ban"></i> Out of Stock</span>`;
      }

      let warrantyHtml = p.has_warranty ? `<div class="spec-item">Warranty<b>1 Year Replacement</b></div>` : '';
      let sizeHtml = `<div class="spec-item">Size<b>${(p.size && p.size.trim() !== '') ? p.size : 'Free Size'}</b></div>`;
      let colorHtml = (p.colors && p.colors.trim() !== '') ? `<div class="spec-item">Colors<b>${p.colors}</b></div>` : '';

      root.innerHTML = `
        <div class="media-card">
          <button class="wish-btn" id="wishBtn" onclick="toggleWishlist('${p.id}')">
            <i class="fa-regular fa-heart"></i>
          </button>
          
          <div class="main-img-box" id="mainDisplay">
            <img src="${photoList[0]}" id="mainImg" alt="${p.name}" />
          </div>

          <div class="gallery-thumbs">
            ${photoList.map((img, idx) => `
              <img src="${img}" class="${idx === 0 ? 'active' : ''}" onclick="switchMedia('${img}', this)" />
            `).join('')}
            ${p.video ? `
              <div class="video-btn" onclick="switchVideo('${p.video}')">
                <i class="fa-solid fa-play"></i>
              </div>
            ` : ''}
          </div>
        </div>

        <div class="details-card">
          <h1 class="prod-name">${p.name}</h1>
          
          <div class="meta-row">
            <span class="rating-tag"><i class="fa-solid fa-star"></i> ${p.rating || '5.0'}</span>
            <span>•</span>
            <span>${p.sales_count || 0} Orders placed</span>
          </div>

          ${stockHtml}

          <div class="price-box">
            <span class="selling-price">₹${p.price}</span>
            ${hasDiscount ? `<span class="mrp-price">₹${p.old_price}</span>` : ''}
            ${hasDiscount ? `<span class="discount-pill">${discountPercent}% OFF</span>` : ''}
          </div>

          <div class="specs-grid">
            ${sizeHtml}
            ${warrantyHtml}
            ${colorHtml}
            <div class="spec-item">Min Order Qty<b>${minOrderQty} Piece</b></div>
          </div>

          <div class="qty-section">
            <label style="font-size:0.85rem; color:#9ba1b0;">Select Quantity</label>
            <div class="qty-wrap">
              <button class="qty-btn" onclick="updateQty(-1)">-</button>
              <span class="qty-display" id="qtyDisplay">${currentQty}</span>
              <button class="qty-btn" onclick="updateQty(1)">+</button>
            </div>
          </div>
        </div>

        <div class="bottom-bar">
          <button class="btn-buy" onclick="goToBuyPage('${p.id}')">
            <i class="fa-solid fa-bolt"></i> Buy Now
          </button>
        </div>
      `;

      checkWishlistStatus(p.id);
    }

    function switchMedia(src, el) {
      document.getElementById('mainDisplay').innerHTML = `<img src="${src}" id="mainImg" />`;
      document.querySelectorAll('.gallery-thumbs img').forEach(i => i.classList.remove('active'));
      if (el) el.classList.add('active');
    }

    function switchVideo(videoUrl) {
      document.getElementById('mainDisplay').innerHTML = `
        <video controls autoplay style="width:100%; height:100%; object-fit:contain; border-radius:12px;">
          <source src="${videoUrl}" type="video/mp4">
        </video>
      `;
    }

    function updateQty(change) {
      if (currentQty + change >= minOrderQty) {
        currentQty += change;
        document.getElementById('qtyDisplay').innerText = currentQty;
      }
    }

    function goToBuyPage(productId) {
      window.location.href = `buy.html?id=${encodeURIComponent(productId)}&qty=${currentQty}`;
    }

    function toggleWishlist(productId) {
      let wishlist = JSON.parse(localStorage.getItem('rc_wishlist')) || [];
      const btn = document.getElementById('wishBtn');
      const icon = btn.querySelector('i');

      if (wishlist.includes(productId)) {
        wishlist = wishlist.filter(id => id !== productId);
        icon.className = 'fa-regular fa-heart';
        btn.classList.remove('active');
      } else {
        wishlist.push(productId);
        icon.className = 'fa-solid fa-heart';
        btn.classList.add('active');
      }
      localStorage.setItem('rc_wishlist', JSON.stringify(wishlist));
    }

    function checkWishlistStatus(productId) {
      const wishlist = JSON.parse(localStorage.getItem('rc_wishlist')) || [];
      const btn = document.getElementById('wishBtn');
      if (wishlist.includes(productId) && btn) {
        btn.querySelector('i').className = 'fa-solid fa-heart';
        btn.classList.add('active');
      }
    }

    function showError(msg) {
      document.getElementById('productRoot').innerHTML = `
        <div style="text-align:center; padding: 60px 20px; color:#fff;">
          <h2>${msg}</h2>
          <p style="color:#9ba1b0; margin: 10px 0 20px;">Could not load item details from database.</p>
          <a href="index.html" style="color:#FF7A00; text-decoration:none; font-weight:700;">← Return to Store</a>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', loadProduct);
  </script>
</body>
</html>
