<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RADA CREST | Next-Gen AI & Tech Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-bg: #05070A;
      --surface-1: rgba(15, 19, 26, 0.7);
      --surface-2: rgba(26, 32, 44, 0.7);
      --surface-border: rgba(255, 122, 0, 0.18);
      --accent: #FF7A00;
      --accent-glow: rgba(255, 122, 0, 0.45);
      --accent-soft: rgba(255, 122, 0, 0.12);
      --cyber-blue: #00E5FF;
      --text-main: #F4F6F8;
      --text-muted: #8E9BAE;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;
      --transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--primary-bg);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* REAL-TIME MATRIX / PARTICLE CANVAS */
    #techCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.65;
    }

    /* REAL-TIME PULSING ORBS */
    .orb-light {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 1;
      animation: floatOrb 10s infinite alternate ease-in-out;
    }
    .orb-1 {
      top: -80px;
      left: 15%;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
      opacity: 0.28;
    }
    .orb-2 {
      bottom: 20%;
      right: -50px;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, var(--cyber-blue) 0%, transparent 70%);
      opacity: 0.15;
      animation-duration: 14s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, 60px) scale(1.15); }
      100% { transform: translate(-30px, 30px) scale(0.95); }
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
      position: relative;
      z-index: 2;
    }

    /* HEADER */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 7, 10, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--surface-border);
    }

    .header-inner {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-logo {
      height: 32px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }

    .brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      background: linear-gradient(135deg, #FFFFFF 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 122, 0, 0.3);
    }

    .quick-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-1);
      border: 1px solid var(--surface-border);
      padding: 7px 14px;
      border-radius: var(--radius-full);
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      transition: var(--transition);
      backdrop-filter: blur(10px);
    }

    .nav-chip:hover {
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
      transform: translateY(-1px);
    }

    .nav-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-full);
      background: var(--surface-1);
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      position: relative;
      transition: var(--transition);
    }

    .nav-icon-btn:hover {
      border-color: var(--accent);
      transform: scale(1.08);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background: var(--accent);
      color: #000;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: var(--radius-full);
      animation: pulseBadge 2s infinite ease-in-out;
    }

    @keyframes pulseBadge {
      0%, 100% { transform: scale(1); box-shadow: 0 0 4px var(--accent); }
      50% { transform: scale(1.15); box-shadow: 0 0 14px var(--accent); }
    }

    .text-accent { color: var(--accent); }

    /* REAL-TIME SCANNER ADDRESS BAR */
    .address-strip {
      margin-top: 14px;
      background: linear-gradient(135deg, rgba(26, 32, 44, 0.7) 0%, rgba(255, 122, 0, 0.12) 100%);
      border: 1px solid var(--surface-border);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
    }

    .address-strip::after {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 122, 0, 0.18), transparent);
      animation: lightSweep 4s infinite linear;
    }

    @keyframes lightSweep {
      0% { left: -150%; }
      100% { left: 150%; }
    }

    .address-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .address-text .caption {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .address-text .loc-summary {
      font-size: 0.85rem;
      font-weight: 700;
    }

    .btn-edit-addr {
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* SMART SEARCH BAR */
    .search-panel {
      position: relative;
      margin-top: 14px;
    }

    .search-bar-wrapper {
      display: flex;
      align-items: center;
      background: var(--surface-1);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: 6px 10px 6px 16px;
      transition: var(--transition);
      backdrop-filter: blur(20px);
    }

    .search-bar-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 24px var(--accent-glow);
      transform: translateY(-1px);
    }

    #smartSearchInput {
      flex: 1;
      background: transparent;
      border: none;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .search-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .search-tool-btn {
      background: var(--surface-2);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .search-tool-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* SLIDER MODULE WITH NEON SCAN BARS */
    .slider-module {
      margin-top: 18px;
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--surface-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    .carousel-track {
      display: flex;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .banner-slide {
      min-width: 100%;
      aspect-ratio: 16 / 7;
      background: var(--surface-2);
      cursor: pointer;
      position: relative;
    }

    .banner-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .slider-dots {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      transition: var(--transition);
    }

    .dot.active {
      width: 22px;
      border-radius: var(--radius-full);
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    /* SECTIONS & CYBER HEADERS */
    .section-block { margin-top: 28px; }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-head h2 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: livePulse 1.5s infinite;
    }

    @keyframes livePulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }

    /* CATEGORIES WITH HUD GLOW */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .category-card {
      background: var(--surface-1);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 14px 8px;
      text-align: center;
      cursor: pointer;
      backdrop-filter: blur(14px);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .category-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.8), 0 0 20px var(--accent-glow);
    }

    .cat-icon-wrap {
      color: var(--accent);
      font-size: 1.3rem;
      margin-bottom: 8px;
      transition: transform 0.3s ease;
    }

    .category-card:hover .cat-icon-wrap {
      transform: scale(1.2);
    }

    .category-card span { font-size: 0.75rem; font-weight: 700; }

    /* PRODUCT CARDS (HIGH-TECH 3D HOVER) */
    .products-horizontal-scroll {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 6px 2px 14px;
    }
    .products-horizontal-scroll::-webkit-scrollbar { display: none; }

    .product-card {
      background: var(--surface-1);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 12px;
      min-width: 160px;
      max-width: 180px;
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(16px);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (min-width: 768px) {
      .products-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .products-grid .product-card { min-width: 0; max-width: none; }

    .product-card:hover {
      border-color: var(--accent);
      transform: translateY(-6px);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.9), 0 0 20px var(--accent-glow);
    }

    .product-img-box {
      aspect-ratio: 1/1;
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-bottom: 10px;
      position: relative;
    }

    .product-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .product-card:hover .product-img-box img {
      transform: scale(1.08);
    }

    .product-title {
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 2.3em;
      margin-bottom: 8px;
    }

    .current-price {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent);
    }

    .old-price {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-decoration: line-through;
      margin-left: 6px;
    }

    .filter-toolbar select {
      background: var(--surface-1);
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      outline: none;
      backdrop-filter: blur(10px);
    }

    /* FOOTER */
    .app-footer {
      margin-top: 48px;
      background: #030406;
      border-top: 1px solid var(--surface-border);
      padding: 30px 0;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND REAL-TIME PARTICLES & CYBER GLOW -->
  <canvas id="techCanvas"></canvas>
  <div class="orb-light orb-1"></div>
  <div class="orb-light orb-2"></div>

  <!-- HEADER -->
  <header class="app-header">
    <div class="header-inner container">
      <div class="brand-block" onclick="location.href='index.html'">
        <img id="storeLogo" src="assets/logo.png" alt="Rada Crest" class="brand-logo" onerror="this.style.display='none'">
        <span class="brand-name" id="storeName">RADA CREST</span>
      </div>
      <nav class="quick-nav">
        <a href="help.html" class="nav-chip"><i class="fa-regular fa-circle-question"></i> Help</a>
        <a href="referral.html" class="nav-chip"><i class="fa-solid fa-gift text-accent"></i> Refer</a>
        <a href="cart.html" class="nav-icon-btn"><i class="fa-solid fa-bag-shopping"></i><span class="badge" id="cartCountBadge">0</span></a>
        <a href="account.html" class="nav-icon-btn"><i class="fa-regular fa-user"></i></a>
      </nav>
    </div>
  </header>

  <main class="main-content container">
    <!-- SCANNER ADDRESS BAR -->
    <section class="address-strip" onclick="location.href='address.html'">
      <div class="address-meta">
        <i class="fa-solid fa-location-dot text-accent" style="font-size: 1.1rem;"></i>
        <div class="address-text">
          <div class="caption">Deliver to: <strong id="userFullName">Customer</strong></div>
          <div class="loc-summary" id="userAddressLine">Add delivery address</div>
        </div>
      </div>
      <button class="btn-edit-addr">Edit <i class="fa-solid fa-chevron-right"></i></button>
    </section>

    <!-- SMART SEARCH -->
    <section class="search-panel">
      <div class="search-bar-wrapper">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
        <input type="search" id="smartSearchInput" placeholder="Search smart LED, inverter bulb, charger..." autocomplete="off">
        <div class="search-actions">
          <button type="button" class="search-tool-btn" id="voiceSearchBtn"><i class="fa-solid fa-microphone"></i></button>
          <button type="button" class="search-tool-btn" id="photoSearchBtn"><i class="fa-solid fa-camera"></i></button>
        </div>
      </div>
      <input type="file" id="photoInput" accept="image/*" style="display: none;">
    </section>

    <!-- BANNER CAROUSEL -->
    <section class="slider-module" id="bannerModule">
      <div class="carousel-track" id="bannerTrack"></div>
      <div class="slider-dots" id="bannerDots"></div>
    </section>

    <!-- CATEGORIES -->
    <section class="section-block">
      <div class="section-head">
        <h2><div class="live-dot"></div> Shop Categories</h2>
      </div>
      <div class="categories-grid" id="categoriesContainer"></div>
    </section>

    <!-- SUGGESTED PRODUCTS -->
    <section class="section-block" id="suggestedSection">
      <div class="section-head">
        <h2><div class="live-dot"></div> Suggested for You</h2>
      </div>
      <div class="products-horizontal-scroll" id="suggestedContainer"></div>
    </section>

    <!-- TRENDING PRODUCTS -->
    <section class="section-block" id="trendingSection">
      <div class="section-head">
        <h2><div class="live-dot"></div> Trending Tech</h2>
      </div>
      <div class="products-horizontal-scroll" id="trendingContainer"></div>
    </section>

    <!-- ALL PRODUCTS -->
    <section class="section-block">
      <div class="section-head" style="flex-wrap: wrap; gap: 8px;">
        <h2><div class="live-dot"></div> All Inventory</h2>
        <div class="filter-toolbar">
          <select id="priceFilter">
            <option value="default">Sort: Default</option>
            <option value="low-high">Price: Low to High</option>
            <option value="high-low">Price: High to Low</option>
          </select>
        </div>
      </div>
      <div class="products-grid" id="allProductsGrid"></div>
    </section>
  </main>

  <footer class="app-footer container">
    <div style="margin-bottom: 12px;">
      <a href="terms.html" style="color: var(--accent); text-decoration: none; margin-right: 14px;">Terms & Conditions</a>
      <a href="help.html" style="color: var(--text-muted); text-decoration: none;">Help Support</a>
    </div>
    <div>&copy; 2026 RADA CREST. All rights reserved.</div>
  </footer>

  <!-- CONFIG FILE INCLUDED SAFELY -->
  <script src="config.js" onerror="console.log('config.js optional')"></script>

  <script>
    // ==========================================
    // 1. DATA CONFIGURATION (KHALI / EDITABLE)
    // ==========================================
    const storeData = {
      // Banners: Agar nahi ho to array [] khali rahega
      banners: [
        { img: "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=1200&q=80", link: "category.html?id=led" }
      ],
      categories: [
        { id: "led", name: "LED", icon: "fa-lightbulb" },
        { id: "chargers", name: "Chargers", icon: "fa-bolt" },
        { id: "boards", name: "Boards", icon: "fa-plug" },
        { id: "cables", name: "Cables", icon: "fa-network-wired" }
      ],
      // Products: Real product add karne ke liye yahan update karein
      products: []
    };

    // ==========================================
    // 2. REAL-TIME CYBER BACKGROUND ANIMATION ENGINE
    // ==========================================
    function initMatrixCanvas() {
      const canvas = document.getElementById("techCanvas");
      const ctx = canvas.getContext("2d");
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;

      window.addEventListener("resize", () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      const particles = Array.from({ length: 35 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        size: Math.random() * 2 + 1
      }));
