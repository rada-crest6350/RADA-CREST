<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Cart — RADA CREST</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>

<style>

.checkout-box{
  max-width:650px;
  margin:30px auto;
  padding:25px;
  border:1px solid #ddd;
  border-radius:18px;
}

.checkout-box input,
.checkout-box textarea{
  width:100%;
  padding:13px;
  margin:7px 0 15px;
  border:1px solid #ccc;
  border-radius:10px;
  box-sizing:border-box;
}

.checkout-box textarea{
  min-height:100px;
  resize:vertical;
}

.cart-item{
  display:flex;
  align-items:center;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid #ddd;
}

.cart-item img{
  width:80px;
  height:80px;
  object-fit:contain;
  border-radius:10px;
}

.cart-item-info{
  flex:1;
}

.qty-box{
  display:flex;
  align-items:center;
  gap:8px;
}

.qty-box button{
  width:32px;
  height:32px;
  border:1px solid #ccc;
  border-radius:7px;
  background:#fff;
  cursor:pointer;
}

.remove-btn{
  border:0;
  background:none;
  cursor:pointer;
  color:#d33;
}

.total-box{
  display:flex;
  justify-content:space-between;
  font-size:20px;
  margin:25px 0;
}

</style>

</head>


<body>

<main class="section">

<a href="index.html">
← Continue Shopping
</a>

<h1>
Your Cart
</h1>


<div id="cart">

<p>
Loading cart...
</p>

</div>


<div
  id="checkout"
  class="checkout-box"
  style="display:none"
>

<h2>
Delivery Details
</h2>

<p>
Enter your details to place the order.
</p>


<label>
Full Name
</label>

<input
  id="customerName"
  type="text"
  autocomplete="name"
  placeholder="Your full name"
>


<label>
Mobile Number
</label>

<input
  id="customerPhone"
  type="tel"
  inputmode="numeric"
  maxlength="10"
  placeholder="10-digit mobile number"
>


<label>
Delivery Address
</label>

<textarea
  id="customerAddress"
  placeholder="House / Village / City / State / PIN code"
></textarea>


<button
  id="orderBtn"
  class="btn full"
  type="button"
  onclick="placeOrder()"
>
Place Order on WhatsApp
</button>


<p
  id="checkoutMsg"
  class="msg"
></p>

</div>

</main>


<script>

let cartProducts = [];

let cartTotal = 0;


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function getCart(){

  try{

    return JSON.parse(
      localStorage.getItem("rc_cart") || "[]"
    );

  }catch{

    return [];

  }

}


function saveCart(cart){

  localStorage.setItem(
    "rc_cart",
    JSON.stringify(cart)
  );

}


function getImages(url){

  if(!url) return [];

  return String(url)
    .split(/[\n,]+/)
    .map(x => x.trim())
    .filter(Boolean);

}


async function render(){

  const cart =
    getCart();

  const cartBox =
    document.getElementById("cart");

  const checkout =
    document.getElementById("checkout");


  if(!cart.length){

    cartBox.innerHTML = `
      <div style="padding:30px 0">
        <h2>Your cart is empty.</h2>

        <a
          class="btn"
          href="index.html"
        >
          Shop Products
        </a>
      </div>
    `;

    checkout.style.display =
      "none";

    return;

  }


  if(!sbReady()){

    cartBox.innerHTML =
      "<p>Supabase configuration is missing.</p>";

    return;

  }


  const ids =
    cart.map(
      item => item.id
    );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select("*")
      .in("id",ids)
      .eq("active",true);


  if(error){

    cartBox.innerHTML =
      `<p>${escapeHtml(error.message)}</p>`;

    return;

  }


  cartProducts =
    data || [];


  if(!cartProducts.length){

    cartBox.innerHTML =
      "<p>Your cart is empty.</p>";

    checkout.style.display =
      "none";

    return;

  }


  cartTotal = 0;


  let html = "";


  cartProducts.forEach(product => {

    const item =
      cart.find(
        x =>
          Number(x.id) ===
          Number(product.id)
      );


    if(!item) return;


    let quantity =
      Number(item.qty || 1);


    const stock =
      Number(product.stock || 0);


    if(stock > 0){

      quantity =
        Math.min(
          quantity,
          stock
        );

    }


    const subtotal =
      Number(product.price || 0) *
      quantity;


    cartTotal += subtotal;


    const images =
      getImages(
        product.image_url
      );


    const image =
      images.length
        ? images[0]
        : "";


    html += `

      <div class="cart-item">

        <div>

          ${
            image

            ?

            `<img
              src="${escapeHtml(image)}"
              alt="${escapeHtml(product.name)}"
            >`

            :

            `<div
              style="
                width:80px;
                height:80px;
                display:grid;
                place-items:center;
                font-size:40px;
              "
            >
              💡
            </div>`
          }

        </div>


        <div class="cart-item-info">

          <b>
            ${escapeHtml(product.name)}
          </b>

          <small>
            ₹${Number(product.price || 0)
              .toLocaleString("en-IN")}
          </small>

          <div class="qty-box">

            <button
              type="button"
              onclick="changeQty(${product.id},-1)"
            >
              −
            </button>

            <strong>
              ${quantity}
            </strong>

            <button
              type="button"
              onclick="changeQty(${product.id},1)"
            >
              +
            </button>

          </div>

        </div>


        <div>

          <strong>
            ₹${subtotal.toLocaleString("en-IN")}
          </strong>

          <br>

          <button
            class="remove-btn"
            type="button"
            onclick="removeItem(${product.id})"
          >
            Remove
          </button>

        </div>

      </div>

    `;

  });


  html += `

    <div class="total-box">

      <b>
        Total
      </b>

      <b>
        ₹${cartTotal.toLocaleString("en-IN")}
      </b>

    </div>

  `;


  cartBox.innerHTML =
    html;


  checkout.style.display =
    "block";


  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if(user){

    const {
      data: profile
    } =
      await supabaseClient
        .from("profiles")
        .select("full_name")
        .eq("id",user.id)
        .maybeSingle();


    if(profile?.full_name){

      document.getElementById(
        "customerName"
      ).value =
        profile.full_name;

    }

  }

}


function changeQty(id,difference){

  const cart =
    getCart();


  const item =
    cart.find(
      x =>
        Number(x.id) ===
        Number(id)
    );


  if(!item) return;


  item.qty =
    Number(item.qty) +
    difference;


  if(item.qty <= 0){

    const index =
      cart.indexOf(item);

    cart.splice(
      index,
      1
    );

  }


  saveCart(cart);

  render();

}


function removeItem(id){

  const cart =
    getCart()
      .filter(
        x =>
          Number(x.id) !==
          Number(id)
      );


  saveCart(cart);

  render();

}


async function placeOrder(){

  const msg =
    document.getElementById(
      "checkoutMsg"
    );

  const button =
    document.getElementById(
      "orderBtn"
    );


  if(!cartProducts.length){

    msg.textContent =
      "Your cart is empty.";

    return;

  }


  const {
    data: {
      user
    }
  } =
    await supabaseClient
      .auth
      .getUser();


  if(!user){

    window.location.href =
      "account.html?redirect=cart.html";

    return;

  }


  const name =
    document.getElementById(
      "customerName"
    ).value.trim();


  const phone =
    document.getElementById(
      "customerPhone"
    ).value
      .replace(/\D/g,"");


  const address =
    document.getElementById(
      "customerAddress"
    ).value.trim();


  if(!name){

    msg.textContent =
      "Please enter your full name.";

    return;

  }


  if(!/^[0-9]{10}$/.test(phone)){

    msg.textContent =
      "Please enter a valid 10-digit mobile number.";

    return;

  }


  if(address.length < 10){

    msg.textContent =
      "Please enter your complete delivery address.";

    return;

  }


  button.disabled =
    true;

  msg.textContent =
    "Creating your order...";


  try{


    /*
      1. CREATE ORDER
    */

    const {
      data: order,
      error: orderError
    } =
      await supabaseClient
        .from("orders")
        .insert({

          customer_id:
            user.id,

          customer_name:
            name,

          customer_phone:
            phone,

          customer_email:
            user.email || null,

          total_amount:
            cartTotal,

          status:
            "pending",

          payment_status:
            "pending",

          shipping_address:
            address

        })
        .select()
        .single();


    if(orderError){

      throw orderError;

    }


    /*
      2. CREATE ORDER ITEMS
    */


    const cart =
      getCart();


    const orderItems =
      cartProducts.map(
        product => {

          const item =
            cart.find(
              x =>
                Number(x.id) ===
                Number(product.id)
            );


          return {

            order_id:
              order.id,

            product_id:
              product.id,

            product_name:
              product.name,

            quantity:
              Number(
                item?.qty || 1
              ),

            price:
              Number(
                product.price || 0
              )

          };

        }
      );


    const {
      error: itemError
    } =
      await supabaseClient
        .from("order_items")
        .insert(
          orderItems
        );


    if(itemError){

      throw itemError;

    }


    /*
      3. CREATE WHATSAPP MESSAGE
    */


    let productText =
      "";


    cartProducts.forEach(
      product => {

        const item =
          cart.find(
            x =>
              Number(x.id) ===
              Number(product.id)
          );


        const qty =
          Number(
            item?.qty || 1
          );


        productText +=

          `${product.name} × ${qty} = ₹${(
            Number(product.price || 0) *
            qty
          ).toLocaleString("en-IN")}\n`;

      }
    );


    const message =

`RADA CREST — NEW ORDER

Order ID: #${order.id}

PRODUCTS
${productText}

TOTAL
₹${cartTotal.toLocaleString("en-IN")}

CUSTOMER
${name}

MOBILE
${phone}

EMAIL
${user.email || "Not provided"}

DELIVERY ADDRESS
${address}

PAYMENT
Cash on Delivery

ORDER STATUS
Pending Confirmation`;


    /*
      4. CLEAR CART
    */

    localStorage.removeItem(
      "rc_cart"
    );


    /*
      5. OPEN WHATSAPP
    */

    const whatsappUrl =
      "https://wa.me/919079714767?text=" +
      encodeURIComponent(
        message
      );


    msg.style.color =
      "#1b8a3a";

    msg.textContent =
      "Order created. Opening WhatsApp...";


    setTimeout(
      function(){

        window.location.href =
          whatsappUrl;

      },
      500
    );


  }catch(error){

    console.error(error);


    msg.style.color =
      "#d33";

    msg.textContent =
      "Order failed: " +
      (
        error.message ||
        "Please try again."
      );


    button.disabled =
      false;

  }

}


render();

</script>

</body>
</html>
