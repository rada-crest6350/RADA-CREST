<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart — RADA CREST</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script></head><body><main class="section"><a href="index.html">← Continue Shopping</a><h1>Your Cart</h1><div id="cart"></div></main><script>
function getCart(){return JSON.parse(localStorage.getItem('rc_cart')||'[]')}async function render(){let c=getCart();if(!c.length)return cart.innerHTML='<p>Your cart is empty.</p>';let ids=c.map(x=>x.id);let {data,error}=await supabaseClient.from('products').select('*').in('id',ids);if(error)return cart.textContent=error.message;let total=0;cart.innerHTML=data.map(p=>{let q=c.find(x=>x.id===p.id).qty,v=p.price*q;total+=v;return `<div class="cart-row"><span>💡</span><div><b>${p.name}</b><small>₹${p.price} × ${q}</small></div><strong>₹${v}</strong></div>`}).join('')+`<div class="total"><b>Total</b><b>₹${total}</b></div><button class="btn full" onclick="checkout(${total})">Proceed to Checkout</button>`}
async function checkout(total){const {data:{user}}=await supabaseClient.auth.getUser();if(!user){alert('Please login first.');return location.href='account.html'}alert('Secure order creation is ready for the next step: shipping address + COD/online payment.');}render();
</script></body></html>
