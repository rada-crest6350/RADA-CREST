<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart | Rada Crest</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #FF7A00;
            --primary-glow: rgba(255, 122, 0, 0.35);
            --bg-dark: #0b0d14;
            --card-bg: rgba(18, 20, 26, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #9ba1b0;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(255, 122, 0, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 90% 85%, rgba(255, 122, 0, 0.04) 0%, transparent 45%);
            background-attachment: fixed;
            padding-bottom: 50px;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Header */
        .header-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--primary);
            color: #000;
            transform: translateX(-3px);
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .header-title {
            font-size: 1.35rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-badge {
            background: var(--primary-glow);
            color: var(--primary);
            border: 1px solid var(--border-color);
            font-size: 0.8rem;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 700;
        }

        .select-all-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
        }

        /* Delivery Address */
        .address-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 20px;
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            text-decoration: none;
        }

        .address-info {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .addr-icon {
            color: var(--primary);
            font-size: 1.3rem;
            margin-top: 2px;
        }

        .addr-text h4 {
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 3px;
            font-weight: 700;
        }

        .addr-text p {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .addr-edit-btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .addr-edit-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 12px var(--primary-glow);
        }

        /* Grid */
        .cart-layout {
            display: grid;
            grid-template-columns: 1.85fr 1.15fr;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 860px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .cart-item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 16px;
            backdrop-filter: blur(12px);
            display: grid;
            grid-template-columns: 24px 90px 1fr;
            gap: 16px;
            align-items: center;
            position: relative;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cart-item-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 122, 0, 0.12);
        }

        .cart-item-card.removing {
            transform: scale(0.9) translateX(40px);
            opacity: 0;
        }

        .custom-checkbox {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .custom-checkbox:checked {
            background: var(--primary);
            border-color: var(--primary);
        }

        .custom-checkbox:checked::after {
            content: '✔';
            position: absolute;
            color: #000;
            font-size: 13px;
            font-weight: 900;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .prod-img-wrap {
            width: 90px;
            height: 90px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .prod-img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .prod-details {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .prod-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .prod-spec {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .stock-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--warning);
            background: rgba(245, 158, 11, 0.12);
            padding: 3px 8px;
            border-radius: 6px;
            width: fit-content;
        }

        .price-section {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-top: 4px;
        }

        .current-price {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--primary);
        }

        .old-price {
            font-size: 0.85rem;
            color: #64748b;
            text-decoration: line-through;
        }

        .discount-tag {
            font-size: 0.75rem;
            color: var(--success);
            font-weight: 700;
        }

        .prod-bottom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .qty-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .qty-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            width: 32px;
            height: 32px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .qty-btn:hover {
            background: var(--primary);
            color: #000;
        }

        .qty-value {
            width: 38px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 800;
        }

        .action-links {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .act-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }

        .act-btn:hover {
            color: var(--primary);
        }

        .act-btn.delete:hover {
            color: var(--danger);
        }

        /* Price Breakdown */
        .total-board {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            position: sticky;
            top: 20px;
        }

        .board-title {
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            font-size: 0.92rem;
            color: var(--text-muted);
        }

        .summary-line span:last-child {
            color: var(--text-main);
            font-weight: 700;
        }

        .grand-total-row {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px dashed var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .grand-total-row .lbl {
            font-size: 1.05rem;
            font-weight: 800;
        }

        .grand-total-row .val {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 15px var(--primary-glow);
        }

        .buy-now-btn {
            width: 100%;
            background: linear-gradient(135deg, #FF7A00 0%, #ff5500 100%);
            border: none;
            color: #000;
            padding: 16px;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 900;
            cursor: pointer;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            box-shadow: 0 6px 25px var(--primary-glow);
        }

        .buy-now-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 35px rgba(255, 122, 0, 0.45);
        }

        .order-suggest {
            margin-top: 14px;
            font-size: 0.82rem;
            text-align: center;
            color: #ff9b44;
            background: rgba(255, 122, 0, 0.08);
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Footer */
        .policy-footer {
            margin-top: 45px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        .policy-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 12px;
        }

        .policy-links a {
            color: var(--text-muted);
            font-size: 0.82rem;
            text-decoration: none;
            transition: 0.2s;
        }

        .policy-links a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .copyright-text {
            font-size: 0.75rem;
            color: #64748b;
        }

        .toast-notify {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #12151B;
            color: #fff;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid var(--primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .toast-notify.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header-nav">
        <div class="header-left">
            <a href="index.html" class="back-btn" title="Go Back">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="header-title">
                My Cart <span class="cart-badge" id="headerCount">0 Items</span>
            </div>
        </div>
        <label class="select-all-box">
            <input type="checkbox" id="selectAll" class="custom-checkbox" checked onchange="toggleSelectAll()">
            <span>Select All</span>
        </label>
    </div>

    <!-- Address Link -->
    <div class="address-card">
        <div class="address-info">
            <i class="fa-solid fa-location-dot addr-icon"></i>
            <div class="addr-text">
                <h4 id="displayUserName"/h4>
                <p id="displayAddress"/p>
            </div>
        </div>
        <a href="addresses.html" class="addr-edit-btn">
            <i class="fa-solid fa-pen-to-square"></i> Change / Edit
        </a>
    </div>

    <!-- Main Layout -->
    <div class="cart-layout">
        <div class="product-list" id="productListContainer"></div>

        <div class="total-board">
            <div class="board-title">
                <i class="fa-solid fa-receipt" style="color: var(--primary);"></i> Price Breakdown
            </div>

            <div class="summary-line">
                <span>Total (<span id="selectedCountText">0</span> items selected)</span>
                <span id="subtotalVal">₹0</span>
            </div>

            <div class="summary-line">
                <span>Discount</span>
                <span id="discountVal" style="color: var(--success);">-₹0</span>
            </div>

            <div class="summary-line">
                <span>Delivery Charge</span>
                <span id="deliveryVal" style="color: var(--success);">FREE</span>
            </div>

            <div class="grand-total-row">
                <span class="lbl">Final Payment</span>
                <span class="val" id="grandTotalVal">₹0</span>
            </div>

            <div class="order-suggest">
                <i class="fa-solid fa-shield-check"></i> 100% Genuine Quality Guaranteed
            </div>

            <button class="buy-now-btn" onclick="proceedToBuy()">
                Buy Now / Place Order <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="policy-footer">
        <div class="policy-links">
            <a href="terms.html">Terms & Conditions</a>
            <a href="privacy.html">Privacy Policy</a>
            <a href="refund.html">Replacement & Refund Policy</a>
            <a href="shipping.html">Shipping Details</a>
        </div>
        <p class="copyright-text">© 2026 Rada Crest Lighting Solutions. All rights reserved.</p>
    </footer>
</div>

<div class="toast-notify" id="toastNotify"></div>

<script>
    // Exact localStorage Key used in product.html
    const CART_STORAGE_KEY = 'rc_cart_items';
    const WISHLIST_KEY = 'rc_wishlist';

    // Load Cart from rc_cart_items
    function getStoredCart() {
        let data = localStorage.getItem(CART_STORAGE_KEY);
        try {
            let parsed = JSON.parse(data);
            if (Array.isArray(parsed)) return parsed;
        } catch(e) {}
        return [];
    }

    let rawCart = getStoredCart();

    // Map according to exact product.html payload (id, name, price, image, quantity)
    let cartItems = rawCart.map((item, index) => {
        let price = Number(item.price || 0);
        let oldPrice = Number(item.old_price || item.oldPrice || (price > 0 ? Math.round(price * 1.5) : 0));
        let qty = Number(item.quantity || item.qty || 1);

        return {
            id: item.id !== undefined ? item.id : `prod_${index}`,
            title: item.name || "Rada Crest Product",
            variant: item.variant || "Standard Edition",
            currentPrice: price,
            oldPrice: oldPrice,
            stockLeft: item.stock || 3,
            quantity: qty,
            selected: item.selected !== undefined ? item.selected : true,
            image: item.image || 'assets/placeholder.jpg'
        };
    });

    function saveCartState() {
        // Save back exact structure to rc_cart_items
        let toSave = cartItems.map(item => ({
            id: item.id,
            name: item.title,
            price: item.currentPrice,
            old_price: item.oldPrice,
            image: item.image,
            quantity: item.quantity,
            selected: item.selected
        }));
        localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(toSave));
    }

    function loadSavedAddress() {
        const savedAddress = JSON.parse(localStorage.getItem('user_address'));
        if (savedAddress && (savedAddress.name || savedAddress.address)) {
            document.getElementById('displayUserName').innerText = `Deliver to: ${savedAddress.name || 'Customer'}, ${savedAddress.pincode || ''}`;
            document.getElementById('displayAddress').innerText = savedAddress.address || 'Address details saved';
        }
    }

    function showToast(msg) {
        const toast = document.getElementById('toastNotify');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function renderCartItems() {
        const container = document.getElementById('productListContainer');
        container.innerHTML = "";

        if (cartItems.length === 0) {
            container.innerHTML = `
                <div style="text-align:center; padding:60px 20px; background:var(--card-bg); border-radius:18px; border:1px solid var(--border-color);">
                    <i class="fa-solid fa-box-open" style="font-size:3rem; color:var(--primary); margin-bottom:12px;"></i>
                    <h3 style="font-weight:800;">Aapka Cart Khali Hai!</h3>
                    <p style="color:var(--text-muted); margin-top:6px; font-size:0.9rem;">Store se naye products add karein.</p>
                </div>
            `;
            calculateCart();
            return;
        }

        cartItems.forEach(item => {
            const card = document.createElement('div');
            card.className = "cart-item-card";
            card.id = `item-card-${item.id}`;

            const stockHtml = item.stockLeft <= 3 
                ? `<span class="stock-badge"><i class="fa-solid fa-bolt"></i> Only ${item.stockLeft} left!</span>`
                : `<span style="font-size:0.75rem; color:var(--success);"><i class="fa-solid fa-circle-check"></i> In Stock</span>`;

            const discountPercent = item.oldPrice > item.currentPrice 
                ? Math.round(((item.oldPrice - item.currentPrice) / item.oldPrice) * 100)
                : 0;

            card.innerHTML = `
                <input type="checkbox" class="custom-checkbox" 
                    ${item.selected ? 'checked' : ''} 
                    onchange="toggleItemSelect('${item.id}', this.checked)">

                <div class="prod-img-wrap">
                    <img src="${item.image}" alt="${item.title}" class="prod-img">
                </div>

                <div class="prod-details">
                    <div class="prod-title">${item.title}</div>
                    <div class="prod-spec">${item.variant}</div>
                    ${stockHtml}

                    <div class="price-section">
                        <span class="current-price">₹${item.currentPrice}</span>
                        ${discountPercent > 0 ? `<span class="old-price">₹${item.oldPrice}</span><span class="discount-tag">${discountPercent}% OFF</span>` : ''}
                    </div>

                    <div class="prod-bottom-row">
                        <div class="qty-box">
                            <button class="qty-btn" onclick="updateItemQty('${item.id}', -1)">-</button>
                            <span class="qty-value">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateItemQty('${item.id}', 1)">+</button>
                        </div>

                        <div class="action-links">
                            <button class="act-btn" onclick="moveToWishlist('${item.id}')">
                                <i class="fa-regular fa-heart"></i> Wishlist
                            </button>
                            <button class="act-btn delete" onclick="deleteItem('${item.id}')">
                                <i class="fa-regular fa-trash-can"></i> Remove
                            </button>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        calculateCart();
    }

    function toggleItemSelect(id, isSelected) {
        const item = cartItems.find(i => i.id == id);
        if (item) {
            item.selected = isSelected;
            saveCartState();
            document.getElementById('selectAll').checked = cartItems.every(i => i.selected);
            calculateCart();
        }
    }

    function toggleSelectAll() {
        const isChecked = document.getElementById('selectAll').checked;
        cartItems.forEach(i => i.selected = isChecked);
        saveCartState();
        renderCartItems();
    }

    function updateItemQty(id, change) {
        const item = cartItems.find(i => i.id == id);
        if (!item) return;

        item.quantity += change;
        if (item.quantity <= 0) {
            deleteItem(id);
            return;
        }
        saveCartState();
        renderCartItems();
    }

    function deleteItem(id) {
        const card = document.getElementById(`item-card-${id}`);
        if (card) {
            card.classList.add('removing');
            setTimeout(() => {
                cartItems = cartItems.filter(i => i.id != id);
                saveCartState();
                renderCartItems();
                showToast("Product Cart se hata diya gaya!");
            }, 300);
        }
    }

    function moveToWishlist(id) {
        const item = cartItems.find(i => i.id == id);
        if (item) {
            let wishlist = JSON.parse(localStorage.getItem(WISHLIST_KEY) || '[]');
            if (!wishlist.includes(String(item.id))) {
                wishlist.push(String(item.id));
                localStorage.setItem(WISHLIST_KEY, JSON.stringify(wishlist));
            }
            deleteItem(id);
            showToast("Saved to Wishlist!");
        }
    }

    function calculateCart() {
        const selectedItems = cartItems.filter(i => i.selected);
        const totalItemsCount = cartItems.reduce((sum, i) => sum + i.quantity, 0);
        const selectedItemsCount = selectedItems.reduce((sum, i) => sum + i.quantity, 0);

        const subtotal = selectedItems.reduce((sum, i) => sum + (i.currentPrice * i.quantity), 0);
        const totalMRP = selectedItems.reduce((sum, i) => sum + (i.oldPrice * i.quantity), 0);
        const totalDiscount = totalMRP > subtotal ? totalMRP - subtotal : 0;

        document.getElementById('headerCount').innerText = `${totalItemsCount} Items`;
        document.getElementById('selectedCountText').innerText = selectedItemsCount;
        document.getElementById('subtotalVal').innerText = `₹${subtotal.toLocaleString('en-IN')}`;
        document.getElementById('discountVal').innerText = `-₹${totalDiscount.toLocaleString('en-IN')}`;
        document.getElementById('grandTotalVal').innerText = `₹${subtotal.toLocaleString('en-IN')}`;
    }

    function proceedToBuy() {
        const selected = cartItems.filter(i => i.selected);
        if (selected.length === 0) {
            showToast("Kripya kam se kam ek product select karein!");
            return;
        }

        const orderData = {
            items: selected,
            payableAmount: document.getElementById('grandTotalVal').innerText
        };

        localStorage.setItem('checkout_order_data', JSON.stringify(orderData));
        window.location.href = "buy.html";
    }

    // Initialize
    loadSavedAddress();
    renderCartItems();
</script>
</body>
</html>
