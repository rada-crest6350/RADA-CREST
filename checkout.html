<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout — RADA CREST</title>

<script type="module">
import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
"https://ynpsnkvrjhaxdynmurzj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_De-FpQeLF8L5g-7_nu_mvQ_VihQGfjL";

const supabase =
createClient(SUPABASE_URL, SUPABASE_KEY);

window.supabase = supabase;
</script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f7f5;
  color:#111;
  font-family:Arial,Helvetica,sans-serif;
}

.container{
  width:min(900px,94%);
  margin:auto;
  padding:25px 0 60px;
}

.back{
  display:inline-block;
  color:#111;
  text-decoration:none;
  font-weight:bold;
  margin-bottom:30px;
}

h1{
  font-size:48px;
  margin:0 0 12px;
}

.subtitle{
  font-size:18px;
  margin-bottom:30px;
}

.box{
  background:#fff;
  border:1px solid #ddd;
  border-radius:20px;
  padding:25px;
  margin-bottom:20px;
}

.box h2{
  margin-top:0;
}

.product{
  display:flex;
  gap:18px;
  align-items:center;
}

.product img{
  width:110px;
  height:110px;
  object-fit:cover;
  border-radius:14px;
  border:1px solid #ddd;
}

.product-info{
  flex:1;
}

.product-name{
  font-size:22px;
  font-weight:800;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin-top:8px;
}

.quantity{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:12px;
}

.quantity input{
  width:75px;
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.field.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:22px;
  font-weight:800;
  padding-top:18px;
  border-top:1px solid #ddd;
  margin-top:20px;
}

.place{
  width:100%;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#111;
  color:#fff;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.place:disabled{
  opacity:.6;
}

.message{
  margin-top:15px;
  text-align:center;
  font-weight:bold;
}

.success{
  text-align:center;
  padding:35px 20px;
}

.success-icon{
  font-size:70px;
  margin-bottom:15px;
}

.success h2{
  font-size:42px;
  margin:10px 0;
}

.order-id{
  background:#f5f5f3;
  border-radius:14px;
  padding:20px;
  margin:25px 0;
  font-size:18px;
}

.order-id strong{
  display:block;
  font-size:30px;
  margin-top:8px;
}

.whatsapp,
.continue{
  display:inline-block;
  padding:15px 22px;
  border-radius:11px;
  text-decoration:none;
  font-weight:800;
  margin:6px;
}

.whatsapp{
  background:#111;
  color:#fff;
}

.continue{
  background:#111;
  color:#fff;
}

.loading{
  text-align:center;
  padding:50px 10px;
  font-size:18px;
}

@media(max-width:650px){

  h1{
    font-size:40px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .product{
    align-items:flex-start;
  }

  .product img{
    width:90px;
    height:90px;
  }
}
</style>
</head>

<body>

<div class="container">

  <a href="products.html" class="back">
    ← Continue Shopping
  </a>

  <h1>Checkout</h1>

  <div class="subtitle">
    Complete your delivery details and place your RADA CREST order.
  </div>

  <!-- CHECKOUT AREA -->

  <div id="checkoutArea">

    <div class="loading">
      Loading product...
    </div>

  </div>

</div>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://ynpsnkvrjhaxdynmurzj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_De-FpQeLF8L5g-7_nu_mvQ_VihQGfjL";

const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================
   URL PARAMETER
===================================== */

const params =
new URLSearchParams(
  window.location.search
);

const buyNow =
params.get("buy_now");

const productId =
params.get("product_id") ||
params.get("id") ||
buyNow;


/* =====================================
   GLOBAL PRODUCT
===================================== */

let product = null;


/* =====================================
   LOAD PRODUCT
===================================== */

async function loadProduct(){

  const area =
    document.getElementById(
      "checkoutArea"
    );

  if(!productId){

    area.innerHTML = `
      <div class="box">
        <h2>Product not found</h2>
        <p>Please go back and select a product again.</p>
      </div>
    `;

    return;
  }


  let query;


  /* Numeric ID */

  if(/^\d+$/.test(productId)){

    query =
      supabase
        .from("products")
        .select("*")
        .eq("id",Number(productId))
        .single();

  }

  /* SKU */

  else{

    query =
      supabase
        .from("products")
        .select("*")
        .or(
          `sku.eq.${productId},name.eq.${productId}`
        )
        .limit(1);

  }


  const result =
    await query;


  if(result.error){

    console.error(result.error);

    area.innerHTML = `
      <div class="box">
        <h2>Unable to load product</h2>
        <p>${escapeHtml(result.error.message)}</p>
      </div>
    `;

    return;
  }


  if(Array.isArray(result.data)){

    product =
      result.data[0];

  }
  else{

    product =
      result.data;

  }


  if(!product){

    area.innerHTML = `
      <div class="box">
        <h2>Product not found</h2>
        <p>This product may no longer be available.</p>
      </div>
    `;

    return;
  }


  renderCheckout();

}


/* =====================================
   RENDER CHECKOUT
===================================== */

function renderCheckout(){

  const area =
    document.getElementById(
      "checkoutArea"
    );


  const image =
    product.image_url ||
    "https://via.placeholder.com/300";


  const price =
    Number(product.price || 0);


  area.innerHTML = `

    <div class="box">

      <h2>Your Product</h2>

      <div class="product">

        <img
          src="${escapeHtml(image)}"
          alt="${escapeHtml(product.name || "")}"
        >

        <div class="product-info">

          <div class="product-name">
            ${escapeHtml(product.name || "Product")}
          </div>

          <div class="price">
            ₹${price.toLocaleString("en-IN")}
          </div>

          ${
            product.warranty
            ?
            `<div style="margin-top:6px;color:#666;">
              Warranty: ${escapeHtml(product.warranty)}
            </div>`
            :
            ""
          }

          <div class="quantity">

            <label style="margin:0;">
              Quantity
            </label>

            <input
              id="quantity"
              type="number"
              min="1"
              value="1"
            >

          </div>

        </div>

      </div>

      <div class="total">

        <span>Total</span>

        <span id="totalAmount">
          ₹${price.toLocaleString("en-IN")}
        </span>

      </div>

    </div>


    <div class="box">

      <h2>Delivery Details</h2>

      <form id="orderForm">

        <div class="form-grid">

          <div>
            <label>
              Full Name *
            </label>

            <input
              id="customerName"
              required
              placeholder="Enter your name"
            >
          </div>


          <div>
            <label>
              Phone Number *
            </label>

            <input
              id="phone"
              type="tel"
              required
              placeholder="Enter mobile number"
            >
          </div>


          <div class="field full">

            <label>
              Full Address *
            </label>

            <textarea
              id="address"
              required
              placeholder="House no., street, village / area"
            ></textarea>

          </div>


          <div>

            <label>
              City *
            </label>

            <input
              id="city"
              required
              placeholder="City"
            >

          </div>


          <div>

            <label>
              State *
            </label>

            <input
              id="state"
              required
              placeholder="State"
            >

          </div>


          <div>

            <label>
              Pincode *
            </label>

            <input
              id="pincode"
              required
              inputmode="numeric"
              maxlength="6"
              placeholder="6 digit pincode"
            >

          </div>

        </div>


        <div
          id="orderMessage"
          class="message"
        ></div>


        <div style="margin-top:20px;">

          <button
            id="placeOrderBtn"
            class="place"
            type="submit"
          >
            Place Order
          </button>

        </div>

      </form>

    </div>

  `;


  document
    .getElementById("quantity")
    .addEventListener(
      "input",
      updateTotal
    );


  document
    .getElementById("orderForm")
    .addEventListener(
      "submit",
      placeOrder
    );

}


/* =====================================
   TOTAL
===================================== */

function updateTotal(){

  const quantity =
    Math.max(
      1,
      Number(
        document.getElementById(
          "quantity"
        ).value
      ) || 1
    );


  const total =
    Number(product.price || 0)
    *
    quantity;


  document.getElementById(
    "totalAmount"
  ).textContent =
    "₹" +
    total.toLocaleString("en-IN");

}


/* =====================================
   PLACE ORDER
===================================== */

async function getLoggedInCustomer(){
  const { data, error } =
    await supabase.auth.getUser();

  if(error){
    console.error(error);
    return null;
  }

  return data?.user || null;
}


async function placeOrder(e){

  e.preventDefault();

  const customer =
    await getLoggedInCustomer();

  if(!customer){

    window.location.href =
      "account.html?redirect=" +
      encodeURIComponent(
        window.location.href
      );

    return;
  }


  const button =
    document.getElementById(
      "placeOrderBtn"
    );

  const message =
    document.getElementById(
      "orderMessage"
    );


  const customerName =
    document.getElementById(
      "customerName"
    ).value.trim();


  const phone =
    document.getElementById(
      "phone"
    ).value.trim();


  const address =
    document.getElementById(
      "address"
    ).value.trim();


  const city =
    document.getElementById(
      "city"
    ).value.trim();


  const state =
    document.getElementById(
      "state"
    ).value.trim();


  const pincode =
    document.getElementById(
      "pincode"
    ).value.trim();


  const quantity =
    Math.max(
      1,
      Number(
        document.getElementById(
          "quantity"
        ).value
      ) || 1
    );


  const totalAmount =
    Number(product.price || 0)
    *
    quantity;


  if(!/^\d{10}$/.test(
    phone.replace(/\D/g,"")
  )){

    message.style.color =
      "#d33";

    message.textContent =
      "Please enter a valid 10-digit phone number.";

    return;

  }


  if(!/^\d{6}$/.test(pincode)){

    message.style.color =
      "#d33";

    message.textContent =
      "Please enter a valid 6-digit pincode.";

    return;

  }


  button.disabled = true;

  button.textContent =
    "Placing Order...";

  message.style.color =
    "#777";

  message.textContent =
    "Please wait...";


  /* =====================================
     INSERT ORDER
  ===================================== */

  const { data,error } =
    await supabase
      .from("orders")
      .insert({

        customer_id:
          customer.id,

        customer_name:
          customerName,

        phone:
          phone,

        address:
          address,

        city:
          city,

        state:
          state,

        pincode:
          pincode,

        product_name:
          product.name || "",

        product_id:
          product.id || null,

        quantity:
          quantity,

        total_amount:
          totalAmount,

        status:
          "Pending"

      })
      .select()
      .single();


  if(error){

    console.error(error);

    button.disabled = false;

    button.textContent =
      "Place Order";

    message.style.color =
      "#d33";

    message.textContent =
      error.message;

    return;

  }


  /* =====================================
     SUCCESS
  ===================================== */

  showSuccess(
    data,
    customerName,
    phone,
    address,
    city,
    state,
    pincode,
    quantity,
    totalAmount
  );

}


/* =====================================
   SUCCESS SCREEN
===================================== */

function showSuccess(
  order,
  customerName,
  phone,
  address,
  city,
  state,
  pincode,
  quantity,
  totalAmount
){

  const area =
    document.getElementById(
      "checkoutArea"
    );


  const orderId =
    order.id;


  const whatsappNumber =
    "9079714767";


  const whatsappMessage =
`RADA CREST Order

Order ID: #${orderId}

Product: ${product.name}
Quantity: ${quantity}
Total: ₹${totalAmount.toLocaleString("en-IN")}

Customer: ${customerName}
Phone: ${phone}

Address:
${address}
${city}, ${state} - ${pincode}`;


  const whatsappUrl =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(
      whatsappMessage
    );


  area.innerHTML = `

    <div class="box success">

      <div class="success-icon">
        ✓
      </div>

      <h2>
        Order Placed Successfully
      </h2>

      <p>
        Thank you for shopping with RADA CREST.
      </p>


      <div class="order-id">

        <div>
          Order ID
        </div>

        <strong>
          #${orderId}
        </strong>

      </div>


      <p>
        Your order has been submitted successfully.
      </p>


      <div style="margin-top:25px;">

        <a
          class="whatsapp"
          href="${whatsappUrl}"
          target="_blank"
        >
          📲 Send Order on WhatsApp
        </a>


        <a
          class="continue"
          href="products.html"
        >
          Continue Shopping
        </a>

      </div>

    </div>

  `;


  /* =====================================
     AUTO OPEN WHATSAPP
     Order is already saved in Supabase.
  ===================================== */

  setTimeout(() => {

    window.location.href =
      whatsappUrl;

  }, 500);

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================
   START
===================================== */

loadProduct();

</script>

</body>
</html>
