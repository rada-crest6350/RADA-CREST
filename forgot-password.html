<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - RADA CREST</title>
    <!-- Tailwind CSS & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-orange: #FF7A00;
            --brand-orange-glow: rgba(255, 122, 0, 0.35);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(135deg, #090b0e 0%, #12161f 50%, #07090c 100%);
            color: #f3f4f6;
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(18, 22, 31, 0.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .ambient-glow {
            position: fixed;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 122, 0, 0.18) 0%, rgba(0,0,0,0) 70%);
            filter: blur(70px);
            pointer-events: none;
            z-index: 0;
        }

        .custom-input {
            background: rgba(10, 13, 18, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .custom-input:focus {
            border-color: var(--brand-orange);
            box-shadow: 0 0 0 2.5px rgba(255, 122, 0, 0.25);
            background: rgba(10, 13, 18, 0.95);
            transform: translateY(-1px);
        }

        .btn-brand-orange {
            background: linear-gradient(135deg, #FF7A00 0%, #E06000 100%);
            box-shadow: 0 6px 20px -4px var(--brand-orange-glow);
            transition: all 0.3s ease;
        }
        .btn-brand-orange:hover {
            background: linear-gradient(135deg, #FF8A1C 0%, #FF7A00 100%);
            box-shadow: 0 8px 25px 0px rgba(255, 122, 0, 0.5);
            transform: translateY(-1px);
        }
        .btn-brand-orange:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-between relative overflow-x-hidden">

    <div class="ambient-glow top-0 left-1/2 -translate-x-1/2"></div>
    <div class="ambient-glow bottom-10 right-[-100px]"></div>

    <!-- Header -->
    <header class="w-full bg-[#090c10]/80 backdrop-blur-md border-b border-neutral-800/80 px-5 py-3.5 flex items-center justify-between sticky top-0 z-50">
        <a href="account.html" class="flex items-center gap-2 group text-neutral-300 hover:text-white transition">
            <div class="w-8 h-8 rounded-lg bg-neutral-800 flex items-center justify-center text-xs group-hover:bg-[#FF7A00] group-hover:text-black transition">
                <i class="fa-solid fa-arrow-left"></i>
            </div>
            <span class="font-bold tracking-wider text-sm uppercase">Back to Login</span>
        </a>
        <a href="index.html" class="text-xs font-semibold tracking-wide uppercase px-3.5 py-1.5 rounded-full border border-neutral-700 text-neutral-300 hover:text-white hover:border-[#FF7A00] hover:bg-neutral-800/80 transition flex items-center gap-1.5">
            <i class="fa-solid fa-store text-[10px]"></i> Store
        </a>
    </header>

    <!-- Main Container -->
    <main class="max-w-md w-full mx-auto px-4 py-8 flex-grow relative z-10">

        <!-- Title & Icon -->
        <div class="mb-6 text-center">
            <div class="w-14 h-14 rounded-2xl bg-[#FF7A00]/10 border border-[#FF7A00]/30 text-[#FF7A00] flex items-center justify-center text-2xl mx-auto mb-3 shadow-lg shadow-[#FF7A00]/15">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Forgot Password?</h1>
            <p class="text-xs text-neutral-400 mt-1">Apna registered email address enter karein password reset karne ke liye.</p>
        </div>

        <!-- Alert Notification -->
        <div id="reset-alert" class="hidden mb-4 p-3.5 text-xs font-medium rounded-xl"></div>

        <!-- Reset Form -->
        <div class="glass-panel rounded-2xl p-6 shadow-xl">
            <form id="forgotPasswordForm" onsubmit="handleResetPassword(event)" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-neutral-400 mb-1.5">Registered Email</label>
                    <input type="email" id="reset-email" required placeholder="you@example.com" class="w-full px-3.5 py-2.5 custom-input text-white placeholder-neutral-500 rounded-xl text-xs focus:outline-none">
                </div>

                <button type="submit" id="reset-btn" class="w-full py-3.5 btn-brand-orange text-black font-extrabold text-xs uppercase tracking-wider rounded-xl transition">
                    Send Reset Link
                </button>
            </form>

            <div class="mt-4 pt-4 border-t border-neutral-800/80 text-center">
                <p class="text-xs text-neutral-400">
                    Password yaad aa gaya? 
                    <a href="account.html" class="text-[#FF7A00] font-semibold hover:underline ml-1">Sign In</a>
                </p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-neutral-500 border-t border-neutral-800/60 bg-[#090c10]/80 backdrop-blur-md relative z-10">
        &copy; 2026 RADA CREST. All rights reserved.
    </footer>

    <!-- Supabase Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
    <script>
        async function handleResetPassword(e) {
            e.preventDefault();
            hideAlert();

            if (typeof sbReady === 'function' && !sbReady()) {
                showAlert('Supabase configuration missing.');
                return;
            }

            const btn = document.getElementById('reset-btn');
            btn.disabled = true;
            btn.innerText = 'Sending Link...';

            const email = document.getElementById('reset-email').value.trim();

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: `${window.location.origin}/account.html`
                });

                if (error) throw error;

                showAlert('Password reset link aapki email par bhej diya gaya hai! Email inbox/spam check karein.', false);
                document.getElementById('forgotPasswordForm').reset();

            } catch (err) {
                showAlert(err.message || 'Reset link bhejne me samasya aayi.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Send Reset Link';
            }
        }

        function showAlert(message, isError = true) {
            const alertBox = document.getElementById('reset-alert');
            alertBox.className = `mb-4 p-3.5 text-xs font-medium rounded-xl ${isError ? 'bg-red-950/60 text-red-300 border border-red-800/60' : 'bg-emerald-950/60 text-emerald-300 border border-emerald-800/60'}`;
            alertBox.innerText = message;
            alertBox.classList.remove('hidden');
        }

        function hideAlert() {
            document.getElementById('reset-alert').classList.add('hidden');
        }
    </script>
</body>
</html>
