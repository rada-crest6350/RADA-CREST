<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot Password — RADA CREST</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
</head>
<body class="center-page">
<main class="auth">
  <a class="brand" href="index.html">
    <span class="brand-mark">RC</span>
    <span>RADA <b>CREST</b></span>
  </a>
  <h1>Forgot Password?</h1>
  <p id="sub">Enter your email and we'll send a verification code.</p>

  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email" placeholder="you@example.com">

  <button id="sendBtn" class="btn full" type="button">Send Verification Code</button>
  <p id="msg" class="msg"></p>
  <p><a href="account.html">← Back to Account</a></p>
</main>

<script>
const client = window.supabase?.createClient 
  ? window.supabase.createClient("https://ynpsnkvrjhaxdynmurzj.supabase.co", "sb_publishable_De-FpQeLF8L5g-7_nu_mvQ_VihQGfjL") 
  : supabaseClient;

const emailInput = document.getElementById("email");
const sendBtn = document.getElementById("sendBtn");
const msg = document.getElementById("msg");

function showMessage(text, type = "") {
  msg.textContent = text;
  msg.style.color = type === "error" ? "#b53b3b" : type === "success" ? "#28734b" : "#777";
}

async function sendOtpCode() {
  const email = emailInput.value.trim();
  if (!email) {
    showMessage("Please enter your email address.", "error");
    return;
  }

  sendBtn.disabled = true;
  sendBtn.textContent = "Sending Code...";
  showMessage("");

  // Supabase OTP recovery trigger
  const { error } = await client.auth.signInWithOtp({
    email: email,
    options: {
      shouldCreateUser: false
    }
  });

  sendBtn.disabled = false;
  sendBtn.textContent = "Send Verification Code";

  if (error) {
    showMessage(error.message, "error");
    return;
  }

  showMessage("Verification code sent to your email! Redirecting...", "success");
  
  // Email ke baad user ko verify code page (reset-password.html) par bhej dein
  setTimeout(() => {
    localStorage.setItem("reset_email", email);
    location.href = "reset-password.html";
    sub.textContent = "Yeh link expire ho chuka hai ya aapne direct open kiya hai. Kripya account page se naya link dobara mangwaye.";

  }, 1500);
}

sendBtn.addEventListener("click", sendOtpCode);
</script>
</body>
</html>
