<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Forgot Password — RADA CREST</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
</head>

<body class="center-page">

<main class="auth">

  <a class="brand" href="index.html">
    <span class="brand-mark">RC</span>
    <span>RADA <b>CREST</b></span>
  </a>

  <h1>Forgot Password?</h1>

  <p id="sub">
    Enter your account email and we'll send you a password reset link.
  </p>

  <label for="email">Email</label>

  <input
    id="email"
    type="email"
    autocomplete="email"
    placeholder="you@example.com"
  >

  <button
    id="sendBtn"
    class="btn full"
    type="button"
  >
    Send Reset Link
  </button>

  <p id="msg" class="msg"></p>

  <p>
    <a href="account.html">← Back to Account</a>
  </p>

</main>

<script>

const emailInput = document.getElementById("email");
const sendBtn = document.getElementById("sendBtn");
const msg = document.getElementById("msg");

function showMessage(text, type = "") {
  msg.textContent = text;

  if (type === "error") {
    msg.style.color = "#b53b3b";
  } else if (type === "success") {
    msg.style.color = "#28734b";
  } else {
    msg.style.color = "#777";
  }
}

async function sendResetLink() {

  if (!window.supabaseClient) {
    showMessage("Supabase is not configured.", "error");
    return;
  }

  const email = emailInput.value.trim();

  if (!email) {
    showMessage("Please enter your email address.", "error");
    return;
  }

  sendBtn.disabled = true;
  sendBtn.textContent = "Sending...";
  showMessage("");

  const redirectTo =
    window.location.origin + "/reset-password.html";

  const { error } =
    await supabaseClient.auth.resetPasswordForEmail(
      email,
      {
        redirectTo: redirectTo
      }
    );

  sendBtn.disabled = false;
  sendBtn.textContent = "Send Reset Link";

  if (error) {
    showMessage(error.message, "error");
    return;
  }

  showMessage(
    "Reset link sent. Please check your Gmail inbox and open the newest email.",
    "success"
  );
}

sendBtn.addEventListener("click", sendResetLink);

emailInput.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    sendResetLink();
  }
});

</script>

</body>
</html>
