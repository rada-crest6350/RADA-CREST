<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Cancelled Orders — RADA CREST</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f5ef;
  color:#171717;
  font-family:Arial,Helvetica,sans-serif;
}

.page{
  width:min(1000px,calc(100% - 24px));
  margin:25px auto 60px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:22px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:#171717;
  font-weight:900;
  letter-spacing:.08em;
}

.brand-mark{
  width:44px;
  height:44px;
  border-radius:12px;
  background:#171717;
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:900;
}

.back{
  color:#555;
  text-decoration:none;
  font-weight:700;
}

.hero{
  background:#171717;
  color:#fff;
  border-radius:22px;
  padding:26px;
  margin-bottom:20px;
}

.hero small{
  color:#aaa;
  font-weight:700;
}

.hero h1{
  margin:7px 0 8px;
  font-size:clamp(30px,6vw,46px);
}

.hero p{
  margin:0;
  color:#bbb;
  line-height:1.6;
}

.message{
  margin:12px 0;
  font-weight:700;
}

.orders{
  display:grid;
  gap:16px;
}

.order-card{
  background:#fff;
  border:1px solid #e1ddd4;
  border-radius:20px;
  padding:20px;
  box-shadow:0 8px 28px rgba(0,0,0,.05);
}

.order-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
}

.order-id{
  font-size:19px;
  font-weight:900;
}

.order-date{
  color:#777;
  font-size:13px;
  margin-top:5px;
}

.total{
  font-size:22px;
  font-weight:900;
  white-space:nowrap;
}

.cancelled-badge{
  display:inline-flex;
  margin-top:12px;
  padding:7px 11px;
  border-radius:999px;
  background:#fde4e4;
  color:#a33a3a;
  font-size:12px;
  font-weight:900;
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:16px;
}

.info{
  background:#f8f6f0;
  border-radius:13px;
  padding:13px;
}

.info strong{
  display:block;
  margin-bottom:5px;
  font-size:13px;
}

.info span{
  color:#555;
  font-size:14px;
  line-height:1.5;
}

.items{
  border-top:1px solid #eee;
  margin-top:17px;
  padding-top:14px;
  display:grid;
  gap:10px;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding-bottom:10px;
  border-bottom:1px solid #f0eee9;
}

.item:last-child{
  border-bottom:0;
}

.item-name{
  font-weight:750;
}

.item-price{
  font-weight:800;
  white-space:nowrap;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:12px 16px;
  border-radius:12px;
  text-decoration:none;
  font-weight:850;
  border:0;
  cursor:pointer;
}

.primary{
  background:#171717;
  color:#fff;
}

.secondary{
  background:#fff;
  color:#171717;
  border:1px solid #171717;
}

.empty{
  background:#fff;
  border:1px dashed #cfc8ba;
  border-radius:18px;
  padding:45px 20px;
  text-align:center;
  color:#777;
}

.error{
  color:#a33a3a;
  background:#fff0f0;
  border:1px solid #efcaca;
  padding:15px;
  border-radius:14px;
}

@media(max-width:700px){

  .page{
    width:min(100% - 18px,1000px);
  }

  .topbar{
    align-items:flex-start;
  }

  .order-head{
    flex-direction:column;
  }

  .total{
    font-size:20px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .hero{
    padding:22px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="topbar">

    <a class="brand" href="index.html">
      <span class="brand-mark">RC</span>
      <span>RADA CREST</span>
    </a>

    <a class="back" href="account.html">
      ← My Account
    </a>

  </div>

  <section class="hero">

    <small>RADA CREST • ORDER HISTORY</small>

    <h1>Cancelled Orders</h1>

    <p>
      Orders that you cancelled or that were cancelled by RADA CREST
      are shown here.
    </p>

  </section>

  <div id="message" class="message"></div>

  <div id="ordersList" class="orders">
    <div class="empty">
      Loading cancelled orders...
    </div>
  </div>

</div>

<script>

const message =
  document.getElementById("message");

const ordersList =
  document.getElementById("ordersList");


function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function money(value){

  return "₹" +
    Number(value || 0)
      .toLocaleString("en-IN");

}


function formatDate(value){

  if(!value) return "-";

  try{

    return new Date(value)
      .toLocaleString("en-IN",{
        day:"2-digit",
        month:"long",
        year:"numeric",
        hour:"numeric",
        minute:"2-digit",
        hour12:true
      });

  }catch{

    return "-";

  }

}


function getTotal(order,items){

  if(Number(order.total || 0) > 0){

    return Number(order.total);

  }

  if(Number(order.total_amount || 0) > 0){

    return Number(order.total_amount);

  }

  return (items || []).reduce(
    (sum,item) =>
      sum +
      Number(item.quantity || 0) *
      Number(
        item.unit_price ??
        item.price ??
        0
      ),
    0
  );

}


async function loadCancelledOrders(){

  const {
    data:{
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if(!user){

    location.href =
      "account.html?redirect=" +
      encodeURIComponent(
        "cancelled-orders.html"
      );

    return;

  }


  message.textContent =
    "Loading cancelled orders...";


  /*
    First load customer's orders.
    RLS should ensure the user can only
    access their own orders.
  */

  const {
    data:orders,
    error
  } =
    await supabaseClient
      .from("orders")
      .select("*")
      .eq("user_id",user.id)
      .eq("status","cancelled")
      .order("created_at",{
        ascending:false
      });


  if(error){

    console.error(error);

    ordersList.innerHTML = `
      <div class="error">
        Unable to load cancelled orders.
        <br><br>
        ${esc(error.message)}
      </div>
    `;

    message.textContent = "";

    return;

  }


  message.textContent = "";


  if(!orders || !orders.length){

    ordersList.innerHTML = `
      <div class="empty">

        <div style="font-size:42px;margin-bottom:10px;">
          ✓
        </div>

        <strong style="font-size:18px;">
          No Cancelled Orders
        </strong>

        <p>
          You don't have any cancelled orders yet.
        </p>

        <a
          class="btn primary"
          href="index.html#products"
        >
          Continue Shopping
        </a>

      </div>
    `;

    return;

  }


  /*
    Load items for all cancelled orders.
  */

  const ids =
    orders.map(order => order.id);


  let items = [];


  if(ids.length){

    const result =
      await supabaseClient
        .from("order_items")
        .select("*")
        .in("order_id",ids);

    if(!result.error){

      items =
        result.data || [];

    }

  }


  const itemMap =
    new Map();


  items.forEach(item => {

    const key =
      String(item.order_id);

    if(!itemMap.has(key)){

      itemMap.set(key,[]);

    }

    itemMap.get(key).push(item);

  });


  ordersList.innerHTML =
    orders.map(order => {

      const orderItems =
        itemMap.get(
          String(order.id)
        ) || [];


      const total =
        getTotal(
          order,
          orderItems
        );


      const payment =
        order.payment_method ||
        "COD";


      const paymentStatus =
        order.payment_status ||
        "Pending";


      const reason =
        order.cancellation_reason ||
        "No reason provided";


      const cancelledAt =
        order.cancelled_at ||
        order.updated_at ||
        order.created_at;


      const cancelledBy =
        order.cancelled_by ||
        "Customer";


      const itemsHtml =
        orderItems.length

        ?

        orderItems.map(item => {

          const quantity =
            Number(
              item.quantity || 1
            );

          const price =
            Number(
              item.unit_price ??
              item.price ??
              0
            );

          return `
            <div class="item">

              <div>
                <div class="item-name">
                  ${esc(
                    item.product_name ||
                    "Product"
                  )}
                </div>

                <small style="color:#777;">
                  Quantity: ${quantity}
                </small>
              </div>

              <div class="item-price">
                ${money(price * quantity)}
              </div>

            </div>
          `;

        }).join("")

        :

        `
          <div style="color:#777;">
            Order item details unavailable.
          </div>
        `;


      return `

        <article class="order-card">

          <div class="order-head">

            <div>

              <div class="order-id">
                Order #${esc(
                  order.order_number ||
                  order.id
                )}
              </div>

              <div class="order-date">
                Ordered:
                ${esc(
                  formatDate(
                    order.created_at
                  )
                )}
              </div>

              <div class="cancelled-badge">
                🔴 Order Cancelled
              </div>

            </div>

            <div class="total">
              ${money(total)}
            </div>

          </div>


          <div class="info-grid">

            <div class="info">

              <strong>Cancelled On</strong>

              <span>
                ${esc(
                  formatDate(
                    cancelledAt
                  )
                )}
              </span>

            </div>


            <div class="info">

              <strong>Cancelled By</strong>

              <span>
                ${esc(
                  cancelledBy
                )}
              </span>

            </div>


            <div class="info">

              <strong>Cancellation Reason</strong>

              <span>
                ${esc(reason)}
              </span>

            </div>


            <div class="info">

              <strong>Payment</strong>

              <span>
                ${esc(payment)}
                •
                ${esc(paymentStatus)}
              </span>

            </div>


            <div class="info">

              <strong>Refund Status</strong>

              <span>
                ${esc(
                  order.refund_status ||
                  (
                    String(payment)
                      .toLowerCase()
                      .includes("cod")
                    ?
                    "Not Applicable"
                    :
                    "Pending"
                  )
                )}
              </span>

            </div>


            ${
              order.refund_amount != null
              ?
              `
              <div class="info">

                <strong>Refund Amount</strong>

                <span>
                  ${money(
                    order.refund_amount
                  )}
                </span>

              </div>
              `
              :
              ""
            }

          </div>


          <div class="items">

            ${itemsHtml}

          </div>


          <div class="actions">

            <a
              class="btn primary"
              href="order.html?id=${encodeURIComponent(
                order.id
              )}"
            >
              View Details
            </a>

            <a
              class="btn secondary"
              href="index.html#products"
            >
              Buy Again
            </a>

          </div>

        </article>

      `;

    }).join("");

}


loadCancelledOrders();

</script>

</body>
</html>
