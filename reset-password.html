<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Reset Password — RADA CREST</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
</head>

<body class="center-page">

<main class="auth">

  <a class="brand" href="index.html">
    <span class="brand-mark">RC</span>
    <span>RADA <b>CREST</b></span>
  </a>

  <!-- REQUEST RESET -->
  <section id="requestView">

    <h1>Forgot Password?</h1>

    <p id="requestSub">
      Enter your account email and we'll send you a password reset link.
    </p>

    <label for="email">Email</label>

    <input
      id="email"
      type="email"
      autocomplete="email"
      placeholder="you@example.com"
    >

    <button
      id="sendBtn"
      class="btn full"
      type="button"
      onclick="sendResetEmail()"
    >
      Send Reset Link
    </button>

    <p id="requestMsg" class="msg"></p>

    <p style="margin-top:18px;">
      <a href="account.html">← Back to Account</a>
    </p>

  </section>


  <!-- UPDATE PASSWORD -->
  <section id="updateView" style="display:none;">

    <h1>Set New Password</h1>

    <p>
      Enter your new password below.
    </p>

    <label for="pass">New Password</label>

    <input
      id="pass"
      type="password"
      minlength="8"
      autocomplete="new-password"
      placeholder="At least 8 characters"
    >

    <label for="confirmPass">Confirm Password</label>

    <input
      id="confirmPass"
      type="password"
      minlength="8"
      autocomplete="new-password"
      placeholder="Repeat your password"
    >

    <button
      id="updateBtn"
      class="btn full"
      type="button"
      onclick="updatePass()"
    >
      Update Password
    </button>

    <p id="msg" class="msg"></p>

  </section>

</main>


<script>

const emailInput =
  document.getElementById("email");

const requestMsg =
  document.getElementById("requestMsg");

const pass =
  document.getElementById("pass");

const confirmPass =
  document.getElementById("confirmPass");

const msg =
  document.getElementById("msg");

const requestView =
  document.getElementById("requestView");

const updateView =
  document.getElementById("updateView");


function showRequestView(){

  requestView.style.display = "block";
  updateView.style.display = "none";

}


function showUpdateView(){

  requestView.style.display = "none";
  updateView.style.display = "block";

}


async function sendResetEmail(){

  if(typeof sbReady === "function" && !sbReady()){

    requestMsg.textContent =
      "Supabase is not configured.";

    return;

  }


  const email =
    emailInput.value.trim();


  if(!email){

    requestMsg.textContent =
      "Please enter your email address.";

    return;

  }


  const btn =
    document.getElementById("sendBtn");

  btn.disabled = true;
  btn.textContent = "Sending...";

  requestMsg.textContent = "";


  const redirectUrl =
    window.location.origin +
    window.location.pathname;


  const { error } =
    await supabaseClient.auth.resetPasswordForEmail(
      email,
      {
        redirectTo: redirectUrl
      }
    );


  btn.disabled = false;
  btn.textContent = "Send Reset Link";


  if(error){

    requestMsg.textContent =
      error.message;

    return;

  }


  requestMsg.textContent =
    "Reset link sent. Please check your email.";

}


async function updatePass(){

  if(typeof sbReady === "function" && !sbReady()){

    msg.textContent =
      "Supabase is not configured.";

    return;

  }


  const password =
    pass.value;

  const confirm =
    confirmPass.value;


  if(password.length < 8){

    msg.textContent =
      "Password must be at least 8 characters.";

    return;

  }


  if(password !== confirm){

    msg.textContent =
      "Passwords do not match.";

    return;

  }


  const btn =
    document.getElementById("updateBtn");

  btn.disabled = true;
  btn.textContent = "Updating...";

  msg.textContent = "";


  const { error } =
    await supabaseClient.auth.updateUser({
      password: password
    });


  if(error){

    btn.disabled = false;
    btn.textContent = "Update Password";

    msg.textContent =
      error.message;

    return;

  }


  msg.textContent =
    "Password updated successfully. Redirecting...";


  setTimeout(() => {

    location.href =
      "account.html";

  },1500);

}


/*
  When Supabase sends the user back
  through the recovery link, a recovery
  session becomes available.
*/

supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if(event === "PASSWORD_RECOVERY"){

      showUpdateView();

    }

    if(session && event === "SIGNED_IN"){

      /*
        If the URL is a password recovery
        flow, show the new password form.
      */

      const hash =
        window.location.hash || "";

      const search =
        window.location.search || "";

      if(
        hash.includes("type=recovery") ||
        search.includes("code=")
      ){

        showUpdateView();

      }

    }

  }
);


/*
  Check the current session when page loads.
*/

async function init(){

  try{

    const { data } =
      await supabaseClient.auth.getSession();


    if(data && data.session){

      const hash =
        window.location.hash || "";

      const search =
        window.location.search || "";


      if(
        hash.includes("type=recovery") ||
        search.includes("code=")
      ){

        showUpdateView();

        return;

      }

    }

  }catch(error){

    console.error(error);

  }


  showRequestView();

}


init();

</script>

</body>
</html>
