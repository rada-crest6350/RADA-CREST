<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password — RADA CREST</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
</head>
<body class="center-page">
<main class="auth">
  <a class="brand" href="index.html">
    <span class="brand-mark">RC</span>
    <span>RADA <b>CREST</b></span>
  </a>
  <h1>Set New Password</h1>
  <p id="sub">Enter your new password below.</p>

  <div id="resetForm">
    <label for="pass">New Password</label>
    <input id="pass" type="password" minlength="8" placeholder="At least 8 characters">
    
    <label for="confirmPass">Confirm Password</label>
    <input id="confirmPass" type="password" minlength="8" placeholder="Repeat your password">
    
    <button id="updateBtn" class="btn full" type="button">Update Password</button>
  </div>

  <p id="msg" class="msg"></p>
  <p><a href="account.html">← Back to Account</a></p>
</main>

<script>
const client = window.supabase?.createClient 
  ? window.supabase.createClient("https://ynpsnkvrjhaxdynmurzj.supabase.co", "sb_publishable_De-FpQeLF8L5g-7_nu_mvQ_VihQGfjL") 
  : supabaseClient;

const pass = document.getElementById("pass");
const confirmPass = document.getElementById("confirmPass");
const updateBtn = document.getElementById("updateBtn");
const msg = document.getElementById("msg");
const resetForm = document.getElementById("resetForm");
const sub = document.getElementById("sub");

function showMessage(text, type = "") {
  msg.textContent = text;
  msg.style.color = type === "error" ? "#b53b3b" : type === "success" ? "#28734b" : "#777";
}

async function init() {
  // Supabase automatically handles tokens in hash or query params on load via client setup
  const { data } = await client.auth.getSession();
  if (!data.session) {
    // Listen for recovery event if session isn't immediately active
    client.auth.onAuthStateChange(async (event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        resetForm.style.display = "block";
      }
    });
  } else {
    resetForm.style.display = "block";
  }
}

async function updatePassword() {
  const password = pass.value;
  const confirm = confirmPass.value;

  if (password.length < 8) {
    showMessage("Password must be at least 8 characters.", "error");
    return;
  }
  if (password !== confirm) {
    showMessage("Passwords do not match.", "error");
    return;
  }

  updateBtn.disabled = true;
  updateBtn.textContent = "Updating...";

  const { error } = await client.auth.updateUser({ password: password });

  if (error) {
    updateBtn.disabled = false;
    updateBtn.textContent = "Update Password";
    showMessage(error.message, "error");
    return;
  }

  showMessage("Password updated successfully! Redirecting...", "success");
  setTimeout(() => { location.href = "account.html"; }, 1500);
}

updateBtn.addEventListener("click", updatePassword);
init();
</script>
</body>
</html>
