<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Reset Password — RADA CREST</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
</head>

<body class="center-page">

<main class="auth">

  <a class="brand" href="index.html">
    <span class="brand-mark">RC</span>
    <span>RADA <b>CREST</b></span>
  </a>

  <h1>Set New Password</h1>

  <p id="sub">
    Verifying reset link...
  </p>

  <div id="resetForm" style="display: none;">

    <label for="pass">New Password</label>
    <input
      id="pass"
      type="password"
      minlength="8"
      autocomplete="new-password"
      placeholder="At least 8 characters"
    >

    <label for="confirmPass">Confirm Password</label>
    <input
      id="confirmPass"
      type="password"
      minlength="8"
      autocomplete="new-password"
      placeholder="Repeat your password"
    >

    <button
      id="updateBtn"
      class="btn full"
      type="button"
    >
      Update Password
    </button>

  </div>

  <p id="msg" class="msg"></p>

  <p>
    <a href="account.html">← Back to Account</a>
  </p>

</main>

<script>

const client =
  window.supabase?.createClient
    ? window.supabase.createClient(
        "https://ynpsnkvrjhaxdynmurzj.supabase.co",
        "sb_publishable_De-FpQeLF8L5g-7_nu_mvQ_VihQGfjL"
      )
    : supabaseClient;

const pass = document.getElementById("pass");
const confirmPass = document.getElementById("confirmPass");
const updateBtn = document.getElementById("updateBtn");
const msg = document.getElementById("msg");
const resetForm = document.getElementById("resetForm");
const sub = document.getElementById("sub");

let recoveryReady = false;

function showMessage(text, type = "") {
  msg.textContent = text;
  if (type === "error") {
    msg.style.color = "#b53b3b";
  } else if (type === "success") {
    msg.style.color = "#28734b";
  } else {
    msg.style.color = "#777";
  }
}

function showError(text) {
  recoveryReady = false;
  resetForm.style.display = "none";
  sub.textContent = "This password reset link is invalid or has expired.";
  showMessage(text, "error");
}

async function initReset() {
  if (!client) {
    showError("Supabase client could not be loaded.");
    return;
  }

  // 1. Check if URL has a PKCE authorization 'code'
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get("code");

  if (code) {
    const { error } = await client.auth.exchangeCodeForSession(code);
    if (error) {
      showError(error.message);
      return;
    }
  }

  // 2. Check hash parameters (legacy token support fallback)
  const hash = window.location.hash || "";
  const params = new URLSearchParams(hash.replace(/^#/, ""));
  const err = params.get("error");
  const errorCode = params.get("error_code");

  if (err || errorCode) {
    if (errorCode === "otp_expired") {
      showError("This reset link has expired. Please request a new password reset link.");
    } else {
      showError("This password reset link is invalid or has expired.");
    }
    return;
  }

  // 3. Verify active session after code exchange or hash parsing
  const { data, error: sessionError } = await client.auth.getSession();

  if (sessionError) {
    showError(sessionError.message);
    return;
  }

  if (data?.session) {
    recoveryReady = true;
    resetForm.style.display = "block";
    sub.textContent = "Enter your new password below.";
    return;
  }

  // 4. Fallback listener for auth events
  const timeout = setTimeout(() => {
    if (!recoveryReady) {
      showError("Reset link could not be verified. Please request a new reset link.");
    }
  }, 5000);

  const { data: listener } = client.auth.onAuthStateChange(async (event, session) => {
    if (event === "PASSWORD_RECOVERY" && session) {
      clearTimeout(timeout);
      recoveryReady = true;
      resetForm.style.display = "block";
      sub.textContent = "Enter your new password below.";
      if (listener?.subscription) {
        listener.subscription.unsubscribe();
      }
    }
  });
}

async function updatePassword() {
  if (!recoveryReady) {
    showMessage("Please open a valid password reset link from your email.", "error");
    return;
  }

  const password = pass.value;
  const confirm = confirmPass.value;

  if (password.length < 8) {
    showMessage("Password must be at least 8 characters.", "error");
    return;
  }

  if (password !== confirm) {
    showMessage("Passwords do not match.", "error");
    return;
  }

  updateBtn.disabled = true;
  updateBtn.textContent = "Updating...";
  showMessage("");

  const { error } = await client.auth.updateUser({
    password: password
  });

  if (error) {
    updateBtn.disabled = false;
    updateBtn.textContent = "Update Password";
    showMessage(error.message, "error");
    return;
  }

  recoveryReady = false;
  resetForm.style.display = "none";
  sub.textContent = "Your password has been changed successfully.";
  showMessage("Password updated successfully. Redirecting to login...", "success");

  await client.auth.signOut();

  setTimeout(() => {
    location.href = "account.html";
  }, 1800);
}

updateBtn.addEventListener("click", updatePassword);

pass.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    updatePassword();
  }
});

confirmPass.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    updatePassword();
  }
});

initReset();

</script>

</body>
</html>
