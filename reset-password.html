<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - RADA CREST</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#FBF9F5}</style>
</head>
<body class="text-neutral-800 antialiased min-h-screen flex flex-col justify-between">
<header class="w-full bg-white border-b border-neutral-200 px-4 py-3 flex items-center justify-between">
<a href="index.html" class="font-bold tracking-widest text-lg uppercase">RADA CREST</a>
<a href="account.html" class="text-sm text-neutral-600"><i class="fa-solid fa-arrow-left"></i> Login</a>
</header>
<main class="max-w-md w-full mx-auto px-4 py-10 flex-grow">
<div class="text-center mb-6">
<div class="w-14 h-14 mx-auto mb-4 rounded-full bg-black text-white flex items-center justify-center"><i class="fa-solid fa-lock"></i></div>
<h1 class="text-2xl font-bold">Create New Password</h1>
<p class="text-sm text-neutral-500 mt-2">Choose a strong password for your RADA CREST account.</p>
</div>
<div id="alert" class="hidden mb-4 p-3 text-sm rounded-lg"></div>
<div class="bg-white border border-neutral-200 rounded-2xl p-6 shadow-sm">
<form onsubmit="updatePassword(event)" class="space-y-4">
<div>
<label class="block text-xs font-semibold uppercase text-neutral-600 mb-1">New Password</label>
<div class="relative">
<input id="password" type="password" required minlength="8" maxlength="16" autocomplete="new-password" placeholder="8–16 characters" class="w-full px-3 py-3 bg-neutral-50 border border-neutral-300 rounded-lg text-sm pr-10 focus:outline-none focus:border-black">
<button type="button" onclick="toggle('password',this)" class="absolute right-3 top-3 text-neutral-400"><i class="fa-regular fa-eye"></i></button>
</div>
</div>
<div>
<label class="block text-xs font-semibold uppercase text-neutral-600 mb-1">Confirm New Password</label>
<div class="relative">
<input id="confirm" type="password" required minlength="8" maxlength="16" autocomplete="new-password" placeholder="8–16 characters" class="w-full px-3 py-3 bg-neutral-50 border border-neutral-300 rounded-lg text-sm pr-10 focus:outline-none focus:border-black">
<button type="button" onclick="toggle('confirm',this)" class="absolute right-3 top-3 text-neutral-400"><i class="fa-regular fa-eye"></i></button>
</div>
</div>
<button id="update-btn" class="w-full py-3 bg-black text-white rounded-xl font-medium">Update Password</button>
</form>
</div>
</main>
<footer class="text-center py-4 text-xs text-neutral-400 border-t border-neutral-200 bg-white">&copy; 2026 RADA CREST. All rights reserved.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script>
function showAlert(msg,error=true){
 const el=document.getElementById('alert');
 el.className='mb-4 p-3 text-sm rounded-lg '+(error?'bg-red-50 text-red-700 border border-red-200':'bg-emerald-50 text-emerald-700 border border-emerald-200');
 el.innerText=msg; el.classList.remove('hidden');
}
function toggle(id,btn){
 const input=document.getElementById(id), icon=btn.querySelector('i');
 if(input.type==='password'){input.type='text';icon.className='fa-regular fa-eye-slash'}else{input.type='password';icon.className='fa-regular fa-eye'}
}
document.addEventListener('input', (event) => {
if(event.target.matches('#password,#confirm') && event.target.value.length>16){
event.target.value=event.target.value.slice(0,16);
}
});

async function updatePassword(e){
 e.preventDefault();
 const p=document.getElementById('password').value, c=document.getElementById('confirm').value, btn=document.getElementById('update-btn');
 if(p.length<8 || p.length>16){showAlert('Password must be 8–16 characters.');return}
 if(c.length<8 || c.length>16){showAlert('Password must be 8–16 characters.');return}
if(p!==c){showAlert('Passwords do not match.');return}
 btn.disabled=true;btn.innerText='Updating...';
 try{
   const {data:{user},error:userError}=await supabaseClient.auth.getUser();
   if(userError || !user) throw new Error('This password reset link/session is invalid or expired. Please start again.');
   const {error}=await supabaseClient.auth.updateUser({password:p});
   if(error) throw error;
   await supabaseClient.auth.signOut();
   showAlert('Password updated successfully. Redirecting to login...',false);
   setTimeout(()=>window.location.href='account.html',1800);
 }catch(err){showAlert(err.message||'Unable to update password.')}
 finally{btn.disabled=false;btn.innerText='Update Password'}
}
</script>
</body>
</html>
