<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — RADA CREST</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script></head><body class="center-page"><main class="auth"><a class="brand" href="index.html"><span class="brand-mark">RC</span><span>RADA <b>CREST</b></span></a><h1>Set new password</h1><label>New password</label><input id="pass" type="password" minlength="8"><button class="btn full" onclick="updatePass()">Update Password</button><p id="msg"></p></main><script>async function updatePass(){if(!sbReady())return msg.textContent='Configure Supabase first.';const {error}=await supabaseClient.auth.updateUser({password:pass.value});msg.textContent=error?error.message:'Password updated. You can now login.'}</script></body></html>
