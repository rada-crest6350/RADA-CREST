<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orders Management — RADA CREST ADMIN</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg-deep:#060608;
      --panel-card:rgba(24, 24, 32, 0.85);
      --border:rgba(255, 255, 255, 0.08);
      --text:#ffffff;
      --text-muted:#9da0b0;
      --brand:#FF7A00;
      --brand-glow:rgba(255, 122, 0, 0.35);
      --brand-gradient:linear-gradient(135deg, #FF9433 0%, #FF5100 100%);
      --danger:#ff4d4d;
      --success:#3dd598;
    }
    body{
      background:var(--bg-deep);
      color:var(--text);
      font-family:'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height:100vh;
      padding:20px;
      position:relative;
      overflow-x:hidden;
    }
    .ambient-glow{
      position:fixed;width:400px;height:400px;
      background:radial-gradient(circle, rgba(255,122,0,0.15) 0%, rgba(0,0,0,0) 70%);
      top:10%
      left:50%;transform:translate(-50%, -50%);
      z-index:0;pointer-events:none;
    }
    .admin-container{
      max-width:900px;margin:0 auto;position:relative;z-index:1;
      animation:fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeInUp{
      from{opacity:0;transform:translateY(20px);}
      to{opacity:1;transform:translateY(0);}
    }
    .header-bar{
      display:flex;align-items:center;justify-content:space-between;
      background:var(--panel-card);backdrop-filter:blur(20px);
      border:1px solid var(--border);border-radius:20px;
      padding:20px 24px;margin-bottom:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
    }
    .header-title h1{font-size:20px;font-weight:800;}
    .header-title p{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
    .back-btn{
      background:rgba(255,255,255,0.06);border:1px solid var(--border);
      width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
      color:#fff;text-decoration:none;transition:0.2s;
    }
    .back-btn:hover{background:var(--brand);border-color:var(--brand);color:#000;}

    /* Analytics Summary Cards */
    .stats-grid{
      display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:12px;margin-bottom:20px;
    }
    .stat-card{
      background:var(--panel-card);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center;
    }
    .stat-card h3{font-size:20px;font-weight:800;color:var(--brand);margin-top:4px;}
    .stat-card p{font-size:11.5px;color:var(--text-muted);}

    /* Filter Tabs */
    .filter-bar{
      display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:20px;
    }
    .filter-tab{
      background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text-muted);
      padding:8px 16px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:0.2s;
    }
    .filter-tab.active{
      background:var(--brand);color:#000;border-color:var(--brand);box-shadow:0 4px 15px var(--brand-glow);
    }

    /* Order Card Item */
    .order-card{
      background:var(--panel-card);backdrop-filter:blur(20px);
      border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;
      box-shadow:0 8px 25px rgba(0,0,0,0.4);transition:0.2s;
    }
    .order-card:hover{border-color:rgba(255,122,0,0.3);}
    .order-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:12px;}
    .order-id{font-size:15px;font-weight:800;color:#fff;}
    .order-date{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
    .order-price{font-size:16px;font-weight:800;color:var(--brand);}

    .order-details{
      display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:10px;font-size:13px;color:var(--text-muted);margin-bottom:14px;
    }
    .order-details div i{color:var(--brand);width:18px;margin-right:4px;}
    .order-details b{color:#fff;}

    .order-footer{
      display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:12px;flex-wrap:gap;gap:10px;
    }
    .status-select{
      background:rgba(255,255,255,0.06);border:1.5px solid var(--border);color:#fff;
      padding:8px 12px;border-radius:10px;font-family:inherit;font-size:13px;outline:none;cursor:pointer;
    }
    .status-select:focus{border-color:var(--brand);}

    .badge{
      padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase;display:inline-block;
    }
    .badge-pending{background:rgba(255,165,0,0.15);color:#ffa500;}
    .badge-delivered{background:rgba(61,213,152,0.15);color:var(--success);}
    .badge-cancelled{background:rgba(255,77,77,0.15);color:var(--danger);}

    /* Reason Modal Popup */
    .modal-overlay{
      position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);
      display:none;align-items:center;justify-content:center;z-index:999;
    }
    .modal-box{
      background:#16161f;border:1px solid var(--border);border-radius:20px;padding:24px;width:90%;max-width:400px;
      box-shadow:0 15px 40px rgba(0,0,0,0.6);animation:fadeInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-box h3{font-size:16px;margin-bottom:10px;}
    .modal-box textarea{
      width:100%;background:rgba(255,255,255,0.04);border:1.5px solid var(--border);border-radius:12px;
      padding:12px;color:#fff;font-family:inherit;font-size:13px;margin:12px 0;outline:none;resize:none;height:80px;
    }
    .modal-box textarea:focus{border-color:var(--brand);}
    .modal-actions{display:flex;gap:10px;}
    .modal-btn{
      flex:1;padding:10px;border-radius:10px;font-weight:700;border:none;cursor:pointer;font-size:13px;
    }
    .btn-cancel{background:rgba(255,255,255,0.06);color:#fff;}
    .btn-confirm{background:var(--brand-gradient);color:#000;}

    .empty-state{text-align:center;padding:40px;color:var(--text-muted);font-size:14px;}
  </style>
</head>
<body>

<div class="ambient-glow"></div>

<div class="admin-container">
  
  <div class="header-bar">
    <div class="header-title">
      <h1>Orders Management</h1>
      <p>Live Customer Orders Database</p>
    </div>
    <a href="admin-dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
  </div>

  <!-- Analytics Summary -->
  <div class="stats-grid">
    <div class="stat-card">
      <p>Total Orders</p>
      <h3 id="statTotal">0</h3>
    </div>
    <div class="stat-card">
      <p>Today's Orders</p>
      <h3 id="statToday">0</h3>
    </div>
    <div class="stat-card">
      <p>Pending Orders</p>
      <h3 id="statPending">0</h3>
    </div>
  </div>

  <!-- Filter Tabs -->
  <div class="filter-bar">
    <button class="filter-tab active" onclick="filterOrders('all', this)">All Orders</button>
    <button class="filter-tab" onclick="filterOrders('today', this)">Today</button>
    <button class="filter-tab" onclick="filterOrders('pending', this)">Pending</button>
    <button class="filter-tab" onclick="filterOrders('delivered', this)">Delivered</button>
    <button class="filter-tab" onclick="filterOrders('cancelled', this)">Cancelled</button>
  </div>

  <div id="message"></div>
  <div id="list"></div>

</div>

<!-- Reason Modal -->
<div class="modal-overlay" id="reasonModal">
  <div class="modal-box">
    <h3 id="modalTitle">Status Update Reason</h3>
    <p style="font-size:12px;color:var(--text-muted);">Please enter a note/reason for this status change:</p>
    <textarea id="statusReasonText" placeholder="e.g. Delivered successfully to customer / Customer cancelled call..."></textarea>
    <div class="modal-actions">
      <button class="modal-btn btn-cancel" onclick="closeReasonModal()">Cancel</button>
      <button class="modal-btn btn-confirm" onclick="confirmStatusUpdate()">Confirm Update</button>
    </div>
  </div>
</div>

<script>
  let allOrdersData = [];
  let currentFilter = 'all';
  let pendingUpdateOrderId = null;
  let pendingUpdateStatus = null;

  async function loadOrders(){
    const message = document.getElementById("message");
    const list = document.getElementById("list");

    const { data: { user } } = await supabaseClient.auth.getUser();
    if(!user){
      location.href = "admin.html";
      return;
    }

    message.innerHTML = `<p style="text-align:center;color:var(--text-muted);padding:20px;">Loading orders from database...</p>`;

    const { data, error } = await supabaseClient
      .from("orders")
      .select("*")
      .order("created_at", { ascending: false });

    if(error){
      console.error(error);
      message.textContent = "Error: " + error.message;
      return;
    }

    message.innerHTML = "";
    allOrdersData = data || [];
    updateStats(allOrdersData);
    renderOrders(filterOrdersList(allOrdersData, currentFilter));
  }

  function updateStats(data){
    document.getElementById("statTotal").textContent = data.length;

    const todayStr = new Date().toDateString();
    const todayCount = data.filter(o => o.created_at && new Date(o.created_at).toDateString() === todayStr).length;
    document.getElementById("statToday").textContent = todayCount;

    const pendingCount = data.filter(o => (o.status || 'pending').toLowerCase() === 'pending').length;
    document.getElementById("statPending").textContent = pendingCount;
  }

  function filterOrders(type, btn){
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = type;
    renderOrders(filterOrdersList(allOrdersData, type));
  }

  function filterOrdersList(data, type){
    const todayStr = new Date().toDateString();
    if(type === 'today'){
      return data.filter(o => o.created_at && new Date(o.created_at).toDateString() === todayStr);
    }
    if(type === 'pending'){
      return data.filter(o => (o.status || 'pending').toLowerCase() === 'pending');
    }
    if(type === 'delivered'){
      return data.filter(o => (o.status || '').toLowerCase() === 'delivered');
    }
    if(type === 'cancelled'){
      return data.filter(o => (o.status || '').toLowerCase() === 'cancelled');
    }
    return data;
  }

  function renderOrders(data){
    const list = document.getElementById("list");

    if(!data || !data.length){
      list.innerHTML = `<div class="empty-state">No orders found in this filter.</div>`;
      return;
    }

    list.innerHTML = data.map(order => {
      const date = order.created_at ? new Date(order.created_at).toLocaleString("en-IN") : "";
      const status = (order.status || "pending").toLowerCase();
      const payment = order.payment_status || "pending";
      const orderIdStr = escapeHtml(order.order_number || String(order.id));

      let badgeClass = "badge-pending";
      if(status === 'delivered') badgeClass = "badge-delivered";
      if(status === 'cancelled') badgeClass = "badge-cancelled";

      return `
        <article class="order-card">
          <div class="order-top">
            <div>
              <div class="order-id">Order #${orderIdStr} <span class="badge ${badgeClass}">${status}</span></div>
              <div class="order-date"><i class="fa-regular fa-clock"></i> ${date}</div>
            </div>
            <div class="order-price">₹${Number(order.total_amount || 0).toLocaleString("en-IN")}</div>
          </div>

          <div class="order-details">
            <div><i class="fa-solid fa-user"></i> <b>${escapeHtml(order.customer_name || "N/A")}</b></div>
            <div><i class="fa-solid fa-phone"></i> ${escapeHtml(order.customer_phone || "N/A")}</div>
            ${order.customer_email ? `<div><i class="fa-solid fa-envelope"></i> ${escapeHtml(order.customer_email)}</div>` : ''}
            <div style="grid-column: 1/-1;"><i class="fa-solid fa-location-dot"></i> <b>Address:</b> ${escapeHtml(order.shipping_address || "N/A")}</div>
            ${order.reason ? `<div style="grid-column: 1/-1; color: var(--brand);"><i class="fa-solid fa-note-sticky"></i> <b>Note/Reason:</b> ${escapeHtml(order.reason)}</div>` : ''}
          </div>

          <div class="order-footer">
            <small>Payment: <b>${escapeHtml(payment)}</b></small>
            <div>
              <label style="font-size:12px;color:var(--text-muted);margin-right:6px;">Update Status:</label>
              <select class="status-select" onchange="handleStatusChange(${order.id}, this.value)">
                <option value="pending" ${status === "pending" ? "selected" : ""}>Pending</option>
                <option value="confirmed" ${status === "confirmed" ? "selected" : ""}>Confirmed</option>
                <option value="processing" ${status === "processing" ? "selected" : ""}>Processing</option>
                <option value="shipped" ${status === "shipped" ? "selected" : ""}>Shipped</option>
                <option value="delivered" ${status === "delivered" ? "selected" : ""}>Delivered</option>
                <option value="cancelled" ${status === "cancelled" ? "selected" : ""}>Cancelled</option>
              </select>
            </div>
          </div>
        </article>
      `;
    }).join("");
  }

  function handleStatusChange(id, newStatus){
    if(newStatus === 'delivered' || newStatus === 'cancelled'){
      pendingUpdateOrderId = id;
      pendingUpdateStatus = newStatus;
      document.getElementById('modalTitle').textContent = `Reason for ${newStatus.toUpperCase()}`;
      document.getElementById('statusReasonText').value = '';
      document.getElementById('reasonModal').style.display = 'flex';
    } else {
      executeStatusUpdate(id, newStatus, "");
    }
  }

  function closeReasonModal(){
    document.getElementById('reasonModal').style.display = 'none';
    loadOrders(); // Reset dropdown view if cancelled
  }

  async function confirmStatusUpdate(){
    const reason = document.getElementById('statusReasonText').value.trim();
    document.getElementById('reasonModal').style.display = 'none';
    if(pendingUpdateOrderId && pendingUpdateStatus){
      await executeStatusUpdate(pendingUpdateOrderId, pendingUpdateStatus, reason);
    }
  }

  async function executeStatusUpdate(id, status, reason){
    const updatePayload = { status: status };
    if(reason) updatePayload.reason = reason;

    const { error } = await supabaseClient
      .from("orders")
      .update(updatePayload)
      .eq("id", id);

    if(error){
      console.error(error);
      alert("Status update failed:\n" + error.message);
    }
    await loadOrders();
  }

  function escapeHtml(value){
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  loadOrders();
</script>

</body>
</html>
