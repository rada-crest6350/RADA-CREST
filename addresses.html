<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Delivery Addresses | Rada Crest</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #FF7A00;
            --primary-glow: rgba(255, 122, 0, 0.35);
            --bg-dark: #0b0d14;
            --card-bg: rgba(18, 20, 26, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #9ba1b0;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(255, 122, 0, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 90% 85%, rgba(255, 122, 0, 0.04) 0%, transparent 45%);
            background-attachment: fixed;
            padding-bottom: 60px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Header */
        .header-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--primary);
            color: #000;
            transform: translateX(-3px);
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .header-title {
            font-size: 1.3rem;
            font-weight: 800;
        }

        /* Add New Button */
        .btn-add-toggle {
            width: 100%;
            background: rgba(255, 122, 0, 0.1);
            border: 1px dashed var(--primary);
            color: var(--primary);
            padding: 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            transition: all 0.25s ease;
        }

        .btn-add-toggle:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        /* Address Form Card */
        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 24px;
            display: none;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: slideDown 0.3s ease;
        }

        .form-card.active {
            display: block;
        }

        .form-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 14px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 11px 14px;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .pincode-status {
            font-size: 0.75rem;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pincode-status.loading { color: var(--warning); }
        .pincode-status.success { color: var(--success); }
        .pincode-status.error { color: var(--danger); }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-save {
            flex: 1;
            background: linear-gradient(135deg, #FF7A00 0%, #ff5500 100%);
            border: none;
            color: #000;
            padding: 13px;
            border-radius: 10px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 13px 18px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Saved Address Cards */
        .address-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .address-item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            position: relative;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(12px);
        }

        .address-item-card:hover {
            border-color: rgba(255, 122, 0, 0.4);
            transform: translateY(-2px);
        }

        .address-item-card.selected {
            border: 2px solid var(--primary);
            background: rgba(255, 122, 0, 0.05);
            box-shadow: 0 8px 25px var(--primary-glow);
        }

        .selected-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            background: var(--primary);
            color: #000;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            display: none;
        }

        .address-item-card.selected .selected-badge {
            display: inline-block;
        }

        .addr-name-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .addr-name {
            font-size: 1.05rem;
            font-weight: 800;
            color: #fff;
        }

        .addr-phone {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .addr-full-text {
            font-size: 0.88rem;
            color: #cbd5e1;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .addr-bottom-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .addr-select-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .address-item-card.selected .addr-select-btn {
            background: var(--primary);
            border-color: var(--primary);
            color: #000;
        }

        .addr-card-actions {
            display: flex;
            gap: 12px;
        }

        .card-act-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-act-btn:hover { color: var(--primary); }
        .card-act-btn.delete:hover { color: var(--danger); }

        .empty-address-box {
            text-align: center;
            padding: 50px 20px;
            background: var(--card-bg);
            border-radius: 18px;
            border: 1px solid var(--border-color);
        }

        .toast-notify {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #12151B;
            color: #fff;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid var(--primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 2000;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .toast-notify.show {
            transform: translateY(0);
            opacity: 1;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-nav">
        <div class="header-left">
            <a href="cart.html" class="back-btn" title="Back to Cart">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="header-title">Delivery Addresses</div>
        </div>
    </div>

    <!-- Add New Toggle Button -->
    <button class="btn-add-toggle" onclick="openAddForm()">
        <i class="fa-solid fa-plus"></i> Add New Address
    </button>

    <!-- Address Add/Edit Form -->
    <div class="form-card" id="addressFormCard">
        <div class="form-title" id="formHeading">
            <i class="fa-solid fa-map-location-dot"></i> Add New Address
        </div>
        <input type="hidden" id="editAddressId" value="">

        <div class="grid-2">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="formName" placeholder="Receiver's name">
            </div>
            <div class="form-group">
                <label>Phone Number *</label>
                <input type="tel" id="formPhone" placeholder="10-digit mobile number">
            </div>
        </div>

        <div class="form-group">
            <label>Pincode * (Auto-Fetches City & State)</label>
            <input type="number" id="formPincode" placeholder="e.g. 508213" oninput="handlePincodeLookup(this.value)">
            <div class="pincode-status" id="pincodeStatus"></div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>City / District *</label>
                <input type="text" id="formCity" placeholder="City name">
            </div>
            <div class="form-group">
                <label>State *</label>
                <input type="text" id="formState" placeholder="State">
            </div>
        </div>

        <div class="form-group">
            <label>Complete House No., Building, Street & Landmark *</label>
            <textarea id="formStreet" rows="3" placeholder="e.g. Shop No. 4, Main Road Market, Near Bus Stand"></textarea>
        </div>

        <div class="form-actions">
            <button class="btn-save" onclick="saveAddressForm()">Save & Deliver Here</button>
            <button class="btn-cancel" onclick="closeForm()">Cancel</button>
        </div>
    </div>

    <!-- Saved Addresses List -->
    <div class="address-list" id="addressListContainer"></div>
</div>

<div class="toast-notify" id="toastNotify"></div>

<script>
    function getActiveUserSuffix() {
        const user = JSON.parse(localStorage.getItem('rc_user')) || null;
        if (user) {
            const uid = user.email || user.phone || user.id;
            if (uid) return String(uid).replace(/[^a-zA-Z0-9]/g, '_');
        }
        return 'guest_user';
    }

    function getUserKeys() {
        const suffix = getActiveUserSuffix();
        return {
            listKey: `rc_addresses_${suffix}`,
            activeKey: `rc_address_${suffix}`,
            selectedKey: `rc_selected_address_${suffix}`
        };
    }

    let addressList = [];
    let activeAddress = null;

    function loadUserAddressData() {
        const keys = getUserKeys();
        addressList = JSON.parse(localStorage.getItem(keys.listKey)) || [];
        activeAddress = JSON.parse(localStorage.getItem(keys.activeKey)) || 
                        JSON.parse(localStorage.getItem(keys.selectedKey)) || 
                        (addressList.length > 0 ? addressList[0] : null);
    }

    function showToast(msg) {
        const toast = document.getElementById('toastNotify');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
    }

    let pincodeTimer = null;
    async function handlePincodeLookup(pincode) {
        const statusEl = document.getElementById('pincodeStatus');
        pincode = pincode.toString().trim();

        if (pincode.length !== 6) {
            statusEl.innerHTML = "";
            return;
        }

        clearTimeout(pincodeTimer);
        statusEl.className = "pincode-status loading";
        statusEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Fetching location details...`;

        pincodeTimer = setTimeout(async () => {
            try {
                const response = await fetch(`https://api.postalpincode.in/pincode/${pincode}`);
                const data = await response.json();

                if (data && data[0] && data[0].Status === "Success") {
                    const postOffice = data[0].PostOffice[0];
                    document.getElementById('formCity').value = postOffice.District || postOffice.Block || "";
                    document.getElementById('formState').value = postOffice.State || "";
                    
                    statusEl.className = "pincode-status success";
                    statusEl.innerHTML = `<i class="fa-solid fa-circle-check"></i> Found: ${postOffice.District}, ${postOffice.State}`;
                } else {
                    statusEl.className = "pincode-status error";
                    statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Invalid or unrecognized Pincode`;
                }
            } catch (err) {
                statusEl.className = "pincode-status error";
                statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Auto-fetch failed, please enter manually`;
            }
        }, 300);
    }

    function renderAddressList() {
        loadUserAddressData();
        const container = document.getElementById('addressListContainer');
        container.innerHTML = "";

        if (addressList.length === 0) {
            container.innerHTML = `
                <div class="empty-address-box">
                    <i class="fa-solid fa-location-crosshairs" style="font-size:2.8rem; color:var(--primary); margin-bottom:12px;"></i>
                    <h3 style="font-weight:800;">Koi Address Saved Nahi Hai!</h3>
                    <p style="color:var(--text-muted); margin-top:6px; font-size:0.88rem;">Delivery ke liye "Add New Address" button dabayein.</p>
                </div>
            `;
            return;
        }

        addressList.forEach((addr) => {
            const isSelected = activeAddress && (activeAddress.id === addr.id || (activeAddress.address === addr.address && activeAddress.name === addr.name));
            const card = document.createElement('div');
            card.className = `address-item-card ${isSelected ? 'selected' : ''}`;
            card.onclick = () => selectAddress(addr.id);

            card.innerHTML = `
                <span class="selected-badge"><i class="fa-solid fa-check"></i> DELIVER HERE</span>
                <div class="addr-name-row">
                    <div class="addr-name">${addr.name}</div>
                    <div class="addr-phone">📱 ${addr.phone}</div>
                </div>
                <div class="addr-full-text">
                    ${addr.street}, ${addr.city}, ${addr.state} - <b>${addr.pincode}</b>
                </div>
                <div class="addr-bottom-row" onclick="event.stopPropagation()">
                    <button class="addr-select-btn" onclick="selectAddress('${addr.id}')">
                        ${isSelected ? '<i class="fa-solid fa-check"></i> Selected' : 'Deliver Here'}
                    </button>
                    <div class="addr-card-actions">
                        <button class="card-act-btn" onclick="editAddress('${addr.id}')"><i class="fa-solid fa-pen"></i> Edit</button>
                        <button class="card-act-btn delete" onclick="deleteAddress('${addr.id}')"><i class="fa-solid fa-trash"></i> Delete</button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function openAddForm() {
        document.getElementById('editAddressId').value = "";
        document.getElementById('formHeading').innerHTML = `<i class="fa-solid fa-map-location-dot"></i> Add New Address`;
        document.getElementById('formName').value = "";
        document.getElementById('formPhone').value = "";
        document.getElementById('formPincode').value = "";
        document.getElementById('formCity').value = "";
        document.getElementById('formState').value = "";
        document.getElementById('formStreet').value = "";
        document.getElementById('pincodeStatus').innerHTML = "";

        const formCard = document.getElementById('addressFormCard');
        formCard.classList.add('active');
        formCard.scrollIntoView({ behavior: 'smooth' });
    }

    function closeForm() {
        document.getElementById('addressFormCard').classList.remove('active');
    }

    function editAddress(id) {
        loadUserAddressData();
        const addr = addressList.find(a => a.id === id);
        if (!addr) return;

        document.getElementById('editAddressId').value = addr.id;
        document.getElementById('formHeading').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> Edit Address`;
        document.getElementById('formName').value = addr.name;
        document.getElementById('formPhone').value = addr.phone;
        document.getElementById('formPincode').value = addr.pincode;
        document.getElementById('formCity').value = addr.city;
        document.getElementById('formState').value = addr.state;
        document.getElementById('formStreet').value = addr.street;
        document.getElementById('pincodeStatus').innerHTML = "";

        const formCard = document.getElementById('addressFormCard');
        formCard.classList.add('active');
        formCard.scrollIntoView({ behavior: 'smooth' });
    }

    // URL check karega ki user cart se aaya hai ya nahi
function handlePostAddressRedirect() {
    const urlParams = new URLSearchParams(window.location.search);
    const redirectTarget = urlParams.get('redirect');

    if (redirectTarget === 'cart') {
        setTimeout(() => {
            window.location.href = "cart.html";
        }, 700);
    } else if (redirectTarget === 'buy') {
        setTimeout(() => {
            window.location.href = "buy.html";
        }, 700);
    }
    // Agar direct account se aaya hai toh koi redirect nahi hoga, page par hi rukega
}

function saveAddressForm() {
    const name = document.getElementById('formName').value.trim();
    const phone = document.getElementById('formPhone').value.trim();
    const pincode = document.getElementById('formPincode').value.trim();
    const city = document.getElementById('formCity').value.trim();
    const state = document.getElementById('formState').value.trim();
    const street = document.getElementById('formStreet').value.trim();
    const editId = document.getElementById('editAddressId').value;

    if (!name || !phone || !pincode || !city || !street) {
        showToast("Kripya saare required fields bharein!");
        return;
    }

    const fullFormatted = `${street}, ${city}, ${state} - ${pincode}`;
    const keys = getUserKeys();
    let list = JSON.parse(localStorage.getItem(keys.listKey)) || [];
    let savedItem;

    if (editId) {
        const index = list.findIndex(a => a.id === editId);
        if (index !== -1) {
            list[index] = { id: editId, name, phone, pincode, city, state, street, address: fullFormatted };
            savedItem = list[index];
        }
    } else {
        savedItem = {
            id: 'addr_' + Date.now(),
            name,
            phone,
            pincode,
            city,
            state,
            street,
            address: fullFormatted
        };
        list.unshift(savedItem);
    }

    // Isolated Save
    localStorage.setItem(keys.listKey, JSON.stringify(list));
    localStorage.setItem(keys.activeKey, JSON.stringify(savedItem));
    localStorage.setItem(keys.selectedKey, JSON.stringify(savedItem));

    localStorage.removeItem('user_address');
    localStorage.removeItem('rc_user_address');
    localStorage.removeItem('rc_all_addresses');

    closeForm();
    renderAddressList();
    showToast("Address Safalta-poorvak Save Ho Gaya!");

    // Smart Redirect
    handlePostAddressRedirect();
}

function selectAddress(id) {
    loadUserAddressData();
    const addr = addressList.find(a => a.id === id);
    if (!addr) return;

    const keys = getUserKeys();
    activeAddress = addr;
    localStorage.setItem(keys.activeKey, JSON.stringify(addr));
    localStorage.setItem(keys.selectedKey, JSON.stringify(addr));

    renderAddressList();
    showToast(`Deliver to: ${addr.name} Selected!`);

    // Smart Redirect
    handlePostAddressRedirect();
}

    function deleteAddress(id) {
        const keys = getUserKeys();
        let list = JSON.parse(localStorage.getItem(keys.listKey)) || [];
        list = list.filter(a => a.id !== id);
        localStorage.setItem(keys.listKey, JSON.stringify(list));

        if (activeAddress && activeAddress.id === id) {
            activeAddress = list.length > 0 ? list[0] : null;
            if (activeAddress) {
                localStorage.setItem(keys.activeKey, JSON.stringify(activeAddress));
                localStorage.setItem(keys.selectedKey, JSON.stringify(activeAddress));
            } else {
                localStorage.removeItem(keys.activeKey);
                localStorage.removeItem(keys.selectedKey);
            }
        }

        renderAddressList();
        showToast("Address delete kar diya gaya!");
    }

    // Initialize on page load
    renderAddressList();
</script>
</body>
</html>
