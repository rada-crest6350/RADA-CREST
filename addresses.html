<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Address — RADA CREST</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg-deep:#060608;
  --panel-card:rgba(24, 24, 30, 0.75);
  --border:rgba(255, 255, 255, 0.08);
  --text:#ffffff;
  --text-muted:#9da0b0;
  --brand:#FF7A00;
  --brand-glow:rgba(255, 122, 0, 0.35);
  --brand-gradient:linear-gradient(135deg, #FF9433 0%, #FF5100 100%);
  --green:#3dd598;
}

body{
  background:var(--bg-deep);
  color:var(--text);
  font-family:'Plus Jakarta Sans', -apple-system, sans-serif;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
  padding-bottom:60px;
}

.ambient-glow{
  position:fixed;
  width:400px;height:400px;
  background:radial-gradient(circle, rgba(255,122,0,0.12) 0%, rgba(0,0,0,0) 70%);
  top:-100px;left:50%;
  transform:translateX(-50%);
  z-index:0;
  pointer-events:none;
}

.header{
  position:sticky;top:0;z-index:100;
  background:rgba(8, 8, 10, 0.85);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
}
.header-left{display:flex;align-items:center;gap:12px;}
.back-btn{
  background:rgba(255,255,255,0.06);
  border:1px solid var(--border);
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;color:#fff;
  text-decoration:none;font-size:16px;
  transition:0.2s;
}
.back-btn:hover{background:rgba(255,255,255,0.12);}
.header-title h1{font-size:16px;font-weight:800;}
.header-title span{font-size:11px;color:var(--brand);font-weight:600;}

.container{max-width:680px;margin:0 auto;padding:24px 18px;position:relative;z-index:1;}

.hero{text-align:center;margin-bottom:24px;}
.hero h2{font-size:24px;font-weight:800;letter-spacing:-0.5px;margin-bottom:6px;}
.hero p{font-size:13.5px;color:var(--text-muted);}

.card{
  background:var(--panel-card);
  backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 8px 30px rgba(0,0,0,0.4);
}

.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px;}
.form-group input, .form-group textarea{
  width:100%;background:#131318;border:1px solid var(--border);color:#fff;
  border-radius:12px;padding:12px 14px;font-size:14px;font-family:inherit;outline:none;
  transition:0.2s;
}
.form-group input:focus, .form-group textarea:focus{border-color:var(--brand);box-shadow:0 0 10px var(--brand-glow);}

.submit-btn{
  background:var(--brand-gradient);color:#000;font-weight:800;
  border:none;padding:14px;width:100%;border-radius:14px;font-size:14px;
  cursor:pointer;box-shadow:0 4px 15px var(--brand-glow);transition:0.2s;
}
.submit-btn:hover{opacity:0.95;transform:scale(1.01);}

.address-list{display:grid;gap:12px;margin-top:16px;}
.address-item{
  background:rgba(255,255,255,0.03);border:1px solid var(--border);
  border-radius:14px;padding:16px;cursor:pointer;transition:0.2s;
  display:flex;align-items:center;justify-content:space-between;
}
.address-item:hover{border-color:var(--brand);}
.address-item.selected{border-color:var(--brand);background:rgba(255,122,0,0.08);}
</style>
</head>
<body>

<div class="ambient-glow"></div>

<header class="header">
  <div class="header-left">
    <a href="index.html" class="back-btn" id="dynamicBackBtn">←</a>
    <div class="header-title">
      <h1>Delivery Address</h1>
      <span>RADA CREST Secure Checkout</span>
    </div>
  </div>
</header>

<div class="container">
  <div class="hero">
    <h2>Apna Pata Darj Karein</h2>
    <p>Jahan aapka order deliver kiya jana hai.</p>
  </div>

  <div class="card">
    <h3 style="font-size:16px;margin-bottom:14px;color:#fff;">Naya Address Jodein</h3>
    <form id="addressForm">
      <div class="form-group">
        <label>Poora Naam (Full Name)</label>
        <input type="text" id="fullName" placeholder="Aapka naam..." required>
      </div>
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" id="phoneNumber" placeholder="10-digit mobile number..." required>
      </div>
      <div class="form-group">
        <label>Pata (Address Details)</label>
        <textarea id="fullAddress" rows="3" placeholder="Ghar ka no., gali, landmark, shehar, pin code..." required></textarea>
      </div>
      <button type="submit" class="submit-btn">Save & Proceed ➔</button>
    </form>
  </div>

  <div id="savedAddressSection" style="display:none;">
    <h3 style="font-size:14px;font-weight:700;color:var(--brand);text-transform:uppercase;margin-bottom:10px;">Saved Addresses</h3>
    <div class="address-list" id="addressListContainer"></div>
  </div>
</div>

<script>
// URL se check kar rahe hain ki user kahan se aaya hai (jaise wishlist.html)
const urlParams = new URLSearchParams(window.location.search);
const returnPage = urlParams.get('return') || 'index.html';

// Back button ko dynamic kar diya hai taaki wahi wapas jaye jahan se user aaya tha
document.getElementById('dynamicBackBtn').href = returnPage;

document.getElementById('addressForm').addEventListener('submit', function(e){
  e.preventDefault();
  
  const addressData = {
    name: document.getElementById('fullName').value,
    phone: document.getElementById('phoneNumber').value,
    address: document.getElementById('fullAddress').value
  };

  // Address localStorage me save kar rahe hain
  localStorage.setItem('rc_selected_address', JSON.stringify(addressData));
  
  // Success message ya alert ke baad user ko uske original page par wapas bhej rahe hain
  alert('Address successfully saved!');
  window.location.href = returnPage;
});
</script>

</body>
</html>
