<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wishlist — RADA CREST</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg-deep:#060608;
  --panel-card:rgba(24, 24, 30, 0.75);
  --border:rgba(255, 255, 255, 0.08);
  --text:#ffffff;
  --text-muted:#9da0b0;
  --brand:#FF7A00;
  --brand-glow:rgba(255, 122, 0, 0.35);
  --brand-gradient:linear-gradient(135deg, #FF9433 0%, #FF5100 100%);
  --green:#3dd598;
  --red:#f87171;
}

body{
  background:var(--bg-deep);
  color:var(--text);
  font-family:'Plus Jakarta Sans', -apple-system, sans-serif;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
  padding-bottom:60px;
}

.ambient-glow{
  position:fixed;
  width:450px;height:450px;
  background:radial-gradient(circle, rgba(255,122,0,0.15) 0%, rgba(0,0,0,0) 70%);
  top:-100px;left:50%;
  transform:translateX(-50%);
  z-index:0;
  pointer-events:none;
}

.header{
  position:sticky;top:0;z-index:100;
  background:rgba(8, 8, 10, 0.85);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
}
.header-left{display:flex;align-items:center;gap:12px;}
.back-btn{
  background:rgba(255,255,255,0.06);
  border:1px solid var(--border);
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;color:#fff;
  text-decoration:none;font-size:16px;
  transition:all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.back-btn:hover{background:rgba(255,122,0,0.2);border-color:var(--brand);transform:translateX(-3px);}
.header-title h1{font-size:16px;font-weight:800;}
.header-title span{font-size:11px;color:var(--brand);font-weight:600;}

.container{max-width:680px;margin:0 auto;padding:24px 18px;position:relative;z-index:1;}

.hero{text-align:center;margin-bottom:24px;}
.hero h2{font-size:24px;font-weight:800;letter-spacing:-0.5px;margin-bottom:6px;}
.hero p{font-size:13.5px;color:var(--text-muted);}

.wishlist-grid{display:grid;gap:16px;}

.wish-card{
  background:var(--panel-card);
  backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px;
  display:flex;gap:16px;align-items:center;
  position:relative;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
.wish-card:hover{
  border-color:rgba(255,122,0,0.5);
  box-shadow:0 10px 35px rgba(255, 122, 0, 0.15);
  transform:translateY(-3px);
}

.wish-img-link{flex-shrink:0;}
.wish-img{
  width:90px;height:90px;border-radius:14px;background:#131318;
  object-fit:cover;border:1px solid var(--border);
  transition:transform 0.3s ease;
  display:block;
}
.wish-card:hover .wish-img{transform:scale(1.05);}

.wish-info{flex:1;}
.discount-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(61, 213, 152, 0.12);border:1px solid rgba(61, 213, 152, 0.3);
  color:var(--green);font-size:11px;font-weight:800;padding:3px 10px;
  border-radius:20px;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;
}
.wish-title{
  font-size:15px;font-weight:700;color:#fff;margin-bottom:4px;
  text-decoration:none;display:block;transition:0.2s;
}
.wish-title:hover{color:var(--brand);}

.price-box{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.old-price{font-size:13px;color:var(--text-muted);text-decoration:line-through;}
.new-price{font-size:16px;font-weight:800;color:var(--brand);}

.wish-actions{display:flex;gap:10px;}
.action-btn{
  background:var(--brand-gradient);color:#000;font-weight:800;
  border:none;padding:9px 18px;border-radius:12px;font-size:12.5px;
  cursor:pointer;text-decoration:none;box-shadow:0 4px 15px var(--brand-glow);
  transition:all 0.25s ease;display:inline-flex;align-items:center;gap:6px;
}
.action-btn:hover{transform:scale(1.03);opacity:0.95;}
.remove-btn{
  background:rgba(248,113,113,0.1);color:var(--red);border:1px solid rgba(248,113,113,0.3);
  font-weight:700;padding:9px 14px;border-radius:12px;font-size:12.5px;cursor:pointer;
  transition:all 0.25s ease;
}
.remove-btn:hover{background:rgba(248,113,113,0.25);}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
.empty-state span{font-size:48px;display:block;margin-bottom:14px;}
.empty-state h3{font-size:18px;color:#fff;margin-bottom:6px;}
</style>
</head>
<body>

<div class="ambient-glow"></div>

<header class="header">
  <div class="header-left">
    <a href="index.html" class="back-btn">←</a>
    <div class="header-title">
      <h1>My Wishlist</h1>
      <span>Special Discount Active</span>
    </div>
  </div>
</header>

<div class="container">
  <div class="hero">
    <h2>Saved Products & Offers</h2>
    <p>Wishlist me save kiye gaye products par automatic discount mil raha hai!</p>
  </div>

  <div class="wishlist-grid" id="wishlistContainer">
    <div class="empty-state">
      <span>🛍️</span>
      <h3>Aapki Wishlist Khaali Hai</h3>
      <p>Store se koi product wishlist me add karein.</p>
      <a href="index.html" class="action-btn" style="margin-top:16px;">Store Par Jayein</a>
    </div>
  </div>
</div>

<script>
function getActiveUserSuffix() {
    const user = JSON.parse(localStorage.getItem('rc_user')) || null;
    if (user) {
        const uid = user.email || user.phone || user.id;
        if (uid) return String(uid).replace(/[^a-zA-Z0-9]/g, '_');
    }
    return 'guest_user';
}

function getUserKeys() {
    const suffix = getActiveUserSuffix();
    return {
        selectedKey: `rc_selected_address_${suffix}`,
        activeKey: `rc_address_${suffix}`
    };
}

function loadWishlist(){
  const container = document.getElementById('wishlistContainer');
  let wishlist = JSON.parse(localStorage.getItem('rc_wishlist')) || [];

  if(wishlist.length === 0){
    container.innerHTML = `
      <div class="empty-state">
        <span>🛍️</span>
        <h3>Aapki Wishlist Khaali Hai</h3>
        <p>Store se koi product wishlist me add karein.</p>
        <a href="index.html" class="action-btn" style="margin-top:16px;">Store Par Jayein</a>
      </div>
    `;
    return;
  }

  const discountPercent = 15; 

  container.innerHTML = wishlist.map((item, index) => {
    const originalPrice = parseFloat(item.price) || 500;
    const discountedPrice = Math.round(originalPrice * (1 - discountPercent / 100));
    // Product page link (agar item me id ya link hai toh wo use karega, nahi toh default product.html)
    const productLink = item.link || item.url || `product.html?name=${encodeURIComponent(item.name || '')}`;

    return `
      <div class="wish-card" id="wish-item-${index}">
        <a href="${productLink}" class="wish-img-link">
          <img src="${item.image || 'https://via.placeholder.com/90'}" class="wish-img" alt="Product">
        </a>
        <div class="wish-info">
          <div class="discount-badge">🔥 Wishlist Special: ${discountPercent}% OFF</div>
          <a href="${productLink}" class="wish-title">${item.name || 'RADA CREST LED Bulb'}</a>
          <div class="price-box">
            <span class="old-price">₹${originalPrice}</span>
            <span class="new-price">₹${discountedPrice}</span>
          </div>
          <div class="wish-actions">
            <button class="action-btn" onclick="proceedToBuy('${item.name}', ${discountedPrice}, '${item.image || ''}')">⚡ Buy Now</button>
            <button class="remove-btn" onclick="removeItem(${index})">✕ Remove</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

window.removeItem = function(index){
  let wishlist = JSON.parse(localStorage.getItem('rc_wishlist')) || [];
  wishlist.splice(index, 1);
  localStorage.setItem('rc_wishlist', JSON.stringify(wishlist));
  loadWishlist();
};

window.proceedToBuy = function(name, finalPrice, image){
  // Checkout item save kar rahe hain
  localStorage.setItem('rc_checkout_item', JSON.stringify({ name: name, price: finalPrice, image: image }));
  
  // Check karenge ki user ka koi address already selected hai ya nahi
  const keys = getUserKeys();
  const selectedAddr = localStorage.getItem(keys.selectedKey) || localStorage.getItem(keys.activeKey);

  if (selectedAddr) {
    // Agar address pehle se hai, toh seedha buy.html par chale jayenge
    window.location.href = 'buy.html';
  } else {
    // Agar address nahi hai, toh address.html par bhejenge aur wapas buy.html par lane ke liye return set karenge
    window.location.href = 'addresses.html?return=buy.html';
  }
};

document.addEventListener('DOMContentLoaded', loadWishlist);
</script>

</body>
</html>
