<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wishlist — RADA CREST</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg-deep:#060608;
  --panel-card:rgba(24, 24, 30, 0.8);
  --border:rgba(255, 255, 255, 0.08);
  --text:#ffffff;
  --text-muted:#9da0b0;
  --brand:#FF7A00;
  --brand-glow:rgba(255, 122, 0, 0.4);
  --brand-gradient:linear-gradient(135deg, #FF9433 0%, #FF5100 100%);
  --green:#3dd598;
  --red:#f87171;
}

body{
  background:var(--bg-deep);
  color:var(--text);
  font-family:'Plus Jakarta Sans', -apple-system, sans-serif;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
  padding-bottom:60px;
}

/* Floating Alive Cyber Glow Animation */
.ambient-glow{
  position:fixed;
  width:450px;height:450px;
  background:radial-gradient(circle, rgba(255,122,0,0.18) 0%, rgba(0,0,0,0) 70%);
  top:-100px;left:50%;
  transform:translateX(-50%);
  z-index:0;
  pointer-events:none;
  animation: floatGlow 8s ease-in-out infinite alternate;
}
@keyframes floatGlow {
  0% { transform: translateX(-50%) translateY(0px) scale(1); }
  100% { transform: translateX(-50%) translateY(-20px) scale(1.08); }
}

.header{
  position:sticky;top:0;z-index:100;
  background:rgba(8, 8, 10, 0.85);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
}
.header-left{display:flex;align-items:center;gap:12px;}
.back-btn{
  background:rgba(255,255,255,0.06);
  border:1px solid var(--border);
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;color:#fff;
  text-decoration:none;font-size:16px;
  transition:all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.back-btn:hover{background:rgba(255,122,0,0.2);border-color:var(--brand);transform:translateX(-3px);}
.header-title h1{font-size:16px;font-weight:800;}
.header-title span{font-size:11px;color:var(--brand);font-weight:600;}

.container{max-width:680px;margin:0 auto;padding:24px 18px;position:relative;z-index:1;}

.hero{text-align:center;margin-bottom:24px; animation: fadeInDown 0.5s ease;}
.hero h2{font-size:24px;font-weight:800;letter-spacing:-0.5px;margin-bottom:6px;}
.hero p{font-size:13.5px;color:var(--text-muted);}

@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.wishlist-grid{display:grid;gap:16px;}

.wish-card{
  background:var(--panel-card);
  backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px;
  display:flex;gap:16px;align-items:center;
  position:relative;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  animation: cardEntrance 0.4s ease backwards;
}
.wish-card:hover{
  border-color:rgba(255,122,0,0.5);
  box-shadow:0 12px 40px rgba(255, 122, 0, 0.18);
  transform:translateY(-3px);
}
@keyframes cardEntrance {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.wish-img-link{flex-shrink:0;}
.wish-img{
  width:90px;height:90px;border-radius:14px;background:#131318;
  object-fit:cover;border:1px solid var(--border);
  transition:transform 0.3s ease;
  display:block;
}
.wish-card:hover .wish-img{transform:scale(1.05);}

.wish-info{flex:1;}

.discount-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(61, 213, 152, 0.12);border:1px solid rgba(61, 213, 152, 0.3);
  color:var(--green);font-size:11px;font-weight:800;padding:3px 10px;
  border-radius:20px;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;
}

.wish-title{
  font-size:15px;font-weight:700;color:#fff;margin-bottom:4px;
  text-decoration:none;display:block;transition:0.2s;
}
.wish-title:hover{color:var(--brand);}

.price-box{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.old-price{font-size:13px;color:var(--text-muted);text-decoration:line-through;}
.new-price{font-size:16px;font-weight:800;color:var(--brand);}

.wish-actions{display:flex;gap:10px;}
.action-btn{
  background:var(--brand-gradient);color:#000;font-weight:800;
  border:none;padding:9px 18px;border-radius:12px;font-size:12.5px;
  cursor:pointer;text-decoration:none;box-shadow:0 4px 15px var(--brand-glow);
  transition:all 0.25s ease;display:inline-flex;align-items:center;gap:6px;
}
.action-btn:hover{transform:scale(1.03);opacity:0.95;}
.remove-btn{
  background:rgba(248,113,113,0.1);color:var(--red);border:1px solid rgba(248,113,113,0.3);
  font-weight:700;padding:9px 14px;border-radius:12px;font-size:12.5px;cursor:pointer;
  transition:all 0.25s ease;
}
.remove-btn:hover{background:rgba(248,113,113,0.25);}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
.empty-state span{font-size:48px;display:block;margin-bottom:14px;}
.empty-state h3{font-size:18px;color:#fff;margin-bottom:6px;}
</style>
</head>
<body>

<div class="ambient-glow"></div>

<header class="header">
  <div class="header-left">
    <a href="index.html" class="back-btn">←</a>
    <div class="header-title">
      <h1>My Wishlist</h1>
      <span>Saved Items</span>
    </div>
  </div>
</header>

<div class="container">
  <div class="hero">
    <h2>Saved Products & Offers</h2>
    <p>Aapke pasandida products yahan secure hain.</p>
  </div>

  <div class="wishlist-grid" id="wishlistContainer">
    <div class="empty-state">
      <span>🛍️</span>
      <h3>Aapki Wishlist Khaali Hai</h3>
      <p>Store se koi product wishlist me add karein.</p>
      <a href="index.html" class="action-btn" style="margin-top:16px;">Store Par Jayein</a>
    </div>
  </div>
</div>

<script>
function getActiveUserSuffix() {
    const user = JSON.parse(localStorage.getItem('rc_user')) || null;
    if (user) {
        const uid = user.email || user.phone || user.id;
        if (uid) return String(uid).replace(/[^a-zA-Z0-9]/g, '_');
    }
    return 'guest_user';
}

function getUserKeys() {
    const suffix = getActiveUserSuffix();
    return {
        selectedKey: `rc_selected_address_${suffix}`,
        activeKey: `rc_address_${suffix}`
    };
}

function getDeterministicRandom(seedStr) {
    let hash = 0;
    for (let i = 0; i < seedStr.length; i++) {
        hash = seedStr.charCodeAt(i) + ((hash << 5) - hash);
    }
    return Math.abs(Math.sin(hash));
}

function loadWishlist(){
  const container = document.getElementById('wishlistContainer');
  let wishlist = JSON.parse(localStorage.getItem('rc_wishlist')) || [];
  const now = Date.now();

  if(wishlist.length === 0){
    container.innerHTML = `
      <div class="empty-state">
        <span>🛍️</span>
        <h3>Aapki Wishlist Khaali Hai</h3>
        <p>Store se koi product wishlist me add karein.</p>
        <a href="index.html" class="action-btn" style="margin-top:16px;">Store Par Jayein</a>
      </div>
    `;
    return;
  }

  let adminActiveDiscountsReport = [];

  container.innerHTML = wishlist.map((item, index) => {
    if (!item.added_at) {
      item.added_at = now - (Math.floor(Math.random() * 12) * 24 * 60 * 60 * 1000);
      localStorage.setItem('rc_wishlist', JSON.stringify(wishlist));
    }

    const ageMs = now - item.added_at;
    const ageDays = Math.floor(ageMs / (1000 * 60 * 60 * 24));
    const isTimeElapsed = ageDays >= 7; // Backend secret check: 7 days elapsed

    const seed = String(item.id || item.name || index);
    const randomVal = getDeterministicRandom(seed);
    const isRandomSelected = randomVal < 0.45;

    const originalPrice = parseFloat(item.price) || 500;
    let hasDiscount = isTimeElapsed && isRandomSelected;
    
    const discountPercent = hasDiscount ? Math.floor(randomVal * 15) + 10 : 0; 
    const discountedPrice = hasDiscount ? Math.round(originalPrice * (1 - discountPercent / 100)) : originalPrice;

    if (hasDiscount) {
      adminActiveDiscountsReport.push({ name: item.name, discount: discountPercent, ageDays: ageDays });
    }

    const productLink = item.link || item.url || `product.html?name=${encodeURIComponent(item.name || '')}`;
    const safeImage = item.image || '';
    const safeName = item.name || 'RADA CREST Product';

    return `
      <div class="wish-card" id="wish-item-${index}" style="animation-delay: ${index * 0.08}s;">
        <a href="${productLink}" class="wish-img-link">
          <img src="${safeImage || 'https://via.placeholder.com/90'}" class="wish-img" alt="Product">
        </a>
        <div class="wish-info">
          ${hasDiscount ? `
            <div class="discount-badge"><i class="fa-solid fa-fire"></i> Special Offer: ${discountPercent}% OFF</div>
          ` : ``}
          <a href="${productLink}" class="wish-title">${safeName}</a>
          <div class="price-box">
            <span class="old-price">₹${originalPrice}</span>
            <span class="new-price">₹${discountedPrice}</span>
          </div>
          <div class="wish-actions">
            <button class="action-btn" onclick="proceedToBuy('${safeName.replace(/'/g, "\\'")}', ${discountedPrice}, '${safeImage}')">⚡ Buy Now</button>
            <button class="remove-btn" onclick="removeItem(${index})">✕ Remove</button>
          </div>
        </div>
      </div>
    `;
  }).join('');

  localStorage.setItem('rc_admin_wishlist_discounts', JSON.stringify(adminActiveDiscountsReport));
}

window.removeItem = function(index){
  let wishlist = JSON.parse(localStorage.getItem('rc_wishlist')) || [];
  wishlist.splice(index, 1);
  localStorage.setItem('rc_wishlist', JSON.stringify(wishlist));
  loadWishlist();
};

window.proceedToBuy = function(name, finalPrice, image){
  const checkoutData = { name: name, price: finalPrice, image: image };
  localStorage.setItem('rc_checkout_item', JSON.stringify(checkoutData));
  
  const queryParam = `?name=${encodeURIComponent(name)}&price=${finalPrice}&image=${encodeURIComponent(image)}`;

  const keys = getUserKeys();
  const selectedAddr = localStorage.getItem(keys.selectedKey) || localStorage.getItem(keys.activeKey);

  if (selectedAddr) {
    window.location.href = 'buy.html' + queryParam;
  } else {
    window.location.href = 'addresses.html?return=' + encodeURIComponent('buy.html' + queryParam);
  }
};

document.addEventListener('DOMContentLoaded', loadWishlist);
</script>

</body>
</html>
