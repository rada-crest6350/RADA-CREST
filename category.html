<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Products — RADA CREST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="home.css">

  <style>
    :root {
      --bg-deep: #060608;
      --panel-card: rgba(24, 24, 32, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --text-muted: #9da0b0;
      --brand: #FF7A00;
      --brand-glow: rgba(255, 122, 0, 0.35);
      --brand-gradient: linear-gradient(135deg, #FF9433 0%, #FF5100 100%);
    }

    body {
      background: var(--bg-deep);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Ambient Glow Background */
    .ambient-glow {
      position: fixed;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255,122,0,0.12) 0%, rgba(0,0,0,0) 70%);
      top: 20%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }

    .category-header {
      background: var(--panel-card);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .category-title-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      width: 40px; height: 40px;
      border-radius: 12px;
      display: grid; place-items: center;
      color: #fff; text-decoration: none;
      transition: 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .back-btn:hover {
      background: var(--brand-gradient);
      border-color: var(--brand);
      color: #000;
      box-shadow: 0 0 15px var(--brand-glow);
      transform: translateY(-2px);
    }

    .category-title-wrap h1 {
      font-size: 18px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.5px;
    }
    .category-title-wrap p {
      font-size: 12px;
      color: var(--text-muted);
      margin: 2px 0 0 0;
    }

    .category-main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 16px;
      position: relative;
      z-index: 1;
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .category-products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    /* Premium Product Card with Glow Animation */
    .product-card-item {
      background: var(--panel-card);
      backdrop-filter: blur(20px);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      cursor: pointer;
    }
    .product-card-item:hover {
      border-color: var(--brand);
      background: rgba(255, 122, 0, 0.04);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px var(--brand-glow);
    }

    .product-img-wrap {
      width: 100%;
      height: 160px;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255,255,255,0.04);
    }
    .product-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: 0.4s ease;
    }
    .product-card-item:hover .product-img-wrap img {
      transform: scale(1.05);
    }

    .product-info h3 {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
      color: var(--text);
    }
    .product-info p {
      font-size: 14px;
      color: var(--brand);
      font-weight: 800;
      margin: 4px 0 0 0;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
    .empty-state i {
      font-size: 42px;
      color: var(--brand);
      margin-bottom: 12px;
      animation: pulseGlow 2s infinite;
    }
    @keyframes pulseGlow {
      0% { text-shadow: 0 0 0 var(--brand-glow); }
      50% { text-shadow: 0 0 20px var(--brand); }
      100% { text-shadow: 0 0 0 var(--brand-glow); }
    }
    .empty-state h3 {
      font-size: 16px;
      color: #fff;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <!-- Header -->
  <header class="category-header">
    <div class="category-title-wrap">
      <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
      <div>
        <h1 id="categoryHeading">Loading Category...</h1>
        <p>Rada Crest Collection</p>
      </div>
    </div>
    <a href="cart.html" class="back-btn" title="Cart"><i class="fa-solid fa-cart-shopping"></i></a>
  </header>

  <!-- Main Content -->
  <main class="category-main-content">
    <div class="category-products-grid" id="categoryProductsGrid">
      <!-- Products matching this category will load here dynamically -->
    </div>
  </main>

  <!-- Script to load products matching selected category -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const categoryName = urlParams.get('category') || "All Products";
      
      document.getElementById('categoryHeading').textContent = categoryName;

      const productsGrid = document.getElementById('categoryProductsGrid');
      const allProducts = JSON.parse(localStorage.getItem('rc_products')) || [];
      const filteredProducts = categoryName === "all" ? allProducts : allProducts.filter(p => p.category === categoryName);

      if(filteredProducts.length === 0) {
        productsGrid.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-box-open"></i>
            <h3>No products found in '${categoryName}'</h3>
            <p>Check back later or explore other categories.</p>
          </div>
        `;
        return;
      }

      productsGrid.innerHTML = '';
      filteredProducts.forEach(product => {
        const itemCard = document.createElement('div');
        itemCard.className = 'product-card-item';
        
        itemCard.innerHTML = `
          <div class="product-img-wrap">
            <img src="${product.image || 'assets/logo.png'}" onerror="this.src='assets/logo.png'">
          </div>
          <div class="product-info">
            <h3>${product.name}</h3>
            <p>₹${product.price || '0'}</p>
          </div>
        `;
        productsGrid.appendChild(itemCard);
      });
    });
  </script>
</body>
</html>
