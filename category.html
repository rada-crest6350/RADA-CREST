<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Collection — RADA CREST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="home.css">

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-deep: #060608;
      --panel-card: rgba(20, 20, 28, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 122, 0, 0.6);
      --text: #ffffff;
      --text-muted: #9da0b0;
      --brand: #FF7A00;
      --brand-glow: rgba(255, 122, 0, 0.4);
      --brand-gradient: linear-gradient(135deg, #FF9433 0%, #FF5100 100%);
    }

    body {
      background: var(--bg-deep);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .cyber-grid-glow {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(255, 122, 0, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(255, 81, 0, 0.06) 0%, transparent 40%);
      z-index: 0;
      pointer-events: none;
    }

    .category-header {
      background: rgba(6, 6, 8, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .category-title-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      width: 42px; height: 42px;
      border-radius: 12px;
      display: grid; place-items: center;
      color: #fff; text-decoration: none;
      transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .back-btn:hover {
      background: var(--brand-gradient);
      border-color: var(--brand);
      color: #000;
      box-shadow: 0 0 20px var(--brand-glow);
      transform: translateY(-2px);
    }

    .category-title-wrap h1 {
      font-size: 18px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #fff, #9da0b0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .category-title-wrap p {
      font-size: 11.5px;
      color: var(--brand);
      font-weight: 600;
      margin: 2px 0 0 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .category-main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 16px;
      position: relative;
      z-index: 1;
      animation: pageEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pageEntrance {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .category-products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
    }

    .product-card-item {
      background: var(--panel-card);
      backdrop-filter: blur(16px);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .product-card-item::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 20px;
      background: var(--brand-gradient);
      z-index: -1;
      opacity: 0;
      transition: 0.4s ease;
    }

    .product-card-item:hover {
      transform: translateY(-6px) scale(1.01);
      border-color: transparent;
      box-shadow: 0 20px 40px var(--brand-glow), 0 0 20px rgba(255,122,0,0.2);
    }

    .product-card-item:hover::before {
      opacity: 1;
    }

    .product-img-wrap {
      width: 100%;
      height: 180px;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,0.03);
      position: relative;
    }

    .product-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .product-card-item:hover .product-img-wrap img {
      transform: scale(1.08);
    }

    .discount-badge {
      position: absolute;
      top: 10px; left: 10px;
      background: rgba(6, 6, 8, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid var(--brand);
      color: var(--brand);
      font-size: 10.5px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 8px;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .product-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 4px;
    }

    .product-info h3 {
      font-size: 14.5px;
      font-weight: 700;
      margin: 0;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: 0.2s;
    }

    .product-card-item:hover .product-info h3 {
      color: #FF9433;
    }

    .pricing-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .price-box {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .current-price {
      font-size: 16px;
      color: var(--brand);
      font-weight: 800;
      letter-spacing: -0.5px;
      text-shadow: 0 0 15px var(--brand-glow);
    }

    .original-price {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .tap-action-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.3s;
      width: 100%;
      margin-top: 4px;
    }

    .product-card-item:hover .tap-action-btn {
      background: var(--brand-gradient);
      border-color: var(--brand);
      color: #000;
      box-shadow: 0 0 15px var(--brand-glow);
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
    .empty-state i {
      font-size: 48px;
      color: var(--brand);
      margin-bottom: 16px;
      animation: pulseGlow 2s infinite;
    }
    @keyframes pulseGlow {
      0% { transform: scale(1); filter: drop-shadow(0 0 0 var(--brand-glow)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 20px var(--brand)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 0 var(--brand-glow)); }
    }
    .empty-state h3 {
      font-size: 18px;
      color: #fff;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <div class="cyber-grid-glow"></div>

  <!-- Header -->
  <header class="category-header">
    <div class="category-title-wrap">
      <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
      <div>
        <h1 id="categoryHeading">Loading Collection...</h1>
        <p>RADA CREST High-Tech Store</p>
      </div>
    </div>
    <a href="cart.html" class="back-btn" title="Cart"><i class="fa-solid fa-cart-shopping"></i></a>
  </header>

  <!-- Main Content Grid -->
  <main class="category-main-content">
    <div class="category-products-grid" id="categoryProductsGrid">
      <!-- High-tech product cards inject dynamically here -->
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://ynpsnkvrjhaxdynmurzj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlucHNua3ZyamhheGR5bm11cnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNTc5NjAsImV4cCI6MjEwMTgzMzk2MH0.I3xFYthE0JNfGnD6N1BaNBybSq7m0G6MRILzq3NXihg';
    const supabaseCategoryClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const categoryName = decodeURIComponent(urlParams.get('category') || "").trim();
      
      document.getElementById('categoryHeading').textContent = categoryName || "All Products";
      const productsGrid = document.getElementById('categoryProductsGrid');

      let allProducts = [];

      try {
        if (supabaseCategoryClient) {
          const { data, error } = await supabaseCategoryClient.from('products').select('*');
          if (!error && data) {
            allProducts = data;
          }
        }
      } catch (err) {
        console.error("Supabase fetch error:", err);
      }

      // Fallback to localStorage if Supabase fails or is empty
      if (allProducts.length === 0) {
        allProducts = JSON.parse(localStorage.getItem('rc_products')) || JSON.parse(localStorage.getItem('products')) || [];
      }

      // Case-insensitive filtering matching category name
      const filteredProducts = (!categoryName || categoryName.toLowerCase() === "all" || categoryName.toLowerCase() === "all products") 
        ? allProducts 
        : allProducts.filter(p => p.category && p.category.trim().toLowerCase() === categoryName.toLowerCase());

      if(filteredProducts.length === 0) {
        productsGrid.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-microchip"></i>
            <h3>No products found in '${categoryName}'</h3>
            <p>Admin panel se is category me product add karein.</p>
          </div>
        `;
        return;
      }

      productsGrid.innerHTML = '';
      filteredProducts.forEach(product => {
        const itemCard = document.createElement('div');
        itemCard.className = 'product-card-item';
        
        const price = Number(product.price) || 999;
        const originalPrice = Number(product.old_price) || Math.round(price * 1.3);
        const imageUrl = product.image || (product.images && product.images[0]) || 'assets/logo.png';
        
        itemCard.innerHTML = `
          <div class="product-img-wrap">
            <span class="discount-badge">30% OFF</span>
            <img src="${imageUrl}" onerror="this.src='assets/logo.png'">
          </div>
          <div class="product-info">
            <h3>${product.name || 'Smart LED Fixture'}</h3>
            <div class="pricing-row">
              <div class="price-box">
                <span class="current-price">₹${price}</span>
                <span class="original-price">₹${originalPrice}</span>
              </div>
            </div>
            <button type="button" class="tap-action-btn">
              <span>View Product</span> <i class="fa-solid fa-arrow-right-long"></i>
            </button>
          </div>
        `;
        
        // Safely redirecting to index.html with product name to avoid 404 errors
        itemCard.onclick = () => {
          window.location.href = `index.html?product=${encodeURIComponent(product.name)}`;
        };

        productsGrid.appendChild(itemCard);
      });
    });
  </script>
</body>
</html>
