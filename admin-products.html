<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products — RADA CREST</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script></head><body><main class="section"><a href="admin-dashboard.html">← Dashboard</a><h1>Products</h1><div id="list"></div></main><script>
async function go(){const {data:{user}}=await supabaseClient.auth.getUser();if(!user)return location.href='admin.html';const {data:p}=await supabaseClient.from('profiles').select('role').eq('id',user.id).single();if(p?.role!=='admin')return location.href='admin.html';const {data,error}=await supabaseClient.from('products').select('*').order('id');if(error)return list.textContent=error.message;list.innerHTML=data.map(x=>`<div class="cart-row"><div><b>${x.name}</b><small>${x.category} · Stock ${x.stock} · ₹${x.price}</small></div><strong>${x.active?'LIVE':'OFF'}</strong></div>`).join('')}go();
</script></body></html>
