<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Products — RADA CREST</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>

<style>

.admin-products{
  max-width:1100px;
  margin:auto;
}

.form-box{
  margin-top:25px;
  padding:25px;
  border:1px solid #ddd;
  border-radius:18px;
  background:#fff;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.form-box label{
  display:block;
  margin:12px 0 6px;
  font-weight:700;
}

.form-box input,
.form-box textarea,
.form-box select{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  box-sizing:border-box;
}

.form-box textarea{
  min-height:100px;
  resize:vertical;
}

.full-field{
  grid-column:1/-1;
}

.preview{
  margin-top:10px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.preview img{
  width:80px;
  height:80px;
  object-fit:contain;
  border:1px solid #ddd;
  border-radius:10px;
}

.product-admin-card{
  margin-top:15px;
  padding:18px;
  border:1px solid #ddd;
  border-radius:16px;
  display:flex;
  gap:15px;
  align-items:center;
}

.product-admin-image{
  width:90px;
  height:90px;
  border-radius:12px;
  background:#f5f5f5;
  display:grid;
  place-items:center;
  overflow:hidden;
  flex:none;
}

.product-admin-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.product-admin-info{
  flex:1;
}

.product-admin-info h3{
  margin:0 0 5px;
}

.product-admin-info small{
  display:block;
  margin:3px 0;
}

.price-line{
  margin-top:8px;
}

.mrp{
  color:#888;
  text-decoration:line-through;
  margin-right:8px;
}

.discount{
  font-weight:800;
  margin-left:8px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.actions button{
  padding:9px 13px;
  border:0;
  border-radius:8px;
  cursor:pointer;
}

.edit-btn{
  background:#111;
  color:#fff;
}

.delete-btn{
  background:#ffe5e5;
  color:#c00;
}

.toggle-btn{
  background:#eee;
}

.status-live{
  color:#16833b;
  font-weight:800;
}

.status-off{
  color:#c00;
  font-weight:800;
}

.msg{
  margin-top:15px;
  font-weight:600;
}

@media(max-width:700px){

  .form-grid{
    grid-template-columns:1fr;
  }

  .full-field{
    grid-column:auto;
  }

  .product-admin-card{
    align-items:flex-start;
    flex-direction:column;
  }

  .product-admin-image{
    width:100%;
    height:180px;
  }

}

</style>

</head>


<body>

<main class="section admin-products">

<a href="admin-dashboard.html">
← Dashboard
</a>

<h1>
Product Management
</h1>

<p>
Add, edit and manage your RADA CREST products.
</p>


<!-- PRODUCT FORM -->

<section class="form-box">

<h2 id="formTitle">
Add New Product
</h2>


<div class="form-grid">


<div class="full-field">

<label>
Product Name
</label>

<input
  id="name"
  type="text"
  placeholder="Example: RADA CREST 9W LED Bulb"
>

</div>


<div>

<label>
Category
</label>

<input
  id="category"
  type="text"
  placeholder="LED Bulb"
>

</div>


<div>

<label>
SKU
</label>

<input
  id="sku"
  type="text"
  placeholder="RC-LED-9W"
>

</div>


<div>

<label>
MRP
</label>

<input
  id="mrp"
  type="number"
  min="0"
  step="0.01"
  placeholder="999"
>

</div>


<div>

<label>
Selling Price
</label>

<input
  id="price"
  type="number"
  min="0"
  step="0.01"
  placeholder="799"
>

</div>


<div>

<label>
Stock
</label>

<input
  id="stock"
  type="number"
  min="0"
  step="1"
  placeholder="100"
>

</div>


<div>

<label>
Warranty
</label>

<input
  id="warranty"
  type="text"
  placeholder="1 Year"
>

</div>


<div class="full-field">

<label>
Product Image URLs
</label>

<textarea
  id="image_url"
  placeholder="Paste image URLs here. One URL per line."
></textarea>

<div
  id="preview"
  class="preview"
></div>

</div>


<div class="full-field">

<label>
Description
</label>

<textarea
  id="description"
  placeholder="Write complete product details..."
></textarea>

</div>


<div>

<label>
Product Status
</label>

<select id="active">

<option value="true">
LIVE
</option>

<option value="false">
OFF
</option>

</select>

</div>


</div>


<div
  id="discountPreview"
  style="margin-top:15px;font-weight:800"
>
Discount: 0%
</div>


<div class="actions">

<button
  class="btn"
  type="button"
  onclick="saveProduct()"
>
Save Product
</button>


<button
  id="cancelBtn"
  type="button"
  onclick="resetForm()"
  style="display:none"
>
Cancel Edit
</button>

</div>


<div
  id="msg"
  class="msg"
></div>

</section>


<!-- PRODUCT LIST -->

<section style="margin-top:35px">

<h2>
All Products
</h2>

<div id="list">

<p>
Loading products...
</p>

</div>

</section>


</main>


<script>

let editingId = null;

let allProducts = [];


const nameInput =
  document.getElementById("name");

const categoryInput =
  document.getElementById("category");

const skuInput =
  document.getElementById("sku");

const mrpInput =
  document.getElementById("mrp");

const priceInput =
  document.getElementById("price");

const stockInput =
  document.getElementById("stock");

const warrantyInput =
  document.getElementById("warranty");

const imageInput =
  document.getElementById("image_url");

const descriptionInput =
  document.getElementById("description");

const activeInput =
  document.getElementById("active");

const preview =
  document.getElementById("preview");

const discountPreview =
  document.getElementById("discountPreview");

const msg =
  document.getElementById("msg");


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function calculateDiscount(){

  const mrp =
    Number(mrpInput.value || 0);

  const price =
    Number(priceInput.value || 0);


  if(
    mrp > 0 &&
    price >= 0 &&
    price < mrp
  ){

    const discount =
      Math.round(
        ((mrp-price)/mrp)*100
      );

    discountPreview.textContent =
      "Discount: " +
      discount +
      "% OFF";

  }else{

    discountPreview.textContent =
      "Discount: 0%";

  }

}


mrpInput.addEventListener(
  "input",
  calculateDiscount
);

priceInput.addEventListener(
  "input",
  calculateDiscount
);


function getImageUrls(){

  return imageInput.value
    .split(/[\n,]+/)
    .map(
      x => x.trim()
    )
    .filter(Boolean);

}


function showPreview(){

  const urls =
    getImageUrls();


  preview.innerHTML =
    urls.map(
      url => `

        <img
          src="${escapeHtml(url)}"
          alt="Preview"
          onerror="this.style.display='none'"
        >

      `
    ).join("");

}


imageInput.addEventListener(
  "input",
  showPreview
);


async function checkAdmin(){

  const {
    data:{
      user
    }
  } =
    await supabaseClient
      .auth
      .getUser();


  if(!user){

    location.href =
      "admin.html";

    return false;

  }


  const {
    data:p
  } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id",user.id)
      .single();


  if(p?.role !== "admin"){

    location.href =
      "admin.html";

    return false;

  }


  return true;

}


async function loadProducts(){

  const list =
    document.getElementById(
      "list"
    );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select("*")
      .order("id");


  if(error){

    list.innerHTML =
      `<p>${escapeHtml(error.message)}</p>`;

    return;

  }


  allProducts =
    data || [];


  if(!allProducts.length){

    list.innerHTML =
      "<p>No products yet.</p>";

    return;

  }


  list.innerHTML =
    allProducts.map(
      product => {

        const images =
          String(
            product.image_url || ""
          )
          .split(/[\n,]+/)
          .map(
            x => x.trim()
          )
          .filter(Boolean);


        const firstImage =
          images[0] || "";


        const mrp =
          Number(
            product.old_price || 0
          );


        const price =
          Number(
            product.price || 0
          );


        let discount =
          Number(
            product.discount_percent || 0
          );


        if(
          mrp > price &&
          mrp > 0
        ){

          discount =
            Math.round(
              ((mrp-price)/mrp)*100
            );

        }


        return `

          <div
            class="product-admin-card"
          >


            <div
              class="product-admin-image"
            >

              ${
                firstImage

                ?

                `<img
                  src="${escapeHtml(firstImage)}"
                  alt="${escapeHtml(product.name)}"
                  onerror="this.style.display='none'"
                >`

                :

                "💡"
              }

            </div>


            <div
              class="product-admin-info"
            >

              <h3>
                ${escapeHtml(product.name)}
              </h3>


              <small>
                ${escapeHtml(product.category || "No category")}
              </small>


              <small>
                SKU:
                ${escapeHtml(product.sku || "—")}
              </small>


              <small>
                Stock:
                ${Number(product.stock || 0)}
              </small>


              <div
                class="price-line"
              >

                ${
                  mrp > price

                  ?

                  `<span class="mrp">
                    ₹${mrp.toLocaleString("en-IN")}
                  </span>`

                  :

                  ""
                }


                <b>
                  ₹${price.toLocaleString("en-IN")}
                </b>


                ${
                  discount > 0

                  ?

                  `<span class="discount">
                    ${discount}% OFF
                  </span>`

                  :

                  ""
                }

              </div>


              <small
                class="${
                  product.active
                    ? "status-live"
                    : "status-off"
                }"
              >

                ${
                  product.active
                    ? "● LIVE"
                    : "● OFF"
                }

              </small>

            </div>


            <div class="actions">

              <button
                class="edit-btn"
                onclick="editProduct(${product.id})"
              >
                Edit
              </button>


              <button
                class="toggle-btn"
                onclick="toggleProduct(${product.id},${product.active})"
              >
                ${
                  product.active
                    ? "Turn OFF"
                    : "Make LIVE"
                }
              </button>


              <button
                class="delete-btn"
                onclick="deleteProduct(${product.id})"
              >
                Delete
              </button>

            </div>


          </div>

        `;

      }
    ).join("");

}


async function saveProduct(){

  msg.textContent =
    "";


  const name =
    nameInput.value.trim();

  const category =
    categoryInput.value.trim();

  const sku =
    skuInput.value.trim();

  const mrp =
    Number(
      mrpInput.value || 0
    );

  const price =
    Number(
      priceInput.value || 0
    );

  const stock =
    Number(
      stockInput.value || 0
    );

  const warranty =
    warrantyInput.value.trim();

  const imageUrl =
    imageInput.value.trim();

  const description =
    descriptionInput.value.trim();

  const active =
    activeInput.value === "true";


  if(!name){

    msg.textContent =
      "Product name is required.";

    return;

  }


  if(price <= 0){

    msg.textContent =
      "Selling price must be greater than 0.";

    return;

  }


  if(mrp > 0 && mrp < price){

    msg.textContent =
      "MRP cannot be lower than selling price.";

    return;

  }


  if(stock < 0){

    msg.textContent =
      "Stock cannot be negative.";

    return;

  }


  let discount =
    0;


  if(
    mrp > 0 &&
    price < mrp
  ){

    discount =
      Math.round(
        ((mrp-price)/mrp)*100
      );

  }


  const payload = {

    name,

    category:
      category || null,

    sku:
      sku || null,

    old_price:
      mrp || null,

    price,

    stock,

    warranty:
      warranty || null,

    image_url:
      imageUrl || null,

    description:
      description || null,

    discount_percent:
      discount,

    active

  };


  let result;


  if(editingId){

    result =
      await supabaseClient
        .from("products")
        .update(payload)
        .eq("id",editingId);

  }else{

    result =
      await supabaseClient
        .from("products")
        .insert(payload);

  }


  if(result.error){

    msg.textContent =
      result.error.message;

    return;

  }


  msg.textContent =
    editingId
      ? "Product updated successfully."
      : "Product added successfully.";


  resetForm();

  loadProducts();

}


function editProduct(id){

  const product =
    allProducts.find(
      x =>
        Number(x.id) ===
        Number(id)
    );


  if(!product) return;


  editingId =
    product.id;


  document.getElementById(
    "formTitle"
  ).textContent =
    "Edit Product";


  nameInput.value =
    product.name || "";

  categoryInput.value =
    product.category || "";

  skuInput.value =
    product.sku || "";

  mrpInput.value =
    product.old_price || "";

  priceInput.value =
    product.price || "";

  stockInput.value =
    product.stock || "";

  warrantyInput.value =
    product.warranty || "";

  imageInput.value =
    product.image_url || "";

  descriptionInput.value =
    product.description || "";

  activeInput.value =
    product.active
      ? "true"
      : "false";


  document.getElementById(
    "cancelBtn"
  ).style.display =
    "inline-block";


  calculateDiscount();

  showPreview();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function resetForm(){

  editingId =
    null;


  document.getElementById(
    "formTitle"
  ).textContent =
    "Add New Product";


  nameInput.value =
    "";

  categoryInput.value =
    "";

  skuInput.value =
    "";

  mrpInput.value =
    "";

  priceInput.value =
    "";

  stockInput.value =
    "";

  warrantyInput.value =
    "";

  imageInput.value =
    "";

  descriptionInput.value =
    "";

  activeInput.value =
    "true";


  preview.innerHTML =
    "";

  discountPreview.textContent =
    "Discount: 0%";


  document.getElementById(
    "cancelBtn"
  ).style.display =
    "none";

}


async function toggleProduct(
  id,
  currentStatus
){

  const {
    error
  } =
    await supabaseClient
      .from("products")
      .update({
        active:
          !currentStatus
      })
      .eq("id",id);


  if(error){

    alert(
      error.message
    );

    return;

  }


  loadProducts();

}


async function deleteProduct(id){

  const yes =
    confirm(
      "Are you sure you want to delete this product?"
    );


  if(!yes) return;


  const {
    error
  } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id",id);


  if(error){

    alert(
      error.message
    );

    return;

  }


  loadProducts();

}


async function go(){

  const allowed =
    await checkAdmin();


  if(!allowed) return;


  loadProducts();

}


go();

</script>

</body>
</html>
