<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Products — RADA CREST</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<style>
.admin-products{max-width:1120px;margin:auto;padding-bottom:60px}
.form-box{margin-top:25px;padding:25px;border:1px solid #e5e5e5;border-radius:22px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.04)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full-field{grid-column:1/-1}
.form-box label{display:block;margin:10px 0 7px;font-weight:800}
.form-box input,.form-box textarea,.form-box select{width:100%;padding:14px;border:1px solid #d8d8d8;border-radius:12px;box-sizing:border-box;font:inherit;background:#fff}
.form-box textarea{min-height:115px;resize:vertical}.help{font-size:12px;color:#777;margin-top:7px;line-height:1.5}
.preview{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}.preview-card{width:92px;height:92px;border:1px solid #ddd;border-radius:12px;overflow:hidden;background:#f7f7f7;display:grid;place-items:center}.preview-card img{width:100%;height:100%;object-fit:contain}.preview-video{font-size:28px}
.product-admin-card{margin-top:15px;padding:18px;border:1px solid #e5e5e5;border-radius:20px;display:flex;gap:16px;align-items:center;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.03)}
.product-admin-image{width:96px;height:96px;border-radius:14px;background:#f5f5f5;display:grid;place-items:center;overflow:hidden;flex:none}.product-admin-image img{width:100%;height:100%;object-fit:contain}
.product-admin-info{flex:1;min-width:0}.product-admin-info h3{margin:0 0 6px}.product-admin-info small{display:block;margin:4px 0;color:#666}
.price-line{margin-top:9px}.mrp{color:#888;text-decoration:line-through;margin-right:8px}.discount{font-weight:900;margin-left:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:10px 13px;border:0;border-radius:10px;cursor:pointer;font-weight:800}
.edit-btn{background:#111;color:#fff}.delete-btn{background:#ffe5e5;color:#b00000}.toggle-btn{background:#eee}
.status-live{color:#16833b;font-weight:900}.status-off{color:#c00;font-weight:900}.msg{margin-top:15px;font-weight:800;min-height:22px}
@media(max-width:700px){.form-grid{grid-template-columns:1fr}.full-field{grid-column:auto}.product-admin-card{align-items:flex-start;flex-direction:column}.product-admin-image{width:100%;height:190px}}
</style>
</head>
<body>
<main class="section admin-products">
<a href="admin-dashboard.html">← Dashboard</a>
<h1>Product Management</h1><p>Add, edit and manage your RADA CREST products.</p>

<section class="form-box">
<h2 id="formTitle">Add New Product</h2>
<div class="form-grid">
<div class="full-field"><label>Product Name</label><input id="name" type="text" placeholder="RADA CREST 9W LED Bulb"></div>
<div><label>Category</label><input id="category" type="text" placeholder="LED Bulb"></div>
<div><label>SKU</label><input id="sku" type="text" placeholder="RC-LED-9W"></div>
<div><label>MRP</label><input id="mrp" type="number" min="0" step="0.01" placeholder="999"></div>
<div><label>Selling Price</label><input id="price" type="number" min="0" step="0.01" placeholder="799"></div>
<div><label>Stock</label><input id="stock" type="number" min="0" step="1" placeholder="100"></div>
<div><label>Warranty</label><input id="warranty" type="text" placeholder="1 Year"></div>

<div class="full-field">
<label>Product Image URLs</label>
<textarea id="image_url" placeholder="Paste image URLs here — one URL per line."></textarea>
<div class="help">Multiple image URLs allowed. Direct image URLs work best.</div>
<div id="preview" class="preview"></div>
</div>

<div class="full-field">
<label>Product Video URL</label>
<input id="video_url" type="url" placeholder="YouTube URL or direct .mp4 URL">
<div class="help">YouTube, youtu.be, Shorts or direct MP4 URL.</div>
<div id="videoPreview" class="preview"></div>
</div>

<div class="full-field"><label>Description</label><textarea id="description" placeholder="Write complete product details..."></textarea></div>
<div><label>Product Status</label><select id="active"><option value="true">LIVE</option><option value="false">OFF</option></select></div>
</div>

<div id="discountPreview" style="margin-top:15px;font-weight:900">Discount: 0%</div>
<div class="actions" style="margin-top:15px">
<button class="btn" type="button" onclick="saveProduct()">Save Product</button>
<button id="cancelBtn" type="button" onclick="resetForm()" style="display:none">Cancel Edit</button>
</div>
<div id="msg" class="msg"></div>
</section>

<section style="margin-top:35px"><h2>All Products</h2><div id="list"><p>Loading products...</p></div></section>
</main>

<script>
let editingId=null,allProducts=[];
const $=id=>document.getElementById(id);
const nameInput=$("name"),categoryInput=$("category"),skuInput=$("sku"),mrpInput=$("mrp"),priceInput=$("price"),stockInput=$("stock"),warrantyInput=$("warranty"),imageInput=$("image_url"),videoInput=$("video_url"),descriptionInput=$("description"),activeInput=$("active"),preview=$("preview"),videoPreview=$("videoPreview"),discountPreview=$("discountPreview"),msg=$("msg");

function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function getImageUrls(){return imageInput.value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean)}
function calculateDiscount(){const mrp=Number(mrpInput.value||0),price=Number(priceInput.value||0);discountPreview.textContent=mrp>0&&price<mrp?"Discount: "+Math.round((mrp-price)/mrp*100)+"% OFF":"Discount: 0%"}
mrpInput.addEventListener("input",calculateDiscount);priceInput.addEventListener("input",calculateDiscount);

function showPreview(){preview.innerHTML=getImageUrls().map(url=>`<div class="preview-card"><img src="${escapeHtml(url)}" alt="Preview" onerror="this.style.display='none'"></div>`).join("")}
imageInput.addEventListener("input",showPreview);

function youtubeId(url){
 try{const u=new URL(url);if(u.hostname.includes("youtu.be"))return u.pathname.split("/")[1]||null;if(u.hostname.includes("youtube.com")){if(u.pathname==="/watch")return u.searchParams.get("v");if(u.pathname.startsWith("/shorts/"))return u.pathname.split("/")[2]||null;if(u.pathname.startsWith("/embed/"))return u.pathname.split("/")[2]||null}}catch(e){}return null
}
function showVideoPreview(){const url=videoInput.value.trim();if(!url){videoPreview.innerHTML="";return}const id=youtubeId(url);videoPreview.innerHTML=id?`<div class="preview-card preview-video">▶️</div><small>YouTube video detected</small>`:`<div class="preview-card preview-video">🎬</div><small>Direct video URL saved</small>`}
videoInput.addEventListener("input",showVideoPreview);

async function checkAdmin(){
 const {data:{user}}=await supabaseClient.auth.getUser();
 if(!user){location.href="admin.html";return false}
 const {data:p}=await supabaseClient.from("profiles").select("role").eq("id",user.id).single();
 if(p?.role!=="admin"){location.href="admin.html";return false} return true
}
async function loadProducts(){
 const list=$("list"),{data,error}=await supabaseClient.from("products").select("*").order("id");
 if(error){list.innerHTML=`<p>${escapeHtml(error.message)}</p>`;return}
 allProducts=data||[];if(!allProducts.length){list.innerHTML="<p>No products yet.</p>";return}
 list.innerHTML=allProducts.map(p=>{
  const first=String(p.image_url||"").split(/[\n,]+/).map(x=>x.trim()).filter(Boolean)[0]||"",mrp=Number(p.old_price||0),price=Number(p.price||0),off=mrp>price&&mrp?Math.round((mrp-price)/mrp*100):0;
  return `<div class="product-admin-card"><div class="product-admin-image">${first?`<img src="${escapeHtml(first)}" alt="${escapeHtml(p.name)}" onerror="this.style.display='none'">`:"💡"}</div><div class="product-admin-info"><h3>${escapeHtml(p.name)}</h3><small>${escapeHtml(p.category||"No category")}</small><small>SKU: ${escapeHtml(p.sku||"—")}</small><small>Stock: ${Number(p.stock||0)}${p.video_url?" · 🎬 Video":""}</small><div class="price-line">${mrp>price?`<span class="mrp">₹${mrp.toLocaleString("en-IN")}</span>`:""}<b>₹${price.toLocaleString("en-IN")}</b>${off?`<span class="discount">${off}% OFF</span>`:""}</div><small class="${p.active?"status-live":"status-off"}">${p.active?"● LIVE":"● OFF"}</small></div><div class="actions"><button class="edit-btn" onclick="editProduct(${p.id})">Edit</button><button class="toggle-btn" onclick="toggleProduct(${p.id},${p.active})">${p.active?"Turn OFF":"Make LIVE"}</button><button class="delete-btn" onclick="deleteProduct(${p.id})">Delete</button></div></div>`
 }).join("")
}
async function saveProduct(){
 msg.textContent="";
 const name=nameInput.value.trim(),category=categoryInput.value.trim(),sku=skuInput.value.trim(),mrp=Number(mrpInput.value||0),price=Number(priceInput.value||0),stock=Number(stockInput.value||0),warranty=warrantyInput.value.trim(),imageUrl=imageInput.value.trim(),videoUrl=videoInput.value.trim(),description=descriptionInput.value.trim(),active=activeInput.value==="true";
 if(!name){msg.textContent="Product name is required.";return} if(price<=0){msg.textContent="Selling price must be greater than 0.";return} if(mrp>0&&mrp<price){msg.textContent="MRP cannot be lower than selling price.";return} if(stock<0){msg.textContent="Stock cannot be negative.";return}
 const discount=mrp>0&&price<mrp?Math.round((mrp-price)/mrp*100):0;
 const payload={name,category:category||null,sku:sku||null,old_price:mrp||null,price,stock,warranty:warranty||null,image_url:imageUrl||null,video_url:videoUrl||null,description:description||null,discount_percent:discount,active};
 const result=editingId?await supabaseClient.from("products").update(payload).eq("id",editingId):await supabaseClient.from("products").insert(payload);
 if(result.error){msg.textContent=result.error.message;return}
 msg.textContent=editingId?"Product updated successfully.":"Product added successfully.";resetForm();await loadProducts()
}
function editProduct(id){
 const p=allProducts.find(x=>Number(x.id)===Number(id));if(!p)return;editingId=p.id;$("formTitle").textContent="Edit Product";
 nameInput.value=p.name||"";categoryInput.value=p.category||"";skuInput.value=p.sku||"";mrpInput.value=p.old_price||"";priceInput.value=p.price||"";stockInput.value=p.stock||"";warrantyInput.value=p.warranty||"";imageInput.value=p.image_url||"";videoInput.value=p.video_url||"";descriptionInput.value=p.description||"";activeInput.value=p.active?"true":"false";
 $("cancelBtn").style.display="inline-block";calculateDiscount();showPreview();showVideoPreview();scrollTo({top:0,behavior:"smooth"})
}
function resetForm(){editingId=null;$("formTitle").textContent="Add New Product";[nameInput,categoryInput,skuInput,mrpInput,priceInput,stockInput,warrantyInput,imageInput,videoInput,descriptionInput].forEach(x=>x.value="");activeInput.value="true";preview.innerHTML="";videoPreview.innerHTML="";discountPreview.textContent="Discount: 0%";$("cancelBtn").style.display="none"}
async function toggleProduct(id,currentStatus){const {error}=await supabaseClient.from("products").update({active:!currentStatus}).eq("id",id);if(error){alert(error.message);return}loadProducts()}
async function deleteProduct(id){if(!confirm("Are you sure you want to delete this product?"))return;const {error}=await supabaseClient.from("products").delete().eq("id",id);if(error){alert(error.message);return}loadProducts()}
async function go(){if(await checkAdmin())loadProducts()}go();
</script>
</body>
</html>
